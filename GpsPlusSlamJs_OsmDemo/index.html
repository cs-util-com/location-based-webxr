<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      `viewport-fit=cover` is REQUIRED for `env(safe-area-inset-*)` to return
      anything but 0. Without it, CSS that pins an element to the true bottom
      edge of a phone resolves its inset to nothing and the element sits wherever
      layout leaves it — silently, with CSS that reads as correct. This matters
      most inside the WebXR `dom-overlay`, where the compass bar is meant to sit
      flush at the bottom. See the plan's §12 dom-overlay research.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>OSM affordance demo</title>
    <!--
      A DATA-URI ICON, matching the RecorderApp and the landing page rather than
      inventing a second convention. Without it the browser requests
      `/favicon.ico` unprompted and logs a 404 on every load — noise in the one
      place a real error would show.
      It survived many sessions because HEADLESS Chromium never requests a
      favicon, so no e2e could see it however the console filter was written.
      `gallery.html` carries the same link for the same reason.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%23ef4444'/%3E%3Ccircle cx='50' cy='50' r='15' fill='%23fff'/%3E%3C/svg%3E"
      type="image/svg+xml"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px/1.4 system-ui,
          sans-serif;
        background: #11131a;
        color: #e6e8ef;
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100dvh;
      }
      header {
        padding: 0.6rem 0.9rem;
        border-bottom: 1px solid #2a2f3d;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: baseline;
      }
      h1 {
        font-size: 1rem;
        margin: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        user-select: none;
      }
      /* The disclosure caret, rotated by the collapsed state.

         A REAL ELEMENT, not a `::before` (round three, G1/F9). It was
         generated so the markup could stay one <h1>, and that tidiness cost
         more than it bought: a pseudo-element is not a DOM node, so
         Playwright's `boundingBox()` cannot address it and the only route left
         was reading `getComputedStyle(el, "::before")` — which returns a used
         pixel size only as a side effect of `#header-toggle` being
         `inline-flex`, a resolved-value detail rather than a contract. The
         glyph that the sixth and thirteenth sessions both called too small was
         therefore the one thing in this bar no test could measure.

         THE SIZE IS THE FIX, not the tap target. 2.75 rem of invisible box went
         in after the twelfth session's review raised WCAG 2.2 SC 2.5.8, and the
         owner reported the same complaint again the next day: the control was
         reachable and still looked like a speck. An accessibility guideline
         about target size and a person saying "I cannot see it" are not the
         same complaint. 1.6 rem is ~25.6 px, over the 24 px floor the plan
         pinned before this rule was written. */
      .header-caret {
        display: block;
        /* THE ELEMENT'S BOX IS THE INK, and that is the whole reason this is an
           SVG rather than a character (PR review of the first fix, finding 2).

           The previous attempt was a <span> holding "▾" at `font-size: 1.6rem;
           line-height: 1`, and its box measured 25.6 px WHATEVER was inside it
           -- `content: ""` would have measured the same. Worse, ▾ is U+25BE
           BLACK DOWN-POINTING *SMALL* TRIANGLE, whose ink is roughly 0.4-0.5 em:
           about 10-13 px of visible triangle in that 25.6 px box. So the test
           asserting ">= 24 px" was measuring a line box and the owner was still
           being shown a speck -- a measurable proxy standing in for the visible
           thing, which is exactly how G1 came back a SECOND time. Repeating it
           inside the test written to prevent a third is the reason this comment
           is long.

           The viewBox is the triangle's exact bounds and these two lengths hold
           the same 1:1 ratio, so the path fills the element edge to edge and
           `boundingBox()` returns the painted triangle. Same argument
           `locate-control.ts` makes for its inline-SVG pin: a glyph renders
           differently on every platform's font and cannot be measured.

           SQUARE SINCE THE FOURTEENTH SESSION (H1), and the ratio is the fix,
           not the size. The owner reported the caret as "about twice as big as
           the Show Quests button" while asking for it to be "as tall as the
           Jump-to-City dropdown" -- and the HEIGHT WAS ALREADY RIGHT, 25.6 px
           against that control's ~26.4. What read as double was a solid filled
           triangle 33.6 px WIDE, wider than it was tall, beside a bordered box
           of thin text: equal height, very unequal ink. Narrowing 21:16 to
           16:16 cuts the painted area by ~24% and leaves the height, the thing
           the owner actually specified, untouched and still over the 24 px
           floor.

           BOTH LENGTHS MUST MOVE TOGETHER. `preserveAspectRatio` defaults to
           `meet`, so changing one alone letterboxes the ink inside the box --
           the element would still measure 24 px while the visible triangle
           shrank below it, which is precisely the measurable-proxy failure the
           paragraph above exists to record.

           SIZE UNCHANGED AT r541, DELIBERATELY, THOUGH IT WAS REPORTED TOO BIG
           A SECOND TIME. The size is pinned by an explicit OWNER instruction
           from the fourteenth session -- "so hoch wie das 'Jump to City'-
           Dropdown" -- which `boot-and-shell.spec.js` holds as a relationship
           (`|caret.height - quests.height| <= 4`) rather than a rem value. A
           junior developer's r541 report says it is still too big. Those are two
           people disagreeing about a visual judgement, and this file is not the
           place to pick a winner: the conflict is filed with its evidence in
           `GpsPlusSlamJs_Docs/docs/2026-08-21-caret-size-instructions-conflict-followup.md`.

           WHAT DID CHANGE is which element carries which floor, and that was a
           real defect independent of the size. The old e2e asserted the PAINTED
           INK was >= 24 px, a number that comes from WCAG 2.2 SC 2.5.8 -- a rule
           about the POINTER TARGET. `#header-toggle` satisfies that on its own
           at 2.75 rem (44 px). So the ink was held at 25.6 px by a requirement
           another element already meets, which is the thread running through all
           three previous attempts: a pseudo-element that could not be measured,
           a line box that measured the same when empty, a triangle whose WIDTH
           read as double -- every assertion on the wrong thing. The target floor
           now sits on the toggle and the ink keeps a legibility floor of its own.

           AND NOTE WHY THE TEMPTING FIX IS BARRED: lightening the triangle to a
           stroke would cut apparent size while the box stayed 25.6 px and every
           assertion kept passing -- the exact measurable-proxy failure the
           paragraph above exists to prevent. Any real change here must move the
           element, so the measurement follows it. */
        width: 1.6rem;
        height: 1.6rem;
        color: #9aa3b8;
        transition: transform 0.15s ease;
      }
      header[data-collapsed="true"] .header-caret {
        transform: rotate(-90deg);
      }
      #status,
      #scale {
        color: #9aa3b8;
        font-size: 0.8rem;
      }

      /* FORCES A ROW BREAK IN A WRAPPING FLEX ROW (G2/F8).

         The header is one `flex-wrap: wrap` row, so which controls share a line
         is a function of available width, not of source order — asking for "row
         1, then row 2" by reordering the markup alone produces the requested
         order and an unrequested layout. A zero-height item at 100% basis is
         the standard way to say "everything after me starts a new line", and it
         is preferred over two wrapper elements here because the wrappers would
         need their own flex context and would change how the existing
         `header[data-collapsed]` rules reach their targets.

         `aria-hidden` and no text: it is a layout instruction, not content.

         THE NEGATIVE MARGIN IS GAP ARITHMETIC, not a nudge. A break item adds a
         SECOND row to the flex container, so the header's `gap: 0.75rem` is
         charged twice down the cross axis where it should be charged once;
         -0.375rem top and bottom cancels the extra exactly. It is therefore
         COUPLED TO `header`'s gap -- change one and this must change with it --
         and nothing tests header height, so this sentence is the only thing
         standing between that coupling and a silent regression.

         THE BREAK IS NOT SUPPRESSED WHEN THE BAR COLLAPSES, deliberately. A
         collapsed desktop bar is two rows now where it used to be one. The
         alternative is a rule that hides the break while collapsed, which would
         make the collapsed and expanded bars disagree about where row 1 ends --
         and G2 is a request about the resting layout, not about the collapsed
         one. Recorded rather than silently accepted. */
      .header-row-break {
        flex-basis: 100%;
        height: 0;
        margin: -0.375rem 0;
      }

      /* CAPPED (DEC-W6). The select is sized by its widest option, and the
         widest is "London — Tower Bridge" at roughly 165-180 px — which alone
         pushes the requested first row past a 390 px phone once the caret
         (44 px), the Show Quests button (7.5 rem) and three gaps are counted.
         The full name stays readable in the open dropdown; only the resting
         face is clipped, which is the cheaper half to lose -- and
         `site-picker.ts` puts the chosen place's full name in the element's
         `title`, so a clipped selection is still recoverable on a pointer
         device.

         UNCONDITIONAL, though DEC-W6 argues only from the 390 px phone. A
         desktop row has ~900 px of slack and does not need the cap; scoping it
         to a media query would mean the picker changes width at a breakpoint
         for no reason a user could see, and a control that resizes itself is
         the defect this round removed elsewhere. One width everywhere is the
         cheaper answer. */
      #site {
        max-width: 8.5rem;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 0;
        position: relative;
      }

      /*
        AR MOUNT POINT. OUT OF FLOW IN BOTH STATES, and that is the whole rule.

        `main` is a two-column grid with no explicit rows, so an in-flow third
        child lands in an implicit second row -- and because both implicit rows
        are `auto` and stretch, the map/3D row loses roughly half of main s
        height to an empty band. Caught in review; no gate could see it, since
        the height assertion runs only at the mobile viewport and the canvas
        check compares against #scene s own box however small that gets.

        `:empty` is doing real work: with no session the element is display:none
        and cannot affect the grid at all. Once `initAR` inserts its canvas and
        DOM-overlay root it becomes a fixed, viewport-sized layer, which is what
        the framework already sizes its canvas for.
      */
      #ar-root {
        position: fixed;
        inset: 0;
      }

      /*
        THE TOP-ALIGNED COLUMN THE READOUT AND THE SLIDER SHARE (G9, DEC-W5).

        A BOX OF ITS OWN, and the first attempt at this got that wrong in a way
        no test could see. It made `#ar-root` ITSELF the flex column -- but the
        framework inserts its full-screen WebGL canvas as that element's FIRST
        CHILD, in flow, with an inline `height` of 100vh written by
        `renderer.setSize`. As a flex item that canvas cannot shrink, so the
        readout and the slider were pushed a full viewport below the fold and
        were invisible for the entire session. The e2e missed it because its
        fixture builds `#ar-root`'s contents by hand and omitted the one child
        that breaks the layout. Found by the PR review, not by the gate.

        So the column lives in a wrapper the demo owns, and `#ar-root` goes back
        to being a plain block that the canvas can fill.

        SHRINK-WRAPPED ON PURPOSE: `top`/`left` with no `right` or `width`, so
        the box hugs its widest child instead of spanning the viewport and
        eating taps in the empty space beside them. `pointer-events` is
        deliberately NOT set here -- `.ar-hud` opts out for itself and the
        slider needs input, exactly as before.

        WHY A COLUMN AT ALL. The slider used to be `bottom: 20vh`, centred and
        up to 88vw wide -- a bar straight across the near content, which is what
        the thirteenth session reported. Moving it to some `top:` value would
        have put two hard-coded offsets in one corner, one of which CHANGES
        HEIGHT AT RUNTIME: the compass box wraps and carries a hint line. That
        is how the earlier toast/slider overlap happened (PR #311 review,
        finding 4). A column cannot overlap itself.
      */
      .ar-stack {
        position: absolute;
        top: 2.5rem;
        left: 0.75rem;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }

      #ar-root:empty {
        display: none;
      }

      /*
        The only message surface an immersed user can see (AR milestone 3).
        WebXR composites ONLY the dom-overlay root's subtree over the camera
        feed, and the header's status line is outside it — so a warning written
        there is invisible for exactly as long as it is relevant.

        `pointer-events: none` because it must never eat a tap: `#ar-root` is a
        full-viewport fixed layer, and a message sitting in it that swallowed
        input would be the same regression the `:empty` rule above exists for.
      */
      .ar-toast {
        position: absolute;
        left: 50%;
        bottom: 12vh;
        transform: translateX(-50%);
        /* Viewport-relative only. A `min(34rem, 88vw)` cap is what this wants,
           but the CSS validator in the gate rejects `min()` here — and the rem
           half only ever binds on a wide desktop viewport, where AR does not
           run. */
        max-width: 88vw;
        padding: 0.6rem 0.9rem;
        border-radius: 0.6rem;
        background: rgb(17 19 26 / 88%);
        color: #f2f4f8;
        font-size: 0.95rem;
        line-height: 1.35;
        text-align: center;
        /* Against a camera feed of unknown brightness, the panel needs an edge
           of its own or it dissolves into a light-coloured scene. */
        border: 1px solid rgb(242 244 248 / 25%);
        box-shadow: 0 2px 12px rgb(0 0 0 / 45%);
        pointer-events: none;
      }

      /* The 2D toast (round two, N3).

         WHY THE PAGE NEEDED ONE AT ALL. Every non-AR message in this demo
         went to the header status line, and that single fact is what forced
         the header to pop itself open on every error (DEC-R2-15): a message
         written into a collapsed header is a message nobody sees. With a
         channel visible while collapsed, that rule can retire (DEC-U10) -
         which is why this exists rather than being a nicety.

         `#toast-root` is a FIXED, EMPTY, pointer-events-none layer that is
         always present, unlike `#ar-root`, which is only safe to leave in
         the DOM because it collapses via `:empty`. This one has no size of
         its own - it positions its child and nothing more - so it cannot eat
         a tap even while a message is showing. That is the regression
         recorded in `ar-mode.ts`, avoided by construction rather than by a
         rule someone has to remember.

         BOTTOM-LEFT, not the AR toast's bottom-centre band: the locate and
         AR controls sit bottom-right (F3a), and so does Leaflet's
         attribution. */
      #toast-root {
        position: fixed;
        left: 0;
        bottom: 0;
        z-index: 500;
        pointer-events: none;
      }

      .toast {
        position: fixed;
        left: 0.75rem;
        bottom: 0.75rem;
        max-width: 78vw;
        padding: 0.55rem 0.85rem;
        border-radius: 0.6rem;
        background: rgb(17 19 26 / 92%);
        color: #f2f4f8;
        font-size: 0.9rem;
        line-height: 1.35;
        border: 1px solid rgb(242 244 248 / 22%);
        box-shadow: 0 2px 12px rgb(0 0 0 / 45%);
        pointer-events: none;
      }

      /*
        The measurement readout (AR milestone 4). Top-left, monospace, one
        number per line: read at arm's length while walking, where a run-on
        sentence is unreadable and a glance is looking for one figure.

        `pointer-events: none` for the same reason as the toast — `#ar-root` is
        a full-viewport fixed layer and nothing in it may eat a tap.
      */
      .ar-hud {
        /* IN THE COLUMN, not absolutely positioned (G9, DEC-W5). Its old
           `top: 2.5rem; left: 0.75rem` moved to `.ar-stack`'s own offsets --
           NOT to `#ar-root`'s padding, as this comment claimed until a PR
           review caught it: `#ar-root` is only `position: fixed; inset: 0` and
           has no padding at all. The inset is still stated once for everything
           in the stack rather than per-control; it is just stated on the stack.

           The note that used to live here still applies to that padding: it is
           a plain offset, not `max(0.75rem, env(safe-area-inset-top))`, because
           the gate's CSS validator rejects `max()` in this file the same way it
           rejects `min()` on the toast's width. Under a notch it can sit high;
           that is M5's UI polish, recorded rather than silently accepted. */
        order: 0;
        padding: 0.4rem 0.6rem;
        border-radius: 0.4rem;
        background: rgb(17 19 26 / 72%);
        color: #cfe3ff;
        font-family: ui-monospace, "SF Mono", "Cascadia Mono", monospace;
        /* ONE STEP DOWN FROM 0.78rem (H7). The readout gained lines faster than
           the screen gained room, and the session asked for it denser. The SPACE
           this buys is asserted where it is actually contested -- the 390 px
           bottom-stack test in Q4 -- rather than by pinning this number, which
           no mutation could make meaningfully wrong. */
        font-size: 0.7rem;
        line-height: 1.45;
        /* The lines are joined with "\n"; without this they collapse. */
        white-space: pre-line;
        pointer-events: none;
      }

      /*
        The expand/collapse toggle (DEC-H2), which must OPT BACK IN to input.

        `.ar-hud` above sets `pointer-events: none` so the readout can never eat
        a tap, and that inherits — so without this rule the button is inert in a
        real browser while every jsdom test still passes, because jsdom does no
        hit-testing. A control that is unclickable only on the device it exists
        for is exactly the failure the co-located CSS is here to prevent.
      */
      .ar-hud-toggle {
        display: block;
        margin-top: 0.3rem;
        padding: 0.15rem 0.5rem;
        border: 1px solid rgb(207 227 255 / 40%);
        border-radius: 0.3rem;
        background: rgb(17 19 26 / 72%);
        color: #cfe3ff;
        font-family: inherit;
        font-size: 0.85rem;
        line-height: 1.2;
        cursor: pointer;
        pointer-events: auto;
      }

      /*
        The manual elevation nudge (DEC-E1). Bottom-centre, above the toast's
        band, so it is reachable with a thumb while the phone is held up.

        NOT `pointer-events: none`, unlike the readout and the toast: this one
        exists to be pressed. It is a direct child of `#ar-root`, which sets no
        pointer-events of its own, so it needs no opt-in the way the HUD's
        toggle does.
      */
      /*
        THE BOTTOM STACK (H6, DEC-Y10/Y12). Two rows, and the second is forced
        by arithmetic rather than chosen.

        Measured at 390 px with the round-four tap targets: elevation is
        2 x 2rem + 3rem + gaps + padding + border = ~149 px, the gear adds
        ~40 px, leaving ~180 px for the slider. The live readout is ~40
        characters and cannot share a row with any of it -- so it gets its own
        line beneath. Two earlier versions of this row discovered that in CSS
        instead of in arithmetic, and overflowed.

        ONE CONTAINER, not three absolutely-positioned controls: the compass box
        changes height at runtime and the readout's text changes length with the
        phase, and two hard-coded offsets that must not collide is exactly how
        the earlier toast/slider overlap happened (PR #311 review, finding 4).
      */
      .ar-bottom {
        position: absolute;
        bottom: 4vh;
        left: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        max-width: 96vw;
        transform: translateX(-50%);
      }

      .ar-bottom-row {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      /*
        The experiment gear (DEC-Y10). Square, at the elevation buttons' size so
        the row reads as one control strip rather than three.
      */
      .ar-gear-wrap {
        position: relative;
      }

      .ar-gear {
        width: 2rem;
        height: 2rem;
        border: 1px solid rgb(242 244 248 / 35%);
        border-radius: 0.4rem;
        background: rgb(36 40 52 / 92%);
        color: #f2f4f8;
        font-size: 1.05rem;
        line-height: 1;
        cursor: pointer;
      }

      /*
        The panel itself: ABOVE the gear, not below it, because the gear sits at
        the bottom of the screen and a panel opening downward would be off it.
        Absolutely positioned so opening it cannot reflow the row underneath --
        a row that changed height on open would move the slider out from under
        the thumb that just pressed the gear.
      */
      .ar-experiments {
        position: absolute;
        right: 0;
        bottom: 2.4rem;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        min-width: 12rem;
        padding: 0.5rem 0.6rem;
        border: 1px solid rgb(242 244 248 / 25%);
        border-radius: 0.6rem;
        background: rgb(17 19 26 / 96%);
        box-shadow: 0 2px 12px rgb(0 0 0 / 45%);
      }

      .ar-experiments-row {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        color: #e6e8ef;
        font-size: 0.78rem;
        white-space: nowrap;
      }

      /* A CLASS, not `.ar-experiments-row select`. The descendant form outranks
         the bare `select` rule further down this file, which stylelint's
         `no-descending-specificity` rejects — and rightly: whichever of the two
         wins would depend on source order rather than on intent. */
      .ar-experiments-select {
        font: inherit;
        color: #f2f4f8;
        background: rgb(36 40 52 / 92%);
        border: 1px solid rgb(242 244 248 / 35%);
        border-radius: 0.25rem;
      }

      .ar-elevation {
        /* IN THE ROW NOW, not absolutely positioned (H6). Its old
           `bottom: 4vh; left: 50%; translateX(-50%)` moved to `.ar-bottom`, so
           the offset is stated once for the whole stack rather than per
           control -- and the slider beside it can no longer overlap it, which
           two hard-coded offsets would eventually have done. */
        display: flex;
        gap: 0.4rem;
        align-items: center;
        padding: 0.35rem 0.5rem;
        border: 1px solid rgb(242 244 248 / 25%);
        border-radius: 0.6rem;
        background: rgb(17 19 26 / 88%);
        box-shadow: 0 2px 12px rgb(0 0 0 / 45%);
      }

      .ar-elevation-button {
        /* 2rem, DOWN FROM 2.5rem, and this deliberately overturns a recorded
           floor (DEC-Y7, owner decision 2026-08-20). The old comment called
           2.5rem "the smallest reliable touch target ... against a camera feed
           of unknown brightness", and that judgement was not wrong -- it was
           made before the compass slider had to share the row.

           The arithmetic that forced it: at 390 px, 2 x 2.5rem + 4.5rem value +
           gaps + padding is ~189 px, and the compass box alone already exceeds
           its own max-width. Something had to give, and the VALUE BOX kept its
           size (3rem) because a readout that cannot be read at arm's length is
           worse than a button that needs a second try. 32 px still clears
           WCAG 2.2 SC 2.5.8's 24 px floor with room. */
        width: 2rem;
        height: 2rem;
        border: 1px solid rgb(242 244 248 / 35%);
        border-radius: 0.4rem;
        background: rgb(36 40 52 / 92%);
        color: #f2f4f8;
        font-size: 1.35rem;
        line-height: 1;
        cursor: pointer;
      }

      /*
        The compass-influence slider (DEC-E2). Above the elevation nudge so the
        two stack rather than overlap, and wide enough that 0-1 is draggable
        with a thumb rather than being a 20-pixel target.
      */
      .ar-compass {
        /* AT THE BOTTOM SINCE H6, beside the elevation control -- "diesen
           Kompass-Slider würde ich eigentlich gerne nach unten packen neben die
           Plus-Minus-UI". That partially reverses DEC-W5, which put it in the
           TOP stack; G9's complaint was that it sat in the MIDDLE of the view,
           and the bottom satisfies that as well as the top did. The readout it
           carries now wraps onto its own line -- see `.ar-compass-value`.

           The previous note, kept because its reasoning still constrains this:
           it was `bottom: 20vh`,
           centred and up to 88vw wide, i.e. a bar across the near content --
           "currently it's in the middle of the screen and occludes basically
           the AR 3D content".

           THE OLD REASON FOR 20vh IS RETIRED, NOT IGNORED: that number avoided
           `.ar-toast`'s 12vh band, because the far-travel toast fires at 2 km,
           during exactly the long walk this slider is measured on (PR #311
           review, finding 4). Leaving the bottom of the screen entirely means
           there is nothing left to collide with down there -- and the column
           above means it cannot collide with the readout either. */
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        padding: 0.35rem 0.5rem;
        border: 1px solid rgb(242 244 248 / 25%);
        border-radius: 0.6rem;
        background: rgb(17 19 26 / 88%);
        box-shadow: 0 2px 12px rgb(0 0 0 / 45%);
      }

      .ar-compass-slider {
        /* FIXED, not 55vw. In the bottom row the slider shares its line with the
           elevation control (~149 px) and the gear (~40 px); a viewport-relative
           width would overflow a 390 px phone by ~60 px, which is how the two
           previous versions of this row broke. */
        width: 9rem;
      }

      .ar-compass-value {
        /* FULL WIDTH ON ITS OWN LINE (DEC-Y12). The readout now reads
           `compass 0.80 target — now 1.00 cold start`, ~40 characters, which
           cannot share a row with a slider at any font size worth reading
           outdoors. `flex-basis: 100%` makes `.ar-compass`'s wrap put it on the
           second line rather than squeezing the slider. */
        flex-basis: 100%;
        text-align: center;
        color: #f2f4f8;
        font-family: ui-monospace, "SF Mono", "Cascadia Mono", monospace;
        font-size: 0.9rem;
      }

      /* The two states a user would otherwise read as a broken control: not
         accepting input yet, and taking ~15-30 fixes to express a change. */
      .ar-compass-hint {
        width: 100%;
        color: #9aa3b8;
        font-size: 0.72rem;
        text-align: center;
      }

      .ar-elevation-value {
        /* 3rem, down from 4.5 (DEC-Y7). The narrowest that still fits a signed
           metre value with one decimal at this font size -- the readout is the
           part of this control that must stay legible outdoors. */
        min-width: 3rem;
        color: #f2f4f8;
        font-family: ui-monospace, "SF Mono", "Cascadia Mono", monospace;
        font-size: 0.95rem;
        text-align: center;
      }

      /* Floats over the split rather than taking a column (DEC-17). */
      #details {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        bottom: 0.5rem;
        width: 22rem;
        max-width: 42vw;
        overflow-y: auto;
        z-index: 1000;
        padding: 0.6rem 0.7rem;
        background: #171b26f2;
        border: 1px solid #2a2f3d;
        border-radius: 6px;
        font-size: 0.78rem;
      }
      #details[hidden] {
        display: none;
      }
      /* Bottom-LEFT, so it cannot sit under the details panel and cannot be
         mistaken for it. Same surface treatment, deliberately: it is the same
         kind of thing — an overlay that explains the view. */
      #hotkey-help {
        position: absolute;
        left: 0.5rem;
        bottom: 0.5rem;
        z-index: 1000;
        padding: 0.5rem 0.7rem;
        background: #171b26f2;
        border: 1px solid #2a2f3d;
        border-radius: 6px;
        font-size: 0.78rem;
        line-height: 1.5;
      }
      #hotkey-help[hidden] {
        display: none;
      }
      /* The geo-event picker sits opposite the hotkey list so the two cannot
         cover each other — both are bottom-anchored overlays over the map. */
      #geo-event-picker {
        position: absolute;
        right: 0.5rem;
        bottom: 0.5rem;
        z-index: 1000;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem;
        /* Bounded by the pane rather than by a fixed width: `min()` reads as an
           invalid value to the CSS validator in the gate, and the pane bound is
           the one that actually matters on a phone. The content is narrower
           than this on a desktop anyway, and `flex-wrap` handles the rest. */
        max-width: calc(100% - 1rem);
        padding: 0.5rem 0.7rem;
        background: #171b26f2;
        border: 1px solid #2a2f3d;
        border-radius: 6px;
        font-size: 0.78rem;
      }
      #geo-event-picker[hidden] {
        display: none;
      }
      #geo-event-picker input,
      #geo-event-picker button {
        font: inherit;
        color: #e6e9f0;
        background: #232838;
        border: 1px solid #3a4152;
        border-radius: 4px;
        padding: 0.15rem 0.4rem;
      }
      #geo-event-picker button {
        cursor: pointer;
      }
      /* Only occupies space when it has something to say — an always-present
         empty line would push the buttons around as it filled and emptied. */
      .geo-event-error:not(:empty) {
        flex-basis: 100%;
        color: #ffb4b4;
      }
      #hotkey-help kbd {
        display: inline-block;
        min-width: 1.1em;
        text-align: center;
        padding: 0 0.3em;
        border: 1px solid #3a4152;
        border-radius: 3px;
        background: #232838;
      }
      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.5rem;
      }
      .panel-close {
        background: none;
        border: none;
        color: #9aa3b8;
        font-size: 1.1rem;
        cursor: pointer;
        line-height: 1;
      }
      .panel-summary {
        margin: 0.4rem 0;
        color: #e6e8ef;
      }
      .panel-threshold {
        margin: 0 0 0.6rem;
        color: #9aa3b8;
      }
      /* The region panel's statistics. A two-column grid rather than a table:
         the labels are one word each and the values are short, so alignment is
         all the structure it needs. */
      .panel-stats {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.15rem 0.75rem;
        margin: 0.4rem 0 0.6rem;
      }
      .panel-stats dt {
        color: #9aa3b8;
      }
      .panel-stats dd {
        margin: 0;
        color: #e6e8ef;
      }
      .panel-feature {
        border-top: 1px solid #2a2f3d;
        padding: 0.3rem 0;
      }
      .panel-feature summary {
        cursor: pointer;
      }
      /* The vetoing element is the answer; it should be findable at a glance. */
      .panel-feature-veto > summary {
        color: #ff8fa3;
        font-weight: 600;
      }
      .panel-tags {
        width: 100%;
        border-collapse: collapse;
        margin-top: 0.2rem;
      }
      .panel-tags td,
      .panel-tags th {
        padding: 0.1rem 0.3rem;
        color: #9aa3b8;
        vertical-align: top;
      }
      .panel-tags th {
        text-align: left;
        font-weight: 400;
        color: #6f7995;
        border-bottom: 1px solid #2a2f3d;
      }
      .panel-tag-veto td {
        color: #ff8fa3;
      }
      /* A tag the veto short-circuit never evaluated: shown, but visibly not
         part of the arithmetic. */
      .panel-tag-skipped td {
        opacity: 0.55;
        text-decoration: line-through;
      }

      /* The grab bar for the map sheet. Hidden on desktop, where the split is
         fixed and there is nothing to drag. */
      #sheet-handle {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        /* Matches #map s height in the mobile query below, so the bar sits on
           the sheet s top edge from first paint. Without it the handle falls
           back to its static position -- the TOP of the grid container -- and
           floats over the 3D view until the first drag. */
        bottom: var(--sheet-height, 45%);
        height: 1.5rem;
        z-index: 600;
        cursor: ns-resize;
        touch-action: none;
      }
      #sheet-handle::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 0.55rem;
        width: 2.5rem;
        height: 0.25rem;
        margin-left: -1.25rem;
        border-radius: 2px;
        background: #6f7995;
      }
      #map,
      #scene {
        min-height: 0;
        min-width: 0;
      }
      #scene {
        border-left: 1px solid #2a2f3d;
        position: relative;
      }
      /* THE IN-PROGRESS STATE FOR ORDERING THE AGENT (stage 4, DEC-R11-3).
         The root CLAUDE.md requires an async UI action to show a distinguishable
         in-progress state, and the element that was "pressed" here is the canvas
         itself — there is no button to relabel. A route is a worker round trip,
         and its SLOWEST reply is "no route": the search has to exhaust its
         frontier before it can know, which is what every mis-click across a wall
         does. So the wait is real and most likely exactly when the user has
         clicked somewhere unreachable.

         The attribute is also what the e2e reads, for the same reason
         `data-frame-origin` exists: an attribute cannot be observed before it is
         written by mistake. */
      #scene[data-routing="true"] {
        cursor: progress;
      }

      /* THE CANVAS IS SIZED BY CSS, AND ONLY BY CSS (W1, finding R3-2).
         `WebGLRenderer.setSize(w, h, false)` sets the width/height ATTRIBUTES to
         `size x devicePixelRatio` — the drawing buffer, which is supposed to be
         larger — and deliberately does not write `canvas.style`. Without a rule
         here the element then lays out at its attribute size in CSS pixels: 2-3x
         its container on a phone, 1.25-1.5x on a Windows desktop at 125-150 %
         scaling. Everything renders correctly into the buffer, so no pixel test
         notices; what breaks is that most of the picture falls outside the
         visible box and the projection centre — every orbit's pivot — goes with
         it.

         DO NOT ALSO PASS `updateStyle: true`. three then writes
         `canvas.style.width` INLINE, an inline style beats this rule, and this
         rule becomes decoration. One mechanism, and it is this one. */
      #scene canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* The two primary inputs — the category and the ground surface — plus
         every checkbox. Styled together (W15) so the bar reads as one control
         panel rather than as browser defaults dropped into a flex row. */
      select {
        background: #1b1f2a;
        color: inherit;
        border: 1px solid #2a2f3d;
        border-radius: 4px;
        padding: 0.2rem 0.45rem;
        font: inherit;
        font-size: 0.8rem;
      }
      select:hover {
        border-color: #3a4356;
      }
      /* The accent makes a checked box read at a glance in a dark bar; the
         default is a pale system blue that disappears against #171b26.

         BEFORE the :focus-visible rule below, which stylelint's
         no-descending-specificity requires: the lower-specificity selector has
         to come first. */
      input[type="checkbox"] {
        accent-color: #7cc4ff;
        margin: 0 0.15rem 0 0;
        vertical-align: -0.1em;
      }
      select:focus-visible,
      input[type="checkbox"]:focus-visible {
        outline: 2px solid #7cc4ff;
        outline-offset: 1px;
      }
      /* `[hidden]` MUST STILL WIN (DEC-U9). A bare `display` on an element type
         overrides the user agent's `[hidden] { display: none }`, so a label
         given `hidden` in script stayed on screen -- which is how DEC-U9
         shipped inert in N4: the attribute was set correctly and changed
         nothing. Same specificity, declared after, so it takes precedence
         without `!important`. */
      /* THE TAP TARGET, not just the glyph (F3b follow-up). Dropping the title
         text left this control as a single 0.8 rem caret -- roughly 13 x 19 CSS
         px, under WCAG 2.2 SC 2.5.8's 24 x 24 minimum and far under the 44-48 px
         platform guidance, on the milestone whose whole subject is the phone.
         The aria-label fixed the NAME; this fixes the TARGET. */
      #header-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 2.75rem;
        min-height: 2.75rem;
        margin: 0;
        cursor: pointer;
      }

      header label[hidden] {
        display: none;
      }
      header label {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        white-space: nowrap;
      }
      /* The layer switches. Compact, because they sit in a bar that already has
         a category picker and a legend — and GROUPED (W15), because nine of them
         in one wrapping row is a pile. The three groups answer three different
         questions: what is the affordance analysis claiming, what is in the
         world, and what am I inspecting the renderer with. */
      .layer-toggles {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        font-size: 0.78rem;
        color: #9aa3b8;
      }
      .layer-group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.45rem;
        padding: 0.15rem 0.5rem 0.15rem 0.4rem;
        border: 1px solid #262b38;
        border-radius: 999px;
        background: #171b26;
      }
      .layer-group-label {
        color: #6f7995;
        font-size: 0.68rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .layer-toggle {
        white-space: nowrap;
      }
      /* IN PROGRESS (F58): enabling the cell layer refetches, measured at ~1.9 s.
         Dimmed and non-interactive, never hidden -- a control that disappears
         reads as a bug.

         NARROWED 2026-08-19 (DEC-U9), so this file does not carry a rule its
         own markup breaks. It governs a control that is TEMPORARILY BUSY,
         which is what this class is for: the setting still applies, it just
         cannot be touched this instant, and removing it would make the panel
         jump for a moment. A control that is INAPPLICABLE to the current mode
         is a different case and IS removed -- `#show-below-label` while the
         cell layer is off has nothing to be below the threshold OF. */
      .layer-toggle.layer-busy {
        opacity: 0.55;
        cursor: progress;
      }

      .hint {
        color: #6f7995;
        font-size: 0.78rem;
      }

      /* COLLAPSED (DEC-R2-4, redrawn by DEC-R6b-5): the title, the CATEGORY
         picker, the legend and the whole affordance block stay.

         WHY THE CATEGORY PICKER AND NOT THE GROUND PICKER, since this comment
         used to justify keeping both as "the two primary inputs". The category
         picker stays because the legend NAMES the current category (DEC-1) and
         nothing else on screen does — a legend with no way to change what it is
         describing re-creates the round-1 confusion. The ground mode is not in
         that relationship with the legend: nothing in the collapsed bar claims
         anything about it, so hiding it leaves no dangling claim. The sixth
         session asked for it to collapse and Q-R6b-3 chose the note over the
         older wording.

         WHY THE AFFORDANCE BLOCK STAYS AND THE OTHERS GO. The legend describes
         the affordance layers, so those switches are the ones it would be
         strange to hide — same argument as the category picker. World, Debug and
         Ground make no appearance in the collapsed bar's claims.

         Hidden: the hint, the eight-fact status string, and the World, Debug and
         Ground controls. `show-below` is NO LONGER LISTED HERE — it moved inside
         `#layer-group-overlays` (see `main.ts`'s `extras`), so it now collapses
         and expands with the affordance block it belongs to, which is to say it
         stays visible. That reverses its old behaviour deliberately: it was the
         ONLY setting that used to collapse, which is exactly backwards from what
         the sixth session reported.

         The Terrarium attribution is NOT hidden — it moved to Leaflet's own
         attribution control, which is always visible, because attribution may not
         be collapsed away.

         Placed AFTER `.hint` and `#status` deliberately: stylelint's
         `no-descending-specificity` wants the lower-specificity selectors first,
         and these override them. */
      header[data-collapsed="true"] .hint,
      header[data-collapsed="true"] #status,
      header[data-collapsed="true"] #ground-mode-label,
      header[data-collapsed="true"] #layer-group-world,
      header[data-collapsed="true"] #layer-group-diagnostics {
        display: none;
      }

      /* The AR button (F3a): the same square, stacked ABOVE locate.

         TEXT RATHER THAN A PICTOGRAM, deliberately. There is no established
         icon for "enter AR" that reads without a label, and two characters in a
         2 rem box are legible and unambiguous. The glyph stays "AR" in every
         state -- including while a session is running, where the label says
         "Exit AR" -- because a square that changes width is the resizing defect
         this whole round is removing elsewhere. `data-ar-active` carries the
         difference visually; `aria-label` carries it to everyone else. */
      .ar-control {
        margin-bottom: 0.35rem;
      }

      .ar-button {
        width: 2rem;
        height: 2rem;
        padding: 0;
        border: 0;
        background: #fff;
        color: #1a1c22;
        font-size: 0.78rem;
        font-weight: 700;
        line-height: 2rem;
        text-align: center;
        cursor: pointer;
      }

      .ar-button[disabled] {
        /* VISIBLE BUT DIMMED, never hidden: "supported, no GPS fix yet" is
           temporary and self-resolving, so the control has to be discoverable
           BEFORE it becomes usable -- otherwise it appears without warning
           under the user's thumb. That distinction is the reason
           `arButtonState` separates hidden from disabled at all. */
        opacity: 0.55;
        cursor: default;
      }

      .ar-button[data-ar-active="true"] {
        background: #1a5cff;
        color: #fff;
      }

      /* The locate button (DEC-R2-3): a SQUARE icon, bottom-right, so it matches
         the maps convention and — unlike the old text button — does not change
         size when it fails. */
      /* A STANDING, UNOBTRUSIVE READOUT (F4a): distance and bearing only,
         which are the parts that change as the user moves. Dimmer than the
         button beside it -- it is a fact about the map, not a control. */
      .quest-readout {
        color: #b9c0cf;
        font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .geo-event-button {
        /* CONSTANT LABEL AND A FLOOR ON THE WIDTH (F4a). The label is one of
           two constants now, but `Show Quests` and `Finding...` are
           different lengths -- so without this the button still resizes on
           every press, which is the reported defect with a smaller
           amplitude. Wide enough for the longer of the two. */
        min-width: 7.5rem;
        font: inherit;
        color: #e6e8ef;
        background: #2a2f3d;
        border: 1px solid #3a4152;
        border-radius: 4px;
        padding: 0.15rem 0.5rem;
        cursor: pointer;
      }
      .geo-event-button:disabled {
        opacity: 0.6;
        cursor: progress;
      }
      /* The seeded candidates and the winner (DEC-G6).

         THE COLOURS ARE NOT HERE ANY MORE, deliberately. They live in
         `surface-colours.ts` because the reported bug was a COLLISION — the
         user dot, both fetch outlines and these two were all `#ff3860` — and a
         collision between a CSS rule and two TypeScript literals is one nothing
         can assert. `marker-palette.test.ts` now pins that they differ, which
         only works while there is one definition. What stays here is the part
         that is genuinely presentation: opacity and the icon reset. */
      .geo-candidate {
        fill-opacity: 0.55;
        stroke: none;
      }
      /* The winner is an `L.divIcon`, not a vector, so Leaflet's default
         `leaflet-div-icon` chrome — a white box with a grey border — would
         otherwise frame the glyph. */
      .geo-winner {
        background: none;
        border: none;
      }
      .locate-button {
        width: 2rem;
        height: 2rem;
        display: grid;
        place-items: center;
        padding: 0;
        border: none;
        background: #171b26;
        color: #e6e8ef;
        cursor: pointer;
        border-radius: 3px;
      }
      .locate-button:disabled {
        cursor: progress;
      }
      /* THE IN-PROGRESS STATE, which is the one the icon-only button would
         otherwise have lost — and the one CLAUDE.md's async-feedback rule
         actually mandates. A GPS fix routinely takes seconds. */
      .locate-button[data-state="locating"] {
        color: #7cc4ff;
        animation: locate-pulse 1s ease-in-out infinite;
      }
      /* Each failure gets its own colour as well as its own label, because the
         three have three different remedies. */
      .locate-button[data-state="denied"],
      .locate-button[data-state="unavailable"] {
        color: #ff8fa3;
      }
      .locate-button[data-state="timeout"] {
        color: #ffd479;
      }
      .locate-button[data-state="located"] {
        color: #7ce0a3;
      }

      @keyframes locate-pulse {
        50% {
          opacity: 0.35;
        }
      }
      /* Respect a reduced-motion preference: the colour change still carries the
         state, so dropping the animation loses nothing. */
      @media (prefers-reduced-motion: reduce) {
        .locate-button[data-state="locating"] {
          animation: none;
        }
      }

      /* The legend replaces the scale sentence: same claim, read at a glance. */
      #legend {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.75rem;
        color: #9aa3b8;
        flex-wrap: wrap;
      }
      .legend-category {
        color: #e6e8ef;
        font-weight: 600;
      }
      .legend-strip {
        display: inline-flex;
        /* Butted together, so the ramp reads as a continuum rather than as a
           set of categories — it is a continuous quantity. */
        gap: 0;
      }
      .legend-swatch {
        width: 0.85rem;
        height: 0.85rem;
        border: 1px solid transparent;
        display: inline-block;
      }
      /* The empty state (W12): a sentence where the ramp would be. */
      .legend-empty {
        font-style: italic;
      }
      /* What the DATA reaches, beside a ramp that no longer moves (DEC-H7).
         Dimmer than the ramp's own end labels on purpose: the ramp is the
         scale and this is an annotation on it, so it must not read as a third
         endpoint. */
      .legend-observed {
        margin-left: 0.5rem;
        opacity: 0.75;
        font-variant-numeric: tabular-nums;
      }
      .legend-band {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        margin-left: 0.4rem;
      }

      /* THE RAMP GOES, THE CATEGORY NAME STAYS (F3e / DEC-U7).

         PLACED AFTER the base `.legend-*` rules, for the reason the collapse
         block below states about `.hint` and `#status`: stylelint's
         `no-descending-specificity` wants the lower-specificity selectors
         first, and these override them.

         The owner asked not to see "diesen Heatmap-Balken mit von 1 bis 1E4"
         in the collapsed bar. That is the strip and its numbers, not the word
         beside them -- and the word is load-bearing: DEC-1 added this legend
         precisely because nothing else on screen named the active category, so
         removing it wholesale would re-create the round-1 confusion the legend
         exists to fix.

         NOT A REVERSAL OF DEC-1, therefore. That decision requires a legend
         that NAMES the current category; keeping `.legend-category` satisfies
         it in full. The ramp came from the later R6b legend work.

         AND `.legend-category` NOW GOES TOO, WHEN COLLAPSED (round three, G3,
         DEC-W4). The paragraph above is preserved because its reasoning was
         right when written and stopped being right four hours later, which is
         the useful part: what DEC-1 required was that SOMETHING on screen name
         the active category, and by the time the owner saw this the category
         `<select>` had moved into the collapsed bar under its own `Category`
         caption — naming it AND able to change it. The word became a duplicate
         sitting beside the control that says the same thing, which is exactly
         why the thirteenth session read it as a random "Battle Area".

         STILL NOT A REVERSAL OF DEC-1. The thing DEC-1 required is now provided
         by something better. And it is hidden WHEN COLLAPSED rather than
         deleted: the argument is about the collapsed bar, so the expanded
         legend keeps its heading. */
      /* THE WHOLE LEGEND, not a list of its children. The enumeration this
         replaces named seven classes in order to keep an eighth --
         `.legend-category` -- and with that survivor gone (DEC-W4) the list had
         no discriminating job left, only the ability to drift: one new legend
         child and a stray element appears in the collapsed bar, while the two
         e2e assert the CONTAINER and would not notice. Hiding `#legend` says
         what those tests check. */
      header[data-collapsed="true"] #legend {
        display: none;
      }

      /* THE AR OFFER (G6, DEC-W2). Bottom-centre and above the map's own
         controls, because it is the one thing on screen the user is waiting
         for once they have pressed AR without a fix.

         NOT IN THE HEADER: the header collapses, and an offer that can be
         collapsed away is an offer nobody takes. NOT IN `#ar-root` either --
         that layer only composites inside an immersive session, and this
         exists precisely when there is no session yet. */
      .ar-offer {
        position: fixed;
        /* ABOVE THE TOAST BAND (PR review of P3, finding 4). At 1.25rem this
           overlapped `.toast` in both axes and won on z-index -- covering the
           app's only 2D message channel, including the GPS failures this very
           flow produces. The toast sits at `bottom: 0.75rem` and is roughly
           2.5rem tall, so 4.5rem clears it with room for a two-line message.
           The narrower cap keeps the box off the bottom-right locate and AR
           controls, which it would otherwise reach under and, having pointer
           events, swallow taps on. Both are asserted rather than eyeballed. */
        bottom: 4.5rem;
        left: 50%;
        z-index: 1000;
        display: flex;
        gap: 0.6rem;
        align-items: center;
        max-width: 21rem;
        padding: 0.5rem 0.75rem;
        transform: translateX(-50%);
        border: 1px solid rgb(242 244 248 / 25%);
        border-radius: 0.6rem;
        background: rgb(17 19 26 / 94%);
        box-shadow: 0 2px 12px rgb(0 0 0 / 45%);
        color: #f2f4f8;
        font-size: 0.9rem;
        /* THE BOX MUST NOT EAT A TAP MEANT FOR THE MAP (PR review of P3,
           finding 4). Bottom-centre of the VIEWPORT lands on the map's own
           bottom-right controls on a desktop split -- measured at 1280 px, the
           locate button's box is inside this one -- and raising the offset far
           enough to clear them is tuning against one viewport, which the mobile
           sheet then invalidates. The same rule `.ar-hud` and `.ar-toast`
           already follow: the container is transparent to input and the things
           that exist to be pressed opt back in below. */
        pointer-events: none;
      }

      .ar-offer[hidden] {
        display: none;
      }

      .ar-offer-button {
        /* OPTS BACK IN. `.ar-offer` above is `pointer-events: none` so it
           cannot swallow a tap on the map underneath, and that inherits -- so
           without this the button is inert in a real browser while every jsdom
           test still passes, which is the trap `.ar-hud-toggle` documents. */
        pointer-events: auto;
        /* 2.75 rem tall, the same floor the header caret's tap target uses --
           this is the control the whole interaction funnels into, so it is the
           last place to be stingy about target size. */
        min-height: 2.75rem;
        padding: 0 0.9rem;
        border: 0;
        border-radius: 0.4rem;
        background: #1a5cff;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .ar-offer-dismiss {
        /* Opts back in, for the same reason as the button above. */
        pointer-events: auto;
        min-width: 2.75rem;
        min-height: 2.75rem;
        padding: 0;
        border: 1px solid rgb(242 244 248 / 25%);
        border-radius: 0.4rem;
        background: none;
        color: #cfd6e4;
        font-size: 1.1rem;
        line-height: 1;
        cursor: pointer;
      }

      /* THE ATTRIBUTION LINE (G5, DEC-W1). One thin line by default: a short
         name per source, always visible, plus a blue "Attributions" control
         that reveals the full credit text.

         WHAT MAY NOT COLLAPSE, and why this is not a preference. ODbL requires
         the OpenStreetMap credit wherever the data is shown, and this repo
         records the two elevation credits as required "the same as the OSM
         one" -- which is why they were put in this always-visible bar and not
         in the collapsible header. So the SHORT NAMES stay outside the
         expander; only the long sentences move behind it. The owner asked for
         "one word per attribution" in a thin line, and one short name each is
         exactly that.

         The control is the demo's own, not Leaflet's -- see
         `attribution-view.ts` for why -- and keeps the
         `leaflet-control-attribution` class so Leaflet's own styling still
         applies underneath these rules. */
      /* NO `max-width` HERE, and its absence is deliberate (PR review of this
         milestone, finding 2). A 60vw cap looked like prudence and was the one
         thing breaking the milestone's own acceptance criterion: Leaflet's
         corner is absolutely positioned inside the map pane, so the box is
         ALREADY bounded by the map's width, and 60vw of a 390 px phone is a
         224 px content box against ~318 px of resting content -- so the "one
         thin line" wrapped to two, on exactly the viewport the e2e runs at. On
         desktop the map is ~50vw, so the cap never bound there and the rule was
         inert where it was harmless and harmful where it was not. */
      .map-attribution-toggle {
        /* A REAL TAP TARGET, and this is the third time in two days the same
           lesson has been paid for. `font: inherit` resolves to Leaflet's
           0.75 rem, so with `padding: 0` this control shipped at roughly
           65 x 17 px -- under WCAG 2.2 SC 2.5.8's 24 x 24 floor, and smaller
           than the header caret whose size the owner complained about twice.
           It is the only new touch control in the milestone whose whole subject
           is a control being wrong on a phone.

           1.5 rem = 24 px, NOT the 2.75 rem the header toggle uses, and that is
           a judgement rather than an oversight: the owner asked for a thin line,
           and a 44 px control is most of the height they asked to get rid of.
           24 px is the accessibility floor, and unlike the caret this control
           has a large easy-to-hit sibling in the resting line beside it. */
        min-height: 1.5rem;
        /* AND A WIDTH FLOOR (H3). The label became a single "…", so the box no
           longer gets its width from the text -- without this the control
           shrinks to roughly 24 x 12 and satisfies a height-only floor while
           being unpressable. WCAG 2.2 SC 2.5.8 is 24 px in BOTH directions and
           only one of them was ever pinned. */
        min-width: 1.5rem;
        margin-left: 0.35rem;
        padding: 0 0.25rem;
        border: 0;
        background: none;
        /* Leaflet's own attribution link colour, so the control reads as the
           link the feedback asked for rather than as a stray button. */
        color: #0078a8;
        font: inherit;
        text-decoration: underline;
        cursor: pointer;
      }

      /* The three lines the feedback said it may expand to.
         NO `max-width` and NO `color`: both were duplicates of what Leaflet's
         own `.leaflet-control-attribution` already gives this subtree, and the
         comment that used to sit here claimed the width cap was what kept a long
         credit inside the corner. The corner does that. A comment describing a
         mechanism the code does not implement is what the next reader builds
         on. */
      .map-attribution-full {
        padding-top: 0.15rem;
      }

      /* The identity band is outline-only: "nothing known here" must not paint
         a claim the data does not support. */
      .legend-swatch-identity {
        border-style: dashed;
      }
      /* MOBILE (DEC-10): the 3D view fills the viewport and the map becomes a
         full-width sheet over it, draggable in height -- which is also the whole
         of D8 s resizing ask, without a splitter. Follows the RecorderApp map
         browser s full-bleed-plus-overlays pattern rather than inventing a
         second visual language. */
      @media (width <= 860px) {
        /* THE HEADER FLOATS — ON PHONES ONLY (Q11).

           The field report is specifically about phone height ("auf meinem
           Handybildschirm"), and `header-collapse.ts` records the cause exactly:
           `body` is `grid-template-rows: auto 1fr`, so the header is a ROW whose
           height comes OUT of `main` rather than covering it. Here it is taken
           out of flow so the views own the whole viewport.

           SCOPED TO THIS BREAKPOINT AFTER A REAL FAILURE, not out of caution.
           Floating it at every width put the bar on top of the map's own
           top-left controls: Leaflet gives `.leaflet-top` a z-index of 1000, so
           the zoom buttons intercepted every click on `#header-toggle`, and
           raising the header above them would only have inverted the problem by
           burying the zoom buttons. On a phone the map is a bottom SHEET
           (`align-self: end` below), so its controls sit mid-screen and there is
           nothing up here to collide with. Desktop keeps the header as a row,
           where the height it costs is not scarce. */
        body {
          grid-template-rows: 1fr;
        }
        header {
          grid-area: 1 / 1;
          align-self: start;
          z-index: 600;

          /* TRANSPARENT TO THE POINTER EXCEPT ON ITS OWN CONTROLS, which is what
             makes this a HUD rather than a lid. Omitting it broke TEN e2e specs
             — the map click, the 3D hotkeys, the location picker's URL write —
             each reported as `locator.click` timing out on an element that was
             "visible, enabled and stable", the signature of an intercepted
             click. */
          pointer-events: none;

          /* NOT `backdrop-filter`, and that is a constraint rather than taste:
             the dom-overlay research (plan §12) established that the overlay
             root is a BACKDROP ROOT, so a blur cannot touch the AR camera feed
             at all. Frosted glass would look right here and silently do nothing
             in the one place contrast matters most. */
          /* rgb() slash-alpha rather than color-mix(): stylelint s csstree
             validator rejects color-mix as an invalid background value, and a
             lint rule that cannot parse a value is not a reason to disable the
             rule. #11131a at 82 %. */
          background: rgb(17 19 26 / 82%);
        }
        /* Broad on purpose rather than a list of control selectors: a list would
           silently stop covering a control added later, and the symptom would be
           an unclickable button rather than a red test. */
        header > * {
          pointer-events: auto;
        }
        /* Collapsing now only uncovers pixels rather than handing back viewport,
           which is a real change in what the feature is for. Kept because the
           error rule (DEC-R2-15) depends on the state existing, and because
           uncovering the top of the map is still worth a tap. */
        header[data-collapsed="true"] {
          border-bottom-color: transparent;
        }
        main {
          grid-area: 1 / 1;
          grid-template-columns: 1fr;
          grid-template-rows: 1fr;
        }
        #scene {
          grid-area: 1 / 1;
          border-left: none;
        }
        #map {
          grid-area: 1 / 1;
          align-self: end;
          width: 100%;
          /* Driven by --sheet-height, which the drag handle sets on <main>.
             Read only inside this query, so a drag on a phone cannot leave a
             stale height behind in the desktop grid after a rotation. */
          height: var(--sheet-height, 45%);
          z-index: 500;
          border-top: 1px solid #2a2f3d;
        }
        #sheet-handle {
          display: block;
        }
        /* Slides up from the bottom over the map, rather than sitting in the
           top-right corner as it does on desktop. */
        #details {
          inset: auto 0.5rem 0.5rem;
          width: auto;
          max-width: none;
          max-height: 55%;
        }
      }
    </style>
  </head>
  <body>
    <header id="header-bar">
      <!-- Tapping the title collapses the whole bar (DEC-R2-4). It is the title
           AND the control, as the feedback asked; `header-collapse.ts` gives it
           role/tabindex/aria-expanded so it is reachable by keyboard too. -->
      <!-- TEXT REMOVED, CARET KEPT (F3b, 2026-08-19). The caret is a
           `<svg class="header-caret">` inside this element (round three,
           G1/F9 -- it was a CSS `::before` until then, and a pseudo-element
           cannot be measured by a browser test, which is why the one
           complaint this bar kept getting had no guard). Its ACCESSIBLE NAME
           did not survive the text going: this text was it, and an empty
           `role="button"` announces as nothing. `header-collapse.ts` now
           sets an explicit `aria-label` that tracks the state.

           Partially reverses DEC-R2-4, whose collapse rule listed the title
           among the things a collapsed header keeps. -->
      <h1 id="header-toggle">
        <svg
          class="header-caret"
          viewBox="0 0 16 16"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M0 0 H16 L8 16 Z" fill="currentColor" />
        </svg>
      </h1>
      <!-- THE EXAMPLE-LOCATION PICKER (W5, DEC-R4-11). Before the category
           picker, as the feedback asked. Its options come from the SAME table
           the offline fixture corpus is captured from, so the places a human
           can reach are exactly the places the suite covers. Populated from
           `site-picker.ts`; the markup carries no place names. -->
      <!-- LABEL TEXT DROPPED, ACCESSIBLE NAME KEPT (F3c). The wrapper's
           word was pure markup on a bar that has to fit a phone; the
           `aria-label` is what a screen reader used to get from it. -->
      <select id="site" aria-label="location"></select>
      <!-- MOVED INTO THE CATEGORY GROUP AT RUNTIME (F3d), the same seam
           `#show-below-label` uses. It stays here in the source because
           this is where the header's own controls live and
           `layer-toggles.ts` builds `#layers` from scratch; `main.ts` hands
           it over as an `overlays` extra. The group's caption now reads
           `Category`, so the picker sits under its own heading. -->
      <select id="category" aria-label="category"></select>
      <!-- MOVED INTO THE AFFORDANCE GROUP AT RUNTIME (DEC-R6b-5). It stays here
           in the source because this is where the header's own controls live and
           `layer-toggles.ts` builds `#layers` from scratch; `main.ts` hands the
           label over as an `overlays` extra, the same seam the perf switch uses.
           The `id` exists so it can be handed over by name rather than by
           walking up from the checkbox.

           AND IT IS NOW HIDDEN WHILE THE CELL LAYER IS OFF (DEC-U9), which
           partially reverses the paragraph above. That move was made so this
           setting would STAY VISIBLE, after the sixth session complained it was
           the only one that collapsed. The trigger is different: collapse still
           keeps it while `cells` is on, and what removes it now is the setting
           having nothing to apply to. See `.layer-busy` above for the narrowed
           rule. -->
      <label class="layer-toggle" id="show-below-label"
        ><input type="checkbox" id="show-below" /> below threshold</label
      >
      <!--
        THE GEO-EVENT TRIGGER (round 9, DEC-R9-13). A BUTTON rather than firing on
        every position change: computing an event can score hundreds of chunks and
        may download a tile, and clicking around the map is this demo primary
        interaction. It also makes WHEN it ran visible, which matters on a
        diagnostic surface.
      -->
      <button type="button" id="geo-event" class="geo-event-button">
        Show Quests
      </button>
      <!-- THE STANDING DISTANCE READOUT (F4a). The button's label became a
           constant so it would stop resizing, which deletes F56's actual
           win: a distance that re-reads as the user walks. A toast fades
           and a pan does not restate, so this is what preserves it.

           AFTER THE BUTTON, NOT BEFORE IT (PR review of the row-order fix,
           finding 1). It is `hidden` until a quest is found, so it costs
           nothing at boot and the first row fits comfortably -- but with
           "340 m SW" in it the row goes about 30 px over a 390 px phone, and
           whichever item is LAST is the one that wraps. Before the button that
           was Show Quests: the control the row exists for would have been
           pushed off it the moment the feature was used, in the one state the
           layout was never measured in. Ordered this way the readout takes its
           own line instead, which is the cheaper thing to lose. -->
      <span id="quest-readout" class="quest-readout"></span>
      <!-- ROW 1 ENDS HERE (G2). Everything above shares the first line -- the
           caret, the city picker and Show Quests with its distance readout --
           and the layer groups start the second. See `.header-row-break`. -->
      <span class="header-row-break" aria-hidden="true"></span>
      <!-- Per-layer toggles (DEC-R2-10). Independent switches rather than a
           two-state mode: a mode makes it impossible to view a merged area OVER
           the cells that produced it, which is the first check anyone makes when a
           region looks wrong. Populated from ALL_LAYERS so a new builder cannot
           arrive without a switch. -->
      <div id="layers" class="layer-toggles"></div>
      <!--
        AR MODE (DEC-12, AR milestone 1). HIDDEN BY DEFAULT and revealed by
        `arButtonState`, never by this markup: the device may not support
        immersive AR, and on a device that does, entry still waits for a first
        GPS fix because the scene is anchored to the framework's `zero`.

        THE MAP STAYS. DEC-12 is explicit that AR is an additional mode, not a
        replacement — the reference consumer's pattern hides its map view
        inversely to AR support, which here would cost every WebXR-capable
        phone the only interface that can drive the data.
      -->
      <!-- MOVED INTO A LEAFLET CONTROL AT RUNTIME (F3a, 2026-08-19), above
           the locate button in the bottom-right corner. It stays here in
           the source for the same reason the pickers do: this is where the
           header's controls live, and `main.ts` hands it over.

           SQUARE AND ICON-ONLY, matching `.locate-button` (DEC-R2-3). The
           label text moves to `title`/`aria-label` rather than being
           deleted -- that wording is the only thing distinguishing the four
           states `arButtonState` models, and on touch a `title` never
           shows, so the accessible name is what carries it. -->
      <button type="button" id="enter-ar" class="ar-button" hidden>AR</button>
      <!--
        THE GROUND MODE (W11, DEC-R3-3). NOT a layer — it does not add or remove
        anything from the scene, it chooses which surface is drawn as the ground:
        the CPU-displaced plane, the GPU-displaced one (W23's A/B comparison), or
        none at all. `ALL_LAYERS` means "things the scene can draw", each
        independently; this is one thing drawn three ways and is exclusive.

        `No ground` is what makes the OSM ground areas inspectable on their own —
        the ask behind the round-3 note — while `plates` stays an ordinary layer,
        so "areas lying on the terrain" is still reachable. Options are populated
        from `GROUND_MODES` so the picker cannot drift from the union.
      -->
      <label class="layer-toggle" id="ground-mode-label">
        ground
        <select id="ground-mode"></select>
      </label>
      <!-- A DIAGNOSTIC, outside the layer registry because it draws nothing in
           the scene. Off by default (DEC-R3-18) so the demo's default picture is
           unchanged. Since W6 it is the only member of the debug group — the
           height ramp that used to sit beside it is now a ground mode. -->
      <label class="layer-toggle" id="perf-stats-label">
        <input type="checkbox" id="perf-stats" />
        perf
      </label>
      <span id="status">starting…</span>
      <div id="legend"></div>
    </header>
    <main>
      <div id="map"></div>
      <div id="scene"></div>
      <!--
        WHERE `initAR` MOUNTS (AR milestone 1). Its OWN element rather than
        `<main>` or `#scene`: the framework inserts a full-screen canvas plus a
        DOM-overlay root as children of whatever it is given, and both `#map`
        and `#scene` are grid-laid children that the demo sizes itself. Handing
        either over would put a full-screen canvas inside a sized cell and
        leave the demo's own resize observer fighting it.

        Empty and zero-sized until a session starts; the framework's canvas is
        positioned by the UA once the session is immersive.
      -->
      <!--
        NO `aria-hidden` (r510 review). It carried one, statically, and nothing
        ever toggled it — which silently made the AR toast's `role="status"` /
        `aria-live="polite"` inert, because an `aria-hidden` subtree is removed
        from the accessibility tree wholesale. The toast exists precisely to
        reach a user who cannot see the header's status line, so hiding it from
        assistive technology defeated it for the one audience with the fewest
        alternatives.

        Nothing is needed in its place: the container is `display: none` while
        `:empty` (see the CSS above), which keeps it out of the accessibility
        tree whenever no session is running. The HUD inside it carries its own
        `aria-hidden`, because a readout that changes twice a second forever
        should not be announced.
      -->
      <div id="ar-root"></div>
      <!-- THE AR OFFER (G6, DEC-W2). Shown when a fix arrives that an AR
           PRESS asked for, never when the user merely pressed Locate.

           A REAL CONTROL, NOT A TOAST, and the difference is the whole design.
           A toast fades on its own; this is the second half of an action the
           user started, and the wait it follows can be a walk outside to get a
           fix -- so it has to still be there when they look back at the screen.

           ITS BUTTON IS ALSO WHAT MAKES THE SHAPE LEGAL. requestSession() needs
           transient user activation, so the session must be asked for from a
           fresh gesture; entering from the fix callback would spend the
           activation the press already used. See `ar-entry.ts`. -->
      <div
        id="ar-offer"
        class="ar-offer"
        role="status"
        aria-live="polite"
        hidden
      >
        <span class="ar-offer-text">Found you.</span>
        <button type="button" id="ar-offer-enter" class="ar-offer-button">
          Enter AR now
        </button>
        <button
          type="button"
          id="ar-offer-dismiss"
          class="ar-offer-dismiss"
          aria-label="Dismiss the AR prompt"
        >
          ×
        </button>
      </div>
      <!-- The 2D message channel. Deliberately NOT inside `#ar-root`: that
           subtree is what WebXR composites during an immersive session, and
           a 2D message has to be visible when no session is running. See
           `toast.ts.md`. -->
      <div id="toast-root"></div>
      <!-- An OVERLAY on desktop too (DEC-17): a third column would squeeze the
           two views to ~450 px each on a laptop, which is the width that made
           the 3D pane useless on a phone. -->
      <div id="sheet-handle" aria-hidden="true"></div>
      <aside id="details" hidden></aside>
      <!-- The keyboard shortcuts, listed by the registry that owns them (§1).
           An undocumented hotkey is a feature only its author has, so "?"
           toggles this and it is populated from `hotkeys.bindings()` rather
           than hand-written — a list that can disagree with the bindings is
           worse than none. -->
      <aside id="hotkey-help" hidden></aside>
      <!-- The geo-event time picker (G1, DEC-G1). Empty here and filled by
           `geo-event-picker.ts`: the two inputs, the two buttons and the error
           line are one interaction, and splitting them between markup and
           wiring is how a control ends up with no listener.

           A `hidden`-toggled `<aside>` rather than a `<dialog>`, like the two
           above it. `showModal()` traps focus and dims the page, which is right
           for a decision that blocks and wrong for this one — the map
           underneath is what you consult while choosing a time. -->
      <aside id="geo-event-picker" hidden></aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
