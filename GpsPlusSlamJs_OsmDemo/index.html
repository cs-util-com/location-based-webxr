<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      NO `viewport-fit=cover`, DELIBERATELY, and it was added and then reverted.

      Opting in does two things: it makes `env(safe-area-inset-*)` non-zero, and
      it extends the layout viewport UNDER the system bars. This package consumes
      no safe-area inset anywhere — the AR bottom stack uses a plain `bottom:
      4vh`, and the top offset at the `.ar-hud` rule says outright that it is a
      plain offset rather than a `max(..., env(safe-area-inset-top))`.

      So the only live effect would be the second half: content pushed further
      down, under the navigation bar. That is the WRONG DIRECTION for the very
      symptom it was meant to help — a compass bar reported as not sitting flush
      at the bottom. Caught in review of PR #333.

      Opting in is still the right move the day something consumes the insets,
      and `ar-overlay-contract.test.ts` pins exactly that coupling so the two
      halves cannot be separated again.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OSM affordance demo</title>
    <!--
      A DATA-URI ICON, matching the RecorderApp and the landing page rather than
      inventing a second convention. Without it the browser requests
      `/favicon.ico` unprompted and logs a 404 on every load — noise in the one
      place a real error would show.
      It survived many sessions because HEADLESS Chromium never requests a
      favicon, so no e2e could see it however the console filter was written.
      `gallery.html` carries the same link for the same reason.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%23ef4444'/%3E%3Ccircle cx='50' cy='50' r='15' fill='%23fff'/%3E%3C/svg%3E"
      type="image/svg+xml"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <!--
      design.css is a VERBATIM copy of GpsPlusSlamJs_DesignSystem/design.css,
      written by `pnpm run vendor` there and held byte-identical by
      tests/repo-config/design-css-copies.test.js - never edit it here. It
      is linked before the <style> block so its @layer order is fixed first;
      the rules below are unlayered and therefore win every conflict (the
      adoption plan's L1 contract) - adopting an atom means deleting the rule
      here. Adoption plan M6a: the copy lands with three pins (below) and
      nothing visible moves; M6b restyles the AR HUD, M6c the 2D chrome.
    -->
    <link rel="stylesheet" href="/design.css" />
    <style>
      :root {
        color-scheme: dark;
      }
      /* PINS until the restyle (adoption plan M6a, DEC-L2-8's rule): the
         three places design.css's reset and base layers landed where this
         page left a browser default, measured with `pnpm run leaks` -
         everything else on the list was font: inherit on checkboxes and
         an icon-only button, with nothing visible. Each goes with the
         restyle of the element it protects. */
      input[type="range"] {
        margin: 2px;
        /* Not a pin: a vertical swipe over a slider scrolls (Chromium's own
           default, said out loud for other engines); the value itself is
           held by the framework's slider guard, installed in main.ts. */
        touch-action: pan-y;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px/1.4 system-ui,
          sans-serif;
        background: #11131a;
        color: #e6e8ef;
        display: grid;
        grid-template-rows: 1fr;
        height: 100dvh;
      }

      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 0;
        position: relative;
      }

      /*
        AR MOUNT POINT. OUT OF FLOW IN BOTH STATES, and that is the whole rule.

        `main` is a two-column grid with no explicit rows, so an in-flow third
        child lands in an implicit second row -- and because both implicit rows
        are `auto` and stretch, the map/3D row loses roughly half of main s
        height to an empty band. Caught in review; no gate could see it, since
        the height assertion runs only at the mobile viewport and the canvas
        check compares against #scene s own box however small that gets.

        `:empty` is doing real work: with no session the element is display:none
        and cannot affect the grid at all. Once `initAR` inserts its canvas and
        DOM-overlay root it becomes a fixed, viewport-sized layer, which is what
        the framework already sizes its canvas for.
      */
      #ar-root {
        position: fixed;
        inset: 0;
      }

      /*
        THE TOP-ALIGNED COLUMN THE READOUT AND THE SLIDER SHARE (G9, DEC-W5).

        A BOX OF ITS OWN, and the first attempt at this got that wrong in a way
        no test could see. It made `#ar-root` ITSELF the flex column -- but the
        framework inserts its full-screen WebGL canvas as that element's FIRST
        CHILD, in flow, with an inline `height` of 100vh written by
        `renderer.setSize`. As a flex item that canvas cannot shrink, so the
        readout and the slider were pushed a full viewport below the fold and
        were invisible for the entire session. The e2e missed it because its
        fixture builds `#ar-root`'s contents by hand and omitted the one child
        that breaks the layout. Found by the PR review, not by the gate.

        So the column lives in a wrapper the demo owns, and `#ar-root` goes back
        to being a plain block that the canvas can fill.

        SHRINK-WRAPPED ON PURPOSE: `top`/`left` with no `right` or `width`, so
        the box hugs its widest child instead of spanning the viewport and
        eating taps in the empty space beside them. `pointer-events` is
        deliberately NOT set here -- `.ar-hud` opts out for itself and the
        slider needs input, exactly as before.

        WHY A COLUMN AT ALL. The slider used to be `bottom: 20vh`, centred and
        up to 88vw wide -- a bar straight across the near content, which is what
        the thirteenth session reported. Moving it to some `top:` value would
        have put two hard-coded offsets in one corner, one of which CHANGES
        HEIGHT AT RUNTIME: the compass box wraps and carries a hint line. That
        is how the earlier toast/slider overlap happened (PR #311 review,
        finding 4). A column cannot overlap itself.
      */
      .ar-stack {
        position: absolute;
        top: 2.5rem;
        left: 0.75rem;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }

      #ar-root:empty {
        display: none;
      }

      /*
        THE ENTRY WAITING LINE (J1, DEC-J11).

        The entry gate can hold for `DESCENT_ESTIMATE_WAIT_S` before the descent
        starts, and a held picture with no MOTION does not say whether the entry
        is working or stalled — the same ambiguity the landing announcement
        exists to remove at the other end.

        NOT "the screen would otherwise be blank", which an earlier draft
        claimed. The city is already attached below the user by the time this
        shows, and the additive shell draws OVER the veil, so the hold shows the
        city 60–100 m down. It is the stillness that is ambiguous, not the
        emptiness.

        CENTRED AND UNSTYLED BEYOND LEGIBILITY: it is present for at most three
        seconds and is removed the instant the descent begins, so a panel with a
        border and a shadow would draw more attention leaving than it earns
        while it is up.

        `pointer-events: none` for the same reason `.ar-toast` carries it —
        `#ar-root` is a full-viewport fixed layer, and anything in it that
        swallowed a tap would be the regression the `:empty` rule above exists
        for.
      */
      /* THE DOM ENTRY VEIL (DEC-K5). Covers the window between the session
         being granted -- at which point the passthrough camera is already
         composited -- and the first WebGL frame, which no scene mesh can
         reach. `#ar-root` is the session's dom-overlay root, so the browser
         composites this over the camera whether or not WebGL drew anything.

         The colour is set inline from `ENTRY_VEIL_COLOUR` so the two veils
         cannot drift apart; only the geometry lives here.

         `pointer-events: none` because it must never eat a tap: it sits over
         the whole viewport, and the AR exit affordance is underneath it. */
      .ar-entry-dom-veil {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      .ar-entry-wait {
        position: absolute;
        top: 45%;
        left: 50%;
        margin: 0;
        transform: translateX(-50%);
        max-width: 88vw;
        color: #f2f4f8;
        font-size: 1rem;
        text-align: center;
        /* Against a veil this dark the text is legible on its own, but the veil
           is FADING — by the time it is half gone the camera feed behind it is
           of unknown brightness, so the shadow is what keeps the line readable
           for its last moments. */
        text-shadow: 0 1px 6px rgb(0 0 0 / 70%);
        pointer-events: none;
      }

      /* THE AR HUD WEARS THE DESIGN SYSTEM (adoption plan M6b). Its visual
         rules are gone: ar-hud.ts, ar-mode.ts, ar-elevation-control.ts,
         ar-experiment-panel.ts, ar-compass-control.ts and ar-toast.ts put
         the atoms and the hud-* compositions from design.css beside their
         ar-* hooks (the hooks stay: the jsdom tests and the e2e name them).
         What is left here is behaviour and placement, not look:
         - pointer-events: the readout and the toast may never eat a tap
           (a pure CSS change once moved ten specs); the toggle opts back in;
         - the readout's line breaks: the values are one newline-joined string;
         - the bottom stack's width: 96vw capped at 26rem, the arithmetic of
           DEC-Y10/Y12 that keeps the 40-character compass readout on one
           line at 390 px (asserted by the e2e) - the catalog's 340 px is a
           phone-frame number;
         - the experiments panel opens ABOVE the gear inside its wrapper,
           where the catalog's .exp-panel sits at a phone-frame offset, and
           its [hidden] companion stays until the last author display that
           could beat hidden is gone (DEC-Y16's hazard);
         - the AR toast's placement: the catalog's .hud-toast placement is
           catalog chrome, never vendored (PR #311's band). */
      .ar-hud {
        /* IN THE COLUMN (G9, DEC-W5): the stack places the readout, so the
           composition's own absolute offset - a phone-frame number in the
           catalog - is switched off here. */
        position: static;
        pointer-events: none;
      }
      .ar-hud-values {
        white-space: pre-line;
      }
      .ar-hud-toggle {
        pointer-events: auto;
      }
      .ar-bottom {
        width: 96vw;
        max-width: 26rem;
      }
      .ar-gear-wrap {
        position: relative;
      }
      .ar-experiments {
        right: 0;
        bottom: 3rem;
      }
      .ar-experiments[hidden] {
        display: none;
      }
      .ar-toast {
        position: absolute;
        left: 50%;
        bottom: 12vh;
        transform: translateX(-50%);
        max-width: 88vw;
        pointer-events: none;
      }

      /* The 2D toast (round two, N3).

         WHY THE PAGE NEEDED ONE AT ALL. Every non-AR message in this demo
         went to the header status line, and that single fact is what forced
         the header to pop itself open on every error (DEC-R2-15): a message
         written into a collapsed header is a message nobody sees. With a
         channel visible while collapsed, that rule can retire (DEC-U10) -
         which is why this exists rather than being a nicety.

         `#toast-root` is an EMPTY, pointer-events-none layer that is
         always present, unlike `#ar-root`, which is only safe to leave in
         the DOM because it collapses via `:empty`. This one has no size of
         its own - it holds its child and nothing more - so it cannot eat
         a tap even while a message is showing. That is the regression
         recorded in `ar-mode.ts`, avoided by construction rather than by a
         rule someone has to remember.

         IN THE DOCK above the legend plate on a phone (see `.hud-dock`),
         below the bar at the 3D view's top-left on a desktop and a phone on
         its side: the locate and AR controls sit bottom-right (F3a), and so
         does Leaflet's attribution. */
      #toast-root {
        pointer-events: none;
      }

      .toast {
        pointer-events: none;
      }

      /* Floats over the split rather than taking a column (DEC-17). */
      #details {
        position: absolute;
        top: calc(var(--hud-bar-h) + 0.5rem);
        right: 0.5rem;
        bottom: 0.5rem;
        width: 22rem;
        max-width: 42vw;
        overflow-y: auto;
        z-index: 1000;
        font-size: 0.78rem;
      }
      #details[hidden] {
        display: none;
      }
      /* THE LIGHT DIALOG (plan 2026-09-24-2140): in the right slot below the
         command bar, stacked over the settings drawer it is opened from and
         over the details panel; its back arrow, Close button and Escape
         close it and leave the drawer as it was. */
      #light-dialog {
        position: absolute;
        top: var(--hud-bar-h);
        right: 0;
        bottom: 0;
        width: var(--hud-slot-w);
        overflow-y: auto;
        z-index: 1060;
        font-size: 0.78rem;
      }
      #light-dialog[hidden] {
        display: none;
      }
      #light-dialog h2 {
        margin: 0 0 0.4rem;
        font-size: 0.9rem;
      }
      #light-dialog .light-row {
        display: grid;
        grid-template-columns: 1fr 2.6rem;
        gap: 0.1rem 0.4rem;
        margin-bottom: 0.35rem;
      }
      #light-dialog .light-row span {
        grid-column: 1 / -1;
      }
      #light-dialog .light-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
      }
      /* Bottom-LEFT, so it cannot sit under the details panel and cannot be
         mistaken for it. Same surface treatment, deliberately: it is the same
         kind of thing — an overlay that explains the view. */
      #hotkey-help {
        position: absolute;
        left: 0.5rem;
        bottom: 0.5rem;
        z-index: 1000;
        font-size: 0.78rem;
        line-height: 1.5;
      }
      #hotkey-help[hidden] {
        display: none;
      }
      /* BOTTOM-LEFT, and pinned to the corner rather than floating (field
         report, 2026-08-23): "the 'Find an event at' Box has now a good size
         but a very random position. How about moving it to the bottom left?"
         It had been offset from the bottom-right, which on a short map pane
         reads as hovering in the middle of the map rather than as a corner
         panel.

         IT CLEARS BOTH OTHER OCCUPANTS OF THIS CORNER, which is why the bottom
         offset is not 0.5rem. `.toast` is `left: 0.75rem; bottom: 0.75rem` —
         a two-line toast reaches ~70px — and `#hotkey-help` sits at the same
         corner and reaches ~102px with today's four bindings (4 rows ≈ 94px
         + the 0.5rem offset). 6rem (96px) cleared the toast but already
         covered the list's top row — the move from bottom-right silently
         dropped the old "sits opposite the hotkey list" invariant (PR #345
         review). 8rem (128px) cleared four bindings but not a fifth (the
         light dialog's `l`, 2026-09-24, caught by the guard below); 10rem
         (160px) clears five with about one row of slack. The
         list grows a row per future hotkey, so the e2e overlap guard in
         `map-and-cells.spec.js` (picker vs `#hotkey-help`, list open) is what
         keeps this offset honest rather than merely measured-once.

         The bottom-RIGHT corner is Leaflet's control column (the AR and locate
         buttons, moved there by `main.ts` at runtime). Being on the opposite
         side is now what keeps this off them; the earlier `right` offset was
         doing that job and is no longer needed. */
      #geo-event-picker {
        position: absolute;
        left: 0.5rem;
        bottom: 10rem;
        z-index: 1000;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem;
        /* SMALL BY DEFAULT, and it used to be `max-width: calc(100% - 1rem)` —
           i.e. as wide as the pane, which on a phone is the whole screen. The
           same report: "it is unnecessarily large. Especially the width causes
           problems because it fills the entire screen space."

           A fixed width with a pane-relative cap: the width is what keeps it
           small on a phone, the cap is what stops it overflowing a narrow one.
           `min()` is not used because the gate's CSS validator rejects it. */
        width: 13rem;
        max-width: calc(100% - 4rem);
        font-size: 0.78rem;
      }
      #geo-event-picker[hidden] {
        display: none;
      }
      #geo-event-picker input,
      #geo-event-picker button {
        font: inherit;
        color: #e6e9f0;
        background: #232838;
        border: 1px solid #3a4152;
        border-radius: 4px;
        padding: 0.15rem 0.4rem;
      }
      #geo-event-picker button {
        cursor: pointer;
      }
      /* Only occupies space when it has something to say — an always-present
         empty line would push the buttons around as it filled and emptied. */
      .geo-event-error:not(:empty) {
        flex-basis: 100%;
        color: #ffb4b4;
      }
      #hotkey-help kbd {
        display: inline-block;
        min-width: 1.1em;
        text-align: center;
        padding: 0 0.3em;
        border: 1px solid #3a4152;
        border-radius: 3px;
        background: #232838;
      }
      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.5rem;
      }
      .panel-close {
        background: none;
        border: none;
        color: #9aa3b8;
        font-size: 1.1rem;
        cursor: pointer;
        line-height: 1;
      }
      .panel-summary {
        margin: 0.4rem 0;
        color: #e6e8ef;
      }
      .panel-threshold {
        margin: 0 0 0.6rem;
        color: #9aa3b8;
      }
      /* The region panel's statistics. A two-column grid rather than a table:
         the labels are one word each and the values are short, so alignment is
         all the structure it needs. */
      .panel-stats {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.15rem 0.75rem;
        margin: 0.4rem 0 0.6rem;
      }
      .panel-stats dt {
        color: #9aa3b8;
      }
      .panel-stats dd {
        margin: 0;
        color: #e6e8ef;
      }
      .panel-feature {
        border-top: 1px solid #2a2f3d;
        padding: 0.3rem 0;
      }
      .panel-feature summary {
        cursor: pointer;
      }
      /* The vetoing element is the answer; it should be findable at a glance. */
      .panel-feature-veto > summary {
        color: #ff8fa3;
        font-weight: 600;
      }
      .panel-tags {
        width: 100%;
        border-collapse: collapse;
        margin-top: 0.2rem;
      }
      .panel-tags td,
      .panel-tags th {
        padding: 0.1rem 0.3rem;
        color: #9aa3b8;
        vertical-align: top;
      }
      .panel-tags th {
        text-align: left;
        font-weight: 400;
        color: #6f7995;
        border-bottom: 1px solid #2a2f3d;
      }
      .panel-tag-veto td {
        color: #ff8fa3;
      }
      /* A tag the veto short-circuit never evaluated: shown, but visibly not
         part of the arithmetic. */
      .panel-tag-skipped td {
        opacity: 0.55;
        text-decoration: line-through;
      }

      /* The grab bar for the map sheet. Hidden on desktop, where the split is
         fixed and there is nothing to drag. */
      #sheet-handle {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        /* Matches #map s height in the mobile query below, so the bar sits on
           the sheet s top edge from first paint. Without it the handle falls
           back to its static position -- the TOP of the grid container -- and
           floats over the 3D view until the first drag. */
        bottom: var(--sheet-height, 45%);
        height: 1.5rem;
        z-index: 600;
        cursor: ns-resize;
        touch-action: none;
      }
      #sheet-handle::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 0.55rem;
        width: 2.5rem;
        height: 0.25rem;
        margin-left: -1.25rem;
        border-radius: 2px;
        background: #6f7995;
      }
      #map,
      #scene {
        min-height: 0;
        min-width: 0;
      }
      #scene {
        border-left: 1px solid #2a2f3d;
        position: relative;
      }
      /* THE IN-PROGRESS STATE FOR ORDERING THE AGENT (stage 4, DEC-R11-3).
         The root CLAUDE.md requires an async UI action to show a distinguishable
         in-progress state, and the element that was "pressed" here is the canvas
         itself — there is no button to relabel. A route is a worker round trip,
         and its SLOWEST reply is "no route": the search has to exhaust its
         frontier before it can know, which is what every mis-click across a wall
         does. So the wait is real and most likely exactly when the user has
         clicked somewhere unreachable.

         The attribute is also what the e2e reads, for the same reason
         `data-frame-origin` exists: an attribute cannot be observed before it is
         written by mistake. */
      #scene[data-routing="true"] {
        cursor: progress;
      }

      /* THE CANVAS IS SIZED BY CSS, AND ONLY BY CSS (W1, finding R3-2).
         `WebGLRenderer.setSize(w, h, false)` sets the width/height ATTRIBUTES to
         `size x devicePixelRatio` — the drawing buffer, which is supposed to be
         larger — and deliberately does not write `canvas.style`. Without a rule
         here the element then lays out at its attribute size in CSS pixels: 2-3x
         its container on a phone, 1.25-1.5x on a Windows desktop at 125-150 %
         scaling. Everything renders correctly into the buffer, so no pixel test
         notices; what breaks is that most of the picture falls outside the
         visible box and the projection centre — every orbit's pivot — goes with
         it.

         DO NOT ALSO PASS `updateStyle: true`. three then writes
         `canvas.style.width` INLINE, an inline style beats this rule, and this
         rule becomes decoration. One mechanism, and it is this one. */
      #scene canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* The two primary inputs — the category and the ground surface — plus
         every checkbox. Styled together (W15) so the bar reads as one control
         panel rather than as browser defaults dropped into a flex row. */
      select {
        background: #1b1f2a;
        color: inherit;
        border: 1px solid #2a2f3d;
        border-radius: 4px;
        padding: 0.2rem 0.45rem;
        font: inherit;
        font-size: 0.8rem;
      }
      select:hover {
        border-color: #3a4356;
      }
      /* The accent makes a checked box read at a glance in a dark bar; the
         default is a pale system blue that disappears against #171b26.

         BEFORE the :focus-visible rule below, which stylelint's
         no-descending-specificity requires: the lower-specificity selector has
         to come first. */
      input[type="checkbox"] {
        accent-color: #7cc4ff;
        margin: 0 0.15rem 0 0;
        vertical-align: -0.1em;
        /* PIN (M6a): the reset's font: inherit gave the boxes a line-height
           that made the header 2px taller */
        line-height: normal;
      }
      select:focus-visible,
      input[type="checkbox"]:focus-visible {
        outline: 2px solid #7cc4ff;
        outline-offset: 1px;
      }

      /* The layer switches. Compact, because they sit in a bar that already has
         a category picker and a legend — and GROUPED (W15), because nine of them
         in one wrapping row is a pile. The three groups answer three different
         questions: what is the affordance analysis claiming, what is in the
         world, and what am I inspecting the renderer with. */
      .layer-toggles {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        font-size: 0.78rem;
        color: #9aa3b8;
      }
      /* THE ONE BLOCK VISUAL of a layer group: a drawer section. */
      .layer-group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.45rem;
        padding: 0.15rem 0.5rem 0.15rem 0.4rem;
        border: 1px solid #262b38;
        border-radius: 0.5rem;
        background: rgb(23 27 38 / 82%);
      }
      .layer-group-label {
        color: #6f7995;
        font-size: 0.68rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .layer-toggle {
        white-space: nowrap;
      }
      /* A SECTION is a native `<details>` built by `layer-toggles.ts`: its
         caption is the `<summary>` that unfolds it. */
      .layer-group > summary {
        cursor: pointer;
      }
      .layer-group::details-content {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.45rem;
      }
      /* IN PROGRESS (F58): enabling the cell layer refetches, measured at ~1.9 s.
         Dimmed and non-interactive, never hidden -- a control that disappears
         reads as a bug.

         NARROWED 2026-08-19 (DEC-U9), so this file does not carry a rule its
         own markup breaks. It governs a control that is TEMPORARILY BUSY,
         which is what this class is for: the setting still applies, it just
         cannot be touched this instant, and removing it would make the panel
         jump for a moment. A control that is INAPPLICABLE to the current mode
         is a different case and IS removed -- `#show-below-label` while the
         cell layer is off has nothing to be below the threshold OF. */
      .layer-toggle.layer-busy {
        opacity: 0.55;
        cursor: progress;
      }

      /* The AR button (F3a): the same square, stacked ABOVE locate.

         TEXT RATHER THAN A PICTOGRAM, deliberately. There is no established
         icon for "enter AR" that reads without a label, and two characters in a
         2 rem box are legible and unambiguous. The glyph stays "AR" in every
         state -- including while a session is running, where the label says
         "Exit AR" -- because a square that changes width is the resizing defect
         this whole round is removing elsewhere. `data-ar-active` carries the
         difference visually; `aria-label` carries it to everyone else. */
      .ar-control {
        margin-bottom: 0.35rem;
      }

      .ar-button[data-ar-active="true"] {
        background: var(--accent);
        color: var(--ink-on-accent);
      }

      /* The locate button (DEC-R2-3): a SQUARE icon, bottom-right, so it matches
         the maps convention and — unlike the old text button — does not change
         size when it fails. */
      /* A STANDING, UNOBTRUSIVE READOUT (F4a): distance and bearing only,
         which are the parts that change as the user moves. Dimmer than the
         button beside it -- it is a fact about the map, not a control. */
      .quest-readout {
        color: #b9c0cf;
        font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      /* The light dialog's opener and Show Quests share one button look, not
         the design system's tall panel buttons. */
      .geo-event-button,
      #light-open {
        font: inherit;
        color: #e6e8ef;
        background: #2a2f3d;
        border: 1px solid #3a4152;
        border-radius: 4px;
        padding: 0.15rem 0.5rem;
        cursor: pointer;
      }
      .geo-event-button {
        /* CONSTANT LABEL AND A FLOOR ON THE WIDTH (F4a). The label is one of
           two constants now, but `Show Quests` and `Finding...` are
           different lengths -- so without this the button still resizes on
           every press, which is the reported defect with a smaller
           amplitude. Wide enough for the longer of the two. */
        min-width: 7.5rem;
      }
      .geo-event-button:disabled {
        opacity: 0.6;
        cursor: progress;
      }
      /* The seeded candidates and the winner (DEC-G6).

         THE COLOURS ARE NOT HERE ANY MORE, deliberately. They live in
         `surface-colours.ts` because the reported bug was a COLLISION — the
         user dot, both fetch outlines and these two were all `#ff3860` — and a
         collision between a CSS rule and two TypeScript literals is one nothing
         can assert. `marker-palette.test.ts` now pins that they differ, which
         only works while there is one definition. What stays here is the part
         that is genuinely presentation: opacity and the icon reset. */
      .geo-candidate {
        fill-opacity: 0.55;
        stroke: none;
      }
      /* The winner is an `L.divIcon`, not a vector, so Leaflet's default
         `leaflet-div-icon` chrome — a white box with a grey border — would
         otherwise frame the glyph. */
      .geo-winner {
        background: none;
        border: none;
      }

      /* The legend replaces the scale sentence: same claim, read at a glance. */
      #legend {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.75rem;
        color: #9aa3b8;
        flex-wrap: wrap;
      }
      .legend-category {
        color: #e6e8ef;
        font-weight: 600;
      }
      .legend-strip {
        display: inline-flex;
        /* Butted together, so the ramp reads as a continuum rather than as a
           set of categories — it is a continuous quantity. */
        gap: 0;
      }
      .legend-swatch {
        width: 0.85rem;
        height: 0.85rem;
        border: 1px solid transparent;
        display: inline-block;
      }
      /* The empty state (W12): a sentence where the ramp would be. */
      .legend-empty {
        font-style: italic;
      }
      /* What the DATA reaches, beside a ramp that no longer moves (DEC-H7).
         Dimmer than the ramp's own end labels on purpose: the ramp is the
         scale and this is an annotation on it, so it must not read as a third
         endpoint. */
      .legend-observed {
        margin-left: 0.5rem;
        opacity: 0.75;
        font-variant-numeric: tabular-nums;
      }
      .legend-band {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        margin-left: 0.4rem;
      }

      /* THE AR OFFER (G6, DEC-W2). Bottom-centre and above the map's own
         controls, because it is the one thing on screen the user is waiting
         for once they have pressed AR without a fix.

         NOT IN THE COMMAND BAR OR A PANEL: an offer behind a fold is an
         offer nobody takes, so it stacks above every panel. NOT IN `#ar-root` either --
         that layer only composites inside an immersive session, and this
         exists precisely when there is no session yet. */
      .ar-offer {
        position: fixed;
        /* ABOVE THE TOAST BAND (PR review of P3, finding 4). At 1.25rem this
           overlapped `.toast` in both axes and won on z-index -- covering the
           app's only 2D message channel, including the GPS failures this very
           flow produces. The toast sits at `bottom: 0.75rem` and is roughly
           2.5rem tall, so 4.5rem clears it with room for a two-line message.
           The narrower cap keeps the box off the bottom-right locate and AR
           controls, which it would otherwise reach under and, having pointer
           events, swallow taps on. Both are asserted rather than eyeballed. */
        bottom: 4.5rem;
        left: 50%;
        /* Above the bar (1100), the panels (1050) and the light dialog. */
        z-index: 1200;
        display: flex;
        gap: 0.6rem;
        align-items: center;
        max-width: 21rem;
        transform: translateX(-50%);
        /* THE BOX MUST NOT EAT A TAP MEANT FOR THE MAP (PR review of P3,
           finding 4). Bottom-centre of the VIEWPORT lands on the map's own
           bottom-right controls on a desktop split -- measured at 1280 px, the
           locate button's box is inside this one -- and raising the offset far
           enough to clear them is tuning against one viewport, which the mobile
           sheet then invalidates. The same rule `.ar-hud` and `.ar-toast`
           already follow: the container is transparent to input and the things
           that exist to be pressed opt back in below. */
        pointer-events: none;
      }

      /* THE 2D CHROME'S LIGHT PASS (adoption plan M6c, DEC-L2-14): the
         toast, the locate button, this offer card, the AR entry button and
         the three hidden-toggled panels wear the atoms; their look comes
         from design.css and only placement and behaviour stay here. The
         header (DEC-L2-12), the layer toggles and the legend keep their own
         rules on purpose. */
      .ar-offer-button,
      .ar-offer-dismiss {
        /* the card is pointer-events: none so it cannot swallow a map tap;
           the two controls opt back in */
        pointer-events: auto;
      }
      .ar-offer[hidden] {
        display: none;
      }

      /* THE ATTRIBUTION LINE (G5, DEC-W1). One thin line by default: a short
         name per source, always visible, plus a blue "Attributions" control
         that reveals the full credit text.

         WHAT MAY NOT COLLAPSE, and why this is not a preference. ODbL requires
         the OpenStreetMap credit wherever the data is shown, and this repo
         records the two elevation credits as required "the same as the OSM
         one" -- which is why they were put in this always-visible bar and not
         in the collapsible header. So the SHORT NAMES stay outside the
         expander; only the long sentences move behind it. The owner asked for
         "one word per attribution" in a thin line, and one short name each is
         exactly that.

         The control is the demo's own, not Leaflet's -- see
         `attribution-view.ts` for why -- and keeps the
         `leaflet-control-attribution` class so Leaflet's own styling still
         applies underneath these rules. */
      /* NO `max-width` HERE, and its absence is deliberate (PR review of this
         milestone, finding 2). A 60vw cap looked like prudence and was the one
         thing breaking the milestone's own acceptance criterion: Leaflet's
         corner is absolutely positioned inside the map pane, so the box is
         ALREADY bounded by the map's width, and 60vw of a 390 px phone is a
         224 px content box against ~318 px of resting content -- so the "one
         thin line" wrapped to two, on exactly the viewport the e2e runs at. On
         desktop the map is ~50vw, so the cap never bound there and the rule was
         inert where it was harmless and harmful where it was not. */
      .map-attribution-toggle {
        /* A REAL TAP TARGET, and this is the third time in two days the same
           lesson has been paid for. `font: inherit` resolves to Leaflet's
           0.75 rem, so with `padding: 0` this control shipped at roughly
           65 x 17 px -- under WCAG 2.2 SC 2.5.8's 24 x 24 floor, and smaller
           than the header caret whose size the owner complained about twice.
           It is the only new touch control in the milestone whose whole subject
           is a control being wrong on a phone.

           1.5 rem = 24 px, NOT the 2.75 rem the header toggle uses, and that is
           a judgement rather than an oversight: the owner asked for a thin line,
           and a 44 px control is most of the height they asked to get rid of.
           24 px is the accessibility floor, and unlike the caret this control
           has a large easy-to-hit sibling in the resting line beside it. */
        min-height: 1.5rem;
        /* AND A WIDTH FLOOR (H3). The label became a single "…", so the box no
           longer gets its width from the text -- without this the control
           shrinks to roughly 24 x 12 and satisfies a height-only floor while
           being unpressable. WCAG 2.2 SC 2.5.8 is 24 px in BOTH directions and
           only one of them was ever pinned. */
        min-width: 1.5rem;
        margin-left: 0.35rem;
        padding: 0 0.25rem;
        border: 0;
        background: none;
        /* Leaflet's own attribution link colour, so the control reads as the
           link the feedback asked for rather than as a stray button. */
        color: #0078a8;
        font: inherit;
        text-decoration: underline;
        cursor: pointer;
      }

      /* The three lines the feedback said it may expand to.
         NO `max-width` and NO `color`: both were duplicates of what Leaflet's
         own `.leaflet-control-attribution` already gives this subtree, and the
         comment that used to sit here claimed the width cap was what kept a long
         credit inside the corner. The corner does that. A comment describing a
         mechanism the code does not implement is what the next reader builds
         on. */
      .map-attribution-full {
        padding-top: 0.15rem;
      }

      /* The identity band is outline-only: "nothing known here" must not paint
         a claim the data does not support. */
      .legend-swatch-identity {
        border-style: dashed;
      }
      /* MOBILE (DEC-10): the 3D view fills the viewport and the map becomes a
         full-width sheet over it, draggable in height -- which is also the whole
         of D8 s resizing ask, without a splitter. Follows the RecorderApp map
         browser s full-bleed-plus-overlays pattern rather than inventing a
         second visual language. */
      @media (width <= 860px) {
        /* The command bar floats at every width (see `.command-bar`); here
           the views share one cell and the map becomes a sheet. */
        body {
          grid-template-rows: 1fr;
        }

        main {
          grid-area: 1 / 1;
          grid-template-columns: 1fr;
          grid-template-rows: 1fr;
        }
        #scene {
          grid-area: 1 / 1;
          border-left: none;
        }
        #map {
          grid-area: 1 / 1;
          align-self: end;
          width: 100%;
          /* Driven by --sheet-height, which the drag handle sets on <main>.
             Read only inside this query, so a drag on a phone cannot leave a
             stale height behind in the desktop grid after a rotation. */
          height: var(--sheet-height, 45%);
          z-index: 500;
          border-top: 1px solid #2a2f3d;
        }
        #sheet-handle {
          display: block;
        }
        /* Slides up from the bottom over the map, rather than sitting in the
           top-right corner as it does on desktop. */
        #details {
          inset: auto 0.5rem 0.5rem;
          width: auto;
          max-width: none;
          max-height: 55%;
        }
      }
      /* The site-wide legal notice and privacy page: a small fixed link in
         the bottom-left corner, out of the header and out of the grid, so it
         moves no control. Leaflet keeps that corner of the map free. */
      #legal-link {
        position: fixed;
        left: 0.5rem;
        bottom: 0.4rem;
        z-index: 1000;
        padding: 1px 6px;
        border-radius: 4px;
        background: rgb(11 11 13 / 70%);
        color: #9db8ff;
        font-size: 11px;
      }
      /* A narrow phone cannot fit the link beside the map's credit line, so
         it sits on its own line above it, and the footer the panels stop
         above grows to hold both lines. */
      @media (width <= 480px) {
        #legal-link {
          bottom: 26px;
        }
      }

      /* THE COMMAND BAR AND ITS PANELS.

         The bar is FIXED over both panes at every width, never a grid row:
         the two views keep the whole window and the bar only covers its top
         strip. On a desktop that strip of the map is where Leaflet's zoom
         sits, so `.leaflet-top` moves down by the bar's height, and the bar
         stacks above Leaflet's z-index of 1000.

         THE LOOK: surfaces, accent, type and buttons are the app's own tokens
         here, unlayered, so they win over the vendored `design.css`, which is
         never edited. Controls stay native. Casing comes only from
         `text-transform`, so every accessible name the suite matches keeps
         its DOM text. */
      :root {
        --hud-bar-h: 52px;
        --hud-foot: 24px;
        --hud-slot-w: 320px;
        --hud-map-column: 64px;
        --hud-surface: linear-gradient(
          160deg,
          rgb(52 58 80 / 92%),
          rgb(20 24 36 / 92%)
        );
        --hud-line: rgb(255 255 255 / 10%);
        --hud-radius: 14px;
        --hud-shadow: 0 6px 22px rgb(0 0 0 / 45%);
        --hud-accent: #f2971f;
        --hud-accent-ink: #1d1407;
        --hud-well: rgb(14 17 26 / 90%);
        --hud-font: corbel, "Segoe UI", system-ui, sans-serif;
      }
      .command-bar {
        position: fixed;
        inset: 0 0 auto;
        z-index: 1100;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 8px;
        height: var(--hud-bar-h);
        padding: 3px 8px 4px;
        background: var(--hud-surface);
        border-bottom: 1px solid var(--hud-line);
        box-shadow: 0 2px 12px rgb(0 0 0 / 35%);
        font: 14px/1.35 var(--hud-font);
      }
      .bar-group {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .bar-do {
        flex: 1 1 auto;
      }
      .bar-analysis {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .command-bar select,
      .command-bar .layer-toggle {
        height: 44px;
        padding: 0 12px;
        border: 1px solid var(--hud-line);
        border-radius: 10px;
        background: var(--hud-well);
        color: #e6e8ef;
        font: inherit;
      }
      .command-bar .layer-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      #site {
        max-width: 11rem;
      }
      .bar-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 44px;
        min-height: 44px;
        padding: 0 12px;
        border: 1px solid var(--hud-line);
        border-radius: 10px;
        background: linear-gradient(rgb(70 78 104), rgb(36 42 58));
        box-shadow:
          2px 2px 2px rgb(0 0 0 / 46%),
          -2px -2px 2px rgb(255 255 255 / 12%);
        color: #e6e8ef;
        font: 600 12px/1 var(--hud-font);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
        cursor: pointer;
      }
      .bar-btn[aria-expanded="true"] {
        background: var(--hud-accent);
        color: var(--hud-accent-ink);
      }
      .bar-btn svg {
        flex: none;
        width: 20px;
        height: 20px;
      }
      .bar-icon {
        padding: 0;
      }
      .bar-chip {
        margin-left: auto;
      }
      .bar-num {
        font-variant-numeric: tabular-nums;
      }
      .bar-quests {
        position: relative;
        display: inline-flex;
      }
      /* Under the quests button, not beside it: a readout that widens the
         bar would wrap it onto a second row. */
      .bar-quests .quest-readout {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        padding: 2px 8px;
        border-radius: 8px;
        background: var(--hud-well);
      }
      .bar-quests .quest-readout:empty {
        display: none;
      }
      .bar-spinner {
        display: none;
        flex: none;
        width: 18px;
        height: 18px;
        border: 2.5px solid var(--hud-accent);
        border-right-color: transparent;
        border-radius: 50%;
        animation: bar-spin 0.8s linear infinite;
      }
      .bar-settings[data-busy="true"] .bar-gear {
        display: none;
      }
      .bar-settings[data-busy="true"] .bar-spinner {
        display: block;
      }
      @keyframes bar-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar-spinner {
          animation: none;
        }
      }
      .leaflet-top {
        top: var(--hud-bar-h);
      }

      /* THE PANELS share one place: the settings drawer in the right slot
         below the bar, the status and the quick sun slider dropped from the
         bar. At most one is open (`hud-panels.ts`); the light dialog stacks
         over the drawer in the same slot. */
      .hud-panel {
        position: absolute;
        z-index: 1050;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: var(--hud-surface), #181c28;
        border: 1px solid var(--hud-line);
        border-radius: var(--hud-radius);
        box-shadow: var(--hud-shadow);
        color: #e6e8ef;
        font: 14px/1.35 var(--hud-font);
      }
      .hud-panel[hidden] {
        display: none;
      }
      .hud-slot {
        top: var(--hud-bar-h);
        right: 0;
        bottom: 0;
        width: var(--hud-slot-w);
        gap: 0;
        border-radius: 0;
      }
      .hud-pop {
        top: calc(var(--hud-bar-h) + 8px);
        right: 8px;
        width: 300px;
        max-height: calc(100% - var(--hud-bar-h) - 16px);
        padding: 4px 16px 16px;
        overflow-y: auto;
      }
      .hud-panel-head {
        display: flex;
        flex: none;
        align-items: center;
        gap: 8px;
        min-height: 52px;
        padding: 4px 4px 4px 16px;
        border-bottom: 1px solid var(--hud-line);
      }
      .hud-panel-head .hud-caption {
        flex: 1 1 auto;
      }
      .hud-panel-body {
        flex: 1 1 auto;
        padding: 8px 12px 16px;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .hud-caption {
        margin: 0;
        padding-top: 8px;
        color: #9aa3b8;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .hud-panel-head .hud-caption {
        padding-top: 0;
      }
      #status {
        color: #9aa3b8;
        font-size: 13px;
      }
      #sun-time-quick {
        width: 100%;
        min-height: 44px;
      }

      /* THE DRAWER'S SECTIONS: each a native `<details>`, folded until asked
         for; a section head is a full-width 44 px target. */
      .hud-panel .layer-toggles {
        flex-direction: column;
        flex-wrap: nowrap;
        gap: 8px;
        font-size: 14px;
        color: #e6e8ef;
      }
      .hud-panel .layer-group {
        display: block;
        padding: 0 12px;
        border: 1px solid var(--hud-line);
        border-radius: 10px;
        background: rgb(14 17 26 / 55%);
      }
      .hud-panel .layer-group > summary {
        display: flex;
        align-items: center;
        min-height: 44px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: #c9cfdc;
      }
      .hud-panel .layer-group::details-content {
        flex-direction: column;
        align-items: stretch;
        gap: 4px;
        padding-bottom: 12px;
      }
      .hud-panel .layer-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
      }
      .hud-panel select,
      .hud-panel input[type="date"] {
        min-height: 44px;
        padding: 0 12px;
        border: 1px solid var(--hud-line);
        border-radius: 10px;
        background: var(--hud-well);
        color: #e6e8ef;
        font: inherit;
      }

      /* THE DOCK, bottom-left of the 3D view: the toast above the legend
         plate. A column, so neither can cover the other. */
      .hud-dock {
        position: absolute;
        left: calc(50% + 8px);
        bottom: 8px;
        z-index: 900;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        max-width: min(300px, calc(50% - 16px));
        pointer-events: none;
      }
      .legend-plate {
        padding: 8px 12px;
        border: 1px solid var(--hud-line);
        border-radius: var(--hud-radius);
        background:
          linear-gradient(rgb(14 17 26 / 55%), rgb(14 17 26 / 55%)),
          var(--hud-surface);
        box-shadow: var(--hud-shadow);
        pointer-events: auto;
      }
      .legend-plate:has(> #legend:empty) {
        display: none;
      }
      /* The legend explains the cells' colours, so it shows with them; the
         bar's category picker names the category meanwhile. */
      body:has(#layer-cells:not(:checked)) .legend-plate {
        display: none;
      }
      /* Desktop: the toast drops from the bar into the 3D view's top-left,
         clear of the legend below, the AR offer above it and the popovers
         at the top-right. */
      @media (width > 860px) {
        #toast-root {
          position: fixed;
          top: calc(var(--hud-bar-h) + 8px);
          left: calc(50% + 8px);
          width: max(160px, min(300px, calc(50% - 332px)));
        }
        .ar-offer {
          left: calc(50% + 8px);
          bottom: 5rem;
          max-width: min(21rem, calc(50% - 16px));
          transform: none;
        }
      }

      /* PHONES: the map is a sheet at the bottom, so the slot covers the
         sheet and stops above the footer line (legal link, attribution).
         It leaves the map's right column free, so locate and AR stay
         reachable while a panel is open. */
      @media (width <= 860px) {
        .hud-slot,
        #light-dialog {
          inset: auto var(--hud-map-column) var(--hud-foot) 0;
          width: auto;
          height: calc(var(--sheet-height, 45%) - var(--hud-foot));
          max-height: none;
          border-radius: var(--hud-radius) var(--hud-radius) 0 0;
        }
        .hud-pop {
          left: 8px;
          width: auto;
          max-height: calc(
            100% - var(--hud-bar-h) - var(--sheet-height, 45%) - 16px
          );
        }
        /* 16 px above the sheet, clear of the drag handle that straddles
           its edge. */
        .hud-dock {
          left: 8px;
          bottom: calc(var(--sheet-height, 45%) + 16px);
          max-width: calc(100% - 16px);
        }
        /* In the sheet above the footer, clear of the locate and AR column. */
        .ar-offer {
          left: 12px;
          right: var(--hud-map-column);
          bottom: calc(var(--hud-foot) + 24px);
          max-width: none;
          transform: none;
        }
        .leaflet-top {
          top: 0;
        }
      }
      /* Upright, the drawer covers the sheet left of the map column, so the
         map zoom joins that column, at its top. */
      @media (width <= 860px) and (orientation: portrait) {
        #map .leaflet-top.leaflet-left {
          right: 0;
          left: auto;
        }
      }
      /* The footer the panels stop above holds both lines on a narrow phone
         (after the token block, which would otherwise win). */
      @media (width <= 480px) {
        :root {
          --hud-foot: 48px;
        }
      }
      /* Narrow: the bar takes two rows, where (place, category, cells) and
         do (quests, sun, status, settings). */
      @media (width <= 600px) {
        :root {
          --hud-bar-h: 100px;
        }
        .command-bar {
          gap: 4px;
        }
        .bar-where,
        .bar-do {
          flex: 1 1 100%;
          gap: 4px;
        }
        #site {
          flex: 1 1 0;
          min-width: 0;
          max-width: none;
        }
        .bar-analysis {
          flex: 0 1 auto;
          min-width: 0;
        }
        #category {
          min-width: 0;
          max-width: 9.5rem;
        }
        .command-bar .geo-event-button {
          min-width: 0;
        }
      }
      /* Phone landscape: one bar row, the slot comes from the right. */
      @media (width <= 860px) and (orientation: landscape) {
        .hud-slot,
        #light-dialog {
          inset: var(--hud-bar-h) var(--hud-map-column) var(--hud-foot) auto;
          width: min(440px, calc(100% - var(--hud-map-column)));
          height: auto;
          border-radius: var(--hud-radius) 0 0 var(--hud-radius);
        }
        /* Left of the map's locate and AR column, like the slot. */
        .hud-pop {
          left: auto;
          right: var(--hud-map-column);
          width: 320px;
          max-height: calc(100% - var(--hud-bar-h) - var(--hud-foot) - 16px);
        }
        /* The dock and the toast keep left of the slot. */
        .hud-dock {
          max-width: 320px;
        }
        #toast-root {
          position: fixed;
          top: calc(var(--hud-bar-h) + 8px);
          left: 8px;
          width: 320px;
        }
        .ar-offer {
          left: 50%;
          right: auto;
          max-width: 300px;
          transform: translateX(-50%);
        }
      }
    </style>
  </head>
  <body>
    <!-- THE COMMAND BAR: one bar over both panes, never a grid row, so the two
         views keep the whole window and the bar only covers. The controls the
         demo is used for are one tap away; everything else is in the settings
         drawer, which keeps every id and accessible name the suite addresses.
         `data-hud` marks what the layout e2e counts as covering the 3D view. -->
    <header id="command-bar" class="command-bar" data-hud>
      <div class="bar-group bar-where">
        <!-- The example-location picker, filled by `site-picker.ts` from the
             same table the offline fixture corpus is captured from. -->
        <select id="site" aria-label="location"></select>
        <!-- The category and the cell layer that draws it, side by side:
             `layer-toggles.ts` mounts the `cells` switch in here. -->
        <span id="bar-analysis" class="bar-analysis">
          <select id="category" aria-label="category"></select>
        </span>
      </div>
      <div class="bar-group bar-do">
        <!-- A BUTTON rather than firing on every position change: computing an
             event can score hundreds of chunks and may download a tile. The
             readout below it is `hidden` until a quest is found. -->
        <span class="bar-quests">
          <button type="button" id="geo-event" class="geo-event-button bar-btn">
            Show Quests
          </button>
          <span id="quest-readout" class="quest-readout"></span>
        </span>
        <!-- The sun chip: the time of day at a glance, and a quick slider that
             mirrors the drawer's canonical `#sun-time`. -->
        <button
          type="button"
          id="sun-chip"
          class="bar-btn bar-chip"
          aria-label="Sun time"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4.5" fill="currentColor" />
            <path
              d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
          <span id="sun-chip-time" class="bar-num"></span>
        </button>
        <button
          type="button"
          id="info-open"
          class="bar-btn bar-icon"
          aria-label="Status"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle
              cx="12"
              cy="12"
              r="9.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <path
              d="M12 10.5v6.5"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
            />
            <circle cx="12" cy="7.3" r="1.4" fill="currentColor" />
          </svg>
        </button>
        <!-- `data-busy` is set while any drawer control is applying, so an
             async state stays visible with the drawer closed. -->
        <button type="button" id="settings-open" class="bar-btn bar-settings">
          <svg
            class="bar-gear"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path
              fill="currentColor"
              d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z"
              transform="translate(-1 0)"
            />
          </svg>
          <span class="bar-spinner" aria-hidden="true"></span>
          <span>Settings</span>
        </button>
      </div>
    </header>
    <main>
      <div id="map"></div>
      <div id="scene"></div>
      <!--
        AR MODE (DEC-12, AR milestone 1). HIDDEN BY DEFAULT and revealed by
        `arButtonState`, never by this markup: the device may not support
        immersive AR, and on a device that does, entry still waits for a first
        GPS fix because the scene is anchored to the framework's `zero`.

        THE MAP STAYS. DEC-12 is explicit that AR is an additional mode, not a
        replacement — the reference consumer's pattern hides its map view
        inversely to AR support, which here would cost every WebXR-capable
        phone the only interface that can drive the data.
      -->
      <!-- MOVED INTO A LEAFLET CONTROL AT RUNTIME (F3a, 2026-08-19), above
           the locate button in the bottom-right corner. It stays here in
           the source so the markup lists every control, and `main.ts` hands
           it over.

           SQUARE AND ICON-ONLY, matching `.locate-button` (DEC-R2-3). The
           label text moves to `title`/`aria-label` rather than being
           deleted -- that wording is the only thing distinguishing the four
           states `arButtonState` models, and on touch a `title` never
           shows, so the accessible name is what carries it. -->
      <button
        type="button"
        id="enter-ar"
        class="ar-button btn btn--icon"
        hidden
      >
        AR
      </button>
      <!--
        WHERE `initAR` MOUNTS (AR milestone 1). Its OWN element rather than
        `<main>` or `#scene`: the framework inserts a full-screen canvas plus a
        DOM-overlay root as children of whatever it is given, and both `#map`
        and `#scene` are grid-laid children that the demo sizes itself. Handing
        either over would put a full-screen canvas inside a sized cell and
        leave the demo's own resize observer fighting it.

        Empty and zero-sized until a session starts; the framework's canvas is
        positioned by the UA once the session is immersive.
      -->
      <!--
        NO `aria-hidden` (r510 review). It carried one, statically, and nothing
        ever toggled it — which silently made the AR toast's `role="status"` /
        `aria-live="polite"` inert, because an `aria-hidden` subtree is removed
        from the accessibility tree wholesale. The toast exists precisely to
        reach a user who cannot see the header's status line, so hiding it from
        assistive technology defeated it for the one audience with the fewest
        alternatives.

        Nothing is needed in its place: the container is `display: none` while
        `:empty` (see the CSS above), which keeps it out of the accessibility
        tree whenever no session is running. The HUD inside it carries its own
        `aria-hidden`, because a readout that changes twice a second forever
        should not be announced.
      -->
      <div id="ar-root"></div>
      <!-- THE AR OFFER (G6, DEC-W2). Shown when a fix arrives that an AR
           PRESS asked for, never when the user merely pressed Locate.

           A REAL CONTROL, NOT A TOAST, and the difference is the whole design.
           A toast fades on its own; this is the second half of an action the
           user started, and the wait it follows can be a walk outside to get a
           fix -- so it has to still be there when they look back at the screen.

           ITS BUTTON IS ALSO WHAT MAKES THE SHAPE LEGAL. requestSession() needs
           transient user activation, so the session must be asked for from a
           fresh gesture; entering from the fix callback would spend the
           activation the press already used. See `ar-entry.ts`. -->
      <div
        id="ar-offer"
        class="ar-offer plate"
        role="status"
        aria-live="polite"
        hidden
      >
        <span class="ar-offer-text">Found you.</span>
        <button
          type="button"
          id="ar-offer-enter"
          class="ar-offer-button btn btn--accent"
        >
          Enter AR now
        </button>
        <button
          type="button"
          id="ar-offer-dismiss"
          class="ar-offer-dismiss btn btn--icon btn--glyph"
          aria-label="Dismiss the AR prompt"
        >
          ×
        </button>
      </div>
      <!-- THE SETTINGS DRAWER: every control that is not one tap away, in
           folded sections (`layer-toggles.ts` builds them and moves the
           controls below into them). Open/closed is view state, never stored. -->
      <aside
        id="settings-drawer"
        class="hud-panel hud-slot"
        aria-labelledby="settings-title"
        data-hud
        hidden
      >
        <div class="hud-panel-head">
          <h2 id="settings-title" class="hud-caption">Settings</h2>
          <button
            type="button"
            id="settings-hide"
            class="bar-btn bar-icon"
            aria-label="Hide settings"
          >
            ×
          </button>
        </div>
        <div class="hud-panel-body">
          <div id="layers" class="layer-toggles"></div>
          <!-- Modifies which cells `cells` draws; hidden while that layer is
               off, because it has nothing to apply to (DEC-U9). -->
          <label class="layer-toggle" id="show-below-label"
            ><input type="checkbox" id="show-below" /> below threshold</label
          >
          <!-- THE GROUND MODE (W11, DEC-R3-3). NOT a layer: it chooses which
               surface is drawn as the ground, the CPU-displaced plane, the
               GPU-displaced one or none, and is exclusive. Options come from
               `GROUND_MODES` so the picker cannot drift from the union. -->
          <label class="layer-toggle" id="ground-mode-label">
            ground
            <select id="ground-mode"></select>
          </label>
          <!-- THE COLOUR SCHEMES: looks for the whole city, filled from
               `colour-schemes.ts`. "colour scheme", not "colours": the land-use
               switch is "land-use colours", and e2e locators match accessible
               names by substring. The status says while a switch is building. -->
          <label class="layer-toggle" id="colour-scheme-label">
            colour scheme
            <select id="colour-scheme"></select>
          </label>
          <span
            id="colour-scheme-status"
            role="status"
            aria-live="polite"
          ></span>
          <!-- THE INVENTED ROOFS: on, buildings OpenStreetMap gives no roof
               shape get a planned roof; off, flat lids. A switch is a rebuild. -->
          <label class="layer-toggle" id="invented-roofs-label">
            <input type="checkbox" id="invented-roofs" checked />
            invented roofs
          </label>
          <span
            id="invented-roofs-status"
            role="status"
            aria-live="polite"
          ></span>
          <!-- ZEBRAS AND PEDESTRIAN AREAS, in the road buffers; a rebuild. -->
          <label class="layer-toggle" id="markings-label">
            <input type="checkbox" id="markings" checked />
            zebras and pedestrian areas
          </label>
          <span id="markings-status" role="status" aria-live="polite"></span>
          <!-- A DIAGNOSTIC outside the layer registry: it draws nothing in the
               scene. Off by default (DEC-R3-18). -->
          <label class="layer-toggle" id="perf-stats-label">
            <input type="checkbox" id="perf-stats" />
            perf
          </label>
          <!-- THE RENDER-DISTANCE DIAL. THIS `value` IS THE SINGLE SOURCE and
               must equal `DEFAULT_RENDER_MULTIPLIER` in `render-distance.ts`
               (`render-distance-markup.test.ts` holds them together): the boot
               path applies it, and the readout is painted from the camera. -->
          <label class="layer-toggle" id="render-distance-label">
            <input
              type="range"
              id="render-distance"
              min="1"
              max="10"
              step="1"
              value="2"
              aria-label="Render distance multiplier"
            />
            <span id="render-distance-value">draw 2400 m</span>
          </label>
          <!-- THE REAL SUN (plan 2026-09-23-2149, DEC-SUN-14/15): the date, a
               time slider from civil dawn to civil dusk, and the apparent solar
               time. t/T step the time; the date field's own arrows step a day or
               a month. This is the canonical time slider; the bar's quick
               slider mirrors it. -->
          <details class="layer-group" id="sun-group">
            <summary class="layer-group-label">Sun and time</summary>
            <input type="date" id="sun-date" aria-label="Sun date" />
            <input
              type="range"
              id="sun-time"
              min="0"
              max="1000"
              step="1"
              aria-label="Sun time of day, dawn to dusk"
            />
            <span id="sun-readout"></span>
            <button type="button" id="light-open">Light</button>
          </details>
        </div>
      </aside>
      <!-- THE STATUS: the status line, behind the bar's info button. Errors
           never open it; they toast. -->
      <aside
        id="info-panel"
        class="hud-panel hud-pop"
        aria-labelledby="info-title"
        data-hud
        hidden
      >
        <h2 id="info-title" class="hud-caption">Status</h2>
        <span id="status">starting…</span>
      </aside>
      <!-- THE QUICK SUN SLIDER, dropped from the chip. One handler moves the
           sun from either slider, so the two always agree. -->
      <aside
        id="sun-pop"
        class="hud-panel hud-pop"
        aria-labelledby="sun-pop-title"
        data-hud
        hidden
      >
        <h2 id="sun-pop-title" class="hud-caption">Sun</h2>
        <input
          type="range"
          id="sun-time-quick"
          min="0"
          max="1000"
          step="1"
          aria-label="Quick sun time"
        />
      </aside>
      <!-- THE DOCK at the bottom of the 3D view: the 2D message channel above
           the legend plate, stacked so the two never overlap. -->
      <div class="hud-dock">
        <!-- The 2D message channel. Deliberately NOT inside `#ar-root`: that
             subtree is what WebXR composites during an immersive session, and
             a 2D message has to be visible when no session is running. See
             `toast.ts.md`. -->
        <div id="toast-root"></div>
        <div id="legend-plate" class="legend-plate" data-hud>
          <div id="legend"></div>
        </div>
      </div>
      <!-- An OVERLAY on desktop too (DEC-17): a third column would squeeze the
           two views to ~450 px each on a laptop, which is the width that made
           the 3D pane useless on a phone. -->
      <div id="sheet-handle" aria-hidden="true"></div>
      <aside id="details" class="plate prose" hidden></aside>
      <!-- The keyboard shortcuts, listed by the registry that owns them (§1).
           An undocumented hotkey is a feature only its author has, so "?"
           toggles this and it is populated from `hotkeys.bindings()` rather
           than hand-written — a list that can disagree with the bindings is
           worse than none. -->
      <aside id="hotkey-help" class="plate prose" hidden></aside>
      <!-- The geo-event time picker (G1, DEC-G1). Empty here and filled by
           `geo-event-picker.ts`: the two inputs, the two buttons and the error
           line are one interaction, and splitting them between markup and
           wiring is how a control ends up with no listener.

           A `hidden`-toggled `<aside>` rather than a `<dialog>`, like the two
           above it. `showModal()` traps focus and dims the page, which is right
           for a decision that blocks and wrong for this one — the map
           underneath is what you consult while choosing a time. -->
      <aside id="geo-event-picker" class="plate" hidden></aside>
    </main>
    <a id="legal-link" href="/legal/" data-testid="legal-link"
      >Legal notice and privacy</a
    >
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
