<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OSM affordance demo</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px/1.4 system-ui,
          sans-serif;
        background: #11131a;
        color: #e6e8ef;
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100dvh;
      }
      header {
        padding: 0.6rem 0.9rem;
        border-bottom: 1px solid #2a2f3d;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: baseline;
      }
      h1 {
        font-size: 1rem;
        margin: 0;
      }
      #status,
      #scale {
        color: #9aa3b8;
        font-size: 0.8rem;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 0;
        position: relative;
      }

      /* Floats over the split rather than taking a column (DEC-17). */
      #details {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        bottom: 0.5rem;
        width: 22rem;
        max-width: 42vw;
        overflow-y: auto;
        z-index: 1000;
        padding: 0.6rem 0.7rem;
        background: #171b26f2;
        border: 1px solid #2a2f3d;
        border-radius: 6px;
        font-size: 0.78rem;
      }
      #details[hidden] {
        display: none;
      }
      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.5rem;
      }
      .panel-close {
        background: none;
        border: none;
        color: #9aa3b8;
        font-size: 1.1rem;
        cursor: pointer;
        line-height: 1;
      }
      .panel-summary {
        margin: 0.4rem 0;
        color: #e6e8ef;
      }
      .panel-threshold {
        margin: 0 0 0.6rem;
        color: #9aa3b8;
      }
      .panel-feature {
        border-top: 1px solid #2a2f3d;
        padding: 0.3rem 0;
      }
      .panel-feature summary {
        cursor: pointer;
      }
      /* The vetoing element is the answer; it should be findable at a glance. */
      .panel-feature-veto > summary {
        color: #ff8fa3;
        font-weight: 600;
      }
      .panel-tags {
        width: 100%;
        border-collapse: collapse;
        margin-top: 0.2rem;
      }
      .panel-tags td {
        padding: 0.1rem 0.3rem;
        color: #9aa3b8;
        vertical-align: top;
      }
      .panel-tag-veto td {
        color: #ff8fa3;
      }
      /* A tag the veto short-circuit never evaluated: shown, but visibly not
         part of the arithmetic. */
      .panel-tag-skipped td {
        opacity: 0.55;
        text-decoration: line-through;
      }

      @media (width <= 860px) {
        main {
          grid-template-columns: 1fr;
          grid-template-rows: 1fr 1fr;
        }
      }
      #map,
      #scene {
        min-height: 0;
        min-width: 0;
      }
      #scene {
        border-left: 1px solid #2a2f3d;
        position: relative;
      }
      select {
        background: #1b1f2a;
        color: inherit;
        border: 1px solid #2a2f3d;
        border-radius: 4px;
        padding: 0.2rem 0.4rem;
      }
      .hint {
        color: #6f7995;
        font-size: 0.78rem;
      }

      /* The legend replaces the scale sentence: same claim, read at a glance. */
      #legend {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.75rem;
        color: #9aa3b8;
        flex-wrap: wrap;
      }
      .legend-category {
        color: #e6e8ef;
        font-weight: 600;
      }
      .legend-strip {
        display: inline-flex;
        /* Butted together, so the ramp reads as a continuum rather than as a
           set of categories — it is a continuous quantity. */
        gap: 0;
      }
      .legend-swatch {
        width: 0.85rem;
        height: 0.85rem;
        border: 1px solid transparent;
        display: inline-block;
      }
      .legend-band {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        margin-left: 0.4rem;
      }
      /* The identity band is outline-only: "nothing known here" must not paint
         a claim the data does not support. */
      .legend-swatch-identity {
        border-style: dashed;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>OSM affordance demo</h1>
      <label
        >category
        <select id="category"></select
      ></label>
      <label
        ><input type="checkbox" id="show-below" /> show cells below the
        threshold</label
      >
      <span class="hint">click the map to move</span>
      <span id="status">starting…</span>
      <div id="legend"></div>
    </header>
    <main>
      <div id="map"></div>
      <div id="scene"></div>
      <!-- An OVERLAY on desktop too (DEC-17): a third column would squeeze the
           two views to ~450 px each on a laptop, which is the width that made
           the 3D pane useless on a phone. -->
      <aside id="details" hidden></aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
