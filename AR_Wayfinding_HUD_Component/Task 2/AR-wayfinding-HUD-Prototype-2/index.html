<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Wayfinding HUD - Mobile AR Test</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
        #ar-root { position: fixed; inset: 0; z-index: 0; }
        #status {
            position: fixed; top: 12px; left: 12px; z-index: 1;
            padding: 8px 12px; background: rgba(0,0,0,0.6);
            border: 1px solid #444; border-radius: 6px;
            font-size: 13px; line-height: 1.5; white-space: pre-line;
            color: #eee; font-family: system-ui, sans-serif;
            max-width: min(70vw, 360px); margin: 0;
        }
        #enter-ar {
            position: fixed; left: 50%; bottom: 40px;
            transform: translateX(-50%); z-index: 2;
            padding: 14px 28px; font-size: 16px;
            font-family: system-ui, sans-serif;
            color: #eee; background: #2b6cff;
            border: 1px solid #4f8cff; border-radius: 10px;
            cursor: pointer; white-space: nowrap;
        }
        #enter-ar:disabled { background: #333; border-color: #444; color: #888; cursor: default; }
    </style>
</head>
<body>
    <div id="ar-root">
        <pre id="status">Checking WebXR support…</pre>
        <button id="enter-ar" type="button" disabled>Checking AR support…</button>
    </div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
