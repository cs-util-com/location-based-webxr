<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Look-dev: sky and atmosphere</title>
    <link rel="stylesheet" href="../design.css" />
    <link rel="stylesheet" href="./lookdev.css" />
    <!-- three comes from the framework's own lockfile-pinned copy, served by
         serve.mjs; the deploy rewrites these to the same pinned version. -->
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/",
          "three/examples/jsm/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./lookdev.js"></script>
    <script type="module" src="./panel.js"></script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <aside class="lookdev-panel plate col" aria-label="Look controls">
      <button
        type="button"
        class="lookdev-head"
        aria-expanded="true"
        aria-controls="lookdev-body"
      >
        <span class="lookdev-title">Sky and atmosphere</span>
        <span class="lookdev-chevron" aria-hidden="true"></span>
      </button>
      <span class="hint lookdev-error" data-error-box></span>
      <div id="lookdev-body" class="lookdev-body col">
        <details class="lookdev-section" data-section="look" open>
          <summary>Look</summary>
          <div class="lookdev-section-body col">
            <div class="lookdev-presets" data-presets></div>
            <span class="select-wrap">
              <select id="tone" class="select" aria-label="Tone mapping">
                <option value="neutral">Khronos Neutral</option>
                <option value="agx">AgX</option>
                <option value="aces">ACES Filmic</option>
              </select>
            </span>
            <span class="select-wrap">
              <select id="tier" class="select" aria-label="Cost tier">
                <option value="phone">Phone tier (no bloom)</option>
                <option value="desktop">Desktop tier (bloom)</option>
              </select>
            </span>
          </div>
        </details>
        <details class="lookdev-section" data-section="sun" open>
          <summary>Sun</summary>
          <div class="lookdev-section-body col">
            <label class="lookdev-field">
              <span class="hint">Sun elevation</span>
              <input
                id="elevation"
                class="slider"
                type="range"
                min="-10"
                max="70"
                step="0.5"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint">Sun azimuth</span>
              <input
                id="azimuth"
                class="slider"
                type="range"
                min="0"
                max="360"
                step="1"
              />
            </label>
          </div>
        </details>
        <details class="lookdev-section" data-section="atmosphere" open>
          <summary>Atmosphere</summary>
          <div class="lookdev-section-body col">
            <label class="lookdev-field">
              <span class="hint">Visibility</span>
              <input
                id="visibility"
                class="slider"
                type="range"
                min="0"
                max="1"
                step="0.01"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint">Exposure compensation (EV)</span>
              <input
                id="exposure"
                class="slider"
                type="range"
                min="-4"
                max="4"
                step="0.1"
              />
            </label>
            <label class="switch">
              <input id="haze" type="checkbox" checked />
              <span class="switch-track"></span>
              Haze (sky-matched aerial perspective)
            </label>
          </div>
        </details>
        <details class="lookdev-section" data-section="clouds" open>
          <summary>Clouds</summary>
          <div class="lookdev-section-body col">
            <label class="lookdev-field">
              <span class="hint">Cloud cover</span>
              <input
                id="clouds"
                class="slider"
                type="range"
                min="0"
                max="1"
                step="0.05"
              />
            </label>
            <span class="select-wrap">
              <select id="cloud-mode" class="select" aria-label="Cloud mode">
                <option value="dome">Clouds on the sky (dome)</option>
                <option value="sheet">Clouds to fly through (sheet)</option>
                <option value="slab">Clouds as a thin volume (slab)</option>
              </select>
            </span>
            <span class="select-wrap">
              <select
                id="slab-steps"
                class="select"
                aria-label="Slab steps"
                disabled
              >
                <option value="8">Slab: 8 steps</option>
                <option value="16">Slab: 16 steps</option>
                <option value="24">Slab: 24 steps</option>
                <option value="32">Slab: 32 steps</option>
              </select>
            </span>
          </div>
        </details>
        <details class="lookdev-section" data-section="view" open>
          <summary>View and cost</summary>
          <div class="lookdev-section-body col">
            <span class="select-wrap">
              <select id="camera-view" class="select" aria-label="View">
                <option value="city">View: city</option>
                <option value="sun">View: toward the sun</option>
                <option value="antisun">View: away from the sun</option>
                <option value="lake">View: lake</option>
                <option value="aloft">
                  View: just above the sheet (2.15 km)
                </option>
                <option value="inside">View: inside the clouds (2 km)</option>
                <option value="above">View: above the clouds (3.2 km)</option>
              </select>
            </span>
            <span class="select-wrap">
              <select id="city-fill" class="select" aria-label="City fill">
                <option value="0@42">City: the block only</option>
                <option value="2500@42">City: 2,500 buildings</option>
                <option value="100000@42">
                  City: the whole ring (about 9,500, 42 m lots)
                </option>
                <option value="100000@31">
                  City: denser (about 17,500, 31 m lots)
                </option>
                <option value="100000@20">
                  City: densest (about 42,000, 20 m lots)
                </option>
              </select>
            </span>
            <label class="switch">
              <input id="shadows" type="checkbox" />
              <span class="switch-track"></span>
              Sun shadows (prototype)
            </label>
          </div>
        </details>
        <details class="lookdev-section" data-section="readout" open>
          <summary>Readout</summary>
          <div class="lookdev-section-body col">
            <span class="hint" data-values></span>
            <span class="hint" data-stats></span>
          </div>
        </details>
      </div>
    </aside>
  </body>
</html>
