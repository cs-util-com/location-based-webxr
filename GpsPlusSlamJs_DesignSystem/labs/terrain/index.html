<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab: terrain relief</title>
    <link rel="stylesheet" href="../../design.css" />
    <link rel="stylesheet" href="../../3d/lookdev.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #e4e8ec;
      }

      #terrain-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #terrain-error {
        position: fixed;
        top: 12px;
        left: 12px;
        right: 380px;
        color: #8a1f11;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }

      #terrain-error:empty {
        display: none;
      }

      #terrain-loading {
        position: fixed;
        top: 36px;
        left: 12px;
        color: #30404f;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }

      /* The plate on the right: the error and loading lines are top left. */
      .lookdev-panel {
        left: auto;
        right: 12px;
      }

      /* On a phone the status lines move below the folded plate's header. */
      @media (max-width: 600px) {
        #terrain-error {
          top: 72px;
          right: 12px;
        }

        #terrain-loading {
          top: 96px;
        }
      }

      #terrain-credits {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 10px;
        color: #30404f;
        font:
          12px/1.4 system-ui,
          sans-serif;
      }

      #terrain-credits a {
        color: inherit;
      }
    </style>
    <script type="module" src="./terrain-lab.js"></script>
    <script type="module" src="../../3d/panel.js"></script>
  </head>
  <body>
    <canvas id="terrain-canvas"></canvas>
    <output id="terrain-error" role="alert"></output>
    <output id="terrain-loading" aria-live="polite" hidden></output>
    <aside class="lookdev-panel plate col" aria-label="Terrain controls">
      <button
        type="button"
        class="lookdev-head"
        aria-expanded="true"
        aria-controls="lookdev-body"
      >
        <span class="lookdev-title">Terrain relief</span>
        <span class="lookdev-chevron" aria-hidden="true"></span>
      </button>
      <div id="lookdev-body" class="lookdev-body col">
        <details class="lookdev-section" data-section="terrain-view" open>
          <summary>Place and style</summary>
          <div class="lookdev-section-body col">
            <label class="lookdev-field">
              <span class="hint">Place</span>
              <select class="select" data-hash-key="place">
                <option value="appalachians">Appalachians (Blue Ridge)</option>
              </select>
            </label>
            <label class="lookdev-field">
              <span class="hint">Style</span>
              <select class="select" data-hash-key="style">
                <option value="pastel">A: Pastel atlas</option>
              </select>
            </label>
          </div>
        </details>
        <details class="lookdev-section" data-section="terrain-relief" open>
          <summary>Exaggeration</summary>
          <div class="lookdev-section-body col">
            <label class="lookdev-field">
              <span class="hint"
                >Exaggeration <output data-for="exag"></output>x</span
              >
              <input
                class="slider"
                type="range"
                step="0.1"
                data-hash-key="exag"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint">Auto (grows with the view's width)</span>
              <select class="select" data-hash-key="auto">
                <option value="0">Off</option>
                <option value="1">On</option>
              </select>
            </label>
            <output
              id="terrain-readout"
              class="hint"
              aria-live="polite"
            ></output>
          </div>
        </details>
        <details class="lookdev-section" data-section="terrain-look" open>
          <summary>Look</summary>
          <div class="lookdev-section-body col">
            <label class="lookdev-field">
              <span class="hint"
                >Relief green <output data-for="green"></output
              ></span>
              <input
                class="slider"
                type="range"
                step="0.05"
                data-hash-key="green"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Shadow <output data-for="shadow"></output
              ></span>
              <input
                class="slider"
                type="range"
                step="0.05"
                data-hash-key="shadow"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Slope gain <output data-for="shade"></output
              ></span>
              <input
                class="slider"
                type="range"
                step="0.05"
                data-hash-key="shade"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint">Sky view (directions)</span>
              <select class="select" data-hash-key="svf">
                <option value="0">Off</option>
                <option value="8">8</option>
                <option value="16">16</option>
              </select>
            </label>
          </div>
        </details>
        <details class="lookdev-section" data-section="terrain-camera" open>
          <summary>Camera</summary>
          <div class="lookdev-section-body col">
            <button type="button" class="btn" data-preset="top">
              Top-down, 250 km
            </button>
            <button type="button" class="btn" data-preset="oblique">
              Oblique (diorama)
            </button>
            <button type="button" class="btn" data-preset="low">
              Low oblique, 20 km
            </button>
            <button type="button" class="btn" data-preset="fly">
              Fly in from 600 km
            </button>
            <output id="terrain-cost" class="hint"></output>
          </div>
        </details>
      </div>
    </aside>
    <footer id="terrain-credits"></footer>
  </body>
</html>
