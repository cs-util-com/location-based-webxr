<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab: the globe</title>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/",
          "3d-tiles-renderer": "/vendor/3d-tiles-renderer/build/index.js",
          "3d-tiles-renderer/plugins": "/vendor/3d-tiles-renderer/build/index.plugins.js"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      #globe-error {
        position: fixed;
        top: 12px;
        left: 12px;
        color: #ffb4a8;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }

      #globe-error:empty {
        display: none;
      }

      #globe-loading {
        position: fixed;
        top: 36px;
        left: 12px;
        color: #c9d3e0;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }

      #globe-replay {
        position: fixed;
        top: 10px;
        right: 12px;
        padding: 6px 12px;
        border: 1px solid #5d6b7d;
        border-radius: 6px;
        background: #1a222d;
        color: #e6ecf3;
        font:
          13px/1.2 system-ui,
          sans-serif;
        cursor: pointer;
      }

      #globe-credits {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 10px;
        color: #c9d3e0;
        font:
          12px/1.4 system-ui,
          sans-serif;
      }

      #globe-credits a {
        color: inherit;
      }

      #globe-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
    <script type="module" src="./globe-lab.js"></script>
  </head>
  <body>
    <canvas id="globe-canvas"></canvas>
    <output id="globe-error" role="alert"></output>
    <output id="globe-loading" aria-live="polite" hidden></output>
    <button id="globe-replay" type="button">Replay the turn</button>
    <footer id="globe-credits"></footer>
  </body>
</html>
