<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab: the globe</title>
    <link rel="stylesheet" href="../../design.css" />
    <link rel="stylesheet" href="../../3d/lookdev.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/",
          "3d-tiles-renderer": "/vendor/3d-tiles-renderer/build/index.js",
          "3d-tiles-renderer/plugins": "/vendor/3d-tiles-renderer/build/index.plugins.js",
          "h3-js": "/vendor/h3-js/dist/browser/h3-js.es.js",
          "gps-plus-slam-osm": "/osm-lib/index.js",
          "gps-plus-slam-osm/three": "/osm-lib/three/index.js",
          "gps-plus-slam-app-framework/osm-bridge": "/fw/osm-bridge/index.js"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      #globe-error {
        position: fixed;
        top: 12px;
        left: 12px;
        color: #ffb4a8;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }

      #globe-error:empty {
        display: none;
      }

      #globe-loading {
        position: fixed;
        top: 36px;
        left: 12px;
        color: #c9d3e0;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }

      /* The plate on the right: the error and loading lines are top left. */
      .lookdev-panel {
        left: auto;
        right: 12px;
        /* ends above the pin, bottom right, so the pin stays reachable */
        max-height: calc(100dvh - 140px);
      }

      /*
       * On a phone the plate (340 px, folded to its header) spans nearly the
       * whole width, so the status lines move below its header, where it
       * never covers them folded.
       */
      @media (max-width: 600px) {
        #globe-error {
          top: 72px;
        }

        #globe-loading {
          top: 96px;
        }
      }

      /*
       * The bottom lines in ONE stack, in flow (the r760 CI run: fixed
       * offsets overlapped as soon as a line wrapped, with a wider font or
       * a narrower phone): the readout (round-4 plan DEC-GL4-5) and the
       * pin with its status line on one row, then the device line, then
       * the credits. A line that wraps pushes the lines above it up. The
       * stack lets taps through to the globe except on its controls.
       */
      #globe-bottom {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        pointer-events: none;
      }

      .globe-bottom-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
      }

      /* The pin (round-2 plan M3g), bottom right as in OsmDemo, its status
         line to its left saying what it is doing or why it failed. */
      .globe-pin-group {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        min-width: 0;
      }

      #globe-pin,
      #globe-credits {
        pointer-events: auto;
      }

      /* Tabular figures, so the numbers do not jitter sideways. */
      #globe-readout {
        flex: 0 1 auto;
        color: #e6edf5;
        font:
          13px/1.4 system-ui,
          sans-serif;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 3px #000;
      }

      #globe-pin-status,
      #globe-arrival-status {
        max-width: min(60vw, 420px);
        color: #c9d3e0;
        text-align: right;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }

      #globe-pin {
        flex: none;
      }

      #globe-device,
      #globe-credits {
        color: #c9d3e0;
        font:
          12px/1.4 system-ui,
          sans-serif;
      }

      #globe-credits a {
        color: inherit;
      }

      #globe-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
    <script type="module" src="./globe-lab.js"></script>
    <script type="module" src="../../3d/panel.js"></script>
  </head>
  <body>
    <canvas id="globe-canvas"></canvas>
    <output id="globe-error" role="alert"></output>
    <output id="globe-loading" aria-live="polite" hidden></output>
    <aside class="lookdev-panel plate col" aria-label="Globe controls">
      <button
        type="button"
        class="lookdev-head"
        aria-expanded="true"
        aria-controls="lookdev-body"
      >
        <span class="lookdev-title">Globe</span>
        <span class="lookdev-chevron" aria-hidden="true"></span>
      </button>
      <div id="lookdev-body" class="lookdev-body col">
        <details class="lookdev-section" data-section="globe-sun" open>
          <summary>Sun and time</summary>
          <div class="lookdev-section-body col">
            <label class="lookdev-field">
              <span class="hint">Hour <output data-for="hour"></output></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="23.75"
                step="0.25"
                data-time-hour
              />
            </label>
            <button type="button" class="btn" data-time-now>Now</button>
            <label class="lookdev-field">
              <span class="hint">Clock speed</span>
              <select class="select" data-hash-key="timeScale">
                <option value="0">Stopped</option>
                <option value="1">Real time</option>
                <option value="60">1 min per second</option>
                <option value="600">10 min per second</option>
                <option value="3600">1 h per second</option>
              </select>
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Sun intensity <output data-for="sunIntensity"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="8"
                step="0.05"
                data-hash-key="sunIntensity"
              />
            </label>
          </div>
        </details>
        <details class="lookdev-section" data-section="globe-surface" open>
          <summary>Surface</summary>
          <div class="lookdev-section-body col">
            <label class="lookdev-field">
              <span class="hint"
                >Night lights <output data-for="nightGain"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="4"
                step="0.05"
                data-hash-key="nightGain"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Water roughness <output data-for="waterRoughness"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0.05"
                max="1"
                step="0.05"
                data-hash-key="waterRoughness"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Cloud opacity <output data-for="cloudOpacity"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="1"
                step="0.05"
                data-hash-key="cloudOpacity"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Cloud drift (°/s) <output data-for="cloudDrift"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="10"
                step="0.1"
                data-hash-key="cloudDrift"
              />
            </label>
          </div>
        </details>
        <details class="lookdev-section" data-section="globe-sky" open>
          <summary>Sky</summary>
          <div class="lookdev-section-body col">
            <label class="lookdev-field">
              <span class="hint">Sky behind the Earth</span>
              <select class="select" data-hash-key="sky">
                <option value="1">On</option>
                <option value="0">Off</option>
              </select>
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Sun disc (°) <output data-for="sunSize"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0.1"
                max="10"
                step="0.1"
                data-hash-key="sunSize"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Sun glow <output data-for="sunGlow"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="4"
                step="0.05"
                data-hash-key="sunGlow"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint">Stars (procedural)</span>
              <select class="select" data-hash-key="stars">
                <option value="1">On</option>
                <option value="0">Off</option>
              </select>
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Faintest star (mag) <output data-for="starMag"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0.5"
                max="9"
                step="0.5"
                data-hash-key="starMag"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Star brightness <output data-for="starGain"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="10"
                step="0.05"
                data-hash-key="starGain"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint">Atmosphere (rim, halo, veil)</span>
              <select class="select" data-hash-key="atmo">
                <option value="1">On</option>
                <option value="0">Off</option>
              </select>
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Atmosphere samples per ray
                <output data-for="atmoSteps"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="2"
                max="64"
                step="1"
                data-hash-key="atmoSteps"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Atmosphere strength <output data-for="atmoStrength"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="4"
                step="0.05"
                data-hash-key="atmoStrength"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Atmosphere thickness (x real)
                <output data-for="atmoThickness"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="1"
                max="10"
                step="0.1"
                data-hash-key="atmoThickness"
              />
            </label>
            <button type="button" class="btn" data-atmo-cost>
              Measure the atmosphere's cost
            </button>
            <label class="lookdev-field">
              <span class="hint"
                >Milky Way <output data-for="milkyWay"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="0.1"
                step="0.002"
                data-hash-key="milkyWay"
              />
            </label>
          </div>
        </details>
        <details class="lookdev-section" data-section="globe-look" open>
          <summary>Reference look (each 0 = off)</summary>
          <div class="lookdev-section-body col">
            <label class="lookdev-field">
              <span class="hint"
                >Blue grade <output data-for="grade"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="1"
                step="0.05"
                data-hash-key="grade"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Cloud shading <output data-for="cloudRelief"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="1"
                step="0.05"
                data-hash-key="cloudRelief"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Twilight and warm lights <output data-for="twilight"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="1"
                step="0.05"
                data-hash-key="twilight"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Navy space <output data-for="space"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="1"
                step="0.05"
                data-hash-key="space"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Star glow <output data-for="starGlow"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="1"
                step="0.05"
                data-hash-key="starGlow"
              />
            </label>
          </div>
        </details>
        <details class="lookdev-section" data-section="globe-intro" open>
          <summary>Fly-in</summary>
          <div class="lookdev-section-body col">
            <label class="lookdev-field">
              <span class="hint">Variant</span>
              <select class="select" data-hash-key="intro">
                <option value="narrow">Fly in, FOV narrowing from 80°</option>
                <option value="distance">Fly in at 50°</option>
                <option value="fov">Narrow the FOV far out, then fly</option>
                <option value="dolly">
                  Fly in, FOV widening from 50° (equals "Fly in at 50°" while
                  fovY is 50)
                </option>
              </select>
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Start and zoom-out limit (km from the centre)
                <output data-for="maxKm"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="20000"
                max="100000"
                step="1000"
                data-hash-key="maxKm"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Turn from the sun side, at most (°)
                <output data-for="turnCap"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="180"
                step="5"
                data-hash-key="turnCap"
              />
            </label>
          </div>
        </details>
        <details class="lookdev-section" data-section="globe-camera" open>
          <summary>Camera and turn</summary>
          <div class="lookdev-section-body col">
            <label class="lookdev-field">
              <span class="hint"
                >Field of view (°) <output data-for="fovY"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="20"
                max="80"
                step="1"
                data-hash-key="fovY"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Wait for a fix (ms) <output data-for="spinMs"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="10000"
                step="250"
                data-hash-key="spinMs"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Turn (ms) <output data-for="turnMs"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="10000"
                step="250"
                data-hash-key="turnMs"
              />
            </label>
            <button id="globe-replay" type="button" class="btn">
              Replay the turn
            </button>
          </div>
        </details>
        <details class="lookdev-section" data-section="globe-pin" open>
          <summary>Pin and dive</summary>
          <div class="lookdev-section-body col">
            <label class="lookdev-field">
              <span class="hint"
                >Dive (ms; set here it is fixed, otherwise the city data paces
                it) <output data-for="diveMs"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="1000"
                max="60000"
                step="500"
                data-hash-key="diveMs"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint">Landing altitude (km)</span>
              <select class="select" data-hash-key="landKm">
                <option value="2">2</option>
                <option value="5">5</option>
                <option value="20">20</option>
              </select>
            </label>
          </div>
        </details>
        <details class="lookdev-section" data-section="globe-tiles" open>
          <summary>Tiles and memory</summary>
          <div class="lookdev-section-body col">
            <label class="lookdev-field">
              <span class="hint">Error target (px)</span>
              <select class="select" data-hash-key="errorTarget">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="4">4</option>
                <option value="16">16</option>
              </select>
            </label>
            <label class="lookdev-field">
              <span class="hint">Tile cache (MiB)</span>
              <select class="select" data-hash-key="cacheMiB">
                <option value="32">32</option>
                <option value="48">48</option>
                <option value="64">64</option>
                <option value="128">128</option>
              </select>
            </label>
            <label class="lookdev-field">
              <span class="hint">Pixel ratio cap</span>
              <select class="select" data-hash-key="pixelRatio">
                <option value="1">1</option>
                <option value="1.5">1.5</option>
                <option value="2">2</option>
              </select>
            </label>
          </div>
        </details>
      </div>
    </aside>
    <div id="globe-bottom">
      <div class="globe-bottom-row">
        <!-- aria-live off: an output is a polite live region by default, and
           4 updates a second would flood a screen reader. -->
        <output id="globe-readout" aria-live="off"></output>
        <div class="globe-pin-group">
          <!-- The city's data while the pin's dive loads it: tiles warmed of
             the total, cold or warm, then how it ended (hidden when idle). -->
          <output id="globe-arrival-status" aria-live="polite" hidden></output>
          <output id="globe-pin-status" aria-live="polite"></output>
          <button
            id="globe-pin"
            type="button"
            class="btn btn--icon btn--locate"
            data-state="idle"
            aria-label="Fly to my location"
            title="Fly to my location"
          >
            <svg
              viewBox="5 2 14 20"
              width="18"
              height="18"
              aria-hidden="true"
              focusable="false"
            >
              <path
                fill="currentColor"
                d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Z"
              />
              <circle cx="12" cy="9" r="2.6" fill="#171b26" />
            </svg>
          </button>
        </div>
      </div>
      <output id="globe-device" aria-live="polite"></output>
      <footer id="globe-credits"></footer>
    </div>
  </body>
</html>
