<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab: the globe</title>
    <link rel="stylesheet" href="../../design.css" />
    <link rel="stylesheet" href="../../3d/lookdev.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/",
          "3d-tiles-renderer": "/vendor/3d-tiles-renderer/build/index.js",
          "3d-tiles-renderer/plugins": "/vendor/3d-tiles-renderer/build/index.plugins.js"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      #globe-error {
        position: fixed;
        top: 12px;
        left: 12px;
        color: #ffb4a8;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }

      #globe-error:empty {
        display: none;
      }

      #globe-loading {
        position: fixed;
        top: 36px;
        left: 12px;
        color: #c9d3e0;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }

      /* The plate on the right: the error and loading lines are top left. */
      .lookdev-panel {
        left: auto;
        right: 12px;
        /* ends above the pin, bottom right, so the pin stays reachable */
        max-height: calc(100dvh - 140px);
      }

      /*
       * On a phone the plate (340 px, folded to its header) spans nearly the
       * whole width, so the status lines move below its header, where it
       * never covers them folded.
       */
      @media (max-width: 600px) {
        #globe-error {
          top: 72px;
        }

        #globe-loading {
          top: 96px;
        }
      }

      #globe-credits {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 10px;
        color: #c9d3e0;
        font:
          12px/1.4 system-ui,
          sans-serif;
      }

      /*
       * The distance readout (round-4 plan DEC-GL4-5), above the device
       * line, clear of the pin and its status line on the right. Tabular
       * figures, so the numbers do not jitter sideways as they change.
       */
      #globe-readout {
        position: fixed;
        left: 12px;
        bottom: 52px;
        max-width: calc(100% - 96px);
        color: #e6edf5;
        font:
          13px/1.4 system-ui,
          sans-serif;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 3px #000;
      }

      /* The device line sits just above the credits line. */
      #globe-device {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 32px;
        color: #c9d3e0;
        font:
          12px/1.4 system-ui,
          sans-serif;
      }

      /*
       * The pin (round-2 plan 2026-09-26-2055 M3g), bottom right as in
       * OsmDemo, above the device and credits lines; its status line to its
       * left says what it is doing or why it failed and how to fix it.
       */
      #globe-pin {
        position: fixed;
        right: 12px;
        bottom: 64px;
      }

      #globe-pin-status {
        position: fixed;
        right: 68px;
        bottom: 70px;
        max-width: min(60vw, 420px);
        color: #c9d3e0;
        text-align: right;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }

      #globe-credits a {
        color: inherit;
      }

      #globe-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
    <script type="module" src="./globe-lab.js"></script>
    <script type="module" src="../../3d/panel.js"></script>
  </head>
  <body>
    <canvas id="globe-canvas"></canvas>
    <output id="globe-error" role="alert"></output>
    <output id="globe-loading" aria-live="polite" hidden></output>
    <aside class="lookdev-panel plate col" aria-label="Globe controls">
      <button
        type="button"
        class="lookdev-head"
        aria-expanded="true"
        aria-controls="lookdev-body"
      >
        <span class="lookdev-title">Globe</span>
        <span class="lookdev-chevron" aria-hidden="true"></span>
      </button>
      <div id="lookdev-body" class="lookdev-body col">
        <details class="lookdev-section" data-section="globe-sun" open>
          <summary>Sun and time</summary>
          <div class="lookdev-section-body col">
            <label class="lookdev-field">
              <span class="hint">Hour <output data-for="hour"></output></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="23.75"
                step="0.25"
                data-time-hour
              />
            </label>
            <button type="button" class="btn" data-time-now>Now</button>
            <label class="lookdev-field">
              <span class="hint">Clock speed</span>
              <select class="select" data-hash-key="timeScale">
                <option value="0">Stopped</option>
                <option value="1">Real time</option>
                <option value="60">1 min per second</option>
                <option value="600">10 min per second</option>
                <option value="3600">1 h per second</option>
              </select>
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Sun intensity <output data-for="sunIntensity"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="8"
                step="0.05"
                data-hash-key="sunIntensity"
              />
            </label>
          </div>
        </details>
        <details class="lookdev-section" data-section="globe-surface" open>
          <summary>Surface</summary>
          <div class="lookdev-section-body col">
            <label class="lookdev-field">
              <span class="hint"
                >Night lights <output data-for="nightGain"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="4"
                step="0.05"
                data-hash-key="nightGain"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Water roughness <output data-for="waterRoughness"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0.05"
                max="1"
                step="0.05"
                data-hash-key="waterRoughness"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Cloud opacity <output data-for="cloudOpacity"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="1"
                step="0.05"
                data-hash-key="cloudOpacity"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Cloud drift (°/s) <output data-for="cloudDrift"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="10"
                step="0.1"
                data-hash-key="cloudDrift"
              />
            </label>
          </div>
        </details>
        <details class="lookdev-section" data-section="globe-sky" open>
          <summary>Sky</summary>
          <div class="lookdev-section-body col">
            <label class="lookdev-field">
              <span class="hint">Sky behind the Earth</span>
              <select class="select" data-hash-key="sky">
                <option value="1">On</option>
                <option value="0">Off</option>
              </select>
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Sun disc (°) <output data-for="sunSize"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0.1"
                max="10"
                step="0.1"
                data-hash-key="sunSize"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Sun glow <output data-for="sunGlow"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="4"
                step="0.05"
                data-hash-key="sunGlow"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint">Stars (procedural)</span>
              <select class="select" data-hash-key="stars">
                <option value="1">On</option>
                <option value="0">Off</option>
              </select>
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Faintest star (mag) <output data-for="starMag"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0.5"
                max="7.5"
                step="0.5"
                data-hash-key="starMag"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Star brightness <output data-for="starGain"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="4"
                step="0.05"
                data-hash-key="starGain"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Milky Way <output data-for="milkyWay"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="0.1"
                step="0.002"
                data-hash-key="milkyWay"
              />
            </label>
          </div>
        </details>
        <details class="lookdev-section" data-section="globe-camera" open>
          <summary>Camera and turn</summary>
          <div class="lookdev-section-body col">
            <label class="lookdev-field">
              <span class="hint"
                >Field of view (°) <output data-for="fovY"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="20"
                max="80"
                step="1"
                data-hash-key="fovY"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Wait for a fix (ms) <output data-for="spinMs"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="10000"
                step="250"
                data-hash-key="spinMs"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint"
                >Turn (ms) <output data-for="turnMs"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="0"
                max="10000"
                step="250"
                data-hash-key="turnMs"
              />
            </label>
            <button id="globe-replay" type="button" class="btn">
              Replay the turn
            </button>
          </div>
        </details>
        <details class="lookdev-section" data-section="globe-pin" open>
          <summary>Pin and dive</summary>
          <div class="lookdev-section-body col">
            <label class="lookdev-field">
              <span class="hint"
                >Dive (ms) <output data-for="diveMs"></output
              ></span>
              <input
                class="slider"
                type="range"
                min="1000"
                max="60000"
                step="500"
                data-hash-key="diveMs"
              />
            </label>
            <label class="lookdev-field">
              <span class="hint">Hand-over altitude (km)</span>
              <select class="select" data-hash-key="handOverKm">
                <option value="20">20</option>
                <option value="50">50</option>
                <option value="150">150</option>
              </select>
            </label>
            <label class="lookdev-field">
              <span class="hint">Open the city at the end</span>
              <select class="select" data-hash-key="handOver">
                <option value="1">Yes</option>
                <option value="0">No, hold there</option>
              </select>
            </label>
          </div>
        </details>
        <details class="lookdev-section" data-section="globe-tiles" open>
          <summary>Tiles and memory</summary>
          <div class="lookdev-section-body col">
            <label class="lookdev-field">
              <span class="hint">Error target (px)</span>
              <select class="select" data-hash-key="errorTarget">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="4">4</option>
                <option value="16">16</option>
              </select>
            </label>
            <label class="lookdev-field">
              <span class="hint">Tile cache (MiB)</span>
              <select class="select" data-hash-key="cacheMiB">
                <option value="32">32</option>
                <option value="48">48</option>
                <option value="64">64</option>
                <option value="128">128</option>
              </select>
            </label>
            <label class="lookdev-field">
              <span class="hint">Pixel ratio cap</span>
              <select class="select" data-hash-key="pixelRatio">
                <option value="1">1</option>
                <option value="1.5">1.5</option>
                <option value="2">2</option>
              </select>
            </label>
          </div>
        </details>
      </div>
    </aside>
    <button
      id="globe-pin"
      type="button"
      class="btn btn--icon btn--locate"
      data-state="idle"
      aria-label="Fly to my location"
      title="Fly to my location"
    >
      <svg
        viewBox="5 2 14 20"
        width="18"
        height="18"
        aria-hidden="true"
        focusable="false"
      >
        <path
          fill="currentColor"
          d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Z"
        />
        <circle cx="12" cy="9" r="2.6" fill="#171b26" />
      </svg>
    </button>
    <output id="globe-pin-status" aria-live="polite"></output>
    <!-- aria-live off: an output is a polite live region by default, and
         4 updates a second would flood a screen reader. -->
    <output id="globe-readout" aria-live="off"></output>
    <output id="globe-device" aria-live="polite"></output>
    <footer id="globe-credits"></footer>
  </body>
</html>
