<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Check pages</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/design.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      /* Each view's backdrop, as on the prototype it is checked against. */
      body[data-view="lectern"],
      body[data-view="travelling-box"] {
        background: #dde4e8;
      }
      body[data-view="then-now"] {
        background: #3d7ab8;
      }
      body[data-view="model-views"] {
        background: #0e0f12;
      }
      body[data-view="character-views"] {
        background: #e4e9ee;
      }
      body[data-view="long-text"] {
        /* A stand-in for the camera image, as in the prototypes: a sky,
           a row of plastered houses with windows and roofs, cobbles. The
           box and the sheet are read against a scene, not a flat grey.
           Band positions are shares of the height (for a band of size s
           at top t the position is t / (100% - s)). */
        background:
          repeating-linear-gradient(
              90deg,
              transparent 0 18px,
              rgb(59 63 69 / 75%) 18px 32px,
              transparent 32px 46px
            )
            0 37% / 100% 6% no-repeat,
          repeating-linear-gradient(
              90deg,
              transparent 0 18px,
              rgb(59 63 69 / 75%) 18px 32px,
              transparent 32px 46px
            )
            0 50% / 100% 6% no-repeat,
          linear-gradient(#a04a30, #8a3f2a) 0 25% / 100% 5% no-repeat,
          linear-gradient(#f4efe6, #e2d9ca) 0 40% / 100% 25% no-repeat,
          repeating-linear-gradient(0deg, #77726a 0 3px, #8f8a82 3px 14px) 0
            100% / 100% 45% no-repeat,
          linear-gradient(#8fb8d8, #d5dfe6 30%);
        background-color: #d5dfe6;
      }
      #ar-root {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      .check-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      /* The visitor page's screen host (index.html), so then and now's
         slider sits where it sits there. */
      #narration-card-root {
        position: fixed;
        bottom: calc(16px + env(safe-area-inset-bottom));
        left: 50%;
        z-index: 30;
        width: calc(100vw - 32px);
        max-width: 360px;
        transform: translateX(-50%);
      }
      #narration-card-root:empty {
        display: none;
      }
      /* The model and character demos' view bar (a person's mode), inside
         16 px gutters, wrapping on a narrow phone. */
      .mvc-views,
      .cvc-views {
        position: absolute;
        top: calc(16px + env(safe-area-inset-top, 0px));
        left: 16px;
        right: 16px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        z-index: 3;
      }
      /* The bare page's list of views. */
      .check-index {
        margin: 16px;
        padding-left: 20px;
        font:
          16px/2 system-ui,
          sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="ar-root"></div>
    <div id="narration-card-root"></div>
    <script type="module">
      import { startCheckPage } from "./src/checks/check-page.ts";

      void startCheckPage(document, location.search, {
        root: document.getElementById("ar-root"),
        cardHost: document.getElementById("narration-card-root"),
      });
    </script>
  </body>
</html>
