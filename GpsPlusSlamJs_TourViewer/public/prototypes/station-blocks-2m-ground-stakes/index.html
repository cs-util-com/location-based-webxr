  document.getElementById('ed-desc').addEventListener('input', e => setField('description', e.target.value));
  chipButtons(document.getElementById('ed-roles'), Object.keys(ROLES).map(r => ({ value: r, label: ROLES[r].name })), m.role, r => { m.role = r; b.rebuild(); refreshAll(); }, r => ROLES[r].accent);
  chipButtons(document.getElementById('ed-orients'), ORIENTS.map(o => ({ value: o, label: o[0].toUpperCase() + o.slice(1) })), m.orientation, o => { m.orientation = o; b.rebuild(); refreshAll(); });
  const rng = document.getElementById('ed-read');
  const toR = v => Math.round(Math.exp(Math.log(1) + v / 1000 * (Math.log(40) - Math.log(1))) * 2) / 2;
  const fromR = r => Math.round((Math.log(r) / Math.log(40)) * 1000);
  rng.value = String(fromR(m.readAtM));
  rng.addEventListener('input', () => { m.readAtM = sanitizeModel({ ...m, readAtM: toR(+rng.value) }).readAtM; renderReadLabel(); clearTimeout(rng.t); rng.t = setTimeout(() => b.rebuild(), 40); renderCreatorChrome(); });
  renderReadLabel();
  el.querySelectorAll('[data-pt]').forEach(inp => inp.addEventListener('change', () => { const v = parseFloat(inp.value); if (Number.isFinite(v)) { m.pointsTo[inp.dataset.pt] = v; m.pointsTo = sanitizeModel(m).pointsTo; b.rebuild(); } }));
  el.querySelectorAll('[data-pose]').forEach(inp => inp.addEventListener('change', () => { const v = parseFloat(inp.value); if (Number.isFinite(v)) { p[inp.dataset.pose] = v; b.syncPose(); } }));
  document.getElementById('ed-pick').addEventListener('click', () => { pickTarget = !pickTarget; renderInspector(); if (pickTarget) toast('Click the ground or a wall to set where it points'); });
  document.getElementById('ed-drag').addEventListener('click', () => setTcMode('target'));
  document.getElementById('ed-clear')?.addEventListener('click', () => { m.pointsTo = null; b.rebuild(); if (tcMode === 'target') tcMode = 'move'; attachTC(); refreshAll(); });
  const grid = document.getElementById('ed-views');
  for (const vw of VIEWS) {
    const bn = document.createElement('button'); bn.setAttribute('aria-pressed', String(vw.name === b.rec.view)); bn.innerHTML = `${vw.title}<small>${vw.required ? 'required' : 'extra'}</small>`;
    bn.addEventListener('click', () => { b.rec.view = vw.name; b.rebuild(); refreshAll(); }); grid.appendChild(bn);
  }
  renderCountsOnly();
}
function renderReadLabel() {
  const m = blocks[selected].rec.model;
  const l = document.getElementById('ed-read-l'), h = document.getElementById('ed-read-h'); if (!l) return;
  l.textContent = `${m.readAtM} m`;
  h.textContent = `Letters ${cm(emOf(m))} cm tall; floats at ${liftOf(m).toFixed(1)} m in pin, bubble and callout.`;
}
function renderInspectorValues() {
  if (state.mode !== 'editor') return;
  const b = blocks[selected];
  document.querySelectorAll('#ed-inspector [data-pose]').forEach(inp => { if (document.activeElement !== inp) inp.value = b.rec.pose[inp.dataset.pose]; });
  if (b.rec.model.pointsTo) document.querySelectorAll('#ed-inspector [data-pt]').forEach(inp => { if (document.activeElement !== inp) inp.value = b.rec.model.pointsTo[inp.dataset.pt]; });
}

/* ---------- top bar: view picker, fields panel, notes ---------- */
function currentViewName() { return state.mode === 'visitor' ? (blocks.every(b => b.rec.view === blocks[0].rec.view) ? blocks[0].rec.view : null) : blocks[selected].rec.view; }
function renderViewPicker() {
  const el = document.getElementById('viewpicker'); const cur = currentViewName();
  el.innerHTML = `<span class="vlabel">${state.mode === 'visitor' ? 'View (all blocks)' : 'View (selected)'}</span>` + VIEWS.map(v => `<button data-view="${v.name}" aria-pressed="${v.name === cur}">${v.title}</button>`).join('');
  el.querySelectorAll('button').forEach(bn => bn.addEventListener('click', () => {
    if (state.mode === 'visitor') setAllViews(bn.dataset.view); else { blocks[selected].rec.view = bn.dataset.view; blocks[selected].rebuild(); }
    refreshAll(); updateHash();
  }));
}
function setAllViews(name) {
  if (!VIEW_NAMES.includes(name)) throw new Error(`unknown view "${name}"`);
  for (const b of blocks) { b.rec.view = name; b.rebuild(); }
}
const fieldsPanel = document.getElementById('fields-panel');
function renderFieldsPanel() {
  const name = currentViewName() || blocks[selected].rec.view; const v = viewInfo(name);
  const rows = FIELDS.map(f => v.uses[f.name] ? `<dt>${f.name}</dt><dd>${esc(v.uses[f.name])}</dd>` : `<dt class="off">${f.name}</dt><dd class="off">not used${v.unused[f.name] ? ': ' + esc(v.unused[f.name]) : ''}</dd>`).join('');
  fieldsPanel.innerHTML = `<h3>${esc(v.title)} ${v.required ? '' : '<span style="color:#8a909b;font-weight:400">(extra view)</span>'}</h3><div class="sub">Fields of the short-text model this view uses, and how.${v.extra ? ' ' + esc(v.extra) : ''}</div><dl>${rows}</dl>`;
}
const btnFields = document.getElementById('btn-fields');
btnFields.addEventListener('click', () => { fieldsPanel.hidden = !fieldsPanel.hidden; btnFields.setAttribute('aria-pressed', String(!fieldsPanel.hidden)); renderFieldsPanel(); });
const btnPhone = document.getElementById('btn-phone');
btnPhone.addEventListener('click', () => { state.phone = !state.phone; btnPhone.setAttribute('aria-pressed', String(state.phone)); layout(); });
const notesPanel = document.getElementById('notes-panel'), btnNotes = document.getElementById('btn-notes');
function toggleNotes(open) { notesPanel.hidden = !open; btnNotes.setAttribute('aria-pressed', String(open)); }
btnNotes.addEventListener('click', () => toggleNotes(notesPanel.hidden));
document.getElementById('notes-close').addEventListener('click', () => toggleNotes(false));
document.querySelectorAll('#modepicker button').forEach(bn => bn.addEventListener('click', () => setMode(bn.dataset.mode)));

function setPlaceErr(on, bearingDeg = PLACE_ERR.bearingDeg) {
  const b = Number(bearingDeg);
  PLACE_ERR.on = !!on; PLACE_ERR.bearingDeg = Number.isFinite(b) ? b : 53;
  PLACE_ERR.dx = Math.sin(rad(PLACE_ERR.bearingDeg)); PLACE_ERR.dz = -Math.cos(rad(PLACE_ERR.bearingDeg));   // 1 m, bearing clockwise from north (-z)
  PLACE_ERR.active = PLACE_ERR.on && state.mode === 'visitor';
  for (const bl of blocks) bl.syncPose();
  document.getElementById('btn-err').setAttribute('aria-pressed', String(PLACE_ERR.on));
}
function syncSun() { applySun(GP.sun); document.getElementById('btn-sun').setAttribute('aria-pressed', String(GP.sun > 1.2)); }
document.getElementById('btn-sun').addEventListener('click', () => {
  GP.sun = GP.sun > 1.2 ? 1 : 1.6; syncSun();
  toast(GP.sun > 1.2 ? 'Direct sun on pale paving (place brightness 1.6)' : 'Normal light (place brightness 1)');
});
document.getElementById('btn-err').addEventListener('click', () => {
  setPlaceErr(!PLACE_ERR.on); updateHash();
  toast(PLACE_ERR.on ? (state.mode === 'visitor' ? 'All content drawn 1 m off (the place stays put)' : 'The 1 m error shows in visitor mode') : 'No placement error');
});

/* tiny markdown renderer for the notes (headings, nested lists, paragraphs, bold, code) */
function renderNotes() {
  const src = document.getElementById('notes-md').textContent.replace(/<!--NOTES-(START|END)-->/g, '').trim();
  const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  let html = '', stack = [], para = [];
  const flushPara = () => { if (para.length) { html += `<p>${inline(para.join(' '))}</p>`; para = []; } };
  const closeTo = depth => { while (stack.length > depth) { html += '</li></ul>'; stack.pop(); } };
  for (const raw of src.split('\n')) {
    const line = raw.replace(/\s+$/, '');
    const li = line.match(/^(\s*)- (.*)$/);
    const h = line.match(/^(#{1,3}) (.*)$/);
    if (li) {
      flushPara(); const depth = Math.floor(li[1].length / 2) + 1;
      if (depth > stack.length) { while (stack.length < depth) { html += '<ul><li>'; stack.push(1); } }
      else { closeTo(depth); html += '</li><li>'; }
      html += inline(li[2]);
    } else if (h) { flushPara(); closeTo(0); html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; }
    else if (!line.trim()) { flushPara(); closeTo(0); }
    else if (stack.length && /^\s+/.test(raw)) { html += ' ' + inline(line.trim()); }
    else { closeTo(0); para.push(line.trim()); }
  }
  flushPara(); closeTo(0);
  document.getElementById('notes-body').innerHTML = html;
}
renderNotes();

/* URL hash: #mode=visitor&view=<name> */
function updateHash() {
  const v = currentViewName();
  const h = `#mode=${state.mode}${v ? `&view=${v}` : ''}${PLACE_ERR.on ? '&err=1' : ''}`;
  if (location.hash !== h) history.replaceState(null, '', h);
}
function readHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  const v = q.get('view'); if (v && VIEW_NAMES.includes(v)) setAllViews(v);
  setPlaceErr(q.get('err') === '1');
  const m = q.get('mode'); setMode(['visitor', 'creator', 'editor'].includes(m) ? m : 'visitor');
}
window.addEventListener('hashchange', readHash);

/* =====================================================================
   Frame loop and frame-time readout
   ===================================================================== */
const ftEl = document.getElementById('ftime');
const samples = []; let last = performance.now(), frameNo = 0, lastFt = 0;
const waiters = [];
function frame(now) {
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); const interval = now - last; last = now;
  const t0 = performance.now();
  updateVisitor(dt);
  if (state.mode !== 'editor') applyCamera();
  updateCreator(); updateEditor();
  const camera = activeCam(); camera.updateMatrixWorld(true);
  for (const b of blocks) { b.appearTarget = state.mode === 'visitor' ? (visitor.inside ? 1 : 0) : 1; b.update(dt, camera, now / 1000); }
  layoutEdgeHints(dt);
  renderer.render(scene, camera);
  const work = performance.now() - t0;
  samples.push({ t: now, work, interval });
  while (samples.length && now - samples[0].t > 2000) samples.shift();
  if (now - lastFt > 250 && samples.length) {
    lastFt = now; const n = samples.length;
    const mw = samples.reduce((s, x) => s + x.work, 0) / n, xw = Math.max(...samples.map(x => x.work));
    const mi = samples.reduce((s, x) => s + x.interval, 0) / n, xi = Math.max(...samples.map(x => x.interval));
    ftEl.textContent = `frame ${mi.toFixed(1)} mean / ${xi.toFixed(1)} max ms`; ftEl.dataset.work = `${mw.toFixed(1)} / ${xw.toFixed(1)}`;
  }
  if (snapFrames > 0) snapFrames--;
  frameNo++;
  for (let i = waiters.length - 1; i >= 0; i--) if (frameNo >= waiters[i].at) { waiters[i].res(); waiters.splice(i, 1); }
  requestAnimationFrame(frame);
}
const drawn = (n = 3) => new Promise(res => waiters.push({ at: frameNo + n, res }));

/* =====================================================================
   Script hook
   ===================================================================== */
function exportRecord(r) {
  return { id: r.id, model: 'short-text', view: r.view, pose: { ...r.pose }, data: { ...sanitizeModel(r.model) } };
}
window.__stationBlock = {
  family: FAMILY,
  views: [...VIEW_NAMES],
  modes: ['visitor', 'creator', 'editor'],
  async setMode(name) { setMode(String(name)); snapFrames = 4; await drawn(4); },
  async setView(name) { setAllViews(String(name)); refreshAll(); updateHash(); snapFrames = 4; await drawn(4); },
  async walkTo(x, z) {
    if (![x, z].every(Number.isFinite)) throw new Error('walkTo needs finite x and z');
    visitor.x = x; visitor.z = z; visitor.auto = null; snapFrames = 4; await drawn(4);
  },
  async lookAt(x, y, z) {
    if (![x, y, z].every(Number.isFinite)) throw new Error('lookAt needs finite x, y and z');
    const s = state.mode === 'creator' ? creator : visitor;
    const dx = x - s.x, dy = y - EYE, dz = z - s.z;
    s.yaw = Math.atan2(-dx, -dz); s.pitch = Math.atan2(dy, Math.hypot(dx, dz)); visitor.auto = null; snapFrames = 4; await drawn(4);
  },
  async rebuildMs() { const t0 = performance.now(); for (const bl of blocks) bl.rebuild(); const ms = performance.now() - t0; snapFrames = 4; await drawn(4); return ms; },
  async params() { return { ...GP }; },
  /* Per block: the arrow as laid out (tip on the ground in world metres, length, width, count of chevrons or vanes),
     how often it has been laid out since the view was built, where the plate stands, and a signature of the arrow's
     geometry, so a check can prove that walking around does not change it. */
  async groundInfo() {
    return blocks.map(bl => {
      const v = bl.view, out = { id: bl.rec.id, view: bl.rec.view };
      if (!v.arrow) return out;
      const { tipLocal, ...rest } = v.info || {};
      const tip = tipLocal ? v.group.localToWorld(tipLocal.clone()) : null;
      const pl = v.plateNode ? v.plateNode.getWorldPosition(new THREE.Vector3()) : null;
      return { ...out, ...rest, layouts: v.layouts, tip: tip && { x: +tip.x.toFixed(2), z: +tip.z.toFixed(2) }, plate: pl && { x: +pl.x.toFixed(2), z: +pl.z.toFixed(2) }, sig: arrowSignature(v.arrow) };
    });
  },
  /* Per block, every vertex of the arrow (not its shadows) on the ground plan, world x and z to the cm, so a check
     can say where it lands: on the step, against the wall, short of both. */
  async footprint() {
    return blocks.map(bl => {
      const a = bl.view.arrow, pts = [], seen = new Set(), q = new THREE.Vector3();
      if (!a) return { id: bl.rec.id, pts };
      a.updateWorldMatrix(true, true);
      a.traverse(o => {
        if (!o.isMesh || !o.visible || !o.geometry || o.userData.noMeasure) return;
        const p = o.geometry.attributes.position;
        for (let i = 0; i < p.count; i++) {
          q.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld);
          const k = q.x.toFixed(2) + ',' + q.z.toFixed(2);
          if (!seen.has(k)) { seen.add(k); pts.push([+q.x.toFixed(2), +q.z.toFixed(2)]); }
        }
      });
      return { id: bl.rec.id, pts };
    });
  },
  /* Per block, the arrow on the screen: its page-pixel box, and how many chevrons (or vanes) are on screen and how tall. */
  async arrowInfo() { const camera = activeCam(); camera.updateMatrixWorld(true); return blocks.map(bl => ({ id: bl.rec.id, ...(bl.view.arrow ? measureArrow(bl.view.arrow, camera) : {}) })); },
  /* Per block, the page-pixel box of the caption plate, or null when it is hidden or partly behind the camera; used to
     measure contrast in the screenshots. */
  async textBoxes() {
    const camera = activeCam(), r = stage.getBoundingClientRect(), W = stage.clientWidth, H = stage.clientHeight;
    const shown = o => { for (let x = o; x; x = x.parent) if (!x.visible) return false; return true; };
    return blocks.map(bl => {
      const list = (bl.view.textMeshes || []).filter(shown);
      if (!list.length) return { id: bl.rec.id, box: null };
      const m = list[0], dist = m.getWorldPosition(new THREE.Vector3()).distanceTo(camera.position);
      m.geometry.computeBoundingBox(); const bb = m.geometry.boundingBox;
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, behind = false;
      for (const x of [bb.min.x, bb.max.x]) for (const y of [bb.min.y, bb.max.y]) for (const z of [bb.min.z, bb.max.z]) {
        const q = new THREE.Vector3(x, y, z).applyMatrix4(m.matrixWorld);
        if (q.clone().applyMatrix4(camera.matrixWorldInverse).z > -0.05) behind = true;
        q.project(camera);
        const sx = r.left + (q.x + 1) / 2 * W, sy = r.top + (1 - q.y) / 2 * H;
        x0 = Math.min(x0, sx); y0 = Math.min(y0, sy); x1 = Math.max(x1, sx); y1 = Math.max(y1, sy);
      }
      const box = behind ? null : { x0: Math.max(r.left, x0), y0: Math.max(r.top, y0), x1: Math.min(r.left + W, x1), y1: Math.min(r.top + H, y1) };
      return { id: bl.rec.id, dist: +dist.toFixed(2), box: box && box.x1 - box.x0 > 4 && box.y1 - box.y0 > 4 ? box : null };
    });
  },
  async setParam(name, value) {
    const x = Number(value);
    if (typeof GP[name] !== 'number' || !Number.isFinite(x)) throw new Error('unknown or non-numeric ground parameter ' + name);
    GP[name] = x; syncSun(); for (const bl of blocks) if (bl.rec.view === 'ground-arrow') bl.rebuild(); snapFrames = 4; await drawn(4);
  },
  async resetParams() { Object.assign(GP, GROUND_DEFAULTS); syncSun(); for (const bl of blocks) if (bl.rec.view === 'ground-arrow') bl.rebuild(); snapFrames = 4; await drawn(4); },
  async setError(on, bearingDeg = 53) { setPlaceErr(on, bearingDeg); updateHash(); snapFrames = 4; await drawn(4); },
  async describe() {
    return { family: FAMILY, fields: FIELDS.map(f => ({ ...f })), views: VIEWS.map(v => ({ name: v.name, required: v.required, usesFields: Object.keys(v.uses) })) };
  },
  async exportModel() {
    return { family: FAMILY, model: 'short-text', version: 2, station: { name: STATION.name, radiusM: STATION.r }, blocks: records.map(exportRecord) };
  },
  /* Probes for the checks: the bubble tail's drawn angle (degrees) and the edge-hint states per block. */
  async probe() {
    return blocks.map(b => ({ id: b.rec.id, view: b.rec.view, tailDeg: b.view.tailAngle ? +(b.view.tailAngle() * 180 / Math.PI).toFixed(1) : null,
      edge: b.view.isEdgeHint ? (b.view.edge ? 'edge' : b.view.full ? 'full' : 'inview') : null }));
  },
};

readHash();
layout();
requestAnimationFrame(t => { last = t; frame(t); });
</script>
