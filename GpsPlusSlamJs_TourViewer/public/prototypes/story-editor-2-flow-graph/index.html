<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Story Flow Graph</title>
<meta name="description" content="Story editor prototype 2: a station's story drawn as a flow graph, with every next step and every answer's jump as an arrow.">
<!--
  Throwaway prototype, story editor direction 2: a FLOW GRAPH. A station's
  story steps are nodes laid out top to bottom in story order; every arrow
  (the next step, each answer's jump, the quiz's way on) is drawn. The layout
  is automatic: steps every visitor passes stay on the middle line, steps only
  some visitors reach move out into a side column, so a branch reads as a
  detour. On the desktop the graph sits inside the Studio 3 editor (tree left,
  inspector right); on the phone the author sees one step at a time with where
  it comes from and where it goes, beside a small map of the whole shape.
  Original code and drawings, no libraries, no network. Nothing is saved; the
  station "The old mill" is hard-coded sample data. Not wired into the app.
-->
<style>
:root {
  --bg0: #18191c; --bg1: #1f2023; --bg2: #26282c; --bg3: #2f3136; --bg4: #383a40;
  --line: #313338; --line2: #3c3f46;
  --text: #d9dbe0; --muted: #8a8f99; --dim: #646973;
  --accent: #e9a23b; --accentBg: rgba(233,162,59,.14); --accentLine: rgba(233,162,59,.55);
  --focus: #5b9cf0; --ok: #7cc77a; --err: #ef6b66; --warn: #e9b86b;
  --a0: #5b9cf0; --a1: #67bb57; --a2: #e06fbf; --a3: #3fc1c9; --flow: #80858f;
  --k-choice: #8db8e3; --k-quiz: #f0c05a;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg0); color: var(--text);
  font: 12px/1.4 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
#app { height: 100%; }

/* ---------------- desktop shell (Studio 3 language) ---------------- */
#app.desk { display: grid; grid-template-rows: 40px minmax(0,1fr) 24px; grid-template-columns: 272px minmax(0,1fr) 300px;
  grid-template-areas: "tb tb tb" "tree cv side" "sb sb sb"; }
#tb { grid-area: tb; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: var(--bg1); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; padding-right: 10px; border-right: 1px solid var(--line); height: 24px; white-space: nowrap; }
.brand b { font-weight: 600; }
.brand .doc { color: var(--muted); }
.tbtn { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border: 1px solid transparent; border-radius: 4px; background: transparent; cursor: pointer; white-space: nowrap; }
.tbtn:hover:not(:disabled) { background: var(--bg3); }
.tbtn:disabled { color: var(--dim); cursor: default; }
.tbtn kbd { font: 10px var(--mono); color: var(--dim); }
.seg { display: flex; background: var(--bg0); border: 1px solid var(--line2); border-radius: 5px; padding: 2px; gap: 2px; }
.seg button { height: 22px; padding: 0 10px; border: 0; border-radius: 3px; background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.seg button.on { background: var(--bg3); color: var(--text); }
.spacer { flex: 1; }
.protoTag { font-size: 10px; color: var(--dim); }

#tree { grid-area: tree; background: var(--bg1); border-right: 1px solid var(--line); overflow: auto; min-height: 0; padding-bottom: 12px; }
.th { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
.th .count { font: 10px var(--mono); color: var(--dim); letter-spacing: 0; }
.scard { margin: 8px 8px 0; border-radius: 6px; border: 1px solid var(--line2); background: var(--bg2); overflow: hidden; }
.scard.sel { border-color: var(--accentLine); }
.hero { position: relative; height: 46px; cursor: pointer; display: flex; align-items: flex-end; padding: 6px 9px; }
.hero .n { position: absolute; left: 7px; top: 6px; font: 600 10px var(--mono); background: rgba(20,21,24,.78); color: #e6f0fa; border-radius: 3px; padding: 1px 5px; }
.scard.sel .hero .n { background: var(--accent); color: #1c1c1c; }
.hero .nm { font-weight: 600; font-size: 13px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
.kids { padding: 4px 0 6px; }
.row { position: relative; display: flex; align-items: center; gap: 7px; min-height: 26px; padding: 0 8px 0 12px; cursor: pointer; user-select: none; }
.row:hover { background: var(--bg3); }
.row.sel { background: var(--accentBg); }
.row.sel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { font: 10.5px var(--mono); color: var(--dim); white-space: nowrap; }
.row .tag { font-size: 10px; border-radius: 9px; padding: 0 7px; line-height: 16px; white-space: nowrap; }
.tag.story { background: rgba(141,184,227,.14); color: #a9cbee; }
.tag.world { background: rgba(124,199,122,.14); color: #9fd89d; }
.row .rx { opacity: 0; width: 22px; height: 22px; display: grid; place-items: center; border: 0; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; }
.row:hover .rx, .row.sel .rx { opacity: 1; }
.row .rx:hover { background: var(--bg4); color: #f0a8a5; }
.sub { font-size: 10px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); padding: 8px 12px 3px; }
.kic { display: inline-flex; color: var(--muted); }

#cv { grid-area: cv; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #202125; }
#cvHead { flex: none; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--bg1); display: flex; flex-direction: column; gap: 7px; }
.hrow { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
.htitle { font-size: 14px; font-weight: 600; color: #f0f1f3; display: flex; align-items: center; gap: 7px; }
.htitle small { font-weight: 400; color: var(--muted); font-size: 12px; }
.vchip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; border: 1px solid; cursor: pointer; background: transparent; font-size: 12px; white-space: nowrap; }
.vchip.ok { color: #a6dca4; border-color: rgba(124,199,122,.45); background: rgba(124,199,122,.08); }
.vchip.err { color: #ffb2ae; border-color: rgba(239,107,102,.6); background: rgba(239,107,102,.12); }
.vchip.warn { color: #f3d29a; border-color: rgba(233,184,107,.5); background: rgba(233,184,107,.1); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--line2); background: var(--bg2); color: var(--text); cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--bg3); }
.btn:disabled { color: var(--dim); cursor: default; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #1c1c1c; font-weight: 600; }
.btn.pri:hover { background: #f0b257; }
.btn.danger { background: #b8413c; border-color: #b8413c; color: #fff; font-weight: 600; }
.btn.danger:hover { background: #cc4d47; }
.btn.ghost { background: transparent; }
.ways { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--muted); font-size: 11.5px; }
.way { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px 0 4px; border-radius: 12px; border: 1px solid var(--line2); background: var(--bg2); cursor: pointer; color: var(--text); font-size: 11.5px; max-width: 290px; }
.way .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.way .ct { color: var(--dim); font: 10.5px var(--mono); white-space: nowrap; }
.way.on { border-color: var(--accent); background: var(--accentBg); }
.lt { display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 3px; border-radius: 9px; font: 700 10px/1 var(--mono); color: #111; background: var(--c, var(--flow)); flex: none; }
.lt.end { background: #50545c; color: #e6e8ec; }

#cvScroll { flex: 1; min-height: 0; overflow: auto; position: relative; }
#graph { position: relative; min-width: 100%; min-height: 100%; user-select: none; -webkit-user-select: none;
  background-image: radial-gradient(rgba(255,255,255,.055) 1px, transparent 1px); background-size: 18px 18px; }
#gz { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.zoom { display: inline-flex; align-items: center; border: 1px solid var(--line2); border-radius: 5px; overflow: hidden; }
.zoom button { height: 26px; min-width: 28px; border: 0; background: var(--bg2); cursor: pointer; padding: 0 8px; color: var(--text); }
.zoom button + button { border-left: 1px solid var(--line2); }
.zoom button.on { background: var(--accentBg); color: #f3c47e; }
.zoom button:hover { background: var(--bg3); }
.adv { font-size: 11px; color: var(--muted); background: var(--bg3); border-radius: 8px; padding: 0 6px; line-height: 16px; white-space: nowrap; }
#edges, #wire { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
#wire { z-index: 6; }
.e { fill: none; stroke-width: 1.8; stroke: var(--flow); transition: opacity .2s; }
.e.ans { stroke-width: 2.1; }
.e.a0 { stroke: var(--a0); } .e.a1 { stroke: var(--a1); } .e.a2 { stroke: var(--a2); } .e.a3 { stroke: var(--a3); }
.e.lost { stroke: var(--err); stroke-dasharray: 5 4; }
.e.back { stroke-dasharray: 2 4; }
.e.dim { opacity: .12; }
.e.walk { stroke: var(--accent); stroke-width: 3.2; }
.e.doom { stroke: var(--err); stroke-width: 3; }
.elab { transition: opacity .2s; }
.elab.dim { opacity: .12; }
.elab text { font: 700 9.5px var(--mono); fill: #111; text-anchor: middle; dominant-baseline: central; }
.wire { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-dasharray: 6 4; }

.node { position: absolute; width: 250px; background: var(--bg2); border: 1px solid var(--line2); border-radius: 8px;
  box-shadow: 0 2px 10px rgba(0,0,0,.28); transition: left .28s ease, top .28s ease, opacity .2s, box-shadow .2s; cursor: pointer; z-index: 2; user-select: none; }
.node::before { content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 4px; border-radius: 8px 0 0 8px; background: var(--kc, var(--flow)); }
.node:hover { border-color: #4b4f57; }
.node.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 4px 16px rgba(0,0,0,.35); }
.node.hl { box-shadow: 0 0 0 2px var(--k-choice), 0 4px 16px rgba(0,0,0,.35); }
.node.dim { opacity: .3; }
.node.unreached { border-style: dashed; }
.node.doom { border-color: var(--err); box-shadow: 0 0 0 2px var(--err); opacity: .85; }
.node.playing { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent), 0 0 26px rgba(233,162,59,.45); }
.node.visited { border-color: rgba(233,162,59,.5); }
.node.dragging { transition: none; z-index: 20; box-shadow: 0 12px 30px rgba(0,0,0,.55); cursor: grabbing; opacity: .95; }
.node.drop-ok { box-shadow: 0 0 0 2px var(--accent), 0 0 18px rgba(233,162,59,.4); }
.node.drop-no { opacity: .35; }
.nh { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 7px 0 6px; border-bottom: 1px solid var(--line); }
.nh .grip { color: var(--dim); cursor: grab; display: inline-flex; }
.nh .no { font: 600 11px var(--mono); background: #3d5a78; color: #e6f0fa; border-radius: 3px; padding: 1px 5px; }
.node.sel .nh .no { background: var(--accent); color: #1c1c1c; }
.nh .kd { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nh .iss { display: inline-flex; }
.nh .iss.err { color: var(--err); } .nh .iss.warn { color: var(--warn); }
.nb { padding: 6px 10px 9px 12px; }
.nt { display: flex; align-items: flex-start; gap: 6px; font-weight: 600; color: #f0f1f3; font-size: 14px; line-height: 1.3; }
.nt span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.nt svg { margin-top: 1px; color: var(--kc); }
.nx { color: #b9bdc5; margin-top: 3px; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nx b.ok { color: #a6dca4; font-weight: 600; }
.nm2 { color: var(--dim); margin-top: 5px; font-size: 11px; }
.ans, .qo { list-style: none; margin: 7px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.ans li, .qo li { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #c8ccd3; }
.ans li .al, .qo li .al { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ans li .ag { font: 10.5px var(--mono); color: var(--dim); white-space: nowrap; }
.ans li.lost .ag { color: var(--err); font-weight: 600; }
.qo li .ck { width: 14px; display: inline-flex; color: var(--ok); }
.port { position: absolute; bottom: -10px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; border: 2px solid var(--bg0); background: var(--c, var(--flow));
  color: #111; font: 700 10px/16px var(--mono); text-align: center; cursor: grab; padding: 0; z-index: 3; }
.port:hover { transform: scale(1.18); }
.port.fixed { width: 10px; height: 10px; margin-left: -5px; bottom: -5px; cursor: default; border-width: 2px; }
.port.fixed:hover { transform: none; }
.port.lostp { background: var(--err); color: #fff; }
.term { position: absolute; width: 250px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 8px;
  font-weight: 600; font-size: 12px; z-index: 2; transition: left .28s, top .28s; }
.term.start { background: #2b3a2c; border: 1px solid #4b7a4a; color: #b9e2b6; }
.term.end { background: #33353b; border: 1px solid #5a5e66; color: #e6e8ec; }
.term small { font-weight: 400; color: var(--muted); }
.term.drop-ok { box-shadow: 0 0 0 2px var(--accent), 0 0 18px rgba(233,162,59,.4); }
.term.playing { box-shadow: 0 0 0 3px var(--accent); }
.ins { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 1px solid var(--line2); background: var(--bg1); color: #f3c47e;
  display: grid; place-items: center; cursor: pointer; z-index: 4; padding: 0; opacity: .75; }
.ins:hover { opacity: 1; background: var(--accent); color: #1c1c1c; border-color: var(--accent); }
.ins svg { width: 13px; height: 13px; stroke-width: 2; }
#insLine { position: absolute; height: 0; border-top: 3px solid var(--accent); z-index: 19; pointer-events: none; border-radius: 2px; }
#insLine::before { content: attr(data-l); position: absolute; left: 0; top: -22px; background: var(--accent); color: #1c1c1c; font-weight: 600; font-size: 11px; padding: 1px 8px; border-radius: 9px; white-space: nowrap; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-left: auto; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 2px solid var(--flow); }
.legend i.a { border-color: var(--a0); } .legend i.l { border-color: var(--err); border-top-style: dashed; }

#side { grid-area: side; background: var(--bg1); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.sh { flex: none; display: flex; align-items: center; gap: 7px; height: 40px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--line); }
.sh .ttl { flex: 1; min-width: 0; font-weight: 600; font-size: 13px; color: #f0f1f3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh .no { font: 600 10px var(--mono); background: var(--accent); color: #1c1c1c; border-radius: 3px; padding: 1px 5px; }
.sbody { flex: 1; min-height: 0; overflow: auto; }
.sfoot { flex: none; border-top: 1px solid var(--line); padding: 8px 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.ib { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: 0; background: transparent; border-radius: 4px; color: var(--muted); cursor: pointer; flex: none; }
.ib:hover { background: var(--bg3); color: var(--text); }
.empty { padding: 16px 14px; color: var(--muted); line-height: 1.55; }
.empty h3 { margin: 0 0 6px; color: var(--text); font-size: 13px; }
.empty ul { margin: 6px 0 0; padding-left: 18px; }

/* forms (inspector and phone edit sheet share them) */
.form { padding: 6px 12px 12px; }
.f { display: grid; grid-template-columns: 78px minmax(0,1fr); gap: 8px; align-items: center; margin: 7px 0; }
.f.top { align-items: start; }
.f.top > label { padding-top: 5px; }
.f > label { color: var(--muted); }
.tfield { width: 100%; min-width: 0; height: 26px; background: var(--bg2); border: 1px solid var(--line2); border-radius: 3px; color: var(--text); padding: 0 7px; font: 12px "Segoe UI", system-ui, sans-serif; outline: none; }
.tfield:focus { border-color: var(--focus); }
select.tfield { padding: 0 4px; }
textarea.tfield { height: 60px; padding: 5px 7px; resize: vertical; line-height: 1.4; }
.tfield.bad { border-color: var(--err); box-shadow: 0 0 0 1px var(--err); }
.note { color: var(--dim); font-size: 11px; line-height: 1.45; margin: 3px 0; }
.note.err { color: #ffb2ae; }
.radios { display: flex; flex-direction: column; gap: 5px; }
.radios label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
.radios input[type=number] { width: 52px; }
.optrow { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 6px; align-items: center; margin: 6px 0; }
.optrow .go { grid-column: 2 / 4; display: flex; align-items: center; gap: 6px; color: var(--muted); }
.optrow .go select { flex: 1; }
.optbox { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; margin: 6px 0; background: rgba(255,255,255,.015); }
.optbox.lost { border-color: rgba(239,107,102,.6); }
.secl { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 12px; border: 1px solid var(--line2); background: var(--bg2); cursor: pointer; font-size: 11.5px; }
.chip:hover { border-color: #5a5e66; }
.linkbtn { border: 0; background: none; color: #f3c47e; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }

#sb { grid-area: sb; display: flex; align-items: center; gap: 0; background: var(--bg1); border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); min-width: 0; }
#sb > div { padding: 0 10px; border-right: 1px solid var(--line); height: 100%; display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
#sb .grow { flex: 1; min-width: 0; text-overflow: ellipsis; display: block; line-height: 23px; }
#sb b { color: var(--text); font-weight: 500; }

/* preview panel (desktop) */
.pvwrap { padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.pvphone { width: 272px; height: 484px; border-radius: 22px; border: 6px solid #0c0d0f; box-shadow: 0 0 0 1px var(--line2), 0 10px 30px rgba(0,0,0,.5); overflow: hidden; position: relative; flex: none; }
.pvbar { display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; }
.pvpos { color: var(--muted); font-size: 11.5px; text-align: center; }

/* ---------------- the visitor mock (preview) ---------------- */
.vis { position: absolute; inset: 0; overflow: hidden; cursor: pointer; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f4efe6; container-type: size; }
.vis .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.vis .hud { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; align-items: center; font-size: 11px; background: rgba(17,20,27,.7); padding: 4px 10px; border-radius: 12px; z-index: 5; }
.vis .hud b { color: #f2b84b; font-weight: 600; }
.vis .wsign { position: absolute; right: 3%; bottom: 33%; max-width: 24% !important; background: #6b4a2b; color: #f6e8cf; border: 2px solid #3d2a17; border-radius: 3px; font: 600 10px/1.25 ui-serif, Georgia, serif; padding: 4px 7px; max-width: 34%; text-align: center; box-shadow: 0 3px 6px rgba(0,0,0,.35); }
.vis .wsign::after { content: ""; position: absolute; left: 50%; bottom: -20px; width: 4px; height: 18px; background: #3d2a17; margin-left: -2px; }
.vis .wtag { position: absolute; left: 50%; bottom: 40%; transform: translateX(-50%); background: rgba(17,20,27,.75); border-radius: 10px; padding: 3px 9px; font-size: 10px; }
