<!doctype html>
<!-- Prototype: calm HUD round 2, direction 1 "Ask the guide". Throwaway; not wired to the app. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ask the Guide</title>
<style>
:root {
  --ink: #f3f5f7;
  --muted: #b3bcc6;
  --plate: rgb(10 13 18 / 78%);
  --line: rgb(255 255 255 / 16%);
  --beam: #fb923c;
  --tap: 48px;
  --font: corbel, "Noto Sans", system-ui, -apple-system, "Segoe UI", roboto, sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #101318;
  color: var(--ink);
  font: 15px/1.4 var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

button {

  font: inherit;

  color: inherit;

  cursor: pointer;

}
p { margin: 0; }

.dev {

  position: fixed;

  inset: 0;

  overflow: hidden;

  user-select: none;

}
#gl {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
  outline: 0;
}

#gl:active { cursor: grabbing; }

/* the fake camera feed: a lens vignette over the 3D square */
.feed {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 45%, transparent 60%, rgb(0 0 0 / 26%) 100%);
}

/* ================= the HUD: Exit; "?" inside a station; the radar only while a guide answers;
   the transport while something plays; the story chip while a story runs ================= */
.exit {
  position: absolute;
  z-index: 30;
  top: calc(14px + env(safe-area-inset-top));
  left: calc(14px + env(safe-area-inset-left));
  width: 44px;
  height: 44px;
  padding: 0;
  border-radius: 50%;
  border: 2px solid rgb(255 255 255 / 72%);
  background: rgb(10 13 18 / 70%);
  display: grid;
  place-items: center;
}

.exit svg {

  width: 20px;

  height: 20px;

}
.radar {
  position: absolute;
  z-index: 26;
  top: calc(64px + env(safe-area-inset-top));
  right: calc(14px + env(safe-area-inset-right));
  width: 124px;
  height: 124px;
  border-radius: 50%;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.6s ease;
}

.radar.on { opacity: 1; }

.ask {
  position: absolute;
  z-index: 27;
  right: calc(16px + env(safe-area-inset-right));
  bottom: calc(22px + env(safe-area-inset-bottom));
  width: var(--tap);
  height: var(--tap);
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--plate);
  box-shadow: 0 4px 14px rgb(0 0 0 / 28%);
  display: grid;
  place-items: center;
  animation: fade-in 0.4s ease;
}

.ask svg {

  width: 30px;

  height: 30px;

}
.ask[aria-pressed="true"] {
  background: rgb(255 253 248 / 92%);
  color: #1d232b;
}
.transport {
  position: absolute;
  z-index: 27;
  left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom));
  width: 56px;
  height: 56px;
  margin-left: -28px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: conic-gradient(#fff calc(var(--p, 0) * 1turn), rgb(255 255 255 / 22%) 0);
  display: grid;
  place-items: center;
  box-shadow: 0 4px 14px rgb(0 0 0 / 30%);
  animation: fade-in 0.3s ease;
}

.transport::before {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  background: rgb(10 13 18 / 88%);
}

.transport svg {

  position: relative;

  width: 24px;

  height: 24px;

}
.chip {
  position: absolute;
  z-index: 27;
  left: calc(14px + env(safe-area-inset-left));
  bottom: calc(22px + env(safe-area-inset-bottom));
  max-width: calc(50% - 46px);
  min-height: var(--tap);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 4px 5px 6px;
  border-radius: 24px;
  background: var(--plate);
  box-shadow: 0 4px 14px rgb(0 0 0 / 28%);
  animation: fade-in 0.4s ease;
}

.chip .face {
  flex: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 3px solid #fff;
}

.chip .title {
  flex: 1;
  min-width: 0;
  font-size: 13.5px;
  font-weight: 700;
  line-height: 1.2;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.chip .leave {
  flex: none;
  width: 36px;
  height: 36px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: rgb(255 255 255 / 10%);
  font-size: 22px;
  line-height: 1;
}

@keyframes fade-in { from { opacity: 0; } }

/* the measuring hook: any two HUD boxes that overlap get a red outline (only while measuring) */
.measuring .ovl {
  outline: 3px solid #ff2d2d;
  outline-offset: 0;
}
/* ================= demo chrome: dashed, not part of the design, not measured ================= */
.chrome {
  position: absolute;
  z-index: 40;
  top: calc(12px + env(safe-area-inset-top));
  right: calc(10px + env(safe-area-inset-right));
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1.5px dashed rgb(255 255 255 / 55%);
  border-radius: 22px;
  background: rgb(0 0 0 / 50%);
}

.chrome button {
  height: 36px;
  min-width: 34px;
  padding: 0 7px;
  border: 0;
  border-radius: 18px;
  background: transparent;
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}

.chrome button:active,
.chrome button[aria-pressed="true"] { background: rgb(255 255 255 / 20%); }

.chrome .beat-name {
  min-width: 112px;
  max-width: 40vw;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 650;
}

.chrome .info-btn { font: italic 700 16px/1 Georgia, serif; }
.chrome svg {
  width: 18px;
  height: 18px;
  vertical-align: middle;
}
.readout {
  position: absolute;
  z-index: 40;
  left: 50%;
  bottom: calc(92px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  padding: 4px 9px;
  border: 1.5px dashed rgb(255 255 255 / 45%);
  border-radius: 10px;
  background: rgb(0 0 0 / 60%);
  font: 11px/1.35 ui-monospace, consolas, monospace;
  color: #fff;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
  white-space: pre;
}

.try {
  position: absolute;
  z-index: 40;
  left: 50%;
  top: 38%;
  transform: translateX(-50%);
  width: 320px;
  max-width: calc(100% - 48px);
  padding: 9px 13px;
  border: 1.5px dashed rgb(255 255 255 / 45%);
  border-radius: 14px;
  background: rgb(0 0 0 / 58%);
  font-size: 13.5px;
  line-height: 1.4;
  color: #fff;
  text-align: center;
  transition: opacity 0.8s;
  pointer-events: none;
}

.try.gone { opacity: 0; }

.rip {
  position: absolute;
  z-index: 45;
  width: 46px;
  height: 46px;
  margin: -23px 0 0 -23px;
  border-radius: 50%;
  border: 3px solid #fff;
  box-shadow: 0 0 0 2px rgb(0 0 0 / 35%);
  pointer-events: none;
  animation: rip 0.7s ease-out forwards;
}

@keyframes rip {
  from {
    transform: scale(0.5);
    opacity: 1;
  }
  to {
    transform: scale(1.5);
    opacity: 0;
  }
}

.info {
  position: absolute;
  z-index: 50;
  top: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  max-width: 430px;
  overflow: auto;
  padding: 14px 16px calc(20px + env(safe-area-inset-bottom));
  background: rgb(14 18 23 / 97%);
  border-left: 1px solid var(--line);
  font-size: 14px;
  line-height: 1.45;
  user-select: text;
}

.info h1 {

  margin: 0 0 4px;

  font-size: 19px;

}
.info h3 {
  margin: 14px 0 4px;
  font-size: 11.5px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--muted);
}

.info p,
.info li { color: #dfe4ea; }

.info ol,
.info ul {
  margin: 4px 0;
  padding-left: 20px;
}
.info .close {
  position: sticky;
  top: 0;
  float: right;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  background: rgb(255 255 255 / 10%);
  font-size: 22px;
}

.info .knob {

  display: flex;

  flex-wrap: wrap;

  align-items: center;

  gap: 5px;

  margin: 6px 0;

}
.info .knob span {
  min-width: 112px;
  font-weight: 600;
  color: #fff;
}
.info .knob button,
.info .beats button {
  min-height: 36px;
  padding: 4px 10px;
  border: 1px solid rgb(255 255 255 / 30%);
  border-radius: 10px;
  background: rgb(255 255 255 / 6%);
  font-size: 13px;
}

.info .knob button[aria-pressed="true"] {

  border-color: #fff;

  background: rgb(255 255 255 / 18%);

}
.info .beats {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.info table {
  width: 100%;
  border-collapse: collapse;
  font: 12px/1.4 ui-monospace, consolas, monospace;
  font-variant-numeric: tabular-nums;
}

.info td,
.info th {
  padding: 3px 4px;
  border-bottom: 1px solid var(--line);
  text-align: right;
}
.info td:first-child,
.info th:first-child { text-align: left; }

.exited {
  position: absolute;
  z-index: 60;
  inset: 0;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 14px;
  background: #0d1015;
  text-align: center;
  font-size: 16px;
}

.exited .back {
  min-height: 44px;
  padding: 8px 18px;
  border: 0;
  border-radius: 22px;
  background: #fff;
  color: #1d232b;
  font-weight: 700;
}

@media (orientation: landscape) and (height <= 520px) {
  .radar {
    top: calc(60px + env(safe-area-inset-top));
    width: 112px;
    height: 112px;
  }
  .ask { bottom: calc(14px + env(safe-area-inset-bottom)); }
  .transport { bottom: calc(10px + env(safe-area-inset-bottom)); }
  .chip {
    bottom: calc(14px + env(safe-area-inset-bottom));
    max-width: 300px;
  }
  .try { top: 30%; }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>

<body>
<main class="dev" id="dev">
  <canvas id="gl" tabindex="0" aria-label="The square, standing in for the camera view"></canvas>
  <div class="feed" aria-hidden="true"></div>

  <!-- the HUD (everything with data-hud is measured) -->
  <button type="button" class="exit" id="exit" data-hud aria-label="Exit AR"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <canvas class="radar" id="radar" data-hud width="248" height="248" hidden></canvas>
  <div class="chip" id="chip" data-hud hidden><span class="face"></span><span class="title"></span><button type="button" class="leave" aria-label="Leave this story">&times;</button></div>
  <button type="button" class="transport" id="transport" data-hud hidden aria-label="Pause"></button>
  <button type="button" class="ask" id="ask" data-hud hidden aria-pressed="false" aria-label="Ask the guide what is left to see">
    <svg viewBox="0 0 32 32"><path d="M5 6.5A3.5 3.5 0 0 1 8.5 3h15A3.5 3.5 0 0 1 27 6.5v12a3.5 3.5 0 0 1-3.5 3.5H14l-6 6v-6h0.5A3.5 3.5 0 0 1 5 18.5z" fill="currentColor" opacity=".16"/><path d="M5 6.5A3.5 3.5 0 0 1 8.5 3h15A3.5 3.5 0 0 1 27 6.5v12a3.5 3.5 0 0 1-3.5 3.5H14l-6 6v-6h0.5A3.5 3.5 0 0 1 5 18.5z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M12.6 9.6a3.5 3.5 0 1 1 4.6 3.3c-.8.3-1.2.9-1.2 1.7v.6" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><circle cx="16" cy="18.4" r="1.6" fill="currentColor"/></svg>
  </button>

  <!-- demo chrome -->
  <div class="chrome" id="chrome">
    <button type="button" id="prev" aria-label="Previous beat">&#9664;</button>
    <button type="button" class="beat-name" id="beat-name" aria-label="Replay this beat">1/10 Outside</button>
    <button type="button" id="next" aria-label="Next beat">&#9654;</button>
    <button type="button" class="info-btn" id="info-btn" aria-label="About this page">i</button>
    <button type="button" id="measure-btn" aria-pressed="false" aria-label="Show the measuring numbers"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="2.5" y="8" width="19" height="8" rx="1.5"/><path d="M7 8v3M11 8v4M15 8v3M19 8v4"/></svg></button>
  </div>
  <div class="readout" id="readout" hidden></div>
  <p class="try" id="try">Drag sideways to look, up and down to walk (WASD on a keyboard). Tap people and things. Or press &#9654; for the next beat.</p>
  <aside class="info" id="info" hidden></aside>
  <div class="exited" id="exited" hidden><p>You left AR.</p><button type="button" class="back" id="back-in">Back into AR</button></div>
</main>

<script type="module">
import * as THREE from "three";

/* ---------------- tune here ---------------- */
const EYE = 1.6;
const PITCH = -0.05;
const LOOK_GAIN = 0.0048; // radians per CSS pixel
const DRAG_WALK = 0.035; // metres per CSS pixel of vertical drag
const TAP_PX = 10, TAP_MS = 420;
const WORDS_PER_S = 2.7; // how fast a guide's words appear in the bubble
const HOLD_FAR_M = 14; // a guide stops mid-sentence once you are this far away...
const RESUME_M = 10; // ...and goes on once you are back this close
const SEEN_LOOK_S = 1.5; // a sign or a picture is seen after this long in view, near enough to read
const ANSWER_LINGER_S = 2.5; // the radar stays this long after the guide's last word
const COL = { beam: "#fb923c", unseen: "#ffffff", seen: "#8b939c", ink: "#1d232b", paper: "#fffdf8", gold: "#ffc24a", play: "#7dd3fc" };
const KN = { beam: "round", voice: true, hints: 3, comes: true };

const STATIONS = {
  A: { id: "A", name: "The Well", c: [0, -2], rIn: 18, rOut: 20 },
  B: { id: "B", name: "The Old Gate", c: [24, -80], rIn: 16, rOut: 18 },

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const damp = (dt, tau) => 1 - Math.exp(-dt / tau);
const angDiff = (a, b) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) { d -= Math.PI * 2; } if (d < -Math.PI) { d += Math.PI * 2; } return d; };

const $ = (s) => document.querySelector(s);

/* ---------------- renderer, camera, the square ---------------- */
const canvas = $("#gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog("#dfe6ea", 80, 260);
const camera = new THREE.PerspectiveCamera(64, 1, 0.1, 600);
camera.rotation.order = "YXZ";

// a plain environment only: sky light, one sun, no shadows
scene.add(new THREE.HemisphereLight(0xffffff, 0xb9ae98, 1.8));
const sun = new THREE.DirectionalLight(0xfff2e0, 1.3); sun.position.set(30, 60, 20); scene.add(sun);

(function sky() {
  const g = new THREE.SphereGeometry(400, 24, 12);
  const c = new Float32Array(g.attributes.position.count * 3);
  const top = new THREE.Color("#86b6df"), mid = new THREE.Color("#dbe7ef"), low = new THREE.Color("#efe8da"), o = new THREE.Color();
  for (let i = 0; i < g.attributes.position.count; i++) {
    const h = g.attributes.position.getY(i) / 400;
    if (h >= 0) { o.lerpColors(mid, top, Math.min(1, h / 0.5)); } else { o.lerpColors(mid, low, Math.min(1, -h / 0.1)); }

(function ground() {
  const S = 512, cv = document.createElement("canvas"); cv.width = cv.height = S;
  const g = cv.getContext("2d"); let s = 11;
  const rnd = () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296;
  g.fillStyle = "#b9b09e"; g.fillRect(0, 0, S, S);

  m.position.z = -30; scene.add(m);

const mats = new Map();
const mat = (c) => { if (!mats.has(c)) { mats.set(c, new THREE.MeshLambertMaterial({ color: c })); } return mats.get(c); };

(function town() {
  const colors = ["#e7dcc8", "#d9e2e6", "#efd9c6", "#e6e2d2", "#dcc9b6", "#f0e8d8", "#e3d3c8", "#d6cbb8"];
  let i = 0;

    const c = colors[i++ % colors.length];

    box(w + 0.4, 0.5, d + 0.4, "#8a6d5a", x, h + 0.25, z, ry);

  };

  for (const [x, z, s] of [[-22, -24, 1], [18, 22, 1.2], [-26, 24, 1.1], [34, -30, 1], [-34, -8, 0.9], [8, -60, 1], [40, -62, 1.1]]) {

    const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(2.2 * s, 1), mat("#6f9e62")); crown.position.set(x, 4 * s, z); scene.add(crown);
  }
  // far skyline
  for (let k = 0; k < 14; k++) { const a = (k / 14) * Math.PI * 2; box(18, 10 + (k * 5) % 12, 14, "#b8c0c6", Math.cos(a) * 140, 6, -30 + Math.sin(a) * 140, a); }

  cyl(1.2, 1.3, 0.8, "#b9b2a4", 2, 0.4, -6.5, 20); cyl(1.0, 1.0, 0.05, "#3e5866", 2, 0.82, -6.5, 20);
  box(0.14, 2.2, 0.14, "#5a3d2c", 0.9, 1.1, -6.5); box(0.14, 2.2, 0.14, "#5a3d2c", 3.1, 1.1, -6.5); box(2.5, 0.14, 0.14, "#5a3d2c", 2, 2.2, -6.5);
  // the south steps, the baker's corner, the lamp post

function renderTable() {
  const t = $("#tbl"); if (!t) { return; }
  t.innerHTML = `<table><tr><th>beat</th><th>HUD %</th><th>el</th><th>overlap</th></tr>${BEATS.map((b, i) => { const r = rec[i + 1]; return `<tr><td>${i + 1} ${b}</td><td>${r ? r.hud.toFixed(1) : "-"}</td><td>${r ? r.el : "-"}</td><td>${r ? r.ov : "-"}</td></tr>`; }).join("")}</table>`;
}
$("#info-btn").addEventListener("click", () => { const el = $("#info"); el.hidden = !el.hidden; renderInfo(); });
setTimeout(() => $("#try").classList.add("gone"), 9000);

/* ---------------- size ---------------- */
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // a phone camera's long side sees about 64 degrees, whichever way the phone is held
  camera.fov = w < h ? 64 : THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(32)) * h / w));
  camera.updateProjectionMatrix(); viewH.value = h * renderer.getPixelRatio();
  for (const it of ITEMS) { if (it.bubble) { it.bubble.key = ""; } }
}
addEventListener("resize", resize); resize();

/* ---------------- build, and the automation hook (screenshots, numbers) ---------------- */
for (const it of ITEMS) { buildItem(it); }
Object.assign(demo, {
  jump(n, { stopAt = null, speed = 1 } = {}) { this.stopAt = stopAt; demoMult = speed; jump(n); },
  release() { this.held = false; this.stopAt = null; },
  idle() { return !this.running || this.held; },
  measure(on = true) { if (on !== measuring) { $("#measure-btn").click(); } },
  numbers() { return { beat, rec: JSON.parse(JSON.stringify(rec)), now: hudNow, maxFrame, station: W.station, seen: ITEMS.filter((it) => it.seen).map((it) => it.id), answer: W.answer ? { guide: W.answer.guide.id, named: W.answer.named } : null }; },
});
window.demo = demo;
const qBeat = +new URLSearchParams(location.search).get("beat");
jump(qBeat >= 1 && qBeat <= BEATS.length ? qBeat : 1);
requestAnimationFrame((t) => { last = t; frame(t); });
</script>
</body>
</html>
