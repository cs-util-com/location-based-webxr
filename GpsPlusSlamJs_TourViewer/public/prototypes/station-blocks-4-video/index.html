<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Block Views</title>
<link rel="icon" href="data:,">
<style>
:root{
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --plate: rgba(15,17,21,.82);
  --plate-strong: rgba(18,20,25,.94);
  --ink: #f5f2eb;
  --muted: #b8b2a6;
  --faint: #8c877d;
  --accent: #f1b45c;
  --accent-ink: #231a0e;
  --line: rgba(255,255,255,.12);
  --sky: #e8ebee;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#24262a;color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--sky);container-type:size;container-name:stage}
body.phone #stage{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:34px;box-shadow:0 0 0 9px #0d0e10,0 0 0 10px #3a3d42,0 24px 70px rgba(0,0,0,.55)}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.plate{background:var(--plate);-webkit-backdrop-filter:blur(12px) saturate(1.1);backdrop-filter:blur(12px) saturate(1.1);border:1px solid var(--line)}
svg{display:block}

/* top bar */
#topbar{position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;align-items:center;gap:6px;z-index:30;pointer-events:none}
#topbar>*{pointer-events:auto}
.seg{display:flex;gap:2px;padding:3px;border-radius:12px}
.seg button{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.01em;padding:7px 10px;border-radius:9px;line-height:1}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--ink)}
.spacer{flex:1;pointer-events:none!important}
.iconbtn{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line);background:var(--plate);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink)}
.iconbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
#ft{position:absolute;right:8px;top:calc(max(8px,env(safe-area-inset-top)) + 84px);z-index:30;font:600 9.5px/1.25 ui-monospace,SFMono-Regular,Consolas,monospace;color:#1c1e22;background:rgba(255,255,255,.62);padding:3px 6px;border-radius:6px;pointer-events:none;text-align:right}

/* visitor view picker */
#viewbar{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(8px,env(safe-area-inset-top)) + 44px);z-index:25;display:flex;gap:0;padding:3px;border-radius:12px;max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none}
#viewbar button{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:6px 7px;border-radius:9px;white-space:nowrap;line-height:1}
#viewbar button[aria-pressed="true"]{background:var(--ink);color:#16181c}
#viewbar button .own{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:4px;vertical-align:2px}

/* visitor hud */
#hud{position:absolute;left:0;right:0;bottom:0;z-index:20;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 16px calc(max(14px,env(safe-area-inset-bottom)) + 4px)}
#capStrip{max-width:min(560px,100%);padding:11px 16px 12px;border-radius:14px;font-size:19px;line-height:1.36;font-weight:600;text-align:center;letter-spacing:.005em;opacity:0;transform:translateY(6px);transition:opacity .35s ease,transform .35s ease;text-wrap:balance}
#capStrip.on{opacity:1;transform:none}
#hudRow{display:flex;gap:8px;align-items:center;pointer-events:auto}
.pill{display:flex;align-items:center;gap:7px;height:40px;padding:0 14px 0 11px;border-radius:20px;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--plate);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink)}
.pill.small{padding:0 11px}
.pill[aria-pressed="true"]{background:var(--ink);color:#15171b}
#walkBtn{position:absolute;left:14px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 4px);z-index:21;width:46px;height:46px;border-radius:23px;display:grid;place-items:center}
#nearChip,#guideChip{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 116px);transform:translateX(-50%);z-index:19;display:flex;align-items:center;gap:8px;padding:8px 13px 8px 9px;border-radius:18px;font-size:13.5px;font-weight:600;white-space:nowrap;transition:opacity .3s}
#nearChip .arrow{width:22px;height:22px;border-radius:11px;background:var(--ink);color:#15171b;display:grid;place-items:center}
#guideChip{top:auto;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 120px)}
#guideChip .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(241,180,92,.25)}
.hidden{display:none!important}

/* overlay player (porthole view) */
#ovl{position:absolute;inset:0;z-index:40;background:rgba(10,11,13,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:58px 16px 22px;gap:14px;opacity:0;pointer-events:none;transition:opacity .3s}
#ovl.on{opacity:1;pointer-events:auto}
#ovlFrame{position:relative;width:min(100%,calc((100cqh - 250px) * .8),560px);aspect-ratio:4/5;border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.5)}
#ovlCanvas{width:100%;height:100%;display:block}
#ovlCap{min-height:3.0em;max-width:min(560px,100%);font-size:21px;line-height:1.36;font-weight:600;text-align:center;text-wrap:balance;transition:opacity .3s}
#ovlCtrl{display:flex;align-items:center;gap:8px;width:min(560px,100%)}
#ovlCtrl .round{width:40px;height:40px}
#ovlCtrl .time{min-width:0;font-size:11.5px}
#ovlClose{position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 4px);right:12px}
.round{width:44px;height:44px;border-radius:22px;border:0;background:var(--ink);color:#15171b;display:grid;place-items:center;flex:none}
.round.ghost{background:rgba(255,255,255,.12);color:var(--ink);border:1px solid var(--line)}
input[type=range].scrub{flex:1;-webkit-appearance:none;appearance:none;height:28px;background:transparent;margin:0}
input[type=range].scrub::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--p,0%),rgba(255,255,255,.22) var(--p,0%))}
input[type=range].scrub::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:#fff;margin-top:-6px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.time{font:600 12.5px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);min-width:76px;text-align:center}

/* creator */
#creator{position:absolute;inset:0;z-index:20;pointer-events:none}
#creator>*{pointer-events:auto}
#reticle{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;pointer-events:none!important}
#crTop{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(8px,env(safe-area-inset-top)) + 46px);display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:16px;font-size:13px;font-weight:600;white-space:nowrap}
#crTop .tag{color:var(--accent)}
#crSheet{position:absolute;left:12px;right:12px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 92px);max-width:520px;margin:0 auto;border-radius:20px;padding:14px 14px 15px}
#crSheet h3{margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.07);border-radius:12px;padding:9px 12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:#15171b;border-color:transparent}
.crRow{display:flex;align-items:center;gap:10px;margin-top:8px}
.crRow .lbl{flex:1;font-size:14.5px;font-weight:600}
.crRow .val{font:600 15px/1 ui-monospace,SFMono-Regular,Consolas,monospace;min-width:64px;text-align:center}
.crHint{font-size:12.5px;color:var(--muted);margin-top:9px;line-height:1.4}
.bigbtn{border:0;border-radius:14px;background:rgba(255,255,255,.12);height:44px;padding:0 16px;font-size:14.5px;font-weight:700}
.bigbtn.primary{background:var(--accent);color:var(--accent-ink)}
#crBar{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#crBar button{height:72px;border-radius:20px;border:1px solid var(--line);background:var(--plate);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--ink)}
#crBar button[aria-pressed="true"]{background:var(--ink);color:#15171b}
@container stage (max-height: 460px) and (min-width: 600px){
  #crBar{left:12px;right:auto;top:56px;bottom:12px;width:84px;margin:0;grid-template-columns:1fr;grid-template-rows:repeat(4,1fr)}
  #crBar button{height:auto}
  #crSheet{left:auto;right:12px;top:56px;bottom:auto;width:300px;margin:0;max-height:calc(100% - 68px);overflow:auto;padding:12px}
  #crTop{left:auto;right:324px;transform:none}
  #stage[data-mode=creator] #ft{top:auto;bottom:10px;right:324px}
}
.switch{width:46px;height:28px;border-radius:14px;border:0;background:rgba(255,255,255,.2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:21px}

/* editor */
#editor{position:absolute;inset:0;z-index:20;pointer-events:none}
#editor>*{pointer-events:auto}
#edLeft{position:absolute;left:10px;top:54px;bottom:10px;width:236px;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;overflow:auto}
#edRight{position:absolute;right:10px;top:54px;bottom:10px;width:340px;border-radius:16px;padding:14px 14px 18px;overflow:auto;background:var(--plate-strong)}
.edH{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:2px 2px 4px}
.blk{display:flex;align-items:center;gap:9px;padding:8px;border-radius:11px;font-size:13px;font-weight:600;border:1px solid transparent}
.blk.sel{background:rgba(255,255,255,.1);border-color:var(--line)}
.blk.dim{opacity:.45}
.blk .ic{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none;overflow:hidden}
.blk .ic canvas{width:34px;height:34px;display:block}
.blk small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:1px}
#edHint{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;padding:8px 13px;border-radius:14px;font-size:12px;color:var(--muted);white-space:nowrap}
#edHint b{color:var(--ink);font-weight:600}
.insH{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.insH h2{margin:0;font-size:16px;font-weight:700}
.insH .tag{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.field{padding:10px 0 11px;border-top:1px solid var(--line)}
.field>label,.field .fl{display:flex;align-items:baseline;justify-content:space-between;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.field .use{font-size:11px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--faint);text-align:right;max-width:62%}
.field.unused{opacity:.42}
.field.unused .use{color:var(--accent)}
.vrow{display:flex;gap:8px;align-items:center}
.asset{display:flex;gap:10px;align-items:center}
.asset canvas{width:64px;height:80px;border-radius:8px;flex:none;background:#000}
.asset .meta{font-size:12px;line-height:1.45;color:var(--muted)}
.asset .meta b{color:var(--ink);font-weight:600}
.num{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:8px;padding:6px 7px;font:500 12.5px ui-monospace,SFMono-Regular,Consolas,monospace}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid4 span{display:block;font-size:10px;color:var(--faint);margin-bottom:2px;font-weight:600}
textarea.vtt{width:100%;height:118px;resize:vertical;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:9px;padding:8px;font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;color:#e9e4d8}
.status{font-size:11.5px;color:var(--muted);margin-top:5px}
.status.err{color:#ff9b85}
.segs{display:flex;gap:4px;flex-wrap:wrap}
.segs button{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:9px;padding:6px 9px;font-size:12px;font-weight:600}
.segs button[aria-pressed="true"]{background:var(--ink);color:#15171b;border-color:transparent}
.small-btn{border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:9px;padding:6px 10px;font-size:12px;font-weight:600}
input[type=range].plain{flex:1;accent-color:var(--accent)}
#edListToggle{display:none}
#stage[data-mode=editor] #ft{top:auto;bottom:14px;left:258px;right:auto}

@container stage (max-width: 760px){
  #edLeft{top:52px;left:8px;right:8px;bottom:auto;width:auto;flex-direction:row;padding:6px;border-radius:14px;overflow-x:auto;gap:4px}
  #edLeft .edH{display:none}
  #edLeft .blk{flex:none;padding:5px 8px 5px 5px}
  #edLeft .blk small{display:none}
  #edLeft .blk .ic{width:28px;height:28px}
  #edRight{left:8px;right:8px;width:auto;top:auto;bottom:8px;height:46%;border-radius:18px}
  #edHint{display:none}
  #stage[data-mode=editor] #ft{top:106px;bottom:auto;right:8px;left:auto}
}
@container stage (max-height: 460px) and (min-width: 600px){
  #edLeft{top:52px;left:8px;bottom:8px;right:auto;width:176px;flex-direction:column;overflow:auto}
  #edLeft .blk small{display:none}
  #edRight{top:52px;right:8px;bottom:8px;left:auto;width:300px;height:auto}
  #edHint{display:none}
  #stage[data-mode=editor] #ft{top:auto;bottom:10px;left:194px;right:auto}
}

/* side panels */
.panel{position:absolute;z-index:35;top:calc(max(8px,env(safe-area-inset-top)) + 46px);right:8px;width:min(400px,calc(100% - 16px));max-height:calc(100% - 70px);overflow:auto;border-radius:16px;padding:14px 16px 16px;background:var(--plate-strong);border:1px solid var(--line);font-size:13px;line-height:1.5}
.panel h2{margin:0 0 8px;font-size:15px}
.panel h3{margin:14px 0 4px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.panel ul{margin:4px 0;padding-left:18px}
.panel li{margin:3px 0}
.panel code{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;color:#f3dcb4}
.panel .fu{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;margin:0}
.panel .fu dt{font:600 12px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--ink)}
.panel .fu dd{margin:0;color:var(--muted)}
.panel .fu dd.no{color:var(--faint);font-style:italic}
.panel details{border-top:1px solid var(--line);padding:6px 0}
.panel summary{cursor:pointer;font-weight:700;color:var(--ink);padding:4px 0}
#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:45;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
</style>
<script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
  } }
</script>
</head>
<body>
<div id="stage">
  <canvas id="gl" tabindex="0" aria-label="3D view"></canvas>

  <div id="topbar">
    <div class="seg plate" id="modeSeg" role="group" aria-label="Mode">
      <button data-mode="visitor">Visitor</button>
      <button data-mode="creator">Creator</button>
      <button data-mode="editor">Editor</button>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnPhone" title="Phone frame" aria-pressed="false"><svg width="16" height="18" viewBox="0 0 16 18" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="1" width="10" height="16" rx="2.4"/><path d="M7 14.2h2"/></svg></button>
    <button class="iconbtn" id="btnFields" title="Fields this view uses" aria-pressed="false"><svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 4h11M3 8.5h11M3 13h7"/></svg></button>
    <button class="iconbtn" id="btnNotes" title="Designer notes" aria-pressed="false"><svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8.5" cy="8.5" r="6.5"/><path d="M8.5 7.6v4.2" stroke-linecap="round"/><circle cx="8.5" cy="5.1" r=".6" fill="currentColor"/></svg></button>
  </div>
  <div id="ft">-</div>

  <div id="viewbar" class="plate" role="group" aria-label="View"></div>

  <!-- visitor -->
  <div id="visitor">
    <div id="nearChip" class="plate hidden"><span class="arrow" id="nearArrow"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1 10.5 10 6 7.8 1.5 10z" fill="currentColor"/></svg></span><span id="nearText">Station</span></div>
    <div id="guideChip" class="plate hidden"><span class="dot"></span><span id="guideText"></span></div>
    <button id="walkBtn" class="iconbtn" title="Hold to walk"><svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><ellipse cx="7" cy="6" rx="2.6" ry="3.6"/><ellipse cx="13" cy="11.5" rx="2.6" ry="3.6"/><circle cx="7" cy="12.2" r="1.5"/><circle cx="13" cy="17.4" r="1.5"/></svg></button>
    <div id="hud">
      <div id="capStrip" class="plate"></div>
      <div id="hudRow">
        <button class="pill" id="hudSound" aria-pressed="false"></button>
        <button class="pill small" id="hudCC" aria-pressed="true" title="Captions">CC</button>
      </div>
    </div>
  </div>

  <!-- overlay player -->
  <div id="ovl" aria-hidden="true">
    <button class="round ghost" id="ovlClose" title="Close"><svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button>
    <div id="ovlFrame"><canvas id="ovlCanvas" width="512" height="640"></canvas></div>
    <div id="ovlCap"></div>
    <div id="ovlCtrl">
      <button class="round" id="ovlPlay" title="Play or pause"></button>
      <input type="range" class="scrub" id="ovlScrub" min="0" max="1000" value="0" aria-label="Scrub">
      <span class="time" id="ovlTime">0:00 / 0:12</span>
      <button class="round ghost" id="ovlCC" title="Captions" style="font-weight:700;font-size:12px">CC</button>
      <button class="round ghost" id="ovlSound" title="Sound"></button>
    </div>
  </div>

  <!-- creator -->
  <div id="creator" class="hidden">
    <svg id="reticle" viewBox="0 0 34 34" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="17" cy="17" r="10" stroke-opacity=".9"/><circle cx="17" cy="17" r="1.6" fill="#fff"/><circle cx="17" cy="17" r="11.5" stroke="#000" stroke-opacity=".25" stroke-width="1"/></svg>
    <div id="crTop" class="plate"><span class="tag">Video</span><span id="crTopText">Market day</span></div>
    <div id="crSheet" class="plate"></div>
    <div id="crBar">
      <button data-tab="view"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="16" height="12" rx="2.5"/><path d="M8 19h6"/></svg>View</button>
      <button data-tab="size"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 18 18 4M12 4h6v6M4 12v6h6"/></svg>Size, turn</button>
      <button data-tab="place"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="9" r="4.5"/><path d="M11 13.5V20M6 20h10" stroke-linecap="round"/></svg>Place</button>
      <button data-tab="more"><svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor"><circle cx="5" cy="11" r="1.8"/><circle cx="11" cy="11" r="1.8"/><circle cx="17" cy="11" r="1.8"/></svg>More</button>
    </div>
  </div>

  <!-- editor -->
  <div id="editor" class="hidden">
    <div id="edLeft" class="plate"></div>
    <div id="edRight"></div>

<script type="module">

   ====================================================================== */

const FAMILY = 'station-blocks-4-video';
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const ORIGINAL_VTT = `WEBVTT

00:00.400 --> 00:03.200
Rye bread! Still warm from the oven!

00:04.000 --> 00:06.900
Apples from the lower orchards, three for a penny.

00:07.600 --> 00:10.800
Come early, friends. The hall bell rings at noon.
`;

const record = {
  video: 'media/market-day-1880s.mp4',
  poster: 'media/market-day-1880s-poster.webp',
  captions: ORIGINAL_VTT,
  alpha: 'stacked',
  loop: true,
  widthM: 1.6,
  start: { trigger: 'enter', withinM: 6 },   // when playback begins: 'enter' | 'near' (within withinM metres) | 'look' | 'tap'
  sound: 'off',                              // the creator's default at the start: 'off' | 'on'
  pose: { position: [5, 2.0, -20.0], headingDeg: 180 },
  viewpoint: { position: [5, 1.6, -13.6], headingDeg: 0, pitchDeg: 3, hfovDeg: 40 },

let currentView = 'screen';
let posterAt = 1.6;

/* ---------- WebVTT parsing (defensive: malformed blocks are reported, not trusted) ---------- */
function parseTime(s) {
  const m = /^(?:(\d+):)?(\d{1,2}):(\d{2})[.,](\d{3})$/.exec(s.trim());
  if (!m) return NaN;
  return (+(m[1] || 0)) * 3600 + (+m[2]) * 60 + (+m[3]) + (+m[4]) / 1000;
}
function parseVTT(text) {
  const out = { cues: [], errors: [] };
  if (typeof text !== 'string') { out.errors.push('captions are not text'); return out; }
  const lines = text.replace(/\r/g, '').split('\n');
  if (!/^WEBVTT/.test(lines[0] || '')) out.errors.push('line 1: must start with WEBVTT');
  for (let i = 1; i < lines.length; i++) {
    const l = lines[i];
    if (!l.includes('-->')) continue;
    const [a, b] = l.split('-->');
    const start = parseTime(a), end = parseTime((b || '').trim().split(/\s+/)[0] || '');
    if (!(start >= 0) || !(end > start)) { out.errors.push(`line ${i + 1}: expected 00:00.000 --> 00:00.000`); continue; }
    const txt = [];
    while (i + 1 < lines.length && lines[i + 1].trim() !== '') txt.push(lines[++i].replace(/<[^>]*>/g, '').trim());
    if (txt.length) out.cues.push({ start, end, text: txt.join(' ') });
  }
  out.cues.sort((x, y) => x.start - y.start);

}
let cues = parseVTT(record.captions).cues;
// The clip's own performance (the "video" file) is fixed; edited captions do not change what she does.
const CLIP_CALLS = parseVTT(ORIGINAL_VTT).cues.map((c) => ({ ...c, words: c.text.split(/\s+/).length }));
function activeCue(t) { for (const c of cues) if (t >= c.start && t < c.end) return c; return null; }

/* ======================================================================
   The clip: a canvas-rendered stand-in for the video asset.

   ====================================================================== */

  const c = blockCentreWorld();
  startMotion(V.position[0], V.position[2], [c.x, c.y, c.z], 0.8);
  toast(`Viewpoint preview · field of view ${V.hfovDeg} degrees`);
}
function updateEditorThumbs(frameChanged) {
  if (mode !== 'editor') return;
  const pv = $('#edPrev'); if (pv && frameChanged) pv.getContext('2d').drawImage(clipCanvas, 0, 0, CW, CH, 0, 0, 128, 160);
  const sc = $('#edScrub'); if (sc && document.activeElement !== sc) sc.value = Math.round(player.t / DUR * 1000);
  const pb = $('#edPlay'); if (pb) pb.textContent = player.paused ? 'Play' : 'Pause';
  if (edThumbsDirty) {
    edThumbsDirty = false;
    const ps = $('#edPoster'); if (ps) ps.getContext('2d').drawImage(posterCanvas, 0, 0, 128, 160);
    edThumb.getContext('2d').drawImage(posterCanvas, 0, 60, 512, 512, 0, 0, 68, 68);
  }
}

/* ======================================================================
   Frame loop
   ====================================================================== */
const ft = [];
let last = performance.now(), ftNext = 0;
function onResize() {
  if (document.body.classList.contains('phone')) {
    const H = Math.min(window.innerHeight - 40, (window.innerWidth - 40) * 19.5 / 9), W = H * 9 / 19.5;
    stage.style.width = W + 'px'; stage.style.height = H + 'px';
  } else { stage.style.width = ''; stage.style.height = ''; }
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  if (mode === 'editor') camera.fov = 45;
  else if (camera.aspect < 1) camera.fov = 2 * Math.atan(Math.tan(21 * DEG) / camera.aspect) / DEG; // ~42 degrees across a portrait phone
  else camera.fov = 52;
  // editor: centre the 3D view in the part the panels leave free
  camera.clearViewOffset();
  if (mode === 'editor') {
    const narrow = w <= 760, short = h <= 460 && w >= 600;
    if (narrow && !short) camera.setViewOffset(w, h, 0, h * 0.21, w, h);
    else { const l = short ? 192 : 256, rr = short ? 316 : 360; camera.setViewOffset(w, h, w / 2 - (l + (w - rr)) / 2, 0, w, h); }
    orbit.dist = narrow && !short ? 15 : short ? 17 : 19;
  }
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
window.addEventListener('hashchange', () => { const h = readHash(); if (h.view && VIEW_DEFS[h.view] && h.view !== currentView) setView(h.view); if (h.mode && h.mode !== mode && ['visitor', 'creator', 'editor'].includes(h.mode)) setMode(h.mode); });

let crTopTimer = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); const interval = now - last; last = now;
  const w0 = performance.now();

  // movement
  if (mode === 'visitor' || mode === 'creator') {
    stepMotion(dt);
    if (autoWalk && !motion) autoWalk();
    let fw = 0, sd = 0;
    if (keys.has('w') || keys.has('arrowup') || walkHeld) fw += 1; if (keys.has('s') || keys.has('arrowdown')) fw -= 1;
    if (keys.has('d')) sd += 1; if (keys.has('a')) sd -= 1;
    if (keys.has('arrowleft')) vis.heading -= dt * 1.4; if (keys.has('arrowright')) vis.heading += dt * 1.4;
    if (fw || sd) { const sp = 2.2 * dt; vis.pos.x += (Math.sin(vis.heading) * fw + Math.cos(vis.heading) * sd) * sp; vis.pos.z += (-Math.cos(vis.heading) * fw + Math.sin(vis.heading) * sd) * sp; }
    setCameraFromVis();
  } else setCameraFromOrbit();

  // appearing on entering the circle
  const isIn = mode !== 'visitor' || inside();
  appear = lerp(appear, isIn ? 1 : 0, 1 - Math.exp(-dt * 3.2)); if (appear < 0.002) appear = 0;
  blockRoot.visible = appear > 0.005; if (view && view.extra) view.extra.visible = appear > 0.005;
  if (isIn && mode === 'visitor' && !player.started && currentView !== 'stand-here' && appear > 0.5 && startTriggered(dt)) { player.seek(0); player.play(); }

  const frameChanged = player.update(dt);
  let res = { stripCaption: false };
  if (view) res = view.update(dt, appear) || res;
  // the first time the clip runs for the visitor (any trigger, a tap, stand-here), decide its sound once
  if (mode === 'visitor' && player.started && !player.paused && !player.soundDecided) { player.soundDecided = true; decideStartSound(); }
  if (mode === 'visitor' && !player.started && currentView !== 'stand-here' && !res.guide) {
    const st = record.start;
    if (st.trigger === 'tap') res.guide = 'Tap the video to play';
    else if (st.trigger === 'near') { const c = blockCentreWorld(), d = Math.hypot(camera.position.x - c.x, camera.position.z - c.z); res.guide = `Walk closer to start · ${Math.max(1, Math.round(d - st.withinM))} m`; }
  }
  sound.tick();

  // visitor HUD
  if (mode === 'visitor') {
    const cue = player.cc && appear > 0.5 ? activeCue(player.t) : null;
    const showStrip = !!cue && res.stripCaption && (res.captionGate !== false) && !overlayOpen;
    const cs = $('#capStrip');
    if (showStrip && cs.textContent !== cue.text) cs.textContent = cue.text;
    cs.classList.toggle('on', showStrip);
    $('#hudRow').classList.toggle('hidden', appear < 0.5 || overlayOpen);
    const g = $('#guideChip'); g.classList.toggle('hidden', !res.guide || appear < 0.5); if (res.guide) $('#guideText').textContent = res.guide;
    const nc = $('#nearChip'), out = !inside();
    nc.classList.toggle('hidden', !out);
    if (out) {
      const d1 = Math.hypot(vis.pos.x, vis.pos.z) - 25, d2 = Math.hypot(vis.pos.x - 60, vis.pos.z) - 25;
      const [tx, tz, d] = d1 <= d2 ? [0, 0, d1] : [60, 0, d2];
      const bearing = Math.atan2(tx - vis.pos.x, -(tz - vis.pos.z)) - vis.heading;
      $('#nearArrow').style.transform = `rotate(${bearing}rad)`;
      $('#nearText').textContent = `${d1 <= d2 ? 'Old market square' : 'East path'} · ${Math.max(1, Math.round(d))} m`;
    }
  }
  if (overlayOpen) {
    if (frameChanged) drawOverlayFrame();
    const cue = player.cc ? activeCue(player.t) : null, oc = $('#ovlCap');
    const txt = cue ? cue.text : ''; if (oc.textContent !== txt) oc.textContent = txt;
    const sc = $('#ovlScrub'); if (document.activeElement !== sc) { sc.value = Math.round(player.t / DUR * 1000); }
    sc.style.setProperty('--p', (player.t / DUR * 100).toFixed(1) + '%');
    $('#ovlTime').textContent = `${fmt(player.t)} / ${fmt(DUR)}`;
    const want = player.paused ? 'p' : 'q'; if ($('#ovlPlay').dataset.s !== want) { $('#ovlPlay').dataset.s = want; $('#ovlPlay').innerHTML = player.paused ? svgI.play : svgI.pause; }
  }
  if (mode === 'creator' && now > crTopTimer) { crTopTimer = now + 400; $('#crTopText').textContent = `${VIEW_DEFS[currentView].label} · ${record.widthM.toFixed(2)} m · ${Math.round(camera.position.distanceTo(blockCentreWorld()))} m away`; }
  updateEditorThumbs(frameChanged);

  renderer.clear();
  renderer.render(world, camera);
  renderer.clearDepth();          // AR: content draws over the camera image
  renderer.render(content, camera);

  const work = performance.now() - w0;
  ft.push({ t: now, i: interval, w: work });
  while (ft.length && ft[0].t < now - 2000) ft.shift();
  if (now > ftNext && ft.length > 2) {
    ftNext = now + 250;
    const iv = ft.slice(1).map((f) => f.i), wk = ft.map((f) => f.w);
    const mean = iv.reduce((a, b) => a + b, 0) / iv.length, max = Math.max(...iv);
    const wm = wk.reduce((a, b) => a + b, 0) / wk.length, wx = Math.max(...wk);
    $('#ft').textContent = `frame ${mean.toFixed(1)} / ${max.toFixed(1)} ms\nwork ${wm.toFixed(1)} / ${wx.toFixed(1)} ms`;
    $('#ft').style.whiteSpace = 'pre';
    window.__ft = { meanMs: mean, maxMs: max, workMeanMs: wm, workMaxMs: wx, frames: iv.length };
  }
}

/* ======================================================================
   Start, and the script hook
   ====================================================================== */
renderPoster(posterAt);
renderClipFrame(0);
buildViewbar();
{
  const h = readHash();
  if (h.view && VIEW_DEFS[h.view]) currentView = h.view;
  rebuildView();
  setMode(h.mode && ['visitor', 'creator', 'editor'].includes(h.mode) ? h.mode : 'visitor');
  document.querySelectorAll('#viewbar button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === currentView)));
}
refreshButtons();
setCameraFromVis();
// automatic walk in from the south path: up the path, into the circle, to the view's spot
if (mode === 'visitor') {
  let stage1 = false;
  autoWalk = () => {
    if (!stage1) { stage1 = true; const s = viewStop(); startMotion(0, 20, s.look, 2.4); return; }
    autoWalk = null; glideToView();
  };
}
onResize();
requestAnimationFrame((t) => { last = t; frame(t); });

const drawn = () => new Promise((res) => requestAnimationFrame(() => requestAnimationFrame(() => res())));
function exportRecord() {
  return {
    type: 'video', id: 'blk-video-market-day', view: currentView,
    video: record.video, poster: record.poster, captions: record.captions, alpha: record.alpha, loop: record.loop, widthM: record.widthM,
    start: { trigger: record.start.trigger, withinM: record.start.withinM }, sound: record.sound,
    pose: { position: [...record.pose.position], headingDeg: record.pose.headingDeg },
    viewpoint: record.viewpoint ? { position: [...record.viewpoint.position], headingDeg: record.viewpoint.headingDeg, pitchDeg: record.viewpoint.pitchDeg, hfovDeg: record.viewpoint.hfovDeg } : null,
  };
}
window.__stationBlock = {
  family: FAMILY,
  views: VIEW_ORDER.slice(),
  modes: ['visitor', 'creator', 'editor'],
  async setMode(name) { setMode(name); await drawn(); },
  async setView(name) {
    setView(name);
    if (mode === 'visitor' && inside()) { autoWalk = null; await new Promise((r) => glideToView(r)); }
    await drawn();
  },
  async walkTo(x, z) {
    if (!Number.isFinite(x) || !Number.isFinite(z)) throw new Error('walkTo needs two finite numbers');
    if (mode !== 'visitor') setMode('visitor');
    autoWalk = null;
    const d = Math.hypot(x - vis.pos.x, z - vis.pos.z);
    await new Promise((r) => startMotion(x, z, null, clamp(d / 8, 0.05, 1.5), r));
    await drawn();
  },
  async lookAt(x, y, z) {
    if (![x, y, z].every(Number.isFinite)) throw new Error('lookAt needs three finite numbers');
    autoWalk = null; motion = null;
    const hp = lookHeadingPitch(vis.pos, x, y, z); vis.heading = hp.heading; vis.pitch = hp.pitch;
    await drawn();
  },
  async describe() {
    return {
      family: FAMILY, fields: FIELDS.slice(),
      views: VIEW_ORDER.map((v) => ({ name: v, required: VIEW_DEFS[v].required, usesFields: FIELDS.filter((f) => VIEW_DEFS[v].uses[f]) })),
    };
  },
  async exportModel() { return JSON.parse(JSON.stringify(exportRecord())); },
  /* Round-2 hooks: the sound and start state, the creator's start trigger and sound default, and starting the
     clip over (as switching back to the visitor does). */
  extras: {
    soundState() { return { on: sound.on, muted: player.muted, cc: player.cc, started: player.started, paused: player.paused, decided: player.soundDecided, reason: soundReason, pref: readSoundPref(), activation: hasActivation(), start: { ...record.start }, soundDefault: record.sound, guide: $('#guideChip').classList.contains('hidden') ? null : $('#guideText').textContent, hudSound: $('#hudSound').textContent }; },
    async setStart(trigger, withinM) { setStart(trigger, withinM); if (mode === 'creator') renderCreatorSheet(); if (mode === 'editor') renderEditor(); await drawn(); },
    async setSoundDefault(v) { record.sound = v === 'on' ? 'on' : 'off'; await drawn(); },
    async resetPlayback() { player.reset(); lookDwell = 0; soundReason = null; sound.setOn(false); refreshButtons(); await drawn(); },
    async clearSoundPref() { writeSoundPref(null); },
    async openCreatorMore() { crTab = 'more'; renderCreatorSheet(); await drawn(); },
  },
};
</script>
