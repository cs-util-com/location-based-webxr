          else if (e.key === "ArrowRight") pan(-step, 0);
          else if (e.key === "ArrowUp") pan(0, step);
          else if (e.key === "ArrowDown") pan(0, -step);
          else if (e.key === "+" || e.key === "=")
            cam.alt = clamp(cam.alt * 0.8, 80, 2.5e7);
          else if (e.key === "-") cam.alt = clamp(cam.alt * 1.25, 80, 2.5e7);
        });

        // ---------------------------------------------------------------- rail and inspector (live during the flight)
        const stList = $("#stList"),
          insp = $("#insp");
        function renderRail() {
          stList.innerHTML = "";
          stations.forEach((s, i) => {
            const li = document.createElement("li");
            const b = document.createElement("button");
            b.className = "node" + (sel === i ? " sel" : "");
            b.title = s.name;
            b.innerHTML =
              '<span class="num">' +
              (i + 1) +
              '</span><span class="nm"></span>';
            b.querySelector(".nm").textContent = s.name;
            b.addEventListener("click", () => setSel(i, true));
            li.appendChild(b);
            if (sel === i) {
              const ul = document.createElement("ul");
              ul.className = "items";
              for (const it of s.items) {
                const l = document.createElement("li");
                l.textContent = it;
                ul.appendChild(l);
              }
              li.appendChild(ul);
            }
            stList.appendChild(li);
          });
          $("#tourNode").classList.toggle("sel", sel == null);
        }
        function esc(s) {
          return String(s).replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
          );
        }
        function renderInsp() {
          const note =
            '<div class="insp-note" id="inspNote"><span>&#9998;</span><span>The map is still loading. Your edits are safe.</span></div>';
          if (sel == null) {
            insp.innerHTML =
              note +
              '<h3>Whole tour</h3><div class="sub">' +
              stations.length +
              " stations</div>" +
              '<label for="fName">Tour name</label><input type="text" id="fName" value="' +
              esc(tour.name) +
              '">' +
              '<label for="fText">Description</label><textarea id="fText">' +
              esc(tour.desc) +
              "</textarea>" +
              "<label>Starts at</label><div>1 - " +
              esc(stations[0].name) +
              "</div>";
            $("#fName").addEventListener("input", (e) => {
              tour.name = e.target.value;
              $("#tourTitle").textContent = tour.name;
              dirty();
            });
            $("#fText").addEventListener("input", (e) => {
              tour.desc = e.target.value;
              dirty();
            });
          } else {
            const s = stations[sel];
            insp.innerHTML =
              note +
              "<h3>Station " +
              (sel + 1) +
              '</h3><div class="sub">Click another station to fly there</div>' +
              '<label for="fName">Name</label><input type="text" id="fName" value="' +
              esc(s.name) +
              '">' +
              '<label for="fText">Text</label><textarea id="fText">' +
              esc(s.text) +
              "</textarea>" +
              '<label for="fRad">Reach (<span id="radV">' +
              s.radius +
              '</span> m)</label><input type="range" id="fRad" min="5" max="60" value="' +
              s.radius +
              '">' +
              '<label>On this station</label><div class="chiplist">' +
              s.items
                .map((it) => '<span class="ichip">' + esc(it) + "</span>")
                .join("") +
              '<span class="ichip">+ Add</span></div>';
            $("#fName").addEventListener("input", (e) => {
              s.name = e.target.value;
              renderRailKeepFocus();
              dirty();
            });
            $("#fText").addEventListener("input", (e) => {
              s.text = e.target.value;
              dirty();
            });
            $("#fRad").addEventListener("input", (e) => {
              s.radius = Number(e.target.value);
              $("#radV").textContent = s.radius;
              dirty();
            });
          }
        }
        function renderRailKeepFocus() {
          renderRail();
        }
        function setSel(i, fly) {
          sel = i;
          renderRail();
          renderInsp();
          if (fly) redirect(i);
        }
        $("#tourNode").addEventListener("click", () => setSel(null, true));

        // ---------------------------------------------------------------- top bar
        const saveBtn = $("#saveBtn");
        function dirty() {
          saveBtn.disabled = false;
          saveBtn.textContent = "Save";
        }
        function save() {
          if (saveBtn.disabled) return;
          saveBtn.disabled = true;
          saveBtn.textContent = "Saving…";
          setTimeout(() => {
            saveBtn.textContent = "Saved ✓";
            setTimeout(() => {
              if (saveBtn.disabled) saveBtn.textContent = "Saved";
            }, 1500);
          }, 700);
        }
        saveBtn.addEventListener("click", save);
        const viewMenu = $("#viewMenu");
        function closeMenu() {
          viewMenu.hidden = true;
          $("#viewBtn").setAttribute("aria-expanded", "false");
        }
        $("#viewBtn").addEventListener("click", (e) => {
          e.stopPropagation();
          viewMenu.hidden = !viewMenu.hidden;
          $("#viewBtn").setAttribute("aria-expanded", String(!viewMenu.hidden));
        });
        document.addEventListener("click", (e) => {
          if (!e.target.closest(".menuwrap")) closeMenu();
        });
        $("#optSketch").addEventListener("change", (e) => {
          showSketch = e.target.checked;
        });
        $("#menuReplay").addEventListener("click", () => {
          closeMenu();
          F.target = null;
          setSel(null, false);
          flyTo(0, false);
        });
        $("#menuTour").addEventListener("click", () => {
          closeMenu();
          setSel(null, true);
        });
        $("#inspToggle").addEventListener("click", () =>
          insp.classList.toggle("open"),
        );

        // ---------------------------------------------------------------- debug strip
        document.querySelectorAll("[data-prof]").forEach((b) =>
          b.addEventListener("click", () => {
            profile = b.dataset.prof;
            document
              .querySelectorAll("[data-prof]")
              .forEach((x) => x.classList.toggle("on", x === b));
            if ($("#optFly").checked) openTour();
            else restoreDraft();
          }),
        );
        $("#dbgOpen").addEventListener("click", openTour);
        $("#dbgDraft").addEventListener("click", restoreDraft);
        const ro = $("#dbgRo");

        // hidden URL flags for screenshots: #net=slow&t=6 (fast-forward the clock by t seconds)
        const flags = new URLSearchParams(location.hash.slice(1));
        if (flags.get("net") && PROFILES[flags.get("net")]) {
          profile = flags.get("net");
          document
            .querySelectorAll("[data-prof]")
            .forEach((x) =>
              x.classList.toggle("on", x.dataset.prof === profile),
            );
        }

        // ---------------------------------------------------------------- loop
        openTour();
        if (flags.get("draft")) restoreDraft();
        const ff = Number(flags.get("t") || 0);
        let simT = 0;
        for (let k = 0; k < ff * 30; k++) {
          simT += 1 / 30;
          updateSources(1 / 30);
          stepFlight(1 / 30);
        }
        if (flags.get("sel")) setSel(Number(flags.get("sel")) - 1, true);
        if (flags.get("user")) interrupt("quiet");
        let last = performance.now();
        function frame(now) {
          const dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          simT += dt;
          updateSources(dt);
          stepFlight(dt);
          render(simT);
          updateStrip(simT);
          updateChips();
          ro.textContent =
            F.mode +
            " | " +
            (cam.alt >= 1000
              ? (cam.alt / 1000).toFixed(cam.alt > 1e5 ? 0 : 1) + " km"
              : Math.round(cam.alt) + " m") +
            " | t=" +
            loadT.toFixed(1) +
            "s";
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
