<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pictures - a station block</title>
<script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
  } }
</script>
<style>
:root{--ink:#f4ede1;--muted:#bcb09c;--dim:#8e8473;--amber:#e9b872;--blue:#9ccbff;--plate:rgba(20,17,14,.80);--plate-strong:rgba(20,17,14,.93);--line:rgba(244,237,225,.12);
--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--mono:ui-monospace,"Cascadia Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#24211d;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body.phone{background:radial-gradient(circle at 50% 40%,#3a352f,#141210)}
#stage{position:absolute;inset:0;overflow:hidden;background:#dde3e8;user-select:none;-webkit-user-select:none}
body.phone #stage{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:38px;box-shadow:0 0 0 9px #0c0b0a,0 0 0 10px #4a443d,0 40px 90px rgba(0,0,0,.55)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.grabbing{cursor:grabbing}
.hidden{display:none!important}
button{font:inherit;color:inherit}
.bar{position:absolute;left:0;right:0;top:0;z-index:30;padding:10px 12px 0;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.row{display:flex;align-items:center;gap:8px;pointer-events:none}
.row>*{pointer-events:auto}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--plate);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 18px rgba(0,0,0,.16)}
.seg button{border:0;background:none;cursor:pointer;font-size:12.5px;font-weight:600;letter-spacing:.01em;padding:7px 10px;border-radius:999px;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#1d1913}
.views button[aria-pressed="true"]{background:var(--amber);color:#1d1508}
.views{max-width:100%;overflow-x:auto;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.icons{margin-left:auto;display:flex;gap:4px}
.ib{border:0;cursor:pointer;width:32px;height:32px;border-radius:50%;background:var(--plate);backdrop-filter:blur(10px);display:grid;place-items:center;color:var(--ink);font-size:10px;font-weight:700;letter-spacing:-.02em;padding:0}
.ib svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-pressed="true"]{background:var(--ink);color:#1d1913}
.pill{position:absolute;left:50%;transform:translateX(-50%);z-index:25;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border-radius:999px;background:var(--plate-strong);font-size:15px;font-weight:550;box-shadow:0 8px 24px rgba(0,0,0,.22);white-space:nowrap;pointer-events:none}
#hint{top:98px}
#hint svg{width:22px;height:22px;flex:none;fill:var(--amber)}
#hint .d{color:var(--amber);font-variant-numeric:tabular-nums}
#cap{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:25;width:min(calc(100% - 24px),560px);display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:18px;background:var(--plate-strong);cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:rise .45s cubic-bezier(.2,.8,.2,1)}
#cap .y{font:600 30px/1 var(--serif);color:var(--amber)}
#cap .t{font:16px/1.3 var(--serif);color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#cap .m{font-size:12px;color:var(--muted);margin-top:4px}
#cap .chev{margin-left:auto;color:var(--muted);font-size:20px}
@keyframes rise{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
#swipe{position:absolute;inset:0;z-index:20;pointer-events:none}
#swipe .ln{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:rgba(244,237,225,.92);box-shadow:0 0 10px rgba(0,0,0,.3)}
#swipe .kn{position:absolute;top:50%;left:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--plate-strong);border:2px solid var(--ink);pointer-events:auto;cursor:ew-resize;display:grid;place-items:center;touch-action:none}
#swipe .kn svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#swipe .lab{position:absolute;top:150px;font:600 13px/1 var(--sans);padding:7px 11px;border-radius:999px;background:var(--plate-strong);white-space:nowrap}
#swipe .lab.l{right:12px;color:var(--amber);font-family:var(--serif);font-size:15px}
#swipe .lab.r{left:12px}
#tnCtl{position:absolute;left:50%;transform:translateX(-50%);bottom:112px;z-index:26;display:flex;gap:10px;align-items:center}
#tnCtl input{width:150px;accent-color:var(--amber)}
#tnCtl .fadebox{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--plate-strong);font-size:12px;color:var(--muted)}
#sheet{position:absolute;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
#sheet .scrim{position:absolute;inset:0;background:rgba(10,8,6,.55)}
#sheet .card{position:relative;width:min(100%,640px);max-height:92%;overflow:auto;background:#17140f;border-radius:22px 22px 0 0;padding:58px 16px 22px;box-shadow:0 -10px 40px rgba(0,0,0,.4);animation:up .34s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.wide #sheet{align-items:center}
.wide #sheet .card{border-radius:20px;display:grid;grid-template-columns:1.5fr 1fr;gap:22px;width:min(94%,1040px);padding:56px 18px 18px;align-items:center}
#sheet canvas{width:100%;display:block;border-radius:4px;box-shadow:0 10px 28px rgba(0,0,0,.45)}
#sheet .yr{font:600 42px/1 var(--serif);color:var(--amber);margin:16px 0 10px}
#sheet .capt{font:18px/1.5 var(--serif);margin:0 0 14px;color:var(--ink)}
#sheet .cred{font-size:13px;color:var(--muted);margin:0;line-height:1.4}
#sheet .close{position:absolute;top:12px;right:12px;border:0;border-radius:999px;background:rgba(20,17,14,.85);padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;z-index:2}
#sheet .src{font-size:11.5px;color:var(--dim);margin-top:14px}
/* the cut-out's sheet: the text only, the picture is already standing in front of the visitor */
#sheet .card.textonly canvas,#sheet .card.textonly .src{display:none}
.wide #sheet .card.textonly{grid-template-columns:1fr;width:min(94%,620px)}
#sheet .card.textonly .yr{margin-top:0}
#notes table.sw{border-collapse:collapse;width:100%;font-size:12px;margin:8px 0}
#notes table.sw th,#notes table.sw td{text-align:right;padding:4px 6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;color:#e6ddcd}
#notes table.sw th{color:var(--muted);font-weight:600}
#notes table.sw th:first-child,#notes table.sw td:first-child{text-align:left}
#notes table.sw tr.def td{color:var(--amber);font-weight:600}
#notes table.sw button{border:1px solid rgba(244,237,225,.25);background:none;border-radius:999px;padding:2px 9px;font-size:11px;cursor:pointer}
#joy{position:absolute;left:16px;bottom:20px;width:92px;height:92px;border-radius:50%;background:rgba(20,17,14,.45);border:1px solid rgba(255,255,255,.18);z-index:24;touch-action:none}
#joy .k{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px;border-radius:50%;background:rgba(244,237,225,.85)}
#cbar{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:30;display:flex;gap:4px;padding:7px;border-radius:24px;background:var(--plate-strong);width:min(calc(100% - 20px),620px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
#cbar button{flex:1;border:0;background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px 8px;border-radius:17px;font-size:11.5px;font-weight:600;cursor:pointer;min-width:0}
#cbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#cbar button[aria-pressed="true"]{background:rgba(233,184,114,.18);color:var(--amber)}
#cbar button.off{opacity:.32}
#csheet{position:absolute;left:50%;transform:translateX(-50%);bottom:102px;z-index:31;width:min(calc(100% - 20px),620px);background:var(--plate-strong);border-radius:20px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#csheet h5{margin:0 0 10px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
#csheet .val{font:600 22px/1 var(--sans);font-variant-numeric:tabular-nums}
#csheet .rowc{display:flex;align-items:center;gap:12px}
#csheet input[type=range]{flex:1;accent-color:var(--amber);height:28px}
#csheet .vl button{display:flex;width:100%;text-align:left;gap:12px;align-items:center;border:0;background:none;padding:10px 6px;border-radius:12px;cursor:pointer;border-top:1px solid var(--line)}
#csheet .vl button:first-child{border-top:0}
#csheet .vl b{font-size:14.5px;min-width:96px}
#csheet .vl span{font-size:12.5px;color:var(--muted)}
#csheet .vl button[aria-pressed="true"]{background:rgba(233,184,114,.14)}
#csheet .vl button[aria-pressed="true"] b{color:var(--amber)}
#csheet .big{display:block;width:100%;margin-top:12px;border:0;border-radius:14px;padding:14px;background:var(--amber);color:#1d1508;font-weight:700;font-size:15px;cursor:pointer}
#csheet .note{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.4}
#reticle{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border:2px solid rgba(255,255,255,.95);border-radius:50%;z-index:10;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
#reticle::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#fff}
#eList{position:absolute;left:12px;top:94px;bottom:12px;width:226px;z-index:28;background:var(--plate-strong);border-radius:16px;padding:14px 10px;overflow:auto;font-size:13px}
#eList .eh{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 6px 10px}
#eList .st{font:600 16px/1.2 var(--serif);padding:0 6px 12px;color:var(--ink)}
#eList .it{display:flex;gap:10px;align-items:center;padding:9px 8px;border-radius:12px;margin:2px 0}
#eList .it.sel{background:rgba(233,184,114,.15)}
#eList .it.sel b{color:var(--amber)}
#eList .it.dim{opacity:.45}
#eList .it canvas{width:42px;height:28px;border-radius:3px;flex:none}
#eList .it .ph{width:42px;height:28px;border-radius:3px;flex:none;background:#2c2721;display:grid;place-items:center;font-size:11px;color:var(--muted)}
#eList .it b{display:block;font-size:13px;font-weight:600}
#eList .it small{color:var(--muted);font-size:11.5px}
#eList .add{margin:10px 8px 0;padding:9px;border:1px dashed rgba(244,237,225,.2);border-radius:12px;text-align:center;color:var(--muted);font-size:12.5px}
#eInsp{position:absolute;right:12px;top:94px;bottom:12px;width:336px;z-index:28;background:var(--plate-strong);border-radius:16px;overflow:auto;font-size:13px}
.narrow #eList{display:none}
.narrow #eInsp{left:8px;right:8px;top:auto;bottom:8px;width:auto;height:44%;border-radius:18px}
#eInsp .hd{padding:14px 16px 12px;position:sticky;top:0;background:#1a1612;z-index:2;border-bottom:1px solid var(--line)}
#eInsp .hd b{font:600 17px/1.2 var(--serif)}
#eInsp .hd small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px;font-family:var(--mono)}
.sec{padding:13px 16px;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0}
.sec h4{margin:0 0 9px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.sec h4 .u{letter-spacing:0;text-transform:none;font-weight:500;color:var(--dim);font-size:11.5px}
.sec h4 .u.on{color:var(--amber)}
.sec.unused>*:not(h4){opacity:.4}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.vgrid button{border:1px solid rgba(244,237,225,.14);background:#120f0c;border-radius:10px;padding:7px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--muted)}
.vgrid button svg{width:30px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}
.vgrid button[aria-pressed="true"]{border-color:var(--amber);color:var(--amber);background:rgba(233,184,114,.1)}
.imgrow{display:flex;gap:12px;align-items:center}
.imgrow canvas{width:96px;height:64px;border-radius:4px;flex:none;background:repeating-conic-gradient(#2b2621 0 25%,#1d1915 0 50%) 0 0/12px 12px}
.imgrow .mt{font-size:12px;color:var(--muted);line-height:1.5}
.imgrow .mt b{color:var(--ink);font-family:var(--mono);font-weight:500;font-size:11.5px}
label.f{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:8px;margin:7px 0;font-size:12px;color:var(--muted)}
label.f.top{align-items:start}
input,textarea{background:#0f0d0a;border:1px solid rgba(244,237,225,.16);color:var(--ink);border-radius:8px;padding:7px 9px;font:13px var(--sans);width:100%;min-width:0}
input:focus,textarea:focus{outline:none;border-color:var(--amber)}
textarea{font:14px/1.38 var(--serif);min-height:70px;resize:vertical}
.cnt{font-size:11px;color:var(--dim);text-align:right;margin-top:-3px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.g3 input{font-family:var(--mono);font-size:12px;padding:6px 7px}
.rng{display:flex;gap:8px;align-items:center}
.rng input[type=range]{flex:1;accent-color:var(--amber);padding:0;border:0;background:none}
.rng input[type=number]{width:68px;font-family:var(--mono);font-size:12px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.btn{border:1px solid rgba(244,237,225,.2);background:none;border-radius:999px;padding:7px 12px;font-size:12px;cursor:pointer;color:var(--ink)}
.btn.blue{border-color:rgba(156,203,255,.5);color:var(--blue)}
.tog{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink);cursor:pointer}
.tog input{width:auto;accent-color:var(--blue)}
.lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:4px}
.lgd i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
#eTip{position:absolute;top:100px;left:calc(50% - 55px);transform:translateX(-50%);z-index:27;padding:8px 14px;border-radius:999px;background:var(--plate);font-size:12px;color:var(--muted);white-space:nowrap;pointer-events:none}
.narrow #eTip{display:none}
.panel{position:absolute;z-index:50;right:12px;top:94px;width:min(390px,calc(100% - 24px));max-height:calc(100% - 108px);overflow:auto;background:var(--plate-strong);border-radius:16px;padding:14px 16px;font-size:13px;line-height:1.45;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.panel h3{margin:0 0 4px;font:600 17px/1.25 var(--serif)}
.panel .sub{color:var(--muted);font-size:12px;margin-bottom:10px}
.panel .fr{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.panel .fr b{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--amber)}
.panel .fr.no b{color:var(--dim)}
.panel .fr.no span{color:var(--dim)}
#notes{width:min(760px,calc(100% - 24px));font-size:13.5px}
#notes h4{font:600 15px/1.3 var(--serif);margin:16px 0 6px;color:var(--amber)}
#notes p,#notes li{color:#e6ddcd}
#notes ul{padding-left:18px;margin:6px 0}
#notes details{border-top:1px solid var(--line);padding:6px 0}
#notes summary{cursor:pointer;font:600 15px/1.4 var(--serif);color:var(--ink);padding:4px 0}
#toast{position:absolute;left:50%;bottom:122px;transform:translate(-50%,10px);opacity:0;transition:opacity .25s,transform .25s;z-index:70;background:var(--ink);color:#1d1913;font-weight:600;font-size:14px;padding:10px 16px;border-radius:999px;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#ft{position:absolute;right:8px;bottom:6px;z-index:40;font:10.5px/1.3 var(--mono);color:rgba(244,237,225,.9);background:rgba(20,17,14,.6);padding:3px 7px;border-radius:6px;pointer-events:none;text-align:right;white-space:nowrap}
.m-creator #ft{bottom:auto;top:94px}
.m-creator #hint{top:130px}
.m-editor #ft{right:360px}
.narrow.m-editor #ft{right:12px;bottom:calc(44% + 16px)}
.m-visitor.withcap #ft{bottom:auto;top:94px}
/* short landscape screens: one top row, captions and controls side by side */
.short .bar{flex-direction:row;align-items:center}
.short .bar .row{display:contents}
.short #views{flex:1 1 auto;min-width:0}
.short .icons{order:3;margin-left:0}
.short #hint{top:56px}
.short #ft,.short.m-creator #ft{top:auto;bottom:6px}
.short.m-visitor.withcap #ft{bottom:auto;top:56px}
.short #cap{left:12px;bottom:10px;transform:none;width:min(58%,560px);animation:none}
.short #tnCtl{left:auto;right:12px;bottom:14px;transform:none}
.short #swipe .lab{top:62px}
.short #cbar{bottom:8px;padding:5px}
.short #cbar button{padding:6px 2px 5px;gap:3px}
.short #cbar button svg{width:20px;height:20px}
.short.m-creator #ft{top:56px;bottom:auto}
.short.m-creator #hint{top:56px}
.short #csheet{bottom:78px;max-height:calc(100% - 140px);overflow:auto}
.short #eList,.short #eInsp,.short .panel{top:56px}
.short #eTip{display:none}
</style>
</head>
<body>
<div id="stage" class="m-visitor">
  <canvas id="c"></canvas>

  <div class="bar">
    <div class="row">
      <div class="seg" id="modes" role="group" aria-label="Mode">
        <button data-mode="visitor">Visitor</button><button data-mode="creator">Creator</button><button data-mode="editor">Editor</button>
      </div>
      <div class="icons">
        <button class="ib" id="bErr" title="Simulate a placement error of about 1 m and 3 degrees">±1m</button>
        <button class="ib" id="bFields" title="Fields this view uses"><svg viewBox="0 0 24 24"><path d="M5 6.5h14M5 12h9M5 17.5h11"/></svg></button>
        <button class="ib" id="bPhone" title="Phone frame (9:19.5)"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.6"/><path d="M11 18.3h2"/></svg></button>
        <button class="ib" id="bNotes" title="Designer notes"><svg viewBox="0 0 24 24"><path d="M6.5 3.5h8l3 3v14h-11z"/><path d="M9.5 10.5h5M9.5 14h5M9.5 17.5h3"/></svg></button>
      </div>
    </div>
    <div class="row"><div class="seg views" id="views" role="group" aria-label="View"></div></div>
  </div>

  <div id="hint" class="pill hidden"><svg viewBox="0 0 24 24" id="hintArrow"><path d="M12 3.5l6.5 8.5h-4.2v8.5h-4.6V12H5.5z"/></svg><span></span></div>
  <div id="swipe" class="hidden"><div class="ln"><span class="lab l">1885</span><span class="lab r">Today</span></div><div class="kn"><svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg></div></div>
  <div id="tnCtl" class="hidden">
    <div class="seg" id="tnMode"><button data-m="swipe">Swipe</button><button data-m="fade">Fade</button></div>
    <div class="fadebox hidden" id="fadeBox"><span>Today</span><input type="range" id="fadeR" min="0" max="1" step="0.01" value="0"><span id="fadeY">1885</span></div>
  </div>
  <div id="cap" class="hidden"></div>

  <div id="sheet" class="hidden"><div class="scrim"></div><div class="card"><button class="close">Close</button><canvas></canvas><div class="meta"><div class="yr"></div><p class="capt"></p><p class="cred"></p><div class="src"></div></div></div></div>
  <div id="joy" class="hidden"><div class="k"></div></div>
  <div id="reticle" class="hidden"></div>
  <div id="csheet" class="hidden"></div>
  <div id="cbar" class="hidden">
    <button data-tool="view"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span>View</span></button>

  $('#swipe .ln').style.left = (S.split * 100) + '%'; $('#swipe .kn').style.left = (S.split * 100) + '%';
}
function frame(now) {
  const t0 = performance.now(); const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  update(dt, now / 1000); renderer.render(scene, camera);
  ftPush(now, performance.now() - t0);
  if (now - ftShown > 250) { ftShown = now; const s = ftStats(); $('#ft').textContent = `${s.mean.toFixed(1)} ms avg · ${s.max.toFixed(1)} max · 2 s`; }
  requestAnimationFrame(frame);
}

/* ================================================================
   Boot, the script hook, notes
   ================================================================ */
let bytesReady = Promise.resolve(); let readyResolve; const ready = new Promise(r => (readyResolve = r));
function exportRec(r) { return JSON.parse(JSON.stringify(r)); }
window.__stationBlock = {
  family: 'station-blocks-3-pictures',
  views: VIEWS.slice(),
  modes: ['visitor', 'creator', 'editor'],
  async setMode(name) { await ready; S.autowalk = null; setMode(name); if (name === 'visitor') S.appear = Math.hypot(fp.visitor.pos.x, fp.visitor.pos.z) < 25 ? 1 : 0; await drawn(); },
  async setView(name) { await ready; setView(name); if (S.mode === 'visitor') S.appear = Math.hypot(fp.visitor.pos.x, fp.visitor.pos.z) < 25 ? 1 : 0; await drawn(); },
  async walkTo(x, z) { await ready; if (!Number.isFinite(x) || !Number.isFinite(z)) throw new Error('walkTo needs two numbers'); S.autowalk = null; const f = curFP(); f.pos.set(x, 1.6, z); if (S.mode === 'visitor') S.appear = Math.hypot(x, z) < 25 ? 1 : 0; await drawn(); },
  async lookAt(x, y, z) { await ready; if (![x, y, z].every(Number.isFinite)) throw new Error('lookAt needs three numbers'); S.autowalk = null; lookAtFP(curFP(), x, y, z); await drawn(); },
  async describe() { await ready; return { family: this.family, fields: FIELDS.slice(), records: [hall.id, stall.id], views: VIEWS.map(v => ({ name: v, required: REQUIRED.has(v), record: v === 'cutout' ? stall.id : hall.id, usesFields: FIELDS.filter(f => usesField(v, f)) })) }; },
  async exportModel() { await ready; await bytesReady; return exportRec(hall); },
  extras: {
    async exportAllRecords() { await ready; await bytesReady; return [exportRec(hall), exportRec(stall)]; },
    async openDetails() { await ready; openDetails(rec()); await drawn(); },
    /* Round-2 hooks: tap the block as a visitor would; the then-and-now intro state; the sharpen sweep and its
       parameters; the cut-out's optional tag; where the picture's centre is (to look at it). */
    async tapBlock() { await ready; view.onTap(); await drawn(); },
    thenNowState() { return { aligned: !!(view && view.aligned), fade: +S.fade.toFixed(3), intro: !!S.intro, mode: S.tnMode, lostFor: view && Number.isFinite(view.lostFor) ? +view.lostFor.toFixed(2) : null }; },
    pictureState() { return { view: S.view, alpha: view && view.pic ? +view.pic.mat.uniforms.uAlpha.value.toFixed(3) : null, viewerOpacity: view && view.mats ? +view.mats[0].opacity.toFixed(3) : null, sharpen: sharpenParams() }; },
    sharpenSweep() { return sharpenSweep(); },
    async setSharpen(ri, gi) { if (!SHARPEN.ramps[ri] || !SHARPEN.gates[gi]) throw new Error('no such ramp or gate'); SHARPEN.pick = [ri, gi]; await drawn(); },
    async setTag(on) { stall.showTag = !!on; markDirty(); await drawn(); },
    pictureCentre() { const vp = hall.viewpoint, P = new V3(...vp.position); const C = P.clone().addScaledVector(new V3(0, 0, -1).applyEuler(new THREE.Euler(vp.pitchDeg * DEG, -vp.yawDeg * DEG, 0, 'YXZ')), poseDepth(hall)); return [C.x, C.y, C.z]; },
    async closeOverlays() { closeOverlays(); await drawn(); },
    async creatorTool(name) { await ready; creatorTool(name); await drawn(); },
    async setSwipe(mode, split) { S.tnMode = mode; if (Number.isFinite(split)) S.split = split; syncChrome(); await drawn(); },
    async setError(on) { S.err = !!on; syncChrome(); await drawn(); },
    async editorPov(on) { S.pov = !!on; if (!on) frameEditor(); rebuildHandles(); syncChrome(); await drawn(); },
    async panels(which) { $('#fields').classList.toggle('hidden', which !== 'fields'); $('#notes').classList.toggle('hidden', which !== 'notes'); syncChrome(); await drawn(); },
    frameStats() { return ftStats(); },
  },
};

function boot() {
  layout();
  photoCanvas = makePhoto(); stallCanvas = makeStallCutout();
  photoTex = texFrom(photoCanvas, false); photoTex.generateMipmaps = true; stallTex = texFrom(stallCanvas, false);
  const size = (cv, r, type) => new Promise(res => cv.toBlob(b => { if (b) { r.image.bytes = b.size; if (S.mode === 'editor') renderInspector(); } res(); }, type, 0.85));
  bytesReady = Promise.all([size(photoCanvas, hall, 'image/jpeg'), size(stallCanvas, stall, 'image/webp')]);
  $('#notes').innerHTML = NOTES_HTML.replace('<!--SWEEP-->', sweepTableHTML());
  $('#notes').addEventListener('click', e => { const b = e.target.closest('button[data-sw]'); if (!b) return; SHARPEN.pick = b.dataset.sw.split(',').map(Number); $('#notes').classList.add('hidden'); setView('viewpoint-sharpen'); toast(`Sharpen: ramp ${sharpenParams().ramp.join(' to ')} m, gate ${sharpenParams().gate.join(' to ')} deg`); });
  const p = new URLSearchParams(location.hash.slice(1)); const m = p.get('mode'), v = p.get('view');
  if (v && VIEW_CLASS[v]) S.view = v; if (m && ['visitor', 'creator', 'editor'].includes(m)) S.mode = m;
  if (S.mode === 'visitor') startAutoWalk(); if (S.mode === 'creator') aimCreator(); if (S.mode === 'editor') frameEditor();
  syncChrome(); rebuildView();
  requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });
  readyResolve();
}

const NOTES_HTML = `<h3>Designer notes - pictures</h3><div class="sub">Section 0 is the second round. Sections 1-5 are the first round's notes, kept as written; where they disagree with section 0, section 0 holds.</div><details open><summary>0. Second round (2026-10-25): what changed and why</summary><ul><li><b>Framed: a long caption</b> (about 700 characters), to see the real three-line cut on the plate and the full text in the sheet. The editor now takes up to 1 200 characters.</li><li><b>Cut-out: the tag is optional</b>, a creator toggle (Text in creator mode, "Tag" in the editor; the model field <code>showTag</code>). A tap on the cut-out, with or without the tag, opens the text only: the picture is already standing in front of the visitor, so the sheet no longer shows it again.</li><li><b>Then-and-now: fade is the default, with an intro.</b> Once the visitor stands on the marker and faces the viewpoint, the old picture fades from nothing to 55 % over 5 s, then the slider holds that value. Touching the slider ends the intro at once. The intro replays only on a fresh alignment: "aligned" starts under 32 degrees and ends only past 44 degrees (or on leaving the spot), and it must have ended for at least 1.5 s. A wobble across the gate does nothing. Swipe is one tap away, as before.</li><li><b>One mechanism for three views.</b> Then-and-now, Sharpen and Viewer now share one picture plane at the subject's depth whose opacity is proximity x facing (a distance ramp times a facing gate); only the numbers differ: then-and-now 2.6 to 0.9 m and 50 to 30 degrees, viewer 3.0 to 0.8 m and 50 to 25 degrees, sharpen from the sweep below.</li><li><b>Sharpen is now a proximity fade-in, with no blur:</b> fully transparent far away, opaque at the spot. The mipmap-bias blur and the wash are gone, and so is the pale picture over the whole square.</li><li><b>Viewer: no screen overlay any more.</b> As the visitor steps up, the viewer fades out and the picture fades in, in the world, on the same plane as then-and-now. The binocular overlay and its 1.7x magnification are removed. A tap on the viewer or the picture opens the details sheet.</li><li><b>Mosaic</b> stays in the picker as "Mosaic (dropped)", so the gallery keeps every variant. It is not to be built.</li></ul><h4>The sharpen sweep</h4><p>Three distance ramps (far to near, metres from the spot) times three facing gates (out to in, degrees from the viewpoint's facing), computed in this page by the same function the view uses, on this record's viewpoint. The last two rows move only one inner end against the default: the ramp to 0.3 m, the gate to 10 degrees. Footprint: the share of the station circle (1 m grid) where the picture shows at 10 % or more while you look at it. Shows from / half from: on the walk in from the circle's south edge, the distance to the spot where it first reaches 10 % / 50 %. Turn at 80 %: how far you may turn at the spot and still see it at 80 % or more. 1 m aside: its opacity one step to the side of the spot. "try" switches the view to that pair.</p><!--SWEEP--><p>Parameters this rests on: the inner ends (0.5 m and 15 degrees) are swept once each, in the last two rows, not across the grid; the 10 %, 50 % and 80 % thresholds are mine; the walk-in path is one path (from the south edge, as the station is entered). The default row is marked.</p><p><b>Chosen: 7 to 0.5 m and 70 to 15 degrees.</b> The 12 m ramp shows the picture over 12-15 % of the square, the first round's weakness. The 4 m ramp shows it only in the last 3.3 m of the walk, too late to draw a visitor in. The 40-degree gate leaves only 22 degrees of turn at the spot, tight for a phone held loosely. The gate hardly changes the footprint, because a visitor walking in looks roughly along the axis anyway. What would reverse it: a crowded square where any picture is noise favours the 4 m ramp; wanting it as a teaser from far away favours 12 m; noisier phone headings favour the 100-degree gate.</p><p><b>The inner ends stay at 0.5 m and 15 degrees.</b> A 10-degree inner gate end narrows the turn at 80 % from 30.5 to 27 degrees; a 0.3 m inner ramp end takes the opacity 1 m aside from 98 % to 97 % and the footprint from 5.5 to 4.9 %. Neither is a difference a visitor would see. The gap holds at other thresholds, by the same formula: the turn at 50 % is 42.5 against 40 degrees, at 95 % 22 against 18. What would reverse it: an inner gate end near 0 degrees (20 degrees of turn at 80 %, a third less than now), or the 4 m ramp with its inner end at 0 m (84 % one step aside, where the picture visibly thins just off the marker).</p></details><!--NOTES--><p>Eight views of one picture model: framed, cutout, then-now, mosaic (the four required), three viewpoint variants without tiles (viewpoint-finder, viewpoint-sharpen, viewpoint-window) and one unlisted view of my own (viewer).</p><details open><summary>1. The model as built, and what I would change</summary><ul><li><b>Fields, exactly as given:</b> image (an asset reference with width, height, alpha and bytes), caption, credit, year (optional), widthM, pose (position, yawDeg, pitchDeg) and viewpoint (optional: position, yawDeg, pitchDeg, hfovDeg). The block also stores its chosen view.</li><li><b>One record for every view</b> (market-hall-1885). The cutout view shows the second record the brief allows, a cut-out with alpha (fish-stall-1886-cutout), because a full old photo has no alpha to cut along.</li><li><b>The image is generated in the page.</b> I modelled the 1885 square (the timber hall, stalls, figures, a cart, the guild house) and rendered it once from the viewpoint. Then I toned the render as an orthochromatic sepia print, with grain, blotches, vignette, dust and hairline scratches. So it lines up with the stand-in square as a real photo taken from that spot would.</li><li><b>Add viewpoint.distanceM, the distance to the photographed subject.</b> Then-now, mosaic, finder and sharpen all need a depth at which the picture hangs. Today they borrow it from the pose's distance along the viewpoint axis. That couples two unrelated things: where a framed print stands, and how far away the hall was. A creator who moves the print silently moves the overlay.</li><li><b>Add a short title (about 40 characters).</b> Every view needs a one-line label: the foot tag, the marker card, the window label, the editor list. Deriving it from the caption gives "The timber market hall on a market...", which reads as cut off.</li><li><b>Make year a short text, not a number.</b> Archive pictures are often dated "about 1880" or "1880s". A number forces false precision.</li><li><b>Add alt, a plain description.</b> The caption is a story. A visitor with sound off and poor sight needs "a two-storey timber hall on posts, stalls underneath, a cart in front".</li><li><b>Keep widthM.</b> It is meaningless for the five viewpoint views, where the lens angle and the depth set the size. The editor marks it "not used" per view, which is enough.</li><li><b>Drop nothing else.</b></li></ul></details><details><summary>2. Per view: what it is, fields, why a visitor likes it, where it is weakest</summary><p>Common to all views: tapping the block (or its card) opens a details sheet in a screen overlay with the full picture, year, caption and credit. Long text never sits in the world.</p><ul><li><b>framed</b> - a dark beveled frame with a cream mat and the print, a caption plate below (the year large, the caption in three lines, the credit small), and a soft shadow on the ground. On arrival it rises 12 cm and the print "develops": the darks come first.<ul><li>Fields: image, caption, credit, year, widthM, pose.</li><li>Why: instantly understood; it reads as a museum label in the street.</li><li>Weakest: the plate text (about 0.056 m capitals) is body size only within about 2 m. From 4 m it is a label, and reading happens in the sheet. Seen from a steep side angle, the plate is unreadable.</li><li>Placement error: very forgiving. It hangs in the air, so 1 m or 3 degrees off looks the same.</li><li>Sunlight: the dark frame and plate hold up. Sound off: no sound used.</li></ul></li><li><b>cutout</b> - the stall cut-out standing on the ground with a contact shadow. A small year tag on a stake sits in front. Seen edge-on it fades out, and from behind it shows a dark silhouette, so it never turns into a sliver.<ul><li>Fields: image (alpha), caption, credit, year, widthM, pose (tilt ignored).</li><li>Why: the past is standing in the square at life size.</li><li>Weakest: it stands on the ground, so 0.5 to 1 m of placement error makes it float or sink against real kerbs and steps. In a crowd, people walk "through" it. It needs a good cut-out, which creators do not have.</li></ul></li><li><b>then-now</b> - at the marker, the old photo hangs at the subject's depth, sized from the lens angle. A swipe line (or a fade slider) compares it with the live view.<ul><li>Approach: on the way, a ground marker with footprints and an arrow, a light column, a card with a thumbnail that turns to face you, and a top hint ("Walk to the marker 8.9 m" with an arrow, then "Turn this way"). The photo fades in from 2.6 m to 0.9 m.</li><li>Fields: image, caption, credit, year, pose (depth only), viewpoint.</li><li>Why: the strongest "this is the same place" moment.</li><li>Weakest: placement error. The marker and the photo move together, so the visitor still stands at the content's spot, but the photo no longer matches the real scene. The sweep is in section 3. The +-1m toggle shows it: content shifted 0.8 m and turned 3 degrees.</li></ul></li><li><b>mosaic</b> - 14 x 9 tiles hung at depths from 0.62 to 1.42 times the subject depth, each sized so that it covers its patch of the picture from the viewpoint only. From elsewhere it is a cloud of drifting plates whose backs have an amber rim. Near the spot they settle, and on it the seams close.<ul><li>Fields: image, caption, credit, year, pose (depth), viewpoint.</li><li>Why: walking until it snaps together is a game without rules.</li><li>Weakest: the tiles assemble only within about 0.2 m of the spot. The visitor's own tracking drift of 0.2 to 0.3 m shows seams.</li><li>Generic, and not generic: "content that looks right from only one point" is ordinary perspective, as in every then-and-now overlay. Cutting one image into pieces at different depths that reassemble from one point is the specific mechanism. I avoided that mechanism in the three variants below.</li></ul></li><li><b>viewpoint-finder</b> - four corner brackets in the air, each on its own lens ray at a different depth (4.5 m, 6.5 m, 10.6 m and 17 m). From the spot they form one clean frame and turn amber, and the picture fills it: a 36-degree centre crop, so it fits a portrait screen.<ul><li>Fields: image, caption, credit, year, pose (depth), viewpoint.</li><li>How it differs from the mosaic: the picture is never split, distorted or spread in depth. Only an empty outline is. The picture appears whole, on one plane, once you stand there. The outline is still an arrangement that only lines up from one point, though, so it is not free of the idea. A weaker but cleaner version puts all four corners at one depth: they then form a frame from anywhere, and only look square from the spot.</li><li>Placement error: the self-alignment is immune, because corners and spot move together. The picture-to-scene match suffers exactly as in then-now. The visitor's own offset is the cue: 0.3 m sideways moves the near corners about 3.8 degrees against the far ones, which is visible. It is forgiving for "you are roughly here" within about 0.2 to 0.3 m.</li></ul></li><li><b>viewpoint-sharpen</b> - one whole picture hangs at the subject depth and can be seen from anywhere in the circle. It is blurred (mipmap bias), washed out and at 72 % opacity. It sharpens as the visitor nears the spot and faces the original direction (fully clear within 0.3 m), with the marker and hints as above.<ul><li>Fields: image, caption, credit, year, pose (depth), viewpoint.</li><li>How it differs from the mosaic: no tiles, no distortion and no anamorphosis. It is a reward gradient on one ordinary plane.</li><li>Placement error: the most forgiving of the viewpoint views. The blur hides the mismatch until you are close, the ramp spans 7 m, and 1 m of error changes nothing about the guidance.</li><li>Weakest: a 15 x 10 m pale smear over the square from everywhere. In a crowded or busy square it is visual noise, and against a bright sky it is nearly invisible.</li></ul></li><li><b>viewpoint-window</b> - a small framed window (a 30-degree centre crop, about 0.38 m wide) hung 0.7 m in front of the spot at eye height, with a tiny year label. It exists only within about 1 m of the spot (it fades in from 1.25 m to 0.65 m). From further away there is only the marker.<ul><li>Fields: image, caption, credit, year, viewpoint (pose not used).</li><li>How it differs from the mosaic: one undistorted picture, gated by distance. No piece of it depends on the visitor's exact position to look right.</li><li>Placement error: the frame makes any misfit read as "a print held up to the view", so 1 m and 3 degrees look acceptable.</li><li>Weakest: parallax. At 0.7 m, moving the phone 10 cm moves the window about 8 degrees against the distant scene. It can never truly line up with the scene, and should not pretend to. It also sits inside the near-clipping comfort zone of some phones (unverified).</li></ul></li><li><b>viewer</b> (my own) - a painted sightseeing viewer on a post, standing at the viewpoint and pointing the original way. A plate on the post reads "1885 - Look through". Walk up and tap (within 4.5 m). The screen turns into a binocular view of the picture at 1.7x. Turning the phone swings the view across the picture (a gauge shows where), and the caption and credit sit below.<ul><li>Fields: image, caption, credit, year, viewpoint (position, facing, pitch, and the lens angle sets the swing range). Pose and widthM are not used.</li><li>Why: everyone knows what to do with it, and it brings the visitor to the exact spot without any alignment at all.</li><li>Placement error: fully forgiving. The view is a screen overlay, and the world part is an object, not an overlay.</li><li>Weakest: it is a 3D model coded once in the app, and it is a little whimsical for a sober memorial site. Inside the binoculars you no longer see the real square.</li></ul></li></ul></details><details><summary>3. Costs</summary><ul><li><b>Frame time</b> from the readout (mean and maximum over 2 s), measured headless on this machine with SwiftShader, which is software rendering. These numbers say nothing about a phone GPU; only their order is meaningful. Each value is mean / max in milliseconds at 1440 x 900, device pixel ratio 1, standing at the view's best spot:<ul><li>framed: 94 / 300</li><li>cutout: 174 / 483</li><li>then-now: 217 / 433</li><li>mosaic: 208 / 483</li><li>viewpoint-finder: 191 / 367</li><li>viewpoint-sharpen: 169 / 350</li><li>viewpoint-window: 194 / 333</li><li>viewer: 156 / 300</li><li>editor: 203 / 633</li><li>The script work per frame is 0.5 to 5 ms in the visitor views. In the editor it is about 58 ms, which I did not explain (probably blocking software GL in the overview).</li></ul></li><li><b>Draw calls per view:</b> about 6 (framed), 4 (cutout), 5 (then-now: one plane plus the marker), 5 (mosaic: all 126 tiles in one geometry, animated in the vertex shader), 7 (finder), 5 (sharpen), 8 (window) and about 30 (viewer). None needs a per-block shader. The sharpen blur is a mipmap bias, so it needs mipmaps on the texture.</li><li><b>Overdraw:</b> the then-now, sharpen and finder pictures are large transparent planes covering much of the screen. On a phone that is the real cost.</li><li><b>Media:</b> the hall picture is 1500 x 1000 px, 309 KB as JPEG at quality 0.85 (measured in the page; WebP would be smaller). The stall cut-out is 936 x 592 px with alpha, 55 KB as WebP. Every view uses the same file, so no view adds megabytes.</li><li><b>Creator minutes:</b><ul><li>framed: 1 to 2 minutes (place, size, type the caption);</li><li>cutout: the same in the app, plus 10 to 30 minutes in an image editor to cut the subject out, which is the real cost;</li><li>then-now, mosaic, finder, sharpen, window and viewer: 3 to 5 minutes on site to find the photographer's spot and match the ghost with the lens slider. Finding the spot is the hard part and can take far longer for a picture with few straight edges. Once the viewpoint is set, switching between these six views costs nothing.</li></ul></li></ul><p><b>The parameter sweep behind "placement error breaks the overlay":</b> the angle between the old picture and the real scene is about atan(lateral error / subject distance), plus any heading error.</p><ul><li>Lateral error 0.5 m: 5.7 degrees at a 5 m subject, 2.0 at 14 m, 0.95 at 30 m.</li><li>Lateral error 1 m: 11.3, 4.1 and 1.9 degrees.</li><li>Lateral error 2 m: 21.8, 8.1 and 3.8 degrees.</li><li>3 degrees of heading error adds about 3 degrees at any distance.</li><li>Verdict across the range: the overlay views convince only for subjects about 15 m or more away and with good heading. A near subject (a doorway 5 m away) reverses it for any error over about 0.3 m. The view thresholds are listed in section 5, and I did not sweep them: they are taste values.</li></ul></details><details><summary>4. The creator's controls</summary><ul><li><b>Phone (creator mode):</b> six large buttons along the bottom.<ul><li>View: a list with one-line descriptions.</li><li>Place: framed and cutout go 3 m ahead, facing you. Viewer and window go where you stand.</li><li>Size: a width slider.</li><li>Turn: a slider plus "Face me".</li><li>Text: caption, credit and year.</li><li>Viewpoint: only for the viewpoint views. It shows the photo as a 50 % ghost glued to the phone, with a lens slider. Line it up with the scene and tap "Set viewpoint here", which stores the phone's position, facing and pitch. A toast confirms what was saved.</li></ul></li><li><b>Desktop editor:</b> the block list on the left, and on the right an inspector with:<ul><li>the view grid (eight glyphs) and the image (thumbnail, file, size, alpha);</li><li>caption (with a count), credit and year;</li><li>width;</li><li>pose (x, y, z, turn, tilt);</li><li>viewpoint (x, y, z, facing, pitch, lens), "Look from the viewpoint" (the camera jumps to it and shows exactly what the visitor will see) and Reset.</li><li>Every section says whether the current view uses it, and dims it if not.</li></ul></li><li><b>Handles in the 3D view:</b> an amber disc (drag to move), an amber knob (drag to turn) and a white cube (drag for width) for the pose. For the viewpoint, a blue disc moves it, a blue knob turns it and a blue diamond on the lens wedge sets the lens angle. The frustum lines out to the picture's depth show where it will hang.</li></ul></details><details><summary>5. Blunt self-check</summary><ul><li><b>The demo flatters the viewpoint views.</b> The 1885 photo is a render of my own stand-in model from the exact viewpoint, so it matches the stand-in square perfectly. A real archive photo has lens distortion, a changed ground level and moved buildings, and will never fit this well. Then-now in particular will look worse on site than here.</li><li><b>Text in the world breaks the reading-distance rule</b> wherever the visitor stands further than about 2 m from the plate. I accept that because the world text is a label and the sheet carries the reading.</li><li><b>The mosaic</b> is built as asked, but I would not ship it: the finder and sharpen variants do the same job.</li><li><b>Arbitrary constants in code, not data:</b><ul><li>the crops (36 degrees finder, 30 degrees window), the window distance (0.7 m) and the viewer magnification (1.7x);</li><li>the thresholds: spot hints within 1.0 m; then-now 2.6 to 0.9 m; mosaic 0.75 to 0.2 m; finder 0.6 to 0.2 m; sharpen 7 to 0.3 m; window 1.25 to 0.65 m; viewer tap 4.5 m.</li><li>They are taste values, not swept. A tighter mosaic or finder threshold would make the "line up" moment unreachable with phone tracking drift.</li></ul></li><li><b>Sharpen</b> relies on mipmap-bias blur, which looks blocky on some GPUs (not verified on a device), and it puts a large pale plane over the whole square.</li><li><b>Window</b> cannot truly line up with the scene (the parallax at 0.7 m). It is honest only as a held-up print.</li><li><b>No phone measurements:</b> everything was checked in headless software rendering only.</li><li><b>Drop first:</b> the mosaic (the finder covers it). After that, sharpen (noise for everyone not walking to the spot).</li><li><b>Proudest:</b> the viewer. It brings the visitor to the photographer's exact spot with an object everybody understands, works with sound off, in sunlight (a dark screen overlay) and with any placement error, and costs the creator nothing beyond the viewpoint. Then-now with the swipe is the most beautiful; the viewer is the one I would trust on a real square.</li><li><b>Inspiration, named:</b> then-and-now photo overlays (a common practice in local history projects), coin-operated sightseeing viewers, the camera viewfinder's corner marks, and perspective anamorphosis as a general idea. All code is my own.</li></ul></details><!--/NOTES-->`;

boot();
</script>
