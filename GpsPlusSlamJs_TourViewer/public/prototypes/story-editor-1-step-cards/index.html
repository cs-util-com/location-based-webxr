<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Story Editor - Step Cards</title>
<meta name="description" content="Throwaway prototype: a station's story edited as a vertical list of step cards, with jump chips, margin connector lines and a visitor preview.">
<!--
  Throwaway prototype (BS step 1, direction 1 of 3): the station STORY edited as
  a LIST OF STEP CARDS. One card per step in visitor order; each card shows what
  the visitor sees (a small picture of the block in its view, the first words,
  how the step moves on) and opens in place to edit. A choice's answers carry
  "jumps to step N" chips, and a thin line in the left margin joins each jump to
  the step it lands on.
  Desktop: the docked layout of Studio 3 (tree left, panel right, a mock of the
  3D view behind). Phone creator mode: the story list full screen, one hand,
  with Add step and Preview at the thumb.
  Everything is in memory, hard-coded sample data ("The old mill"), original
  drawings, no libraries, nothing saved. Not wired into the app.
-->
<style>
:root {
  --bg0: #18191c; --bg1: #1f2023; --bg2: #26282c; --bg3: #2f3136; --bg4: #383a40;
  --line: #313338; --line2: #3c3f46;
  --text: #d9dbe0; --muted: #8f949e; --dim: #6b707a;
  --accent: #e9a23b; --accentBg: rgba(233,162,59,.14); --accentLine: rgba(233,162,59,.55); --accentInk: #f3c47e;
  --focus: #5b9cf0;
  --ok: #6cc08a; --okBg: rgba(108,192,138,.13);
  --bad: #e5736d; --badBg: rgba(229,115,109,.13);
  --l0: #5b9cf0; --l1: #c58af0; --l2: #4fc2a6; --l3: #e9a23b;
  --gutter: 34px;
  --mono: "Cascadia Mono", Consolas, "SF Mono", ui-monospace, Menlo, monospace;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  /* the visitor's HUD (design.css language: dark slate translucent, white ink, orange accent) */
  --hud: rgba(30,35,50,.9); --hudInk: #fff; --hudAccent: #f2971f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg0); color: var(--text); font: 12.5px/1.4 var(--sans); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
body { display: grid; grid-template-rows: 40px minmax(0,1fr) 24px; grid-template-columns: minmax(0,1fr); }

/* ---------- top bar ---------- */
#tb { display: flex; align-items: center; gap: 6px; padding: 0 8px; background: var(--bg1); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; padding-right: 10px; border-right: 1px solid var(--line); height: 24px; white-space: nowrap; }
.brand b { font-weight: 600; }
.brand .doc { color: var(--muted); }
.crumb { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crumb b { color: var(--text); font-weight: 600; }
.spacer { flex: 1; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid transparent; border-radius: 4px; background: transparent; white-space: nowrap; color: var(--text); }
.tbtn:hover:not(:disabled) { background: var(--bg3); }
.tbtn:disabled { color: var(--dim); cursor: default; }
.tbtn.pri { background: var(--accent); color: #1c1c1c; font-weight: 600; }
.tbtn.pri:hover { background: #f0b257; }
.tbtn .ulbl { max-width: 220px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.phoneOnly, .landOnly { display: none !important; }
.vpill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid transparent; background: var(--okBg); color: var(--ok); font-weight: 600; white-space: nowrap; }
.vpill.bad { background: var(--badBg); color: var(--bad); border-color: rgba(229,115,109,.4); }

/* ---------- desktop stage: the mock 3D view behind the docks ---------- */
#vp { position: relative; overflow: hidden; background: #232427; min-height: 0; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; }
.dock { position: absolute; top: 0; z-index: 5; display: flex; flex-direction: column; background: rgba(31,32,35,.97); border: 1px solid var(--line); border-top: 0; box-shadow: 0 8px 22px rgba(0,0,0,.35); }
#tree { left: 0; width: 262px; border-left: 0; border-radius: 0 0 8px 0; max-height: calc(100% - 40px); }
#panel { right: 0; width: 452px; bottom: 0; border-right: 0; border-bottom: 0; border-radius: 0; }
.dhead { flex: none; min-height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--line); }
.ttlh { font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.count { font: 10.5px var(--mono); color: var(--dim); }
.dbody { overflow: auto; min-height: 0; }
.dbody::-webkit-scrollbar { width: 10px; } .dbody::-webkit-scrollbar-thumb { background: var(--bg4); border: 3px solid var(--bg1); border-radius: 6px; }
.protoTag { position: absolute; left: 276px; bottom: 8px; font-size: 10px; color: rgba(220,222,226,.65); letter-spacing: .03em; padding: 1px 6px; border-radius: 3px; background: rgba(24,25,28,.6); }

/* tree */
.st { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; color: var(--muted); }
.st .n { font: 600 10px var(--mono); background: #3d5a78; color: #e6f0fa; border-radius: 3px; padding: 1px 5px; }
.st.sel { color: var(--text); background: var(--bg2); }
.st.sel .n { background: var(--accent); color: #1c1c1c; }
.st .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { padding: 0 0 8px; background: var(--bg2); border-bottom: 1px solid var(--line); }
.tsec { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 22px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.trow { position: relative; display: flex; align-items: center; gap: 7px; min-height: 28px; padding: 2px 6px 2px 22px; width: 100%; border: 0; background: transparent; text-align: left; color: var(--text); }
.trow:hover { background: var(--bg3); }
.trow.sel { background: var(--accentBg); }
.trow.sel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.trow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .meta { font: 10.5px var(--mono); color: var(--dim); white-space: nowrap; }
.trow .meta.free { color: var(--l2); }

/* ---------- story panel ---------- */
#panel .dhead { padding: 6px 10px 6px 14px; flex-wrap: wrap; row-gap: 4px; }
.ptitle { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.ptitle b { font-size: 14px; color: #f0f1f3; font-weight: 600; }
#tabs { display: none; }
.scroll { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }
.scroll::-webkit-scrollbar { width: 10px; } .scroll::-webkit-scrollbar-thumb { background: var(--bg4); border: 3px solid var(--bg1); border-radius: 6px; }
#list { position: relative; padding: 10px 12px 14px var(--gutter); }
#links { position: absolute; left: 0; top: 0; width: 100%; pointer-events: none; overflow: visible; }
.intro { color: var(--muted); font-size: 11.5px; margin: 0 0 8px; line-height: 1.45; }
.pfoot { flex: none; display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); }

/* card */
.card { position: relative; background: var(--bg2); border: 1px solid var(--line2); border-radius: 8px; margin: 0 0 8px; transition: border-color .12s, box-shadow .12s; }
.card:hover { border-color: #4a4e56; }
.card.open { border-color: #5a5e66; background: #2a2c31; }
.card.bad { border-color: rgba(229,115,109,.6); }
.card.playing { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accentLine); }
.card.dragging { z-index: 20; box-shadow: 0 14px 30px rgba(0,0,0,.55); border-color: var(--accent); }
.card.flash { animation: flash 1.1s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: 0 0 0 0 transparent; } }
.chead { display: flex; align-items: flex-start; gap: 9px; padding: 8px 8px 8px 4px; cursor: pointer; user-select: none; border-radius: 8px; }
.grip { flex: none; width: 22px; height: 40px; margin-top: 4px; border: 0; border-radius: 4px; background: transparent; color: var(--dim); display: grid; place-items: center; cursor: grab; touch-action: none; padding: 0; }
.grip:hover { color: var(--text); background: var(--bg3); }
.grip:active { cursor: grabbing; }
.num { flex: none; width: 22px; height: 22px; margin-top: 2px; border-radius: 50%; background: #3a3d44; color: #eef0f3; font: 600 11px var(--mono); display: grid; place-items: center; }
.card.playing .num { background: var(--accent); color: #1c1c1c; }
.thumb { flex: none; width: 58px; height: 58px; border-radius: 6px; overflow: hidden; background: #111; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.thumb svg { display: block; width: 100%; height: 100%; }
.sum { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.l1 { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.kindtag { flex: none; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kindtag.choice { color: var(--l1); } .kindtag.quiz { color: var(--l2); }
.ttl { font-weight: 600; font-size: 13px; color: #f0f1f3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.l2 { color: #b9bdc5; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.38; }
.l2.empty { color: var(--bad); font-style: italic; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 1px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--line2); color: var(--muted); font-size: 11px; white-space: nowrap; }
.chip svg { width: 12px; height: 12px; }
.chip.adv { color: #c9ccd3; }
.chev { flex: none; margin-top: 4px; color: var(--dim); transition: transform .15s; }
.card.open .chev { transform: rotate(180deg); }

/* a choice's answers and the quiz's answers, always visible */
.answers { list-style: none; margin: -2px 8px 8px calc(4px + 22px + 9px + 22px + 9px); padding: 0; display: flex; flex-direction: column; gap: 4px; }
.ans { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 3px 4px 3px 9px; border-radius: 6px; background: rgba(0,0,0,.18); border: 1px solid var(--line); }
.ans .albl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ans .albl.empty { color: var(--bad); font-style: italic; }
.ans .mark { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--dim); display: grid; place-items: center; }
.ans .mark.right { background: var(--ok); border-color: var(--ok); color: #10301c; }
.jump { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; border: 1px solid currentColor; background: transparent; }
.jump.next { color: var(--muted); border-color: var(--line2); font-weight: 400; }
.jump.end { color: #d6d8dd; border-color: #6a6e77; }
.jump.back { color: var(--bad); border-style: dashed; }
.jump svg { width: 12px; height: 12px; }

.issues { margin: 0 8px 8px 8px; display: flex; flex-direction: column; gap: 4px; }
.issue { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 7px; padding: 6px 8px; border-radius: 6px; background: var(--badBg); color: #f0b3ae; font-size: 12px; line-height: 1.4; }
.issue svg { margin-top: 1px; color: var(--bad); }
.issue > span { flex: 1 1 220px; min-width: 0; }
.issue .fix { margin-left: auto; flex: none; }

/* edit body */
.body { padding: 4px 12px 12px; border-top: 1px solid var(--line); }
.fld { margin: 10px 0 0; }
.fld > label, .flabel { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
.tf { width: 100%; min-height: 30px; background: var(--bg1); border: 1px solid var(--line2); border-radius: 5px; color: var(--text); padding: 5px 8px; outline: none; }
.tf:focus { border-color: var(--focus); }
textarea.tf { resize: vertical; line-height: 1.45; min-height: 58px; }
select.tf { padding: 4px 6px; }
.row2 { display: flex; gap: 6px; align-items: center; }
.row2 > .tf { flex: 1; min-width: 0; }
.cnt { font: 10.5px var(--mono); color: var(--dim); text-align: right; margin-top: 2px; }
.note { color: var(--muted); font-size: 11.5px; line-height: 1.45; margin: 4px 0 0; }
.blockrow { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 6px; background: var(--bg1); border: 1px solid var(--line); }
.blockrow .thumb { width: 44px; height: 44px; }
.blockrow .bi { flex: 1; min-width: 0; }
.blockrow .bi b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.muted { color: var(--muted); font-size: 11.5px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.segb { min-height: 28px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line2); background: transparent; color: var(--muted); }
.segb:hover { color: var(--text); border-color: #5a5e66; }
.segb[aria-pressed="true"] { color: var(--accentInk); border-color: var(--accentLine); background: var(--accentBg); }
.segb .where { opacity: .7; font-size: 10.5px; margin-left: 4px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 30px; padding: 0 12px; border-radius: 5px; border: 1px solid var(--line2); background: var(--bg3); color: var(--text); white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--bg4); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { min-height: 26px; padding: 0 9px; font-size: 12px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #1c1c1c; font-weight: 600; }
.btn.pri:hover:not(:disabled) { background: #f0b257; }
.btn.danger { color: #f0a8a5; border-color: rgba(229,115,109,.45); background: rgba(229,115,109,.08); }
.btn.danger:hover:not(:disabled) { background: rgba(229,115,109,.18); }
.btn.ghost { background: transparent; }
.btn.wide { flex: 1; }
.optrow { display: flex; gap: 6px; align-items: center; margin: 0 0 6px; }
.optrow .tf { flex: 1 1 40%; min-width: 0; }
.optrow select.tf { flex: 1 1 45%; }
.optrow .rbtn { flex: none; width: 30px; height: 30px; border-radius: 5px; border: 1px solid var(--line2); background: transparent; color: var(--muted); display: grid; place-items: center; padding: 0; }
.optrow .rbtn:hover:not(:disabled) { color: var(--text); background: var(--bg3); }
.optrow .rbtn:disabled { opacity: .35; cursor: default; }
.optrow .radio { flex: none; width: 30px; height: 30px; display: grid; place-items: center; }
.optrow .radio input { width: 17px; height: 17px; accent-color: var(--ok); }
.optbox { padding: 6px; border: 1px solid var(--line); border-radius: 7px; background: rgba(0,0,0,.14); margin: 0 0 6px; }
.optbox .optrow { margin: 0; }
.optrow.lead { margin-top: 5px; }
.leads { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); padding: 0 2px 0 4px; }
.opthead { display: flex; gap: 6px; font-size: 10.5px; color: var(--dim); margin: 0 0 4px; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }
.acts .sp { flex: 1; }

/* insert gap between cards (desktop) */
.gap { position: relative; height: 0; margin: -4px 0 4px; }
.gap button { position: absolute; left: 50%; top: -10px; transform: translateX(-50%); height: 20px; padding: 0 10px; border-radius: 999px; border: 1px dashed var(--line2); background: var(--bg1); color: var(--muted); font-size: 11px; opacity: 0; transition: opacity .12s; z-index: 3; display: inline-flex; align-items: center; gap: 4px; }
.gap:hover button, .gap button:focus-visible { opacity: 1; }
.gap button:hover { color: var(--accentInk); border-color: var(--accentLine); }
#dropLine { position: absolute; left: var(--gutter); right: 12px; height: 3px; border-radius: 2px; background: var(--accent); z-index: 25; pointer-events: none; }
#dropLine span { position: absolute; left: 0; top: -24px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; white-space: nowrap; background: var(--bad); color: #2a0e0c; }
#dropLine.warn { background: var(--bad); }
.addEnd { display: flex; width: 100%; justify-content: center; min-height: 38px; border: 1px dashed var(--line2); border-radius: 8px; background: transparent; color: var(--muted); align-items: center; gap: 6px; }
.addEnd:hover { color: var(--accentInk); border-color: var(--accentLine); }
.endmark { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 11px; margin: 2px 0 10px; }
.endmark::before, .endmark::after { content: ""; flex: 1; height: 1px; background: var(--line2); }

/* blocks list (tree on desktop, a tab on the phone) */
#blocksView { padding: 10px 12px 16px; }
.brow { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; background: var(--bg2); border: 1px solid var(--line2); margin: 0 0 8px; }
.brow .thumb { width: 48px; height: 48px; }
.brow .bi { flex: 1; min-width: 0; }
.brow .bi b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brow .uses { font-size: 11.5px; color: var(--muted); }
.brow .uses.free { color: var(--l2); }
.brow .uses.bad { color: var(--bad); }
.tdel { flex: none; width: 26px; height: 26px; border: 0; border-radius: 4px; background: transparent; color: var(--dim); display: grid; place-items: center; padding: 0; }
.tdel:hover { color: #f0a8a5; background: rgba(229,115,109,.12); }
.trow .tdel { opacity: 0; } .trow:hover .tdel, .trow .tdel:focus-visible { opacity: 1; }
.mthumb { width: 22px; height: 22px; border-radius: 4px; overflow: hidden; flex: none; }
.mthumb svg { display: block; width: 100%; height: 100%; }

/* status bar */
#sb { display: flex; align-items: center; gap: 0; background: var(--bg1); border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); min-width: 0; }
#sb > div { padding: 0 10px; border-right: 1px solid var(--line); height: 100%; display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
#sb .grow { flex: 1; min-width: 0; }

/* ---------- modal: sheets and questions ---------- */
#modalBack { position: fixed; inset: 0; z-index: 60; background: rgba(8,9,11,.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
#modal { width: min(480px, 100%); max-height: calc(100% - 32px); overflow: auto; background: var(--bg1); border: 1px solid var(--line2); border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
#modal h2 { margin: 0; font-size: 15px; font-weight: 600; color: #f0f1f3; padding: 14px 16px 10px; display: flex; align-items: center; gap: 8px; }
#modal h2 .sp { flex: 1; }
#modal .mb { padding: 0 16px 6px; }
#modal .mb p { margin: 0 0 10px; line-height: 1.5; color: #c4c7ce; }
#modal .mf { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; padding: 12px 16px 14px; }
.qbox { border-radius: 8px; padding: 10px 12px; margin: 0 0 10px; background: var(--bg2); border: 1px solid var(--line2); }
.qbox.hl { border-color: var(--accentLine); background: var(--accentBg); }
.qbox h3 { margin: 0 0 6px; font-size: 13.5px; color: #f6f1e6; }
.qbox p { margin: 0 !important; }
.lose { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.lose li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 8px; border-radius: 6px; background: var(--bg1); border: 1px solid var(--line); font-size: 12px; }
.lose .was { color: var(--bad); text-decoration: line-through; }
.lose .now { color: var(--muted); }
.kindgrid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin: 0 0 12px; }
.bigopt { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; padding: 10px; border-radius: 8px; border: 1px solid var(--line2); background: var(--bg2); color: var(--text); min-height: 44px; }
.bigopt:hover { border-color: var(--accentLine); background: #2c2e33; }
.bigopt .thumb { width: 100%; height: 64px; }
.bigopt b { font-size: 13px; }
.bigopt span { font-size: 11.5px; color: var(--muted); line-height: 1.4; }
.picklist { display: flex; flex-direction: column; gap: 6px; margin: 0 0 12px; }
.pick { display: flex; align-items: center; gap: 10px; padding: 7px; border-radius: 8px; border: 1px solid var(--line2); background: var(--bg2); text-align: left; color: var(--text); width: 100%; }
.pick:hover { border-color: var(--accentLine); }
.pick .thumb { width: 44px; height: 44px; }
.pick .bi { flex: 1; min-width: 0; }
.pick .bi b { display: block; }
.newgrid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }

.ask .fb { margin: 4px 0 10px; font-size: 13.5px; line-height: 1.4; }

.endcard { position: absolute; left: 12px; right: 12px; top: 30%; padding: 18px 14px; border-radius: 16px; background: var(--hud); color: #fff; text-align: center; }

<body>

// ------------------------------------------------------------------ connector lines in the margin
const LANE_COLORS = ['var(--l0)', 'var(--l1)', 'var(--l2)', 'var(--l3)'];
function drawLinks() {
  const list = $('#list'); const svg = $('#links'); if (!svg) return;
  const lr = list.getBoundingClientRect();
  svg.setAttribute('height', list.scrollHeight); svg.style.height = list.scrollHeight + 'px';
  const gx = parseFloat(getComputedStyle(list).paddingLeft);
  const links = [];
  M.steps.forEach((s, i) => {
    const srcs = s.kind === 'choice' ? s.options.map((o) => ({ g: o.goto, ref: o.id })) : s.kind === 'quiz' ? [{ g: s.goto, ref: 'quiz-' + s.id }] : [];
    srcs.forEach(({ g, ref }) => {
      const r = jumpOf(g, i); if (r.type !== 'jump' && r.type !== 'nextExplicit' && r.type !== 'back') return;
      const src = list.querySelector(`.ans[data-opt="${ref}"]`); const dst = list.querySelector(`.card[data-id="${M.steps[r.j].id}"]`);
      if (!src || !dst) return;
      const a = src.getBoundingClientRect(); const d = dst.getBoundingClientRect();
      links.push({ ref, sy: a.top - lr.top + a.height / 2, ty: d.top - lr.top + 20, back: r.type === 'back' });
    });
  });
  // lanes: overlapping spans get different lanes
  links.sort((p, q) => Math.abs(p.ty - p.sy) - Math.abs(q.ty - q.sy));
  const lanes = [];
  links.forEach((l) => {
    const lo = Math.min(l.sy, l.ty), hi = Math.max(l.sy, l.ty);
    let k = 0; while (lanes[k] && lanes[k].some(([a, b]) => lo < b + 6 && hi > a - 6)) k++;
    (lanes[k] ||= []).push([lo, hi]); l.lane = k;
  });
  const step = Math.max(4, Math.min(7, (gx - 8) / Math.max(1, lanes.length)));
  let h = '<defs>' + LANE_COLORS.map((c, k) => `<marker id="ah${k}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="${c}"/></marker>`).join('') + '<marker id="ahb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="var(--bad)"/></marker></defs>';
  links.forEach((l, idx) => {

    h += `<path d="${d}" fill="none" stroke="${c}" stroke-width="1.6" ${l.back ? 'stroke-dasharray="4 3"' : ''} marker-end="url(#${l.back ? 'ahb' : 'ah' + (idx % 4)})" opacity=".9"/>`;
    const chip = list.querySelector(`[data-jump="${l.ref}"]`); if (chip && !l.back) chip.style.color = c;
  });

}

  const out = [];
  M.steps.forEach((s, i) => {
    if (ids.includes(s.id)) return;
    const ni = stepsAfter.findIndex((x) => x.id === s.id);
    const after = ni + 1 < stepsAfter.length ? `go on to the next step (${stepTitle(stepsAfter[ni + 1])})` : 'end the story';
    if (s.kind === 'choice') s.options.forEach((o) => { if (ids.includes(o.goto)) out.push({ where: `Step ${i + 1}, answer "${o.label || 'empty'}"`, was: `jumps to step ${stepIdx(o.goto) + 1}`, now: after }); });
    if (s.kind === 'quiz' && ids.includes(s.goto)) out.push({ where: `Step ${i + 1}, after the quiz`, was: `jumps to step ${stepIdx(s.goto) + 1}`, now: after });
  });
  return out;
}
function pruneGotos(ids) {
  M.steps.forEach((s) => {

    if (s.kind === 'quiz' && ids.includes(s.goto)) s.goto = null;

}
const loseHTML = (ls) => `<ul class="lose">${ls.map((l) => `<li><b>${esc(l.where)}</b><span class="was">${esc(l.was)}</span><span class="now">and will ${esc(l.now)}</span></li>`).join('')}</ul>`;
function requestDeleteStep(id) {

  const dropBlock = lastShow && !canStandFree(b);
  const doIt = () => {
    commit(`Delete step ${i + 1}`, () => { M.steps.splice(stepIdx(id), 1); pruneGotos([id]); if (dropBlock) M.blocks = M.blocks.filter((x) => x.id !== b.id); });

  openModal(`<h2 id="mTtl">Delete step ${i + 1}, "${esc(stepTitle(s))}"?</h2><div class="mb">
    ${ls.length ? `<div class="qbox"><h3>${ls.length === 1 ? 'One answer loses its jump' : `${ls.length} answers lose their jump`}</h3><p>${ls.length === 1 ? 'It jumps to this step. Its jump is removed:' : 'They jump to this step. Their jumps are removed:'}</p>${loseHTML(ls)}</div>` : ''}
    ${dropBlock ? `<div class="qbox hl"><h3>Also delete the block it shows?</h3><p>${why}</p></div>` : ''}
    </div><div class="mf"><button class="btn" data-m="cancel">${dropBlock ? 'No, keep the step' : 'Cancel'}</button><button class="btn danger" data-m="ok">${dropBlock ? 'Yes, delete step and block' : 'Delete step'}</button></div>`, { ok: doIt });
}
function requestDeleteBlock(bid) {

      <ul class="lose">${sh.map((s) => `<li><b>Step ${stepIdx(s.id) + 1}</b><span class="now">shows "${esc(b.name)}", ${esc(VIEWS[b.view].label.toLowerCase())}</span></li>`).join('')}</ul></div>

// drag to reorder (mouse, pen and touch), by the grip only
let drag = null;
list.addEventListener('pointerdown', (e) => {
  const g = e.target.closest('[data-grip]'); if (!g || e.button > 0) return;
  e.preventDefault();
  const card = g.closest('.card');
  drag = { id: card.dataset.id, from: stepIdx(card.dataset.id), y0: e.clientY, card, moved: false, to: null, pid: e.pointerId };
  g.setPointerCapture(e.pointerId);
});
list.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.pid) return;
  const dy = e.clientY - drag.y0;
  if (!drag.moved && Math.abs(dy) < 5) return;
  if (!drag.moved) { drag.moved = true; drag.card.classList.add('dragging'); }
  drag.card.style.transform = `translateY(${dy}px)`;
  const sc = $('#scroll'); const sr = sc.getBoundingClientRect();
  if (e.clientY < sr.top + 40) sc.scrollTop -= 10; else if (e.clientY > sr.bottom - 40) sc.scrollTop += 10;
  const others = [...list.querySelectorAll('.card')].filter((c) => c !== drag.card);
  let to = others.length;
  for (let k = 0; k < others.length; k++) { const r = others[k].getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { to = k; break; } }
  drag.to = to;
  const lr = list.getBoundingClientRect();
  const y = to < others.length ? others[to].getBoundingClientRect().top - lr.top - 5 : others[others.length - 1].getBoundingClientRect().bottom - lr.top + 3;
  let dl = $('#dropLine'); if (!dl) { dl = document.createElement('div'); dl.id = 'dropLine'; list.appendChild(dl); }
  dl.style.top = y + 'px';
  // would this order leave a jump pointing back? say so before the drop
  const order = M.steps.filter((s) => s.id !== drag.id); order.splice(to, 0, M.steps[drag.from]);
  const before = validate().filter((x) => x.fix).length; const after = validate(order).filter((x) => x.fix).length;
  dl.className = after > before ? 'warn' : '';
  dl.innerHTML = after > before ? `<span>Dropping here makes ${after - before === 1 ? 'a jump' : 'jumps'} point back</span>` : '';
});

}

function pvOpen(from) {

function pvStop() { clearTimeout(PV.timer); cancelAnimationFrame(PV.raf); }

function pvEnter(i) {

function pvTimers() {
  const i = PV.path[PV.path.length - 1]; const s = M.steps[i]; if (s.kind !== 'show') return;
  const b = blockOf(s.block); if (!b) return;
  const read = Math.max(2, words(b.text) * 0.32);
  const media = b.kind === 'video' || b.kind === 'audio' ? b.durS || 20 : read;
  const auto = s.advance.mode === 'auto' ? s.advance.afterS : s.advance.mode === 'lineEnd' ? media + 0.6 : 0;
  PV.t0 = performance.now(); PV.dur = auto; PV.read = b.kind === 'video' || b.kind === 'audio' ? media : read;
  const tick = () => {
    const t = (performance.now() - PV.t0) / 1000;
    document.querySelectorAll('#scene .bubble .w, #scene .cap .w').forEach((w, k, all) => w.classList.toggle('on', k < Math.ceil((t / PV.read) * all.length)));
    const bar = $('#scene .hint .bar i'); if (bar && PV.dur) bar.style.width = clamp((t / PV.dur) * 100, 0, 100) + '%';
    const vb = $('#scene .vid .track i'); if (vb) vb.style.width = clamp((t / media) * 100, 0, 100) + '%';
    const vt = $('#scene .vid .tm'); if (vt) vt.textContent = `0:${String(Math.min(Math.floor(t), media)).padStart(2, '0')} / 0:${String(media).padStart(2, '0')}`;
    if (auto && t >= auto) { pvEnter(i + 1); return; }
    PV.raf = requestAnimationFrame(tick);
  };
  PV.raf = requestAnimationFrame(tick);
}
const wordSpans = (t) => t.trim().split(/\s+/).map((w) => `<span class="w">${esc(w)}</span>`).join(' ');
function worldObj(b, fresh) {
  const f = fresh ? ' fresh' : '';
  if (b.kind === 'model') return `<div class="wobj w-wheel${f}" title="${esc(b.name)}">${WHEEL_SVG}</div>`;
  if (b.kind === 'picture') return `<div class="wobj w-framed${f}"><div class="frameArt" ${b.view === 'plane' ? 'style="background:none;box-shadow:none;padding:0"' : ''}>${PIC_SVG}</div>${b.view === 'framed' ? '<div class="legs"></div>' : ''}<div class="wtag">${esc(b.name)}</div></div>`;
  if (b.kind === 'shortText') return `<div class="wobj w-pin${f}"><div class="signArt" title="${esc(b.text)}">${esc(b.name)}</div></div>`;
  if (b.kind === 'video') return `<div class="wobj w-screen${f}"><div class="vid" style="border:4px solid #222"><span class="t">${esc(b.name)}</span></div><div class="wtag">${esc(b.name)}</div></div>`;
  if (b.kind === 'longText') return `<div class="wobj w-reading${f}"><div class="signArt" style="text-transform:none;font-weight:400">${esc(b.name)}</div></div>`;
  return `<div class="wobj w-other${f}"><div class="signArt">${esc(b.name)}</div></div>`;
}
function cardContent(b) {
  if (b.kind === 'picture') return `<div class="art">${PIC_SVG}</div><p>${esc(b.text)}</p>`;
  if (b.kind === 'video') return `<div class="vid"><span class="t">${esc(b.name)}</span><div class="ctrl"><span>${IC.play}</span><span class="track"><i></i></span><span class="tm">0:00</span></div></div><p style="font-size:12px;opacity:.8">Captions: ${esc(firstWords(b.text, 10))}</p>`;
  if (b.kind === 'model') return `<div class="art" style="background:#2a3040;padding:10px"><div style="width:44%;margin:0 auto">${WHEEL_SVG}</div></div><p>${esc(b.text)}</p>`;
  if (b.kind === 'audio') return `<div class="art" style="background:#2a3040;padding:10px">${glyph('audio', 0, 0, 48, 30).replace('<svg', '<svg width="100%" height="60"')}</div><p>${esc(b.text)}</p>`;
  if (b.kind === 'character') return `<p class="cap" style="font-size:14px">${wordSpans(b.text)}</p>`;
  return `<p>${esc(b.text)}</p>`;
}
function pvRender() {
  if (!PV.ended && !PV.path.length) return;
  if (!PV.ended && PV.path[PV.path.length - 1] >= M.steps.length) { PV.ended = true; }
  const sc = $('#scene'); const r = sc.getBoundingClientRect(); sc.classList.toggle('wide', r.width > r.height);
  const cur = PV.ended ? -1 : PV.path[PV.path.length - 1];
  const s = cur >= 0 ? M.steps[cur] : null;
  // what stands in the world: free blocks, plus every world block the visitor has reached
  const reached = new Set(PV.path.map((k) => M.steps[k]).filter((x) => x && x.kind === 'show').map((x) => x.block));
  for (let k = 0; k < PV.from; k++) { const x = M.steps[k]; if (x.kind === 'show') reached.add(x.block); }
  const figure = (() => { if (PV.ended) return null; for (let k = PV.path.length - 1; k >= 0; k--) { const x = M.steps[PV.path[k]]; if (x.kind === 'show' && blockOf(x.block)?.kind === 'character') return blockOf(x.block); } return null; })();
  let world = '';
  M.blocks.forEach((b) => {
    if (b.kind === 'character') return;
    const free = !showsOf(b.id).length && canStandFree(b);
    const isCur = s && s.kind === 'show' && s.block === b.id;
    if (VIEWS[b.view].world && (free || reached.has(b.id))) world += worldObj(b, isCur && PV.fresh);
  });
  if (figure) world += `<div class="wobj w-figure${s && s.block === figure.id && PV.fresh ? ' fresh' : ''}">${ADA_SVG()}</div>`;
  let ov = '<div class="hudTop">The old mill</div>'; let hint = '';
  if (PV.ended) {
    ov += `<div class="endcard"><h4>${PV.loop ? 'The story went round in a loop' : 'End of the story'}</h4><p>${PV.loop ? 'A jump points back, so this path never ends. Fix the red card.' : 'The visitor walks on to the next station.'}${PV.points ? ` Points: ${PV.points}.` : ''}</p><button class="go" data-pv="restart" style="width:100%;min-height:44px;border:0;border-radius:12px;background:var(--hudAccent);font-weight:700">PLAY AGAIN</button></div>`;
  } else if (s.kind === 'show') {
    const b = blockOf(s.block);
    if (b) {
      if (b.kind === 'character' && b.view === 'bubble') ov += `<div class="bubble"><span class="who">${esc(b.name)}</span>${wordSpans(b.text || '...')}</div>`;
      else if (b.kind === 'character' && b.view === 'portrait') ov += `<div class="portrait"><div class="face">${ADA_SVG()}</div><div class="cap"><b style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--hudAccent)">${esc(b.name)}</b><br>${wordSpans(b.text || '...')}</div></div>`;
      else if (b.view === 'card' || b.view === 'portrait') ov += `<div class="pcard"><h4>${esc(b.name)}</h4>${cardContent(b)}</div>`;
      const a = s.advance;
      if (a.mode === 'tap') hint = '<div class="hint">Tap to continue</div>';
      else if (a.mode === 'auto') hint = `<div class="hint">Moves on in ${a.afterS} s<span class="bar"><i></i></span></div>`;
      else hint = `<div class="hint">${esc((KINDS[b.kind].lineEnd || 'Moves on by itself').replace('When', 'Moves on when'))}<span class="bar"><i></i></span></div>`;
    }
  } else if (s.kind === 'choice') {
    ov += `<div class="ask"><div class="q">${esc(s.prompt || '(no question yet)')}</div>${s.options.map((o) => `<button class="a" data-pv="choose" data-o="${o.id}">${esc(o.label || '(empty answer)')}</button>`).join('')}</div>`;
  } else {
    const q = PV.quiz;
    ov += `<div class="ask"><div class="kicker">Quiz, ${s.points} points</div><div class="q">${esc(s.question || '(no question yet)')}</div>${s.options.map((o) => { const cls = q ? (o.id === s.correct ? 'right' : o.id === q ? 'wrong' : '') : ''; return `<button class="a ${cls}" data-pv="answer" data-o="${o.id}" ${q ? 'disabled' : ''}>${esc(o.label || '(empty answer)')}</button>`; }).join('')}${q ? `<div class="fb">${esc(q === s.correct ? s.right : s.wrong)}${q === s.correct ? `<span class="pts">+${s.points}</span>` : ''}</div><button class="go" data-pv="next">Continue</button>` : ''}</div>`;
  }
  sc.innerHTML = `<div class="hills"></div><div class="ground"></div><div class="path"></div><svg class="millArt" viewBox="0 0 220 170" aria-hidden="true">${MILL}</svg>${world}<div class="ovl">${ov}</div>${hint}`;
  PV.fresh = false;
  // author bar
  const n = M.steps.length;
  $('#pvWhere').textContent = PV.ended ? 'The story has ended' : `Step ${cur + 1} of ${n}: ${stepTitle(s)}`;
  $('#pvWhat').textContent = PV.ended ? 'Play again, or go back one step.' : s.kind === 'show' ? 'Exactly what the visitor sees. Tap the view to move on.' : 'Pick an answer as the visitor would.';
  $('#pvTrail').innerHTML = '<span>Path taken:</span>' + PV.path.map((k, x) => `<span class="t ${x === PV.path.length - 1 && !PV.ended ? 'cur' : ''}">${k + 1}</span>`).join('<span>&rsaquo;</span>') + (PV.ended ? '<span>&rsaquo;</span><span class="t">end</span>' : '');
  $('#pvSkip').disabled = PV.ended || (s && s.kind !== 'show' && !(s.kind === 'quiz' && PV.quiz));
  $('#pvBack').disabled = PV.path.length < (PV.ended ? 1 : 2);
  document.querySelectorAll('.card').forEach((c) => c.classList.toggle('playing', !!s && c.dataset.id === s.id));
  if (s && !document.body.classList.contains('phone')) { const c = $(`.card[data-id="${s.id}"]`); if (c) { const scr = $('#scroll'); const cr = c.getBoundingClientRect(); const sr = scr.getBoundingClientRect(); if (cr.top < sr.top || cr.bottom > sr.bottom) scr.scrollTop += cr.top - sr.top - 60; } }
}
$('#scene').addEventListener('click', (e) => {
  const b = e.target.closest('[data-pv]');
  const i = PV.path[PV.path.length - 1]; const s = M.steps[i];
  if (b) {
    const k = b.dataset.pv;
    if (k === 'restart') { pvStart(0); return; }
    if (k === 'choose') { pvGo(s.options.find((o) => o.id === b.dataset.o).goto); return; }
    if (k === 'answer') { PV.quiz = b.dataset.o; if (PV.quiz === s.correct) PV.points += s.points; pvRender(); return; }
    if (k === 'next') { pvGo(s.goto); return; }
  }
  if (!PV.ended && s && s.kind === 'show') pvNext();
});
$('#pvClose').onclick = pvClose;
$('#pvRestart').onclick = () => pvStart(0);
$('#pvSkip').onclick = () => { const s = M.steps[PV.path[PV.path.length - 1]]; if (s && s.kind === 'quiz') pvGo(s.goto); else pvNext(); };
$('#pvBack').onclick = () => { if (!PV.ended) PV.path.pop(); const p = PV.path.pop(); pvEnter(p === undefined ? 0 : p); };

// ------------------------------------------------------------------ layout
function layout() {
  const w = innerWidth, h = innerHeight;
  const phone = w <= 760 || h <= 500;
  document.body.classList.toggle('phone', phone);
  document.body.classList.toggle('land', phone && w > h);
  requestAnimationFrame(drawLinks);
  if (PV.on) pvRender();
}
addEventListener('resize', layout);
new ResizeObserver(() => requestAnimationFrame(drawLinks)).observe($('#list'));
layout();
render();
// for the screenshot script and hand checks: #open=s4, #preview, #state=...
(() => {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('open')) { openId = p.get('open'); render(); scrollToCard(openId, false); }
  if (p.has('blocks')) setTab('blocks');
  if (p.has('preview')) pvOpen(+p.get('preview') || 0);
})();
</script>
</body>
</html>
