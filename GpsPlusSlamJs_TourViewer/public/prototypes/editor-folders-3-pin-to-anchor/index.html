<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editor Folders: Pin to Anchor</title>
    <!--
  Throwaway prototype: grouping a station's free items, direction "pin to an
  anchor". A group is not a separate folder object: it starts from one item
  (usually a 3D model), other items are pinned to it, and the group takes the
  anchor's position as its pivot and the anchor's name as its own. Moving or
  turning the anchor carries its pinned items; each pinned item can still be
  moved alone, and its position is kept relative to the anchor. In the tree
  the pinned items sit under the anchor; in 3D each pinned item shows a thin
  line to its anchor. Built to sit inside the chosen editor prototypes (the
  explorer tree, the bottom bar with the selection's actions, the studio's
  ring, move arrow, turn knob and scale dots). Original code. Rendering:
  three.js r185 (MIT licence) with OrbitControls. All icons are simple
  original SVG paths. All data is hard-coded sample data; nothing is saved.
  Hidden URL flag: #noabout skips the opening explanation.
-->
    <style>
      :root {
        --bg0: #18191c;
        --bg1: #1f2023;
        --bg2: #26282c;
        --bg3: #2f3136;
        --bg4: #383a40;
        --line: #313338;
        --line2: #3c3f46;
        --text: #d9dbe0;
        --muted: #8a8f99;
        --dim: #646973;
        --accent: #e9a23b;
        --accentBg: rgba(233, 162, 59, 0.14);
        --accentLine: rgba(233, 162, 59, 0.55);
        --accentText: #f3c47e;
        --danger: #d97d79;
        --focus: #5b9cf0;
        --ax-e: #e0575b;
        --ax-n: #4f8fe8;
        --ax-u: #67bb57;
        --pin: #f3c47e;
        --mono:
          "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", ui-monospace,
          Menlo, monospace;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg0);
        color: var(--text);
        font:
          12px/1.4 "Segoe UI",
          system-ui,
          -apple-system,
          "Helvetica Neue",
          Arial,
          sans-serif;
        overflow: hidden;
      }
      body {
        display: grid;
        grid-template-rows: 40px minmax(0, 1fr) 32px;
        grid-template-columns: minmax(0, 1fr);
      }
      svg.i {
        width: 16px;
        height: 16px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.35;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      kbd {
        font: 10px var(--mono);
        color: var(--dim);
      }
      [hidden] {
        display: none !important;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: -2px;
      }

      /* top bar */
      #tb {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px;
        background: var(--bg1);
        border-bottom: 1px solid var(--line);
        min-width: 0;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-right: 10px;
        margin-right: 2px;
        border-right: 1px solid var(--line);
        height: 24px;
        white-space: nowrap;
        min-width: 0;
      }
      .brand b {
        font-weight: 600;
      }
      .brand .doc {
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .grp {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 6px;
        border-right: 1px solid var(--line);
        height: 26px;
      }
      .grp:last-child {
        border-right: 0;
      }
      .tbtn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 8px;
        border: 1px solid transparent;
        border-radius: 4px;
        background: transparent;
        cursor: pointer;
        white-space: nowrap;
        color: var(--text);
      }
      .tbtn:hover:not(:disabled) {
        background: var(--bg3);
      }
      .tbtn:disabled {
        color: var(--dim);
        cursor: default;
      }
      .tbtn.on {
        background: var(--accentBg);
        border-color: var(--accentLine);
        color: var(--accentText);
      }
      .spacer {
        flex: 1;
      }

      /* main: the 3D view with the docks over it */
      #main {
        position: relative;
        min-width: 0;
        min-height: 0;
      }
      #vp {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #232427;
      }
      #vp canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }
      #tags {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .tag {
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 2px 7px 2px 4px;
        border-radius: 3px;
        background: rgba(28, 29, 32, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #e6e8ec;
        font-size: 11px;
        white-space: nowrap;
        cursor: pointer;
      }
      .tag svg.i {
        width: 13px;
        height: 13px;
        color: var(--muted);
      }
      .tag.sel {
        border-color: var(--accent);
      }
      .tag.grp-of {
        border-color: var(--accentLine);
      }
      .tag .pc {
        font: 10px var(--mono);
        background: var(--accentBg);
        color: var(--accentText);
        border-radius: 2px;
        padding: 0 4px;
        display: inline-flex;
        align-items: center;
        gap: 2px;
      }
      .tag .pc svg.i {
        width: 10px;
        height: 10px;
        color: var(--accentText);
      }
      .tag.pinmode {
        padding: 5px 9px 5px 6px;
        font-size: 12px;
      }
      .tag.pinmode.cand {
        border-color: var(--line2);
        background: rgba(40, 42, 46, 0.95);
      }
      .tag.pinmode.on {
        border-color: var(--accent);
        background: rgba(80, 58, 24, 0.95);
        color: #fff;
      }
      .tag.pinmode.anchor {
        border-color: var(--accent);
        background: var(--accent);
        color: #1c1c1c;
      }
      .tag.pinmode.anchor svg.i {
        color: #1c1c1c;
      }
      .tag.pinmode.no {
        opacity: 0.55;
      }
      .ov {
        position: absolute;
        pointer-events: none;
        font-size: 11px;
        color: #b9bdc5;
      }
      #protoTag {
        right: 8px;
        bottom: 8px;
        font-size: 10px;
        color: rgba(220, 222, 226, 0.7);
        padding: 1px 6px;
        border-radius: 3px;
        background: rgba(24, 25, 28, 0.6);
      }
      #toast {
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        padding: 5px 12px;
        border-radius: 4px;
        background: rgba(30, 31, 34, 0.96);
        border: 1px solid var(--line2);
        color: var(--text);
        opacity: 0;
        transition: opacity 0.25s;
        z-index: 9;
        white-space: nowrap;
        max-width: calc(100% - 32px);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #toast.show {
        opacity: 1;
      }
      #readout {
        display: none;
        padding: 3px 7px;
        border-radius: 3px;
        background: rgba(24, 25, 28, 0.92);
        border: 1px solid var(--line2);
        font: 10.5px var(--mono);
        color: var(--text);
        white-space: nowrap;
        z-index: 8;
      }
      #banner {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 12;
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: calc(100% - 24px);
        padding: 6px 6px 6px 10px;
        border-radius: 6px;
        background: rgba(42, 36, 26, 0.97);
        border: 1px solid var(--accent);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        color: #f4e6cf;
      }
      #banner .bt {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #banner svg.i {
        color: var(--accentText);
      }
      #banner b {
        color: #fff;
      }

      /* docks (flush with the edges, only as tall as their content) */
      .dock {
        position: absolute;
        top: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        max-height: calc(100% - 12px);
        background: rgba(31, 32, 35, 0.97);
        border: 1px solid var(--line);
        border-top: 0;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      }
      #tree {
        left: 0;
        width: min(284px, 36vw);
        border-left: 0;
        border-radius: 0 0 8px 0;
      }
      #insp {
        right: 0;
        width: min(296px, 36vw);
        border-right: 0;
        border-radius: 0 0 0 8px;
      }
      .dhead {
        flex: none;
        height: 36px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 5px 0 12px;
        min-width: 0;
      }
      .dock:not(.collapsed) .dhead {
        border-bottom: 1px solid var(--line);
      }
      .dhead .ttlh {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
        white-space: nowrap;
      }
      .dhead .sp {
        flex: 1;
      }
      .ib {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border: 0;
        background: transparent;
        border-radius: 4px;
        color: var(--muted);
        cursor: pointer;
        flex: none;
        padding: 0;
      }
      .ib:hover {
        background: var(--bg3);
        color: var(--text);
      }
      .ib.acc {
        color: var(--accentText);
      }
      .dbody {
        overflow: auto;
        min-height: 0;
      }
      .dock.collapsed .dbody {
        display: none;
      }
      .dock.collapsed .fold svg {
        transform: rotate(180deg);
      }
      .dbody::-webkit-scrollbar {
        width: 10px;
      }
      .dbody::-webkit-scrollbar-thumb {
        background: var(--bg4);
        border: 3px solid var(--bg1);
        border-radius: 6px;
      }

      /* tree (explorer rows) */
      #rows {
        padding: 4px 0 8px;
      }
      .row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 4px;
        height: 26px;
        padding-left: calc(var(--d, 0) * 16px + 4px);
        padding-right: 4px;
        cursor: pointer;
        white-space: nowrap;
        user-select: none;
      }
      .row:hover {
        background: rgba(255, 255, 255, 0.035);
      }
      .row.sel {
        background: var(--accentBg);
        box-shadow: inset 2px 0 0 var(--accent);
      }
      .row.ingrp {
        background: rgba(233, 162, 59, 0.05);
      }
      .row.st {
        height: 30px;
        font-weight: 600;
      }
      .row .grip {
        width: 12px;
        height: 18px;
        flex: none;
        cursor: grab;
        opacity: 0.35;
        touch-action: none;
        background-image: radial-gradient(
          circle,
          #8b919a 1px,
          transparent 1.3px
        );
        background-size: 4px 4px;
        background-position: 2px 1px;
      }
      .row:hover .grip,
      .row.sel .grip {
        opacity: 0.9;
      }
      .row .gsp {
        width: 12px;
        flex: none;
      }
      .tw {
        width: 16px;
        height: 20px;
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        border: 0;
        background: transparent;
        padding: 0;
        cursor: pointer;
      }
      .tw svg {
        width: 12px;
        height: 12px;
        transition: transform 0.12s;
      }
      .tw.open svg {
        transform: rotate(90deg);
      }
      .tw.none {
        visibility: hidden;
      }
      .badge {
        font: 600 10px var(--mono);
        min-width: 18px;
        height: 16px;
        line-height: 16px;
        text-align: center;
        border-radius: 3px;
        background: #3d5a78;
        color: #e6f0fa;
        flex: none;
        padding: 0 3px;
      }
      .row .ti {
        color: var(--muted);
        display: inline-flex;
      }
      .row .ti.story {
        color: var(--accentText);
      }
      .row .ti.model {
        color: #a3b1c2;
      }
      .row .ti.text {
        color: #c7cbd2;
      }
      .row .ti.picture {
        color: #c9a66b;
      }
      .row .ti.sound {
        color: #8fc0b4;
      }
      .nm {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row:not(.st) .nm {
        font-weight: 400;
      }
      .meta {
        font: 10px var(--mono);
        color: var(--dim);
        flex: none;
      }
      .pc {
        font: 10px var(--mono);
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        padding: 0 5px;
        height: 16px;
        border-radius: 8px;
        background: var(--accentBg);
        color: var(--accentText);
      }
      .pc svg.i {
        width: 11px;
        height: 11px;
      }
      .pinned .pinglyph {
        color: var(--pin);
        display: inline-flex;
      }
      .pinned .pinglyph svg.i {
        width: 13px;
        height: 13px;
      }
      /* the indent guide under an anchor: the tree's echo of the thin line in 3D */
      .pinned .guide {
        position: absolute;
        left: calc(var(--d) * 16px - 6px);
        top: 0;
        bottom: 0;
        width: 10px;
        pointer-events: none;
      }
      .pinned .guide::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        border-left: 1px dashed rgba(233, 162, 59, 0.55);
      }
      .pinned .guide::after {
        content: "";
        position: absolute;
        left: 0;
        top: 50%;
        width: 8px;
        border-top: 1px dashed rgba(233, 162, 59, 0.55);
      }
      .pinned.last .guide::before {
        bottom: 50%;
      }
      .hov {
        width: 24px;
        height: 22px;
        opacity: 0;
        color: var(--accentText);
      }
      .row:hover .hov,
      .row.sel .hov,
      .hov:focus-visible {
        opacity: 1;
      }
      @media (hover: none) {
        .hov {
          opacity: 0.8;
        }
      }
      .ck {
        width: 14px;
        height: 14px;
        flex: none;
        border: 1px solid #6a6f78;
        border-radius: 3px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .ck svg.i {
        width: 11px;
        height: 11px;
        stroke-width: 2;
        opacity: 0;
      }
      .row.sel .ck {
        background: var(--accent);
        border-color: var(--accent);
        color: #1c1c1c;
      }
      .row.sel .ck svg.i {
        opacity: 1;
      }
      .pinchip {
        flex: none;
        height: 20px;
        padding: 0 8px;
        border-radius: 10px;
        border: 1px solid var(--line2);
        background: var(--bg3);
        color: var(--muted);
        font-size: 11px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .pinchip.on {
        border-color: var(--accent);
        background: var(--accentBg);
        color: var(--accentText);
      }
      .pinchip.anchor {
        border-color: var(--accent);
        background: var(--accent);
        color: #1c1c1c;
      }
      .pinchip svg.i {
        width: 11px;
        height: 11px;
      }
      .row.no {
        opacity: 0.5;
      }
      .sech {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 6px 10px 0 12px;
        color: var(--muted);
        user-select: none;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .sech .count {
        font: 10px var(--mono);
        color: var(--dim);
        letter-spacing: 0;
      }
      .row.drop-before::before,
      .row.drop-after::after {
        content: "";
        position: absolute;
        left: calc(var(--d, 0) * 16px + 4px);
        right: 6px;
        height: 2px;
        background: var(--accent);
        border-radius: 1px;
        pointer-events: none;
      }
      .row.drop-before::before {
        top: -1px;
      }
      .row.drop-after::after {
        bottom: -1px;
      }
      .row.drop-into {
        background: var(--accentBg);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .row.dragging {
        opacity: 0.4;
      }
      .unpinzone {
        display: none;
        margin: 4px 8px 2px 20px;
        height: 32px;
        border: 1px dashed var(--line2);
        border-radius: 5px;
        color: var(--muted);
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 11px;
      }
      /* while a pinned row is carried, the unpin zone sticks to the list's bottom: always in reach */
      body.drag-pinned .unpinzone {
        display: flex;
        position: sticky;
        bottom: 6px;
        z-index: 2;
        background: rgba(36, 38, 42, 0.97);
      }
      .unpinzone.drop-into {
        border-color: var(--accent);
        color: var(--accentText);
        background: var(--accentBg);
      }
      .treefoot {
        padding: 8px 12px 10px;
        color: var(--dim);
        font-size: 11px;
        line-height: 1.5;
        border-top: 1px solid var(--line);
      }
      #ghost {
        position: fixed;
        z-index: 60;
        pointer-events: none;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 9px;
        border-radius: 4px;
        background: rgba(36, 38, 42, 0.97);
        border: 1px solid var(--accentLine);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
        white-space: nowrap;
        font-size: 12px;
      }
      #ghost .say {
        font-size: 10.5px;
        color: var(--accentText);
      }
      #ghost.refused {
        border-color: var(--danger);
      }
      #ghost.refused .say {
        color: var(--danger);
      }
      html[data-nest-drag="refused"],
      html[data-nest-drag="refused"] * {
        cursor: not-allowed !important;
      }
      html[data-nest-drag="on"],
      html[data-nest-drag="on"] * {
        cursor: grabbing !important;
      }

      /* inspector */
      #insp .dhead {
        padding-left: 8px;
      }
      .hic {
        display: inline-flex;
        width: 22px;
        justify-content: center;
        color: var(--accentText);
        flex: none;
      }
      .ttlin {
        flex: 1;
        min-width: 0;
        height: 26px;
        border: 1px solid transparent;
        border-radius: 4px;
        background: transparent;
        color: #f0f1f3;
        font:
          600 13.5px "Segoe UI",
          system-ui,
          sans-serif;
        padding: 0 5px;
        outline: none;
        text-overflow: ellipsis;
      }
      .ttlin:hover {
        border-color: var(--line2);
      }
      .ttlin:focus {
        border-color: var(--focus);
        background: var(--bg2);
      }
      .ttlstatic {
        flex: 1;
        min-width: 0;
        font:
          600 13.5px "Segoe UI",
          system-ui,
          sans-serif;
        color: #f0f1f3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .crumb {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 12px 2px;
        color: var(--dim);
        font-size: 11px;
        min-width: 0;
        flex-wrap: wrap;
      }
      .crumb button {
        border: 0;
        background: transparent;
        padding: 0;
        color: var(--muted);
        cursor: pointer;
      }
      .crumb button:hover {
        color: var(--text);
        text-decoration: underline;
      }
      .isec {
        padding: 6px 12px 8px;
        border-top: 1px solid var(--line);
      }
      .isec:first-child {
        border-top: 0;
      }
      .ilab {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 2px 0 6px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .ilab .count {
        font: 10px var(--mono);
        color: var(--dim);
        letter-spacing: 0;
      }
      .note {
        color: var(--dim);
        font-size: 11px;
        line-height: 1.45;
        margin: 3px 0 4px;
      }
      .warn {
        color: #e9b86b;
        font-size: 11px;
        line-height: 1.45;
        margin: 4px 0 2px;
      }
      .act {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        min-height: 28px;
        padding: 0 8px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        cursor: pointer;
        text-align: left;
        color: var(--text);
      }
      .act:hover:not(:disabled) {
        background: var(--bg3);
      }
      .act svg {
        color: var(--accentText);
      }
      .act kbd {
        margin-left: auto;
      }
      .act:disabled {
        color: var(--dim);

      const $ = (s, r = document) => r.querySelector(s);
      const DEG = Math.PI / 180;

      const norm360 = (h) => ((h % 360) + 360) % 360;

      // ---------------------------------------------------------------- icons (original paths)
      const P = {

        check: "M3 8.5l3 3 7-7",

        multi:
          "M2.5 2.5h5v5h-5z M3.8 5l1.2 1.2 2-2.2 M9.5 4h4 M2.5 9.5h5v5h-5z M9.5 11.5h4",
        target:
          "M8 13.5a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11z M8 9.6a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2z",
        reset: "M2.8 8a5.2 5.2 0 1 0 1.6-3.8 M2.5 2.5v2.8h2.8",

      const icon = (n) =>

      const fillIcons = (root = document) =>
        root.querySelectorAll("i[data-icon]").forEach((el) => {

      const TYPE_LABEL = {

      // ---------------------------------------------------------------- the data
      // Station-local metres: e east, n north, y up. h = the heading an item faces (degrees clockwise from north).
      // A free item stores its pose in the station's frame. A PINNED item (anchor set) stores its pose in its
      // anchor's frame: e to the anchor's right, n ahead of it, y above it, h relative to the anchor's heading.
      // That relative pose is the whole "folder": move or turn the anchor and its pinned items follow.
      function initState() {
        return {
          station: { name: "Market Square", num: 1, radius: 12 },
          items: [
            {
              id: "m1",
              type: "model",
              name: "Fountain",
              e: 0,
              n: 2,
              y: 0,
              h: 0,
              s: 1,
              anchor: null,
            },

              id: "t1",

              n: 2.8,

              h: 165,
              s: 1,
              anchor: null,
            },
            {

              e: -2.7,

              y: 1.3,

          ],
          sel: [],
          nextId: 20,
        };
      }
      let S = initState();
      const ui = {
        alone: false,
        multi: false,
        pinMode: null,
        open: {},
        storyOpen: { s1: true },
        tab: "tree",
        anchorPick: null,

      const byId = (id) => S.items.find((i) => i.id === id) || null;
      const pinsOf = (id) => S.items.filter((i) => i.anchor === id);
      const hasPins = (it) => !!it && pinsOf(it.id).length > 0;
      const selItems = () => S.sel.map(byId).filter(Boolean);
      const primary = () => (S.sel.length ? S.sel[S.sel.length - 1] : null);
      const newId = (p) => p + S.nextId++;

      function pose(it) {
        if (!it.anchor)
          return { e: it.e, n: it.n, y: it.y, h: it.h, s: it.s || 1 };
        const a = byId(it.anchor);
        if (!a) return { e: it.e, n: it.n, y: it.y, h: it.h, s: it.s || 1 };
        const ap = pose(a);
        const c = Math.cos(ap.h * DEG),
          s = Math.sin(ap.h * DEG);
        return {
          e: ap.e + it.e * c + it.n * s,
          n: ap.n - it.e * s + it.n * c,
          y: ap.y + it.y,
          h: norm360(ap.h + it.h),
          s: it.s || 1,
        };
      }
      function setWorld(it, W) {
        if (it.anchor) {
          const ap = pose(byId(it.anchor));
          const c = Math.cos(ap.h * DEG),
            s = Math.sin(ap.h * DEG);
          const de = W.e - ap.e,
            dn = W.n - ap.n;
          it.e = de * c - dn * s;
          it.n = de * s + dn * c;
          it.y = W.y - ap.y;
          it.h = norm360(W.h - ap.h);
        } else {
          it.e = W.e;
          it.n = W.n;
          it.y = W.y;
          it.h = norm360(W.h);
        }
      }
      /** The array order is the tree order: top-level items in order, each anchor's pins in order. */
      function moveInArray(it, refFn, after) {
        const i = S.items.indexOf(it);
        if (i < 0) return;
        S.items.splice(i, 1);
        const ref = refFn();
        const j = ref ? S.items.indexOf(ref) : -1;
        if (j < 0) S.items.push(it);
        else S.items.splice(j + (after ? 1 : 0), 0, it);
      }
      const lastOfGroup = (aid) => {
        const p = pinsOf(aid);
        return p.length ? p[p.length - 1] : byId(aid);
      };
      /** May `d` be pinned to `a`? One level deep: an anchor is never pinned, and an item that holds pins is never pinned. */
      function pinRefusal(d, a) {
        if (!d || !a) return "nothing to pin to";
        if (d.id === a.id) return "an item cannot be pinned to itself";
        if (a.anchor)

          hist.future.length = 0;

        const g = hist.gesture;
        hist.gesture = null;

        const e = hist.past.pop();
        if (!e) return toast("Nothing to undo");

      let vpW = 1,

      const wppAt = (x, y, z) =>

      const BASE_R = { model: 1.6, text: 0.95, picture: 0.9, sound: 0 };
      function itemRadius(it) {

      /** What the gizmo works on: one item (a group when it is an anchor and the mode is "with pinned items"), or several. */
      function gizmoFrame() {
        if (ui.pinMode) return null;

      }

      function movers(its) {
        const ids = new Set(its.map((i) => i.id));
        return its.filter((i) => !(i.anchor && ids.has(i.anchor)));
      }
      let hoverHandle = null,
        gdrag = null;
      function updateHandles() {
        const f = gizmoFrame();
        for (const o of HANDLES) o.visible = false;
        if (!f) return;
        const q = pxScale();
        const wpp = wppAt(f.x, 0, f.z);
        const fx = Math.sin(f.F * DEG),
          fz = -Math.cos(f.F * DEG);
        const big = (n) =>
          hoverHandle === n || (gdrag && gdrag.type === n) ? 1.15 : 1;
        hRing.visible = true;
        hRing.position.set(f.x, 0.04, f.z);
        hRing.scale.set(f.R, 1, f.R);
        hMat.opacity = f.group ? 1 : 0.9;
        // the move arrow fills a single item's ring; for a group it covers the anchor only,
        // so a tap on a pinned item still selects that item
        const Rm =
          f.items.length > 1
            ? 34 * wpp
            : f.group
              ? Math.max(itemRadius(f.items[0]), 34 * wpp)
              : f.R;
        hDisc.visible = true;
        hDisc.position.set(f.x, 0.05, f.z);
        hDisc.scale.set(Rm, 1, Rm);
        hMoveMat.opacity =
          hoverHandle === "move" || (gdrag && gdrag.type === "move") ? 1 : 0.85;
        if (f.dots)
          hDots.forEach((d, i) => {
            const a = (f.F + 45 + i * 90) * DEG;
            d.visible = true;
            d.position.set(
              f.x + Math.sin(a) * f.R,
              0.3,
              f.z - Math.cos(a) * f.R,
            );
            d.scale.setScalar(30 * q * big("scale"));
          });
        const L = f.R + 32 * wpp;
        hKnob.visible = true;
        hKnob.position.set(f.x + fx * L, 0.35, f.z + fz * L);
        hKnob.scale.setScalar(42 * q * big("rotate"));
        hBar.visible = true;
        hBar.position.set(f.x + fx * f.R, 0.05, f.z + fz * f.R);
        hBar.rotation.y = -f.F * DEG;
        hBar.scale.set(Math.max(0.02, 2 * wpp), 1, L - f.R);
      }

      // ---------------------------------------------------------------- picking
      const raycaster = new THREE.Raycaster();
      const ndc = new THREE.Vector2();
      function setNDC(e) {
        const r = canvas.getBoundingClientRect();
        ndc.set(
          ((e.clientX - r.left) / r.width) * 2 - 1,
          -((e.clientY - r.top) / r.height) * 2 + 1,
        );
      }
      function pickItem() {
        raycaster.setFromCamera(ndc, camera);
        const h = raycaster.intersectObjects(pickables, false)[0];
        return h ? h.object.userData.pick : null;
      }
      function groundHit() {
        raycaster.setFromCamera(ndc, camera);
        const p = new THREE.Vector3();
        return raycaster.ray.intersectPlane(
          new THREE.Plane(new THREE.Vector3(0, 1, 0), 0),
          p,
        )
          ? p
          : null;
      }
      function pickHandle() {
        const f = gizmoFrame();
        if (!f) return null;
        raycaster.setFromCamera(ndc, camera);
        const sprites = [...hDots, hKnob].filter((s) => s.visible);
        const h = raycaster.intersectObjects(sprites, false)[0];
        if (h) return h.object.userData.handle;
        const hit = pickItem();
        if (hit) return S.sel.includes(hit) ? "move" : null; // another item under the pointer: a click selects it
        raycaster.setFromCamera(ndc, camera);
        if (hDisc.visible && raycaster.intersectObject(hDisc, false).length)
          return "move";
        return null;
      }

      // ---------------------------------------------------------------- gizmo drags
      const readout = $("#readout");
      function showReadout(e, txt) {
        const r = vp.getBoundingClientRect();
        readout.style.display = "block";
        readout.textContent = txt;
        readout.style.left =
          clamp(e.clientX - r.left + 16, 4, r.width - 220) + "px";
        readout.style.top =
          clamp(e.clientY - r.top + 14, 4, r.height - 24) + "px";
      }
      const compassOf = (cx, cz, p) => Math.atan2(p.x - cx, -(p.z - cz)) / DEG;
      function startDrag(handle, e) {
        const f = gizmoFrame();
        const pt = groundHit();
        if (!f || !pt) return false;
        const alone = ui.alone || e.altKey;
        const single = f.items.length === 1 ? f.items[0] : null;
        // start poses: the items the gizmo moves, plus the pinned items it must leave in place ("alone")
        const keep =
          single && hasPins(single) && alone ? pinsOf(single.id) : [];
        gdrag = {
          type: handle,
          pointerId: e.pointerId,
          f,
          alone,
          single,
          keep: keep.map((p) => ({ id: p.id, W: pose(p) })),
          start: f.items.map((it) => ({ id: it.id, W: pose(it) })),
          off: { x: f.x - pt.x, z: f.z - pt.z },
          a0: compassOf(f.x, f.z, pt),
          d0: Math.max(0.2, Math.hypot(pt.x - f.x, pt.z - f.z)),
          pinsStart:
            single && hasPins(single) && !alone
              ? pinsOf(single.id).map((p) => ({
                  id: p.id,
                  e: p.e,
                  n: p.n,
                  y: p.y,
                  s: p.s || 1,
                }))
              : [],
        };
        const what = single
          ? hasPins(single)
            ? alone
              ? `"${single.name}" alone`
              : `group "${single.name}"`
            : `"${single.name}"`
          : `${f.items.length} items`;
        beginGesture(
          (handle === "move"
            ? "Move "
            : handle === "rotate"
              ? "Turn "
              : "Scale ") + what,
        );
        lockCam(true);
        canvas.style.cursor = "grabbing";
        return true;
      }
      function applyDrag(e) {
        const d = gdrag;
        const pt = groundHit();
        if (!pt) return;
        if (d.type === "move") {
          let x = pt.x + d.off.x,
            z = pt.z + d.off.z;
          if (e.shiftKey) {
            x = Math.round(x * 2) / 2;
            z = Math.round(z * 2) / 2;
          }
          x = clamp(x, -40, 40);
          z = clamp(z, -40, 40);
          const dE = x - d.f.x,
            dN = -(z - d.f.z);
          for (const s of d.start) {
            const it = byId(s.id);
            setWorld(it, { ...s.W, e: s.W.e + dE, n: s.W.n + dN });
          }
        } else if (d.type === "rotate") {
          let dh = angDiff(d.a0, compassOf(d.f.x, d.f.z, pt));
          dh = e.shiftKey ? Math.round(dh / 15) * 15 : Math.round(dh);
          const c = Math.cos(dh * DEG),
            s = Math.sin(dh * DEG);
          const ce = d.f.x,
            cn = -d.f.z;
          for (const st of d.start) {
            const it = byId(st.id);
            const de = st.W.e - ce,
              dn = st.W.n - cn;
            setWorld(it, {
              ...st.W,
              e: ce + de * c + dn * s,
              n: cn - de * s + dn * c,
              h: st.W.h + dh,
            });
          }
        } else if (d.single) {
          const k = Math.hypot(pt.x - d.f.x, pt.z - d.f.z) / d.d0;
          const s0 = d.start[0].W.s;
          const s1 = clamp(Math.round(s0 * k * 20) / 20, 0.25, 6);
          const ratio = s1 / s0;
          d.single.s = s1;
          for (const p0 of d.pinsStart) {
            const p = byId(p0.id);
            p.e = p0.e * ratio;
            p.n = p0.n * ratio;
            p.y = p0.y * ratio;
            if (p.type === "model") p.s = clamp(p0.s * ratio, 0.25, 6);
          }
        }
        for (const k of d.keep) setWorld(byId(k.id), k.W); // "alone": the pinned items stay where they stand
        showReadout(e, dragText(d));
        afterChange(false);
      }
      function dragText(d) {
        const it = d.single;
        if (d.type === "scale")
          return (
            `size x${fmt(it.s, 2)}` +
            (d.pinsStart.length
              ? ` - ${d.pinsStart.length} pinned keep their side of it`
              : "")
          );
        if (d.type === "rotate") {
          const W = pose(d.start[0] ? byId(d.start[0].id) : it);
          return (
            `facing ${Math.round(W.h)} deg` +
            (d.alone && d.keep.length
              ? " - pinned items stay"
              : d.single && hasPins(d.single)
                ? ` - ${pinsOf(d.single.id).length} pinned turn with it`
                : "") +
            "  (Shift: 15 deg steps)"
          );
        }
        if (it && it.anchor) {
          const a = byId(it.anchor);
          const W = pose(it),
            A = pose(a);
          return `${fmt(Math.hypot(W.e - A.e, W.n - A.n))} m from ${a.name} - stays pinned`;
        }
        const W = it ? pose(it) : null;
        if (it && hasPins(it))
          return d.alone
            ? `E ${fmt(W.e)}  N ${fmt(W.n)} - ${it.name} alone, its pinned items stay`
            : `E ${fmt(W.e)}  N ${fmt(W.n)} - ${pinsOf(it.id).length} pinned items follow (Alt: alone)`;
        if (it) return `E ${fmt(W.e)}  N ${fmt(W.n)}`;
        return `${d.start.length} items move together - pin them to keep them together`;
      }
      function endDrag() {
        gdrag = null;
        lockCam(false);
        readout.style.display = "none";
        canvas.style.cursor = "";
        endGesture();
        afterChange(true);
      }
      function cancelDrag() {
        gdrag = null;
        lockCam(false);
        readout.style.display = "none";
        canvas.style.cursor = "";
        abortGesture();
        afterChange(true);
        toast("Two fingers move the camera - the edit was undone");
      }

      // ---------------------------------------------------------------- pointer on the 3D view
      const touchIds = new Set();
      let touchBlocked = false;
      let ptr = null;
      vp.addEventListener(
        "pointerdown",
        (e) => {
          if (e.pointerType === "touch") {
            touchIds.add(e.pointerId);
            if (touchIds.size > 1) {
              touchBlocked = true;
              if (gdrag) cancelDrag();
              if (ptr) ptr.multi = true;
              return;
            }
          }
          if (e.target !== canvas) return;
          canvas.focus({ preventScroll: true });
          setNDC(e);
          ptr = {
            id: e.pointerId,
            x: e.clientX,
            y: e.clientY,
            b: e.button,
            moved: false,
            multi: touchBlocked,
            touch: e.pointerType === "touch",
            mod: e.ctrlKey || e.metaKey || e.shiftKey,
          };
          if (touchBlocked || e.button !== 0) return;
          const h = pickHandle();
          if (h && startDrag(h, e)) ptr.drag = true;
        },
        true,
      );
      window.addEventListener("pointermove", (e) => {
        if (gdrag && e.pointerId === gdrag.pointerId) {
          setNDC(e);
          if (ptr) ptr.moved = true;
          applyDrag(e);
          return;
        }
        if (
          ptr &&
          e.pointerId === ptr.id &&
          Math.hypot(e.clientX - ptr.x, e.clientY - ptr.y) > (ptr.touch ? 8 : 4)
        )
          ptr.moved = true;
        if (!ptr && e.target === canvas && e.pointerType === "mouse") {
          setNDC(e);
          const h = pickHandle();
          hoverHandle = h;
          canvas.style.cursor =
            h === "move"
              ? "move"
              : h === "rotate"
                ? "grab"
                : h === "scale"
                  ? "nesw-resize"
                  : pickItem()
                    ? "pointer"
                    : "";
        }
      });
      function onPointerEnd(e) {
        if (e.pointerType === "touch") {
          touchIds.delete(e.pointerId);
          if (touchIds.size === 0) touchBlocked = false;
        }
        if (gdrag && e.pointerId === gdrag.pointerId) {
          if (e.type === "pointercancel") cancelDrag();
          else endDrag();
        }
        if (!ptr || e.pointerId !== ptr.id) return;
        const p = ptr;
        ptr = null;
        if (
          e.type === "pointerup" &&
          !p.moved &&
          !p.drag &&
          !p.multi &&
          p.b === 0 &&
          e.target === canvas
        ) {
          setNDC(e);
          tapItem(pickItem(), p.mod);
        }
      }
      window.addEventListener("pointerup", onPointerEnd);
      window.addEventListener("pointercancel", onPointerEnd);
      canvas.addEventListener("contextmenu", (e) => e.preventDefault());
      canvas.addEventListener("dblclick", () => {
        if (S.sel.length) frameSelection();
      });

      /** A tap on an item (3D, tag or tree): pin mode toggles its pin, otherwise it selects. */
      function tapItem(id, additive) {
        if (ui.pinMode) {
          if (id) togglePin(id);
          return;
        }
        if (!id) {
          if (!additive && !ui.multi) select([]);
          return;
        }
        if (additive || ui.multi) {
          const i = S.sel.indexOf(id);
          const next = S.sel.filter((x) => x !== id);
          if (i < 0) next.push(id);
          select(next);
        } else select([id]);
      }
      function select(ids) {
        S.sel = ids.slice();
        ui.anchorPick = null;
        afterChange(true);
      }

      // ---------------------------------------------------------------- the commands
      function startPinMode(aid) {
        const a = byId(aid);
        if (!a) return;
        if (a.anchor)
          return toast(
            `"${a.name}" is pinned itself - folders are one level deep`,
          );
        ui.pinMode = aid;
        ui.open[aid] = true;
        S.sel = [aid];
        afterChange(true);
      }
      function endPinMode(quiet) {
        if (!ui.pinMode) return;
        const a = byId(ui.pinMode);
        ui.pinMode = null;
        if (!quiet) {
          afterChange(true);
          if (a) toast(`${pinsOf(a.id).length} items pinned to ${a.name}`);
        }
      }
      function pinTo(it, aid, label) {
        const W = pose(it);
        it.anchor = aid;
        setWorld(it, W);
        moveInArray(it, () => lastOfGroup(aid), true);
        ui.open[aid] = true;
        return label;
      }
      function unpinItem(it) {
        const W = pose(it);
        const aid = it.anchor;
        it.anchor = null;
        setWorld(it, W);
        moveInArray(it, () => lastOfGroup(aid), true);
      }
      function togglePin(id) {
        const A = byId(ui.pinMode),
          it = byId(id);
        if (!A || !it) return;
        if (id === A.id) return toast(`${A.name} is the anchor`);
        if (it.anchor === A.id) {
          commit(`Unpin "${it.name}"`, () => unpinItem(it));
          return toast(`Unpinned "${it.name}" - it stays where it stands`);
        }
        const why = pinRefusal(it, A);
        if (why) return toast("Not possible here: " + why);
        const from = it.anchor ? byId(it.anchor) : null;
        commit(`Pin "${it.name}" to ${A.name}`, () => pinTo(it, A.id));
        toast(
          from
            ? `Moved the pin from ${from.name} to ${A.name}`
            : `Pinned "${it.name}" to ${A.name}`,
        );
      }
      /** The anchor a multi-selection would be pinned to: the chosen one, else a 3D model, else the first selected. */
      function anchorFor(its) {
        const pick = its.find((i) => i.id === ui.anchorPick);
        return (
          pick ||
          its.find((i) => i.type === "model" && !i.anchor) ||
          its.find((i) => !i.anchor) ||
          its[0]
        );
      }
      function pinSelectionRefusal(its) {
        if (its.length < 2) return "select at least two items";
        const A = anchorFor(its);
        if (A.anchor)
          return `"${A.name}" is pinned to ${byId(A.anchor).name} - unpin it before it can be an anchor`;
        for (const it of its) {
          if (it === A) continue;
          const why = pinRefusal(it, A);
          if (why) return why;
        }
        return null;
      }
      function pinSelection() {
        const its = selItems();
        const why = pinSelectionRefusal(its);
        if (why) return toast("Not possible: " + why);
        const A = anchorFor(its);
        const others = its.filter((i) => i !== A);
        commit(`Pin ${others.length} items to ${A.name}`, () => {
          for (const it of others) pinTo(it, A.id);
          S.sel = [A.id];
        });
        toast(
          `${others.length} items pinned to ${A.name} - the group is named after it`,
        );
      }
      function unpinAll(aid) {
        const a = byId(aid);
        const ps = pinsOf(aid);
        if (!ps.length) return;
        commit(`Unpin all from ${a.name}`, () => {
          for (const p of ps.slice().reverse()) unpinItem(p);
        });
        toast(`${ps.length} items unpinned - they stay where they stand`);
      }
      function unpinSelected() {
        const ps = selItems().filter((i) => i.anchor);
        if (!ps.length) return;
        commit(
          ps.length === 1
            ? `Unpin "${ps[0].name}"`
            : `Unpin ${ps.length} items`,
          () => ps.forEach(unpinItem),
        );
        toast(
          ps.length === 1
            ? `Unpinned "${ps[0].name}" - it stays where it stands`
            : `${ps.length} items unpinned`,
        );
      }
      function cloneItem(it, over) {
        return {
          ...JSON.parse(JSON.stringify(it)),
          id: newId(it.type[0]),
          name: it.name + " (copy)",
          ...over,
        };
      }
      function duplicate(mode) {
        const it = byId(primary());
        if (!it) return;
        if (hasPins(it) && mode !== "only") {
          commit(`Duplicate group "${it.name}"`, () => {
            const W = pose(it);
            const a2 = cloneItem(it, { anchor: null });
            setWorld(a2, { ...W, e: W.e + 5 });
            const end = lastOfGroup(it.id);
            let at = S.items.indexOf(end) + 1;
            S.items.splice(at++, 0, a2);
            for (const p of pinsOf(it.id)) {
              const c = cloneItem(p, { anchor: a2.id, name: p.name });
              S.items.splice(at++, 0, c);
            }
            ui.open[a2.id] = true;
            S.sel = [a2.id];
          });
          return toast(
            "Duplicated the group: the copy keeps its pins, 5 m to the east",
          );
        }
        commit(`Duplicate "${it.name}"`, () => {
          const c = cloneItem(it, { anchor: it.anchor });
          if (it.anchor) {
            c.e = it.e + 0.7;
          } else {
            const W = pose(it);
            c.e = W.e + 2;
          }
          S.items.splice(
            S.items.indexOf(it.anchor ? it : lastOfGroup(it.id)) + 1,
            0,
            c,
          );
          S.sel = [c.id];
        });
        toast(
          it.anchor
            ? `Duplicated - the copy is pinned to ${byId(it.anchor).name} too`
            : hasPins(it)
              ? `Duplicated ${it.name} alone - its pins stay on the original`
              : "Duplicated",
        );
      }
      function duplicateStory(sid) {
        const s = S.stories.find((x) => x.id === sid);
        if (!s) return;
        commit(`Duplicate story "${s.name}"`, () => {
          const c = {
            id: newId("s"),
            name: s.name + " (copy)",
            steps: s.steps.map((st) => ({ id: newId("st"), name: st.name })),
          };
          S.stories.splice(S.stories.indexOf(s) + 1, 0, c);
          S.sel = ["story:" + c.id];
          ui.storyOpen[c.id] = true;
        });
        toast(`Duplicated the story with its ${s.steps.length} steps`);
      }
      /** Unpin one item without changing the selection (the list's and the details' unpin buttons). */
      function unpinOne(id) {
        const p = byId(id);
        if (!p || !p.anchor) return;
        commit(`Unpin "${p.name}"`, () => unpinItem(p));
        toast(`Unpinned "${p.name}" - it stays where it stands`);
      }
      function deleteSel() {
        const its = selItems();
        if (!its.length) return;
        const anchors = its.filter(hasPins);
        const dangling = anchors
          .flatMap((a) => pinsOf(a.id))
          .filter((p) => !S.sel.includes(p.id));
        if (dangling.length) return askDelete(its, anchors, dangling);
        commit(
          its.length === 1
            ? `Delete "${its[0].name}"`
            : `Delete ${its.length} items`,
          () => {
            const ids = new Set(its.map((i) => i.id));
            S.items = S.items.filter((i) => !ids.has(i.id));
            S.sel = [];
          },
        );
      }
      function doDelete(its, keepPins) {
        const ids = new Set(its.map((i) => i.id));
        const anchors = its.filter(hasPins);
        commit(
          keepPins
            ? `Delete ${anchors.map((a) => a.name).join(", ")}, keep its pinned items`
            : `Delete ${anchors.map((a) => a.name).join(", ")} with its pinned items`,
          () => {
            for (const a of anchors)
              for (const p of pinsOf(a.id)) {
                if (keepPins) {
                  if (!ids.has(p.id)) unpinItem(p);
                } else ids.add(p.id);
              }
            S.items = S.items.filter((i) => !ids.has(i.id));
            S.sel = [];
          },
        );
        toast(
          keepPins
            ? "Deleted - the pinned items are free now and stay where they stood"
            : "Deleted the group",
        );
      }

      // ---------------------------------------------------------------- tree
      const treeBody = $("#treeBody");
      function rowItem(it, depth, extra = "") {
        const sel = S.sel.includes(it.id);
        const pins = pinsOf(it.id);
        const open = ui.open[it.id] !== false;
        const hot = hotGroup();
        const inGrp = !sel && hot && (it.id === hot || it.anchor === hot);
        const pm = ui.pinMode;
        let chip = "",
          no = "";
        if (pm) {
          if (it.id === pm)
            chip = `<span class="pinchip anchor">${icon("pin")}Anchor</span>`;
          else if (it.anchor === pm)
            chip = `<span class="pinchip on">${icon("check")}Pinned</span>`;
          else {
            const why = pinRefusal(it, byId(pm));
            chip = why ? "" : `<span class="pinchip">${icon("plus")}Pin</span>`;
            if (why) no = ` no" title="${esc(why)}`;
          }
        }
        const kids = pins.length
          ? `<button class="tw${open ? " open" : ""}" data-fold="${it.id}" title="${open ? "Fold" : "Unfold"} the pinned items">${icon("chev")}</button>`
          : depth === 1
            ? '<span class="tw none"></span>'
            : "";
        const ck =
          ui.multi && !pm ? `<span class="ck">${icon("check")}</span>` : "";
        const pinG = it.anchor
          ? `<span class="guide"></span><span class="pinglyph" title="Pinned to ${esc(byId(it.anchor)?.name || "")}">${icon("pin")}</span>`
          : "";
        const count =
          pins.length && !pm
            ? `<span class="pc" title="${pins.length} items pinned to it: this is a group">${icon("pin")}${pins.length}</span>`
            : "";
        const hov = pm
          ? ""
          : it.anchor

      function drawTree() {

          h += rowItem(it, 1);

            pins.forEach((p, i) => {
              h += rowItem(p, 2, i === pins.length - 1 ? " last" : "");

        h += `<div class="unpinzone" data-k="unpinzone">${icon("unpin")}Drop here to unpin - it stays where it stands</div>`;
        h += `</div><div class="treefoot">${ui.pinMode ? "Tap items to pin or unpin them." : "Select an item and <b>Pin items here</b>, or drag a row onto another item to pin it there. Drag a pinned row out to unpin it."}</div>`;

      treeBody.addEventListener("click", (e) => {

      });
      treeBody.addEventListener("keydown", (e) => {
        if (
          (e.key === "Enter" || e.key === " ") &&
          e.target.classList.contains("row")

          e.preventDefault();
          e.target.click();
        }
      });

      // tree drag: a row by its grip, onto an item (pin it there), between rows (place it), onto the unpin zone
      let tdrag = null,
        tdragJustEnded = false;
      treeBody.addEventListener("pointerdown", (e) => {
        const grip = e.target.closest(".grip");
        if (!grip || e.button !== 0) return;
        const row = grip.closest(".row");
        e.preventDefault();
        tdrag = {
          id: row.dataset.id,
          pid: e.pointerId,
          x0: e.clientX,
          y0: e.clientY,
          on: false,
          target: null,
          ghost: null,
        };
      });
      function clearMarks() {
        treeBody
          .querySelectorAll(".drop-before,.drop-after,.drop-into")
          .forEach((el) =>
            el.classList.remove("drop-before", "drop-after", "drop-into"),
          );
      }
      function treeTarget(x, y) {
        const d = byId(tdrag.id);
        const el = document.elementFromPoint(x, y);
        const row = el && el.closest("#treeBody .row, #treeBody .unpinzone");
        if (!row) return null;
        const k = row.dataset.k,
          id = row.dataset.id;
        if (k === "unpinzone")
          return d.anchor
            ? {
                el: row,
                mark: "drop-into",
                op: { kind: "unpin" },
                say: "Unpin - it stays where it stands",
              }
            : null;
        if (id === d.id) return null;
        const r = row.getBoundingClientRect();
        const rel = (y - r.top) / r.height;
        if (k === "item") {
          const T = byId(id);
          const why = pinRefusal(d, T);
          if (!why && rel > 0.25 && rel < 0.75)
            return {
              el: row,
              mark: "drop-into",
              op: { kind: "pin", anchor: T.id },
              say: "Pin to " + T.name,
            };
          if (rel <= 0.5)
            return {
              el: row,
              mark: "drop-before",
              op: { kind: "place", anchor: null, ref: T.id, after: false },
              say: d.anchor ? "Unpin and place here" : "Place here",
            };
          if (hasPins(T) && ui.open[T.id] !== false)
            return why
              ? null
              : {
                  el: row,
                  mark: "drop-after",
                  op: {
                    kind: "place",
                    anchor: T.id,
                    ref: pinsOf(T.id)[0].id,
                    after: false,
                  },
                  say: "Pin to " + T.name,
                };
          return {
            el: row,
            mark: "drop-after",
            op: {
              kind: "place",
              anchor: null,
              ref: T.id,
              after: true,
              group: true,
            },
            say: d.anchor ? "Unpin and place here" : "Place here",
          };
        }
        if (k === "pinned") {
          const Pn = byId(id);
          const A = byId(Pn.anchor);
          if (pinRefusal(d, A)) return null;
          return {
            el: row,
            mark: rel < 0.5 ? "drop-before" : "drop-after",
            op: { kind: "place", anchor: A.id, ref: Pn.id, after: rel >= 0.5 },
            say: d.anchor === A.id ? "Place here" : "Pin to " + A.name,

        return null;
      }
      window.addEventListener("pointermove", (e) => {
        if (!tdrag || e.pointerId !== tdrag.pid) return;
        if (!tdrag.on) {
          if (Math.hypot(e.clientX - tdrag.x0, e.clientY - tdrag.y0) < 5)
            return;
          tdrag.on = true;
          const d = byId(tdrag.id);
          tdrag.ghost = document.createElement("div");
          tdrag.ghost.id = "ghost";
          document.body.append(tdrag.ghost);
          tdrag.ghost.innerHTML = `${icon(d.type)}<span>${esc(d.name)}</span><span class="say"></span>`;
          treeBody
            .querySelector(`.row[data-id="${tdrag.id}"]`)
            ?.classList.add("dragging");
          document.body.classList.toggle("drag-pinned", !!d.anchor);
        }
        const touch = e.pointerType === "touch";
        tdrag.ghost.style.left = e.clientX + (touch ? -24 : 14) + "px";
        tdrag.ghost.style.top = e.clientY + (touch ? -64 : 12) + "px";
        clearMarks();
        const t = treeTarget(e.clientX, e.clientY);
        tdrag.target = t;
        if (t) t.el.classList.add(t.mark);
        tdrag.ghost.classList.toggle("refused", !t);
        tdrag.ghost.querySelector(".say").textContent = t
          ? t.say
          : "Not possible here";
        document.documentElement.dataset.nestDrag = t ? "on" : "refused";
        // keep the list scrolling while a row is carried near its edges
        // (not over the unpin zone, which sticks to the bottom edge)
        const r = treeBody.getBoundingClientRect();
        if (t && t.op.kind === "unpin") return;
        if (e.clientY < r.top + 20) treeBody.scrollTop -= 6;
        else if (e.clientY > r.bottom - 20) treeBody.scrollTop += 6;
      });
      function endTreeDrag(write) {
        const t = tdrag;
        tdrag = null;
        if (!t) return;
        clearMarks();
        t.ghost?.remove();
        document.body.classList.remove("drag-pinned");
        delete document.documentElement.dataset.nestDrag;
        treeBody
          .querySelectorAll(".dragging")
          .forEach((el) => el.classList.remove("dragging"));
        if (!t.on) return;
        tdragJustEnded = true;
        setTimeout(() => {
          tdragJustEnded = false;
        }, 0);
        if (!write || !t.target) {
          if (write) toast("Not possible here - nothing changed");
          return;
        }
        const d = byId(t.id),
          op = t.target.op;
        const was = d.anchor ? byId(d.anchor) : null;

          commit(`Unpin "${d.name}"`, () => unpinItem(d));

        const label = op.anchor

            : `Pin "${d.name}" to ${byId(op.anchor).name}`

            ? `Unpin "${d.name}"`

        commit(label, () => {
          const W = pose(d);
          d.anchor = op.anchor;

          );
          if (op.anchor) ui.open[op.anchor] = true;

      <div class="ilab">Pinned here <span class="count">${ps.length}</span></div><div class="plist">${ps.map((p) => `<div class="pitem">${icon(p.type)}<span class="nm">${esc(p.name)}</span></div>`).join("") || '<p class="note">Nothing yet.</p>'}</div>

      <ol class="steps"><li>Select the fountain (the 3D model).</li><li>Choose <b>Pin items here</b>, then tap the text and the picture.</li><li>Move or turn the fountain: the pinned items come along.</li></ol>

          inspBody.innerHTML = `<div class="isec"><div class="ilab">Steps <span class="count">${s.steps.length}</span></div><ol class="steps">${s.steps.map((x) => `<li>${esc(x.name)}</li>`).join("")}</ol></div>
      <div class="isec"><button class="act" data-act="dupstory">${icon("copy")}Duplicate the story<kbd>Ctrl+D</kbd></button><p class="note">A story is never pinned: stories stay at the top of the station, in their own order.</p></div>`;

          return;

        .filter((x) => !pinRefusal(it, x))

        .join("")}</select></div>

        } else {
          h += `<div class="isec"><div class="ilab">${icon("pin")}Pinned here <span class="count">${pins.length}</span></div>
      ${

          : `<p class="note">Nothing is pinned to it yet.</p>`
      }

    <button class="act danger" data-act="del">${icon("trash")}Delete${pins.length ? "..." : ""}<kbd>Del</kbd></button></div>`;
        inspBody.innerHTML = h;
      }

            h =
              sact("selgroup", "target", "Select group") +
              sact("unpin", "unpin", "Unpin") +
              sact("dup", "copy", "Duplicate") +
              sact("del", "trash", "Delete", { danger: true });
            hint = `Pinned to ${byId(it.anchor).name}: the arrow moves it alone, it stays pinned.`;
          } else if (hasPins(it)) {
            h =
              `<span class="seg"><button data-act="mode-group" class="${ui.alone ? "" : "on"}" title="The gizmo moves the group">With pins</button><button data-act="mode-alone" class="${ui.alone ? "on" : ""}" title="The gizmo moves ${esc(it.name)} alone; its pinned items stay">Alone</button></span>` +
              sact("pinhere", "pin", "Pin items here") +
              sact("unpinall", "unpin", "Unpin all") +
              sact("dup", "copy", "Duplicate group") +
              sact("del", "trash", "Delete", { danger: true });
            hint = ui.alone
              ? `Moves ${it.name} alone - its ${pinsOf(it.id).length} pinned items stay.`
              : `The group "${it.name}": move, turn and scale carry its ${pinsOf(it.id).length} pinned items. Alt: alone.`;
          } else {
            h =
              sact("pinhere", "pin", "Pin items here", { pri: true }) +
              sact("dup", "copy", "Duplicate") +
              sact("del", "trash", "Delete", { danger: true });
            hint = `Pin items here: ${it.name} becomes an anchor, and the items you tap move with it.`;
          }
        } else
          hint =
            'Select the fountain and choose "Pin items here" - or Ctrl/Shift-click several items.';
        $("#sbActs").innerHTML = h;
        $("#sbHint").textContent = hint;
      }
      $("#sbActs").addEventListener("click", (e) => {
        const b = e.target.closest("[data-act]");
        if (b && !b.disabled) act(b.dataset.act);
      });

      function act(a) {
        const id = primary();
        const it = byId(id);
        switch (a) {
          case "pinhere":
            if (it) startPinMode(it.id);
            break;
          case "donepin":
            endPinMode();
            break;
          case "pinsel":
            pinSelection();
            break;
          case "unpin":
            unpinSelected();
            break;
          case "unpinall":
            if (it) unpinAll(it.id);
            break;
          case "selgroup":
            if (it && it.anchor) select([it.anchor]);
            break;
          case "dup":
            if (id && id.startsWith("story:")) duplicateStory(id.slice(6));
            else duplicate("group");
            break;
          case "duponly":
            duplicate("only");
            break;
          case "dupstory":
            if (id && id.startsWith("story:")) duplicateStory(id.slice(6));
            break;
          case "del":
            deleteSel();
            break;
          case "clear":
            select([]);
            break;
          case "mode-group":
            ui.alone = false;
            afterChange(true);
            break;
          case "mode-alone":
            ui.alone = true;
            afterChange(true);
            break;
        }
      }

      // ---------------------------------------------------------------- modal: delete an anchor, about
      const modalBack = $("#modalBack"),
        modal = $("#modal");
      function openModal(html, wide) {
        modal.innerHTML = html;
        modal.classList.toggle("wide", !!wide);
        modalBack.classList.add("show");
        modal.querySelector(".btn.pri, .btn")?.focus({ preventScroll: true });
        modal.scrollTop = 0;
      }
      function closeModal() {
        modalBack.classList.remove("show");
        canvas.focus({ preventScroll: true });
      }
      modalBack.addEventListener("click", (e) => {
        if (e.target === modalBack) closeModal();
      });
      function askDelete(its, anchors, dangling) {
        const names = anchors.map((a) => a.name).join(", ");
        openModal(`<h2 id="modalTtl">${icon("trash")}Delete ${esc(names)}?<span class="sp"></span><button class="ib" data-close title="Cancel">${icon("x")}</button></h2>
    <div class="mb"><p>${dangling.length} item${dangling.length > 1 ? "s are" : " is"} pinned to it: ${dangling.map((d) => '"' + esc(d.name) + '"').join(", ")}. An anchor is the group's handle, so deleting it asks what happens to them.</p></div>
    <div class="choice"><button class="btn pri" data-del="keep">Delete ${esc(names)}, keep the pinned items<span>They become free items and stay exactly where they stand.</span></button>
    <button class="btn" data-del="all">Delete the whole group (${its.length + dangling.length} items)<span>${esc(names)} and everything pinned to it.</span></button>
    <button class="btn" data-close>Cancel</button></div>`);
        modal.onclick = (e) => {
          const b = e.target.closest("[data-del],[data-close]");
          if (!b) return;
          closeModal();
          if (b.dataset.del) doDelete(its, b.dataset.del === "keep");
        };
      }
      function openAbout() {
        openModal(
          `<h2 id="modalTtl">${icon("pin")}Folders as pins to an anchor<span class="sp"></span><button class="ib" data-close title="Close">${icon("x")}</button></h2>
  <div class="mb">
    <p>A group starts from one item, usually the 3D model. Other items are pinned to it. The group has no name or pivot of its own: it takes the anchor's. Moving the anchor moves its pinned items; each pinned item can still be moved alone. In the list the pinned items sit under the anchor; in 3D each one has a thin line to it.</p>
    <h3>Why this direction is good</h3>
    <ul><li>It matches how people describe a place: "the text next to the fountain". The group already has a name and a natural centre, so nobody has to invent a folder name or place a pivot.</li>
    <li>Nothing new to aim at in 3D: the model you already see is the handle. Select it and its pinned items come along.</li>
    <li>Turning is meaningful: the text and the picture swing around the fountain and stay on the same side of it. Scaling the model moves its captions outward so they stay beside it, while the text keeps its readable size.</li>
    <li>Pins survive changing the model's file: the pinned items belong to the item, not to its geometry.</li></ul>
    <h3>The strongest case against it</h3>
    <ul><li>Not every group has an anchor. Three signs along a wall, or a row of pictures, have no thing in the middle: one of them must be the anchor, so the pivot sits at one end and turning swings the rest around it. A plain folder with its own pivot would do this better.</li>
    <li>The anchor does two jobs, an item and a group handle. Moving only the model needs a switch (With pins / Alone, or Alt), a hidden mode that can surprise.</li>
    <li>Deleting an anchor always asks a question. Replacing it means re-pinning.</li>
    <li>It is one level deep by nature. If folders ever need folders inside them, this would have to grow into real folders anyway.</li></ul>
    <h3>What to try</h3>
    <ul><li>Select the fountain, choose <b>Pin items here</b>, tap the text and the picture, then <b>Done</b>.</li>
    <li>Drag the arrow under the fountain: the group moves. Turn it with the knob on the stalk; scale it with a round dot.</li>
    <li>Select the text alone and move it: it stays pinned, its line follows.</li>
    <li>Switch to <b>Alone</b> (or hold Alt) and move the fountain: the pinned items stay.</li>
    <li>Ctrl/Shift-click (or <b>Select several</b>) the sound circle and the picture, then <b>Pin to ...</b>; change the anchor in the details.</li>
    <li>In the list, drag the sound circle's grip onto the fountain's row; drag a pinned row out onto "Drop here to unpin".</li>
    <li>Duplicate the group, duplicate the story, delete the fountain (you are asked what happens to the pinned items), then Undo.</li></ul>
    <h3>Not in this prototype</h3>
    <ul><li>No lasso. No dragging an item onto the model in 3D to pin it: moving things beside the model is the common case, and a drop there would pin by accident.</li>
    <li>Only 3D models scale. One station, no saving.</li></ul>
    <p>Keys: Ctrl+Z / Ctrl+Shift+Z undo and redo, Ctrl+G pins the selection, P pins items here, Ctrl+D duplicates, Delete deletes, F frames, Esc ends pinning or clears the selection.</p>
  </div><div class="mf"><button class="btn pri" data-close>Try it</button></div>`,
          true,
        );
        modal.onclick = (e) => {
          if (e.target.closest("[data-close]")) closeModal();
        };
      }

      // ---------------------------------------------------------------- 3D labels over the items
      const tagsEl = $("#tags");
      let tagEls = new Map();
      function drawTags() {
        tagsEl.innerHTML = "";
        tagEls = new Map();
        const pm = ui.pinMode;
        const hot = hotGroup();
        for (const it of S.items) {
          const el = document.createElement("div");
          let cls = "tag";
          let inner = icon(it.type) + `<span>${esc(it.name)}</span>`;
          if (pm) {
            cls += " pinmode";
            if (it.id === pm) {
              cls += " anchor";
              inner = icon("pin") + `<span>${esc(it.name)}: anchor</span>`;
            } else if (it.anchor === pm) {
              cls += " on";
              inner = icon("check") + `<span>Pinned</span>`;
            } else if (pinRefusal(it, byId(pm))) {
              cls += " no";
              el.title = pinRefusal(it, byId(pm));
            } else {
              cls += " cand";
              inner = icon("plus") + `<span>Pin ${esc(it.name)}</span>`;
            }
          } else {
            if (S.sel.includes(it.id)) cls += " sel";
            else if (hot && (it.id === hot || it.anchor === hot))
              cls += " grp-of";
            const n = pinsOf(it.id).length;
            if (n) inner += `<span class="pc">${icon("pin")}${n}</span>`;
          }
          el.className = cls;
          el.innerHTML = inner;
          el.dataset.id = it.id;
          el.addEventListener("click", (e) =>
            tapItem(it.id, e.ctrlKey || e.metaKey || e.shiftKey),
          );
          tagsEl.append(el);
          tagEls.set(it.id, el);
        }
      }
      const _tp = new THREE.Vector3();
      function placeTags() {
        for (const it of S.items) {
          const el = tagEls.get(it.id);
          if (!el) continue;
          const W = pose(it);
          const top =
            it.type === "model"
              ? 2.5 * W.s
              : it.type === "sound"
                ? 0.8
                : (it.type === "text" ? 0.4 : 0.45) + 0.12;
          _tp.set(W.e, W.y + top, -W.n).project(camera);
          if (_tp.z > 1 || Math.abs(_tp.x) > 1.2 || Math.abs(_tp.y) > 1.2) {
            el.style.display = "none";
            continue;
          }
          el.style.display = "";
          el.style.transform = `translate(${(((_tp.x + 1) / 2) * vpW).toFixed(1)}px, ${(((1 - _tp.y) / 2) * vpH).toFixed(1)}px) translate(-50%, -100%)`;
        }
      }

      // ---------------------------------------------------------------- banner, toast, frame
      const banner = $("#banner");
      function drawBanner() {
        if (!ui.pinMode) {
          banner.hidden = true;
          return;
        }
        const A = byId(ui.pinMode);
        banner.hidden = false;
        banner.innerHTML = `${icon("pin")}<span class="bt">Pinning to <b>${esc(A.name)}</b>: tap items to pin or unpin them</span><button class="btn pri" data-act="donepin">Done</button>`;
      }
      banner.addEventListener("click", (e) => {
        if (e.target.closest("[data-act]")) endPinMode();
      });
      let toastT = 0;
      function toast(msg) {
        const t = $("#toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toastT);
        toastT = setTimeout(() => t.classList.remove("show"), 2600);
      }
      let tween = null;
      function frameSelection() {
        const its = selItems().length ? selItems() : S.items;
        const ids = new Set(its.map((i) => i.id));
        for (const i of its)
          if (hasPins(i) && !ui.alone)
            pinsOf(i.id).forEach((p) => ids.add(p.id));
        const box = new THREE.Box3();
        for (const id of ids) {
          const v = views.get(id);
          if (v) box.expandByObject(v.root);
        }
        if (box.isEmpty()) return;
        const c = box.getCenter(new THREE.Vector3());
        const r = Math.max(2, box.getSize(new THREE.Vector3()).length() / 2);
        const dir = camera.position.clone().sub(orbit.target).normalize();
        const aspect = Math.min(1, vpW / vpH);
        const dist = clamp(
          (r / Math.sin((camera.fov * DEG) / 2) / aspect) * 0.9,
          orbit.minDistance,
          orbit.maxDistance,
        );
        tween = {
          t0: performance.now(),
          from: { t: orbit.target.clone(), p: camera.position.clone() },
          to: { t: c, p: c.clone().add(dir.multiplyScalar(dist)) },
        };
      }
      function stepTween(now) {
        if (!tween) return;
        const k = clamp((now - tween.t0) / 500, 0, 1);
        const e = 1 - Math.pow(1 - k, 3);
        orbit.target.lerpVectors(tween.from.t, tween.to.t, e);
        camera.position.lerpVectors(tween.from.p, tween.to.p, e);
        if (k >= 1) tween = null;
      }

      // ---------------------------------------------------------------- top bar, keys, sheet tabs
      $("#bUndo").addEventListener("click", undo);
      $("#bRedo").addEventListener("click", redo);
      $("#bFrame").addEventListener("click", frameSelection);
      $("#bAbout").addEventListener("click", openAbout);
      $("#bReset").addEventListener("click", () => {
        commit("Reset the demonstration", () => {
          const keep = S.nextId;
          S = initState();
          S.nextId = keep;
        });
        ui.alone = false;
        ui.pinMode = null;
        afterChange(true);
      });
      $("#bMulti").addEventListener("click", () => {
        ui.multi = !ui.multi;
        afterChange(true);
        toast(
          ui.multi
            ? "Select several: every tap adds or removes an item"
            : "Back to single selection",
        );
      });
      $("#bTreeFold").addEventListener("click", () =>
        $("#tree").classList.toggle("collapsed"),
      );
      $("#sheetTabs").addEventListener("click", (e) => {
        const b = e.target.closest("[data-tab]");
        if (b) {
          ui.tab = b.dataset.tab;
          drawTabs();
        }
      });
      function drawTabs() {
        document.body.dataset.tab = ui.tab;
        $("#sheetTabs")
          .querySelectorAll("button")
          .forEach((b) => b.classList.toggle("on", b.dataset.tab === ui.tab));
      }
      window.addEventListener("keydown", (e) => {
        if (e.target.closest("input, select, textarea")) return;
        if (modalBack.classList.contains("show")) {
          if (e.key === "Escape") closeModal();
          return;
        }
        const mod = e.ctrlKey || e.metaKey;
        const k = e.key.toLowerCase();
        if (e.key === "Escape" && tdrag) {
          endTreeDrag(false);
          return;
        }
        if (mod && k === "z") {
          e.preventDefault();
          if (e.shiftKey) redo();
          else undo();
        } else if (mod && k === "y") {
          e.preventDefault();
          redo();
        } else if (mod && k === "d") {
          e.preventDefault();
          act("dup");
        } else if (mod && k === "g") {
          e.preventDefault();
          if (e.shiftKey) {
            const it = byId(primary());
            if (it && hasPins(it)) unpinAll(it.id);
            else unpinSelected();
          } else pinSelection();
        } else if (!mod && k === "p") {
          const it = byId(primary());
          if (it) startPinMode(it.id);
        } else if (e.key === "Delete" || e.key === "Backspace") {
          e.preventDefault();
          deleteSel();
        } else if (!mod && k === "f") frameSelection();
        else if (e.key === "Escape") {
          if (ui.pinMode) endPinMode();
          else select([]);
        }
      });

      // ---------------------------------------------------------------- redraw and the frame loop
      function afterChange(full) {
        S.sel = S.sel.filter((id) =>
          id === "station" || id.startsWith("story:")
            ? id === "station" || S.stories.some((s) => "story:" + s.id === id)
            : !!byId(id),
        );
        if (ui.pinMode && !byId(ui.pinMode)) ui.pinMode = null;
        $("#bUndo").disabled = !hist.past.length;
        $("#bRedo").disabled = !hist.future.length;
        $("#bMulti").classList.toggle("on", ui.multi);
        $("#bMulti").setAttribute("aria-pressed", String(ui.multi));
        if (full) {
          rebuildViews();
          drawTree();
          drawTags();
        }
        drawInsp();
        drawActs();
        drawBanner();
      }
      function resize() {
        const w = vp.clientWidth,
          h = vp.clientHeight;
        if (w === vpW && h === vpH) return;
        vpW = Math.max(1, w);
        vpH = Math.max(1, h);
        renderer.setSize(vpW, vpH, false);
        camera.aspect = vpW / vpH;
        camera.updateProjectionMatrix();
      }
      function frame(now) {
        resize();
        stepTween(now);
        orbit.update();
        placeViews();
        updatePinLines();
        updateSelectionBoxes();
        updateHandles();
        placeTags();
        renderer.render(scene, camera);
        requestAnimationFrame(frame);
      }
      afterChange(true);
      drawTabs();
      if (vp.clientWidth / Math.max(1, vp.clientHeight) < 0.9) {
        camera.position.set(3, 9.5, 16);
      }
      requestAnimationFrame(frame);
      if (!/noabout/.test(location.hash)) openAbout();
      // read by the headless checks only
      window.__folders = {
        get S() {
          return S;
        },
        ui,
        act,
        tapItem,
        select,
        startPinMode,
        endPinMode,
        pinSelection,
        undo,
        redo,
        pose,
        hist,
        // an item's ground point on the screen (client px)
        screenOf(id, up = 0) {
          const it = byId(id);
          if (!it) return null;
          const W = pose(it);
          const p = new THREE.Vector3(W.e, W.y + up, -W.n).project(camera);
          const r = canvas.getBoundingClientRect();
          return {
            x: r.left + ((p.x + 1) / 2) * r.width,
            y: r.top + ((1 - p.y) / 2) * r.height,
          };
        },
      };
    </script>
  </body>
</html>
