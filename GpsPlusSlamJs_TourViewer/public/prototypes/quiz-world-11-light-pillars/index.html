<!doctype html>
<!-- Prototype: a quiz whose hidden answers are found first, then chosen by standing in the light pillar of one until it fills. Throwaway; not wired to the app. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>Stand In The Light</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.185.1/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import { loadSamples, runStage } from "../quiz-world-stage/stage.js";
      import { kind } from "./kind.js";

      const samples = await loadSamples("./sample.json");
      if (samples) runStage({ kind, samples, title: "Stand In The Light" });
    </script>
  </body>
</html>
