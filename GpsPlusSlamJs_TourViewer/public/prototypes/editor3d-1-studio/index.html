<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tour Editor Studio</title>
<!--
  Throwaway prototype: desktop 3D tour editor, direction "Studio".
  Original code. Inspired by the docked layouts of game-engine and DCC editors
  (Unity, Godot, Blender: hierarchy left, inspector right, Q/W/E tool keys,
  F to frame, drag-on-label value scrubbing) and by CAD numeric inspectors.
  The ground texture imitates the general look of OpenStreetMap's standard
  style, drawn procedurally. Transform gizmo: three.js TransformControls;
  camera: three.js OrbitControls; labels: three.js CSS2DRenderer.
  Nothing is saved; all data is hard-coded sample data.
-->
<style>
:root {
  --bg0: #18191c; --bg1: #1f2023; --bg2: #26282c; --bg3: #2f3136; --bg4: #383a40;
  --line: #313338; --line2: #3c3f46;
  --text: #d9dbe0; --muted: #8a8f99; --dim: #646973;
  --accent: #e9a23b; --accentBg: rgba(233,162,59,.14); --accentLine: rgba(233,162,59,.55);
  --focus: #5b9cf0;
  --ax-e: #e0575b; --ax-n: #4f8fe8; --ax-u: #67bb57;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg0); color: var(--text);
  font: 12px/1.4 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
body { display: grid; grid-template-rows: 40px minmax(0,1fr) 24px; grid-template-columns: 264px minmax(0,1fr) 324px;
  grid-template-areas: "tb tb tb" "tree vp insp" "sb sb sb"; min-width: 1100px; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
button { font: inherit; color: inherit; }

/* toolbar */
#tb { grid-area: tb; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: var(--bg1); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; padding-right: 10px; margin-right: 2px; border-right: 1px solid var(--line); height: 24px; white-space: nowrap; }
.brand b { font-weight: 600; letter-spacing: .01em; }
.brand .doc { color: var(--muted); }
.grp { display: flex; align-items: center; gap: 2px; padding: 0 6px; border-right: 1px solid var(--line); height: 26px; }
.grp:last-child { border-right: 0; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border: 1px solid transparent; border-radius: 4px; background: transparent; cursor: pointer; white-space: nowrap; color: var(--text); }
.tbtn:hover:not(:disabled) { background: var(--bg3); }
.tbtn:disabled { color: var(--dim); cursor: default; }
.tbtn.on { background: var(--accentBg); border-color: var(--accentLine); color: #f3c47e; }
.tbtn kbd { font: 10px var(--mono); color: var(--dim); }
.seg { gap: 0; }
.seg .tbtn { border-radius: 0; border-color: var(--line2); margin-left: -1px; }
.seg .tbtn:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
.seg .tbtn:last-child { border-radius: 0 4px 4px 0; }
.seg .tbtn.on { position: relative; z-index: 1; }
.spacer { flex: 1; }

/* panels */
aside { background: var(--bg1); min-height: 0; display: flex; flex-direction: column; }
#tree { grid-area: tree; border-right: 1px solid var(--line); }
#insp { grid-area: insp; border-left: 1px solid var(--line); }
.phead { height: 30px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-bottom: 1px solid var(--line);
  font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.phead .r { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
.pbody { flex: 1; overflow: auto; min-height: 0; }
.pbody::-webkit-scrollbar { width: 10px; } .pbody::-webkit-scrollbar-thumb { background: var(--bg4); border: 3px solid var(--bg1); border-radius: 6px; }

/* tree */
.sec { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px 0 10px; margin-top: 4px; color: var(--muted);
  font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.sec .count { font: 10px var(--mono); color: var(--dim); letter-spacing: 0; }
.sec .mini { margin-left: auto; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 20px; border: 0; background: transparent; border-radius: 3px; color: var(--muted); cursor: pointer; }
.sec .mini:hover { background: var(--bg3); color: var(--text); }
.row { position: relative; display: flex; align-items: center; gap: 6px; height: 24px; padding-right: 8px; cursor: default; white-space: nowrap; user-select: none; }
.row:hover { background: var(--bg2); }
.row.sel { background: var(--accentBg); }
.row.sel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.row .tw { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; color: var(--dim); cursor: pointer; flex: none; }
.row .tw:hover { color: var(--text); }
.row .ic { color: var(--muted); display: inline-flex; }
.row.station .ic { color: #8db8e3; }
.row.item .ic.pin { color: #e07a6e; } .row.item .ic.photo { color: #c9a66b; } .row.item .ic.model { color: #a3b1c2; }
.row.code .ic { color: #b9c2cf; }
.row .ord { font: 10.5px var(--mono); color: var(--dim); min-width: 12px; }
.row .nm { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.row .meta { font: 10.5px var(--mono); color: var(--dim); }
.row.sel .nm { color: #fff; }
.row.layer .ic { color: var(--muted); }
.row.layer.off .nm, .row.layer.off .ic { color: var(--dim); }
.row.layer .chk { width: 12px; height: 12px; border: 1px solid var(--line2); border-radius: 2px; display: inline-flex; align-items: center; justify-content: center; margin-left: 4px; }
.row.layer:not(.off) .chk { background: var(--accent); border-color: var(--accent); }
.row.layer:not(.off) .chk::after { content: ""; width: 6px; height: 3px; border-left: 1.5px solid #1b1b1b; border-bottom: 1.5px solid #1b1b1b; transform: rotate(-45deg) translate(1px,-1px); }

/* viewport */
#vp { grid-area: vp; position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #232427; }
#vp canvas { display: block; width: 100%; height: 100%; outline: none; }
#labels { position: absolute; inset: 0; pointer-events: none; }
.tag { pointer-events: auto; display: flex; align-items: center; gap: 5px; padding: 2px 7px 2px 3px; border-radius: 3px; background: rgba(28,29,32,.86);
  border: 1px solid rgba(255,255,255,.08); color: #e6e8ec; font-size: 11px; white-space: nowrap; cursor: pointer; transform: translateY(-50%); }
.tag .n { font: 10px var(--mono); background: #3d5a78; color: #e6f0fa; border-radius: 2px; padding: 0 4px; }
.tag.sel { border-color: var(--accent); }
.tag.sel .n { background: var(--accent); color: #1c1c1c; }
.tag.code .n { background: #4a4f58; }
.ov { position: absolute; pointer-events: none; font-size: 11px; color: #b9bdc5; }
#viewName { left: 10px; top: 8px; padding: 3px 8px; background: rgba(24,25,28,.72); border-radius: 3px; border: 1px solid rgba(255,255,255,.06); }
#protoTag { right: 8px; bottom: 8px; font-size: 10px; color: rgba(220,222,226,.7); letter-spacing: .03em; padding: 1px 6px; border-radius: 3px; background: rgba(24,25,28,.6); }
#compass { right: 12px; top: 10px; width: 46px; height: 46px; border-radius: 50%; background: rgba(24,25,28,.72); border: 1px solid rgba(255,255,255,.08); }
#compass .needle { position: absolute; inset: 0; }
#toast { left: 50%; bottom: 18px; transform: translateX(-50%); padding: 5px 12px; border-radius: 4px; background: rgba(30,31,34,.94); border: 1px solid var(--line2);
  color: var(--text); opacity: 0; transition: opacity .25s; }
#toast.show { opacity: 1; }
#fpHud { left: 50%; top: 10px; transform: translateX(-50%); display: none; padding: 6px 12px; border-radius: 4px; background: rgba(24,25,28,.82);
  border: 1px solid rgba(255,255,255,.08); text-align: center; line-height: 1.5; }
#fpHud b { color: #fff; font-weight: 600; }
#fpHud .in { color: #8fd17f; } #fpHud .out { color: #e9a23b; }
#fpHud kbd, .help kbd { font: 10px var(--mono); padding: 0 4px; border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 3px; background: var(--bg2); color: var(--text); }
#crosshair { left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; display: none; }
#crosshair::before, #crosshair::after { content: ""; position: absolute; background: rgba(255,255,255,.65); }
#crosshair::before { left: 4.5px; top: 0; width: 1px; height: 10px; } #crosshair::after { top: 4.5px; left: 0; height: 1px; width: 10px; }
body.fp #fpHud, body.fp #crosshair { display: block; }
body.fp #vp { background: #aeb8c2; }

/* inspector */
.ihead { padding: 12px 12px 10px; border-bottom: 1px solid var(--line); }
.ihead .kind { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.ihead .ttl { font-size: 15px; font-weight: 600; margin-top: 4px; color: #f0f1f3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ihead .path { color: var(--dim); font-size: 11px; margin-top: 2px; }
.isec { border-bottom: 1px solid var(--line); padding: 8px 12px 10px; }
.isec h4 { margin: 0 0 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; }
.isec h4 .r { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--dim); }
.f { display: grid; grid-template-columns: 82px minmax(0,1fr); align-items: center; gap: 6px; min-height: 26px; margin: 2px 0; }
.f > label { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.f > label.scrub, .ax.scrub { cursor: ew-resize; }
.f > label.scrub:hover { color: var(--text); }
.num { display: flex; align-items: center; height: 24px; background: var(--bg2); border: 1px solid var(--line2); border-radius: 3px; min-width: 0; }
.num:focus-within { border-color: var(--focus); }
.num input, .txt { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; color: var(--text); padding: 0 4px; font: 11px var(--mono); outline: none; }
.num .unit { color: var(--dim); font: 10.5px var(--mono); padding-right: 6px; }
.num.ro { background: transparent; border-color: var(--line); }
.num.ro input { color: var(--muted); }
.vec { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 4px; }
.vec.two { grid-template-columns: repeat(2, minmax(0,1fr)); }
.ax { font: 600 10px var(--mono); padding: 0 5px; align-self: stretch; display: flex; align-items: center; border-right: 1px solid var(--line2); border-radius: 2px 0 0 2px; }
.ax.e { color: var(--ax-e); } .ax.n { color: var(--ax-n); } .ax.u { color: var(--ax-u); }
.ax.scrub:hover { background: var(--bg3); }
.tfield { height: 24px; background: var(--bg2); border: 1px solid var(--line2); border-radius: 3px; font: 12px "Segoe UI", system-ui, sans-serif; color: var(--text); padding: 0 7px; width: 100%; outline: none; }
.tfield:focus, textarea.tfield:focus { border-color: var(--focus); }
textarea.tfield { height: 64px; padding: 5px 7px; resize: vertical; line-height: 1.4; }
.f.top { align-items: start; } .f.top > label { padding-top: 5px; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 1px solid var(--line2); border-radius: 4px; background: var(--bg2); cursor: pointer; color: var(--text); }
.btn:hover { background: var(--bg3); }
.btn.danger:hover { border-color: #b4524f; color: #f0a8a5; }
.btn.sm { height: 22px; padding: 0 7px; }
.ilist .row { height: 24px; padding-left: 4px; border-radius: 3px; }
.note { color: var(--dim); font-size: 11px; line-height: 1.45; margin-top: 6px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; }
.kv span:nth-child(2n) { font: 11.5px var(--mono); color: var(--text); text-align: right; }
.kv span:nth-child(2n+1) { color: var(--muted); }
.help { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; align-items: center; color: var(--muted); }
.help span:nth-child(2n+1) { white-space: nowrap; }
.inline { display: flex; gap: 4px; align-items: center; }

/* status bar */
#sb { grid-area: sb; display: flex; align-items: center; gap: 0; background: var(--bg1); border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
#sb > div { padding: 0 10px; border-right: 1px solid var(--line); height: 100%; display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
#sb .mono { font: 10.5px var(--mono); }
#sb .grow { flex: 1; min-width: 0; }
#sb b { color: var(--text); font-weight: 500; }
</style>

      "three": "https://unpkg.com/three@0.185.1/build/three.module.js",

  } }
</script>

<body>
<header id="tb">
  <div class="brand"><svg class="i" viewBox="0 0 16 16" style="color:var(--accent)"><path d="M8 1.8l5.5 3v6.4L8 14.2 2.5 11.2V4.8z"/><path d="M2.5 4.8L8 7.8l5.5-3M8 7.8v6.4"/></svg><b>Tour Editor</b><span class="doc">Old Town Walk</span></div>
  <div class="grp seg" id="modeGrp">
    <button class="tbtn" data-mode="select" title="Select tool (Q)"><i data-icon="select"></i>Select<kbd>Q</kbd></button>
    <button class="tbtn" data-mode="translate" title="Move tool (W) - arrows nudge 0.1 m, Shift 1 m, PageUp/PageDown height"><i data-icon="move"></i>Move<kbd>W</kbd></button>
    <button class="tbtn" data-mode="rotate" title="Rotate tool (E) - Alt+Left/Right rotate 5 degrees"><i data-icon="rotate"></i>Rotate<kbd>E</kbd></button>
  </div>
  <div class="grp">
    <button class="tbtn" id="bAddStation" title="Add a station at the centre of the view"><i data-icon="plus"></i>Station</button>
    <button class="tbtn" id="bAddPin" title="Add a pin into the selected station"><i data-icon="pin"></i>Pin</button>
    <button class="tbtn" id="bAddPhoto" title="Add a photo into the selected station"><i data-icon="photo"></i>Photo</button>
  </div>
  <div class="grp">
    <button class="tbtn" id="bFP" title="First person at the selected station, eye height 1.6 m (V)"><i data-icon="eye"></i>First person<kbd>V</kbd></button>
    <button class="tbtn" id="bFrame" title="Frame selection (F, or double-click). Home frames the whole tour"><i data-icon="frame"></i>Frame<kbd>F</kbd></button>
  </div>
  <div class="grp">
    <button class="tbtn" id="bUndo" title="Undo (Ctrl+Z)"><i data-icon="undo"></i>Undo</button>
    <button class="tbtn" id="bRedo" title="Redo (Ctrl+Shift+Z)"><i data-icon="redo"></i>Redo</button>
  </div>
  <div class="spacer"></div>
  <div class="grp">
    <button class="tbtn" id="bSnap" title="Snap gizmo drags to 0.5 m and 15 degrees"><i data-icon="snap"></i>Snap</button>
    <button class="tbtn" id="bWalk" title="Show the recorded walk"><i data-icon="walk"></i>Walk</button>
    <button class="tbtn" id="bDepth" title="Show the depth points recorded along the walk"><i data-icon="depth"></i>Depth points</button>
  </div>
</header>

<aside id="tree">
  <div class="phead">Hierarchy<span class="r" id="treeStats"></span></div>
  <div class="pbody" id="treeBody"></div>
</aside>

<main id="vp">
  <div id="labels"></div>
  <div class="ov" id="viewName">Overview - perspective</div>
  <div class="ov" id="compass"><svg class="needle" viewBox="0 0 46 46"><g id="needle"><path d="M23 7l4.5 16h-9z" fill="#e0575b"/><path d="M23 39l-4.5-16h9z" fill="#80858f"/><text x="23" y="6.2" text-anchor="middle" font-size="6.5" fill="#d9dbe0" font-family="Segoe UI, sans-serif" font-weight="700">N</text></g></svg></div>
  <div class="ov" id="fpHud"></div>
  <div class="ov" id="crosshair"></div>
  <div class="ov" id="toast"></div>
  <div class="ov" id="protoTag">Prototype: Studio</div>
</main>

<aside id="insp">
  <div class="phead">Inspector<span class="r" id="inspKind"></span></div>
  <div class="pbody" id="inspBody"></div>
</aside>

<footer id="sb">
  <div id="sbMode"></div>
  <div id="sbSel" class="grow"></div>
  <div id="sbCursor" class="mono"></div>
  <div id="sbHist" class="mono"></div>
  <div id="sbCalls" class="mono"></div>
</footer>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------------------------------------------------------------- utilities
const DEG = Math.PI / 180;
const $ = (q) => document.querySelector(q);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const norm360 = (a) => ((a % 360) + 360) % 360;
const fmtNum = (v, d) => { const s = (Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v).toFixed(d); return s === '-0' || /^-0\.0*$/.test(s) ? s.slice(1) : s; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function mulberry(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function distSeg(px, py, ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; const L = dx * dx + dy * dy; let t = L ? ((px - ax) * dx + (py - ay) * dy) / L : 0; t = clamp(t, 0, 1); return Math.hypot(px - ax - t * dx, py - ay - t * dy); }
function distPoly(px, py, pts) { let d = Infinity; for (let i = 1; i < pts.length; i++) d = Math.min(d, distSeg(px, py, pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1])); return d; }

const ICON = {
  select: '<path d="M3.5 2.2l9 5.1-4 1.1-2 4.4z"/>',
  move: '<path d="M8 1.5v13M1.5 8h13M6 3.5l2-2 2 2M6 12.5l2 2 2-2M3.5 6l-2 2 2 2M12.5 6l2 2-2 2"/>',
  rotate: '<path d="M13 8.5a5 5 0 1 1-1.7-4.3"/><path d="M12 1.8v2.8H9.2"/>',
  plus: '<path d="M8 3v10M3 8h10"/>',
  pin: '<rect x="2.5" y="2.5" width="11" height="5" rx="1"/><path d="M8 7.5v6.5"/>',

  model: '<path d="M8 1.8l5.5 3v6.4L8 14.2 2.5 11.2V4.8z"/><path d="M2.5 4.8L8 7.8l5.5-3M8 7.8v6.4"/>',
  eye: '<path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8s-2.4 4.5-6.5 4.5S1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/>',
  frame: '<path d="M2 5.5V2h3.5M10.5 2H14v3.5M14 10.5V14h-3.5M5.5 14H2v-3.5"/><circle cx="8" cy="8" r="1.6"/>',
  undo: '<path d="M5.5 3.5L2.5 6.5l3 3"/><path d="M2.5 6.5h7a3.6 3.6 0 0 1 0 7.2H6.5"/>',
  redo: '<path d="M10.5 3.5l3 3-3 3"/><path d="M13.5 6.5h-7a3.6 3.6 0 0 0 0 7.2h3"/>',
  snap: '<path d="M3 2.5v5.5a5 5 0 0 0 10 0V2.5h-3V8a2 2 0 0 1-4 0V2.5z"/><path d="M3 5h3M10 5h3"/>',
  walk: '<path d="M2 13.5c2.6 0 2.4-4.5 5-4.5s2.4 3 5 3c1.6 0 2-2.2 2-4.5"/><circle cx="14" cy="5.5" r="1.2"/>',
  depth: '<circle cx="3.5" cy="11" r=".9"/><circle cx="6.5" cy="6.5" r=".9"/><circle cx="9" cy="10" r=".9"/><circle cx="12.5" cy="5" r=".9"/><circle cx="11.5" cy="12" r=".9"/><circle cx="4.5" cy="3.8" r=".9"/>',
  folder: '<path d="M1.8 4v8.6h12.4V5.6H7.7L6.1 4z"/>',

window.addEventListener('keydown', (e) => {
  const a = document.activeElement; const typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && !a.readOnly;
