<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Long Text Writing Desk</title>
<link rel="icon" href="data:,">
<!--
  Throwaway prototype, long text editor round, direction 2: "a writing desk".
  Selecting a long text and pressing Write turns the 3D view's area into a large
  writing surface: the source on the left, "shown as typed" as a margin list beside
  it, a live phone preview of the reading sheet on the right (kept in step by
  scrolling), and the narration as a timeline strip underneath. The left rail stays.
  Original code, no libraries. The 3D view is a static drawing. The voice is a fake
  clock (no sound). Nothing is saved; everything lives in this page's memory.
  The strip at the very bottom with the dashed magenta border is the prototype's own
  debug control, not part of the design. URL flag: #desk opens the desk directly.
-->
<style>
:root {
  --bg0: #18191c; --bg1: #1f2023; --bg2: #26282c; --bg3: #2f3136; --bg4: #383a40;
  --line: #313338; --line2: #3c3f46;
  --text: #d9dbe0; --muted: #8a8f99; --dim: #646973;
  --accent: #e9a23b; --accentBg: rgba(233,162,59,.14); --accentLine: rgba(233,162,59,.55); --accentText: #f3c47e;
  --focus: #5b9cf0;
  --typed: #93a9e8; --typedBg: rgba(147,169,232,.15); --typedLine: rgba(147,169,232,.5);
  --rose: #e57f82; --roseBg: rgba(229,127,130,.13); --roseLine: rgba(229,127,130,.5);
  --ok: #86c47f; --okBg: rgba(134,196,127,.13); --okLine: rgba(134,196,127,.5);
  --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", ui-monospace, Menlo, monospace;
  --railW: 248px; --marginW: 232px; --prevW: 336px; --listW: 320px; --tlH: 104px;
  color-scheme: dark;
}
@media (max-width: 1380px) { :root { --railW: 226px; --marginW: 210px; --prevW: 312px; --listW: 292px; } }
@media (max-width: 1150px) { :root { --railW: 188px; --marginW: 186px; --prevW: 272px; --listW: 214px; } }
@media (max-height: 800px) { :root { --tlH: 82px; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg0); color: var(--text); font: 12px/1.4 var(--sans); overflow: hidden; }
body { display: grid; grid-template-rows: 40px minmax(0,1fr) 24px auto; grid-template-columns: minmax(0,1fr); }
button { font: inherit; color: inherit; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
kbd { font: 10px var(--mono); color: var(--dim); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
[hidden] { display: none !important; }

/* ---------------- toolbar ---------------- */
#tb { display: flex; align-items: center; gap: 6px; padding: 0 8px; background: var(--bg1); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; padding-right: 10px; border-right: 1px solid var(--line); height: 24px; white-space: nowrap; }
.brand b { font-weight: 600; }
.brand .doc { color: var(--muted); }
.grp { display: flex; align-items: center; gap: 2px; padding: 0 6px; border-right: 1px solid var(--line); height: 26px; }
.grp:last-child { border-right: 0; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border: 1px solid transparent; border-radius: 4px; background: transparent; cursor: pointer; white-space: nowrap; }
.tbtn:hover:not(:disabled) { background: var(--bg3); }
.tbtn:disabled { color: var(--dim); cursor: default; }
.tbtn.on { background: var(--accentBg); border-color: var(--accentLine); color: var(--accentText); }
.spacer { flex: 1; }

/* ---------------- app grid ---------------- */
#app { display: grid; grid-template-columns: var(--railW) minmax(0,1fr); min-height: 0; }
#rail { background: var(--bg1); border-right: 1px solid var(--line); overflow: auto; min-height: 0; }
#work { position: relative; min-width: 0; min-height: 0; overflow: hidden; }

/* rail */
.rhead { display: flex; align-items: center; height: 34px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--line); }
.ttlh { font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.count { font: 10px var(--mono); color: var(--dim); margin-left: 6px; }
.cards { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.card { border-radius: 6px; overflow: hidden; background: var(--bg2); border: 1px solid var(--line2); }
.card.ctx { border-color: var(--accentLine); }
.hero { position: relative; height: 56px; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,11,13,.05) 0%, rgba(10,11,13,.3) 42%, rgba(10,11,13,.86) 100%); }
.hero > * { position: absolute; z-index: 1; }
.hero .n { left: 7px; top: 6px; font: 600 10px var(--mono); background: rgba(20,21,24,.78); color: #e6f0fa; border-radius: 3px; padding: 1px 5px; }
.card.ctx .hero .n { background: var(--accent); color: #1c1c1c; }
.hero .nm { left: 9px; right: 9px; bottom: 18px; font-weight: 600; font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
.hero .ds { left: 9px; right: 9px; bottom: 4px; font-size: 11px; color: rgba(230,232,236,.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kids { padding: 3px 0 4px; }
.kid { position: relative; display: flex; align-items: center; gap: 6px; width: 100%; height: 26px; padding: 0 8px 0 12px; border: 0; background: transparent; cursor: pointer; text-align: left; white-space: nowrap; color: var(--text); }
.kid:hover { background: var(--bg3); }
.kid.sel { background: var(--accentBg); }
.kid.sel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.kid .nm { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.kid.sel .nm { color: #fff; }
.kid .meta { font: 10px var(--mono); color: var(--dim); display: inline-flex; align-items: center; gap: 4px; }
.kid .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot.ok { background: var(--ok); } .dot.amber { background: var(--accent); } .dot.rose { background: var(--rose); } .dot.none { background: #4b4f57; }
.ic { display: inline-flex; color: var(--muted); }
.ic.long { color: #e7c58e; } .ic.short { color: #d0c3a8; } .ic.photo { color: #c9a66b; } .ic.video { color: #c58fb0; } .ic.model { color: #a3b1c2; }
.radd { margin: 2px 8px 6px 12px; font-size: 11px; color: var(--dim); border: 1px dashed var(--line2); border-radius: 5px; padding: 4px 8px; text-align: center; }

/* ---------------- map (3D view picture + inspector) ---------------- */
#map { position: absolute; inset: 0; background: #232427; }
#map > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tag { position: absolute; display: flex; align-items: center; gap: 5px; padding: 2px 7px 2px 3px; border-radius: 3px; background: rgba(28,29,32,.86); border: 1px solid rgba(255,255,255,.08); color: #e6e8ec; font-size: 11px; white-space: nowrap; transform: translate(-50%, -50%); }
.tag .n { font: 10px var(--mono); background: #3d5a78; color: #e6f0fa; border-radius: 2px; padding: 0 4px; }
.tag.sel { border-color: var(--accent); }
.tag.sel .n { background: var(--accent); color: #1c1c1c; }
#mapCtl { position: absolute; left: 12px; bottom: 14px; display: flex; flex-direction: column; gap: 8px; }
.pill { background: #fff; border-radius: 8px; box-shadow: 0 1px 2px rgba(60,64,67,.25), 0 2px 8px rgba(60,64,67,.15); display: flex; flex-direction: column; overflow: hidden; }
.pill span { width: 38px; height: 38px; display: grid; place-items: center; color: #5f6670; }
.pill span + span { border-top: 1px solid #e4e7eb; }
#mapNote { position: absolute; right: 8px; bottom: 8px; font-size: 10px; color: rgba(220,222,226,.7); padding: 1px 6px; border-radius: 3px; background: rgba(24,25,28,.6); }
#insp { position: absolute; right: 0; top: 0; width: 300px; max-height: calc(100% - 10px); display: flex; flex-direction: column; background: rgba(31,32,35,.97); border: 1px solid var(--line); border-top: 0; border-right: 0; border-radius: 0 0 0 8px; box-shadow: 0 8px 22px rgba(0,0,0,.35); z-index: 5; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--bg4) transparent; }
.dhead { flex: none; height: 38px; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 10px; border-bottom: 1px solid var(--line); }
.ttlin { flex: 1; min-width: 0; height: 26px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: #f0f1f3; font: 600 13.5px var(--sans); padding: 0 5px; outline: none; text-overflow: ellipsis; }
.ttlin:hover { border-color: var(--line2); }
.ttlin:focus { border-color: var(--focus); background: var(--bg2); }
.dbody { overflow: auto; min-height: 0; }
.sub { padding: 7px 12px 3px; color: var(--dim); font-size: 11px; }
.isec { padding: 8px 12px 10px; border-top: 1px solid var(--line); }
.isec h4 { margin: 0 0 7px; font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.isec h4 i { font-style: normal; letter-spacing: 0; text-transform: none; font-weight: 400; color: var(--dim); }
.writeBtn { display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--accent); border-radius: 6px; background: var(--accent); color: #1c1c1c; font-weight: 650; font-size: 13px; cursor: pointer; }
.writeBtn:hover { background: #f0b257; }
.writeBtn svg { stroke-width: 1.7; }
.writeBtn kbd { margin-left: auto; color: rgba(28,28,28,.6); }
.excerpt { display: block; margin: 9px 0 4px; padding: 9px 11px; border-radius: 6px; background: var(--bg2); border: 1px solid var(--line2); font: 13px/1.5 var(--serif); color: #c9c4b8; cursor: pointer; text-align: left; width: 100%; }
.excerpt span { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.excerpt:hover { border-color: #565a63; }
.note { color: var(--dim); font-size: 11px; line-height: 1.45; margin: 4px 0 2px; }
.note b { color: var(--muted); font-weight: 600; }
.tnote { color: var(--typed); font-size: 11px; line-height: 1.45; margin: 4px 0 2px; }
.btn { height: 28px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--line2); background: var(--bg2); color: var(--text); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not(:disabled) { background: var(--bg3); }
.btn:disabled { color: var(--dim); cursor: default; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #1c1c1c; font-weight: 600; }
.btn.pri:hover { background: #f0b257; }
.btn.sm { height: 24px; padding: 0 8px; font-size: 11.5px; }
.btn.link { border-color: transparent; background: transparent; color: var(--accentText); padding: 0 4px; }
.btn.link:hover { background: var(--bg3); }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

/* view picker: three illustrated cards */
.vcards { display: grid; gap: 6px; }
.vcards.row { grid-template-columns: repeat(3, minmax(0,1fr)); }
.vcard { position: relative; display: grid; gap: 2px 9px; align-items: center; text-align: left; border: 1px solid var(--line2); background: var(--bg2); border-radius: 7px; padding: 6px 8px; cursor: pointer; color: var(--text); }
.vcards:not(.row) .vcard { grid-template-columns: 64px minmax(0,1fr); }
.vcards.row .vcard { grid-template-columns: minmax(0,1fr); justify-items: center; text-align: center; padding: 6px 4px 5px; }
.vcard:hover { border-color: #565a63; }
.vcard.on { border-color: var(--accent); background: var(--accentBg); box-shadow: 0 0 0 1px var(--accent); }
.vcard .dr { grid-row: span 2; width: 64px; height: 48px; display: block; }
.vcards.row .vcard .dr { grid-row: auto; width: 52px; height: 38px; }
.vcards.row .vcard .badge { position: static; margin-top: 2px; }
.vcards.row .vcard b { font-size: 12px; }
@media (max-height: 800px) { .vcards.row .vcard > span:not(.badge) { display: none; } .vcards.row .vcard .dr { width: 46px; height: 32px; } }
.vcard b { font-size: 12.5px; font-weight: 600; color: #f0f1f3; }
.vcard span { font-size: 11px; color: var(--muted); line-height: 1.35; }
.vcards.row .vcard span { font-size: 10.5px; }
.vcard .badge { position: absolute; top: 4px; right: 4px; font-size: 9.5px; padding: 0 5px; border-radius: 8px; background: var(--bg4); color: var(--muted); line-height: 15px; }
.vcards:not(.row) .vcard .badge { position: static; justify-self: start; grid-column: 2; }
.vcard .badge.amber { background: rgba(233,162,59,.2); color: var(--accentText); }
.vcard.off { opacity: .78; }
.vcard.off .dr { opacity: .55; }
.dr .o { fill: #2b2d33; stroke: #737985; stroke-width: 1; }
.dr .bld { fill: #4b505a; } .dr .sky { fill: #3a4048; }
.dr .sg { fill: var(--accent); } .dr .st { stroke: #9aa0aa; stroke-width: 1; }
.dr .sh { fill: #43464e; } .dr .tl { stroke: #a6abb4; stroke-width: 1.5; stroke-linecap: round; } .dr .ta { stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; }
.dr .cs { fill: #17181b; } .dr .wv { stroke: var(--accent); stroke-width: 1.3; fill: none; stroke-linecap: round; }
.dr .x { stroke: #9aa0aa; stroke-width: 1.3; fill: none; stroke-linecap: round; }
.vexp { font-size: 11px; color: var(--muted); line-height: 1.4; margin: 0 1px; }
.vexp .warnt { color: var(--accentText); }

/* ---------------- the writing desk ---------------- */
/* the desk: the writing (and the narration strip beneath it) on the left, the phone at full height on the right */
#desk { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0,1fr) var(--marginW) var(--prevW); grid-template-rows: 40px minmax(0,1fr) auto; background: var(--bg0); }
#deskHead { grid-column: 1 / -1; }
#deskHead { display: flex; align-items: center; gap: 6px; padding: 0 8px; background: var(--bg1); border-bottom: 1px solid var(--line); min-width: 0; }
#deskHead .crumb { display: flex; align-items: center; gap: 4px; min-width: 0; flex: 0 1 auto; color: var(--muted); white-space: nowrap; }
#deskHead .crumb .ttlin { width: clamp(120px, 22vw, 300px); }
.fmt { display: flex; align-items: center; gap: 1px; padding: 0 6px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); height: 26px; }
.fbtn { height: 26px; min-width: 28px; padding: 0 6px; border: 1px solid transparent; border-radius: 4px; background: transparent; cursor: pointer; display: inline-grid; place-items: center; color: var(--text); font-size: 12.5px; }
.fbtn:hover { background: var(--bg3); }
.fbtn b, .fbtn em { font-family: var(--serif); font-size: 14px; }
.saved { color: var(--dim); font-size: 11px; white-space: nowrap; }
#deskBody { display: contents; }
.colhead { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--line); background: var(--bg1); white-space: nowrap; min-width: 0; }
.colhead .stat { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
#srcCol { grid-column: 1; grid-row: 2; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #1c1d20; }
#srcWrap { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#gutter { position: absolute; left: 0; top: 0; bottom: 0; width: 44px; overflow: hidden; border-right: 1px solid #26272b; background: #1a1b1e; }
#gutIn { position: absolute; left: 0; right: 0; top: 0; }
.gl { position: absolute; right: 8px; font: 10px/1 var(--mono); color: #4a4e56; }
.gmk { position: absolute; border: 0; padding: 0; cursor: pointer; }
.gmk.ty { right: 1px; width: 4px; border-radius: 2px; background: var(--typed); }
.gmk.ty.kept { background: #4d5466; }
.gmk.vo { left: 3px; width: 13px; height: 13px; border-radius: 50%; display: grid; place-items: center; }
.gmk.vo svg { width: 9px; height: 9px; stroke: #1c1c1c; stroke-width: 2; fill: none; stroke-linecap: round; }
.gmk.vo.amber { background: var(--accent); } .gmk.vo.rose { background: var(--rose); } .gmk.vo.grey { background: #6a6f78; }
#back, #src { font: 14.5px/1.72 var(--sans); letter-spacing: normal; tab-size: 4; white-space: pre-wrap; overflow-wrap: break-word; word-break: normal; padding: 20px 24px 45vh 12px; }
#back { position: absolute; left: 44px; top: 0; color: #d6d3cb; pointer-events: none; }
#back .ln { min-height: 1.72em; }
#back .ln.h { color: #fff3dc; }
#back .mk { color: #6d6a63; }
#back .img { color: #8fb39a; }
#back .ty { background: var(--typedBg); text-decoration: underline wavy var(--typedLine); text-underline-offset: 4px; }
#back .ty.kept { background: rgba(147,169,232,.06); text-decoration: none; }
#back .cur { background: rgba(233,162,59,.24); color: #fff; border-radius: 2px; }
#back .curhold { background: rgba(255,255,255,.08); text-decoration: underline dashed #8a8f99; text-underline-offset: 4px; }
#back .chg { text-decoration: underline dotted var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; background: rgba(233,162,59,.07); }
#back .nov { text-decoration: underline dotted var(--rose); text-decoration-thickness: 2px; text-underline-offset: 4px; }
#back .selS { box-shadow: 0 0 0 1px rgba(255,255,255,.35); border-radius: 2px; }
#back .ln.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0% { background: rgba(91,156,240,.35); } 100% { background: transparent; } }
#src { position: absolute; left: 44px; right: 0; top: 0; bottom: 0; margin: 0; border: 0; outline: none; resize: none; background: transparent; color: transparent; caret-color: var(--accentText); overflow-y: scroll; scrollbar-width: thin; scrollbar-color: var(--bg4) transparent; }
#src::selection { background: rgba(91,156,240,.38); color: transparent; }
#src::placeholder { color: var(--dim); }

/* margin list: shown as typed */
#marginCol { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: #1d1e21; }
#marginCol .colhead { padding-left: 10px; }
.cnt { font: 600 10px var(--mono); padding: 1px 6px; border-radius: 8px; background: var(--typedBg); color: var(--typed); }
.cnt.zero { background: var(--bg3); color: var(--dim); }
.navb { width: 22px; height: 22px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.navb:hover { background: var(--bg3); color: var(--text); }
#mlist { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.ment { position: absolute; left: 6px; right: 6px; border: 1px solid var(--line2); border-left: 3px solid var(--typed); border-radius: 5px; background: var(--bg2); padding: 6px 8px 7px; font-size: 11.5px; line-height: 1.4; transition: top .18s ease; }
.ment.act { border-color: var(--typedLine); border-left-color: var(--typed); background: #262a35; box-shadow: 0 4px 16px rgba(0,0,0,.35); z-index: 2; }
.ment.kept { border-left-color: #4d5466; opacity: .85; }
.ment .mt { display: flex; gap: 6px; align-items: baseline; border: 0; background: transparent; padding: 0; width: 100%; text-align: left; cursor: pointer; color: #e7e9ee; font-weight: 600; }
.ment .mt small { margin-left: auto; font: 10px var(--mono); color: var(--dim); font-weight: 400; white-space: nowrap; }
.ment .mx { color: var(--muted); margin-top: 3px; }
.ment .lit { margin-top: 5px; font: 11px/1.45 var(--mono); color: #c2cbe8; background: #1b1d24; border-radius: 4px; padding: 4px 6px; white-space: pre-wrap; word-break: break-word; max-height: 76px; overflow: hidden; }
.ment .sugl { margin-top: 6px; font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.ment .sug { margin-top: 3px; font: 12.5px/1.45 var(--serif); color: #e5e0d4; background: #1f2026; border: 1px dashed #4c5468; border-radius: 4px; padding: 5px 7px; max-height: 120px; overflow: hidden; }
.ment .sug ul { margin: 0; padding-left: 16px; }
.ment .btnrow { margin-top: 6px; }
.ment .one { margin-top: 2px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mmore { position: absolute; left: 50%; transform: translateX(-50%); z-index: 3; border: 1px solid var(--typedLine); background: #23283a; color: var(--typed); border-radius: 10px; font-size: 10.5px; padding: 1px 9px; cursor: pointer; white-space: nowrap; }
.mempty { padding: 14px 12px; color: var(--muted); font-size: 11.5px; line-height: 1.5; }
.mempty .ck { color: var(--ok); font-weight: 600; display: block; margin-bottom: 4px; }

/* preview column: view cards + phone */
#prevCol { grid-column: 3; grid-row: 2 / 4; display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: #1a1b1e; }
#prevCol .colhead { gap: 10px; }
#prevTop { padding: 7px 8px 2px; flex: none; }
#phoneArea { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-start; padding: 4px 10px 0; overflow: hidden; }
#phone { position: relative; flex: none; border-radius: 30px; background: #0a0a0b; box-shadow: 0 0 0 1px #3b3c42, 0 14px 40px rgba(0,0,0,.5); padding: 7px; }
#phScr { position: relative; overflow: hidden; border-radius: 24px; }
#prevFoot { flex: none; padding: 6px 10px 8px; font-size: 11px; color: var(--dim); line-height: 1.4; display: flex; flex-direction: column; gap: 4px; }
#prevFoot .vnote { color: var(--accentText); }
.chk { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: var(--muted); }
.chk input { accent-color: var(--accent); margin: 0; }

/* the phone screen (the visitor side, as in station-blocks-1-narrated-text) */
.ph { position: absolute; left: 0; top: 0; width: 390px; transform-origin: 0 0; overflow: hidden; background: #0c0d0f; font-family: var(--sans); color: #f6f2ea; }
.ph .cam { position: absolute; inset: 0; }
.ph .cam svg { width: 100%; height: 100%; display: block; }
.ph .psign { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); width: var(--signW, 210px); }
.ph .cam .psign { height: auto; }
.ph.compact .credit { display: none; }
.ph.compact .stt { font-size: 20px; margin: 4px 0 3px; }
.ph.compact .shd { padding: 6px 24px 6px; }
.ph.compact .cb.play { width: 48px; height: 48px; }
.ph .sheet { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; background: rgba(18,19,22,.95); border-radius: 24px 24px 0 0; border-top: 1px solid rgba(255,255,255,.08); color: #d8d2c6; box-shadow: 0 -10px 40px rgba(0,0,0,.25); }
.ph.v-reading .sheet { top: var(--sheetTop, 31%); }
.ph.v-silent .sheet { top: 5%; }
.ph .grab { width: 38px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.18); margin: 8px auto 0; flex: none; }
.ph .shd { padding: 10px 24px 8px; flex: none; }
.ph .over { font: 700 10.5px/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: #f2b45a; }
.ph .stt { font: 600 23px/1.18 var(--serif); color: #fff; margin: 6px 0 5px; }
.ph .smt { font-size: 12.5px; color: #a49e92; display: flex; align-items: center; gap: 6px; }
.ph .tw { position: relative; flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(transparent 0, #000 18px, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(transparent 0, #000 18px, #000 calc(100% - 24px), transparent); }
.ph .tw::-webkit-scrollbar { display: none; }
.ph .txt { position: relative; font-family: var(--serif); font-size: 18.5px; line-height: 1.62; color: #d8d2c6; padding: 12px 26px 60% 24px; hyphens: auto; text-wrap: pretty; }
.ph .txt p, .ph .txt figure, .ph .txt .tyb { margin: 0 0 1.05em; }
.ph .txt h2, .ph .txt h3, .ph .txt h4 { font-family: var(--serif); color: #fff; margin: 1.1em 0 .45em; line-height: 1.25; }
.ph .txt h2 { font-size: 1.3em; } .ph .txt h3 { font-size: 1.16em; } .ph .txt h4 { font-size: 1.04em; }
.ph .txt ul, .ph .txt ol { margin: 0 0 1.05em; padding-left: 1.2em; }
.ph .txt li ul, .ph .txt li ol { margin: .15em 0 0; }
.ph .txt li { margin: .15em 0; }
.ph .txt a { color: #ffd391; text-decoration-color: rgba(242,180,90,.5); }
.ph .txt strong { color: #fff; }
.ph .txt figure .pic { height: 180px; border-radius: 10px; }
.ph .txt figcaption { font: 13px/1.4 var(--sans); color: #a49e92; margin-top: 6px; }
.ph .txt .tyb { white-space: pre-wrap; }
.ph .s { border-radius: 4px; padding: 2px 0; -webkit-box-decoration-break: clone; box-decoration-break: clone; transition: background-color .3s, box-shadow .3s; }
.ph .s.cur { background: rgba(242,180,90,.16); box-shadow: 0 0 0 3px rgba(242,180,90,.16); color: #fdfaf3; }
.ph .w.on { color: #ffd391; text-decoration: underline; text-decoration-color: #f2b45a; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.ph.marks .ty { outline: 1.5px dashed var(--typed); outline-offset: 2px; background: rgba(147,169,232,.08); border-radius: 2px; }
.ph.marks .caretblk { position: relative; }
.ph.marks .caretblk::before { content: ""; position: absolute; left: -13px; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: var(--accent); }
.ph .sft { flex: none; padding: 6px 18px 14px; border-top: 1px solid rgba(255,255,255,.07); }
.ph .bar { position: relative; height: 18px; margin: 2px 4px 0; }
.ph .bar .tr { position: absolute; left: 0; right: 0; top: 7px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); }
.ph .bar .fl { position: absolute; left: 0; top: 7px; height: 4px; border-radius: 4px; background: #f2b45a; width: 0; }
.ph .bar .kn { position: absolute; top: 3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #fff; }
.ph .prow { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 2px; }
.ph .tm { font: 500 12px var(--mono); color: #a49e92; min-width: 62px; }
.ph .tm.r { text-align: right; }
.ph .cb { width: 46px; height: 46px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; color: #e9e4da; cursor: pointer; }
.ph .cb svg { width: 24px; height: 24px; fill: currentColor; }
.ph .cb.play { width: 56px; height: 56px; background: #f2b45a; color: #1a1408; }
.ph .credit { text-align: center; font-size: 11.5px; color: #8f897e; margin-top: 4px; }
.ph .cap { position: absolute; left: 10px; right: 10px; bottom: 16px; background: rgba(14,15,18,.88); border: 1px solid rgba(255,255,255,.07); border-radius: 22px; padding: 15px 18px 10px; }
.ph .capt { font: 600 22px/1.33 var(--sans); color: #f7f3eb; min-height: calc(1.33em * 3); display: flex; align-items: flex-end; }
.ph .capt .w.todo { color: #bdb7ab; }
.ph .capt .w.on { text-decoration-thickness: 3px; text-underline-offset: 6px; }
.ph .crow { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.ph .crow .cb { width: 44px; height: 44px; } .ph .crow .cb svg { width: 20px; height: 20px; }
.ph .cmeta { flex: 1; min-width: 0; font: 600 13px/1.25 var(--serif); color: #efe9de; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph .cmeta small { display: block; font: 11px var(--sans); color: #8f897e; margin-top: 2px; }
.ph .cpill { border: 1px solid rgba(255,255,255,.14); border-radius: 999px; height: 34px; padding: 0 13px; font-size: 12.5px; font-weight: 600; color: #e9e4da; display: grid; place-items: center; white-space: nowrap; }
.ph .capbar { height: 3px; border-radius: 3px; background: rgba(255,255,255,.1); margin-top: 9px; overflow: hidden; }
.ph .capbar i { display: block; height: 100%; width: 0; background: #f2b45a; }
.ph .snd { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
.ph .snd i { width: 3px; border-radius: 1px; background: #f2b45a; height: 4px; }
.playing .snd i { animation: eq .8s ease-in-out infinite; }
.snd i:nth-child(2) { animation-delay: -.3s !important; } .snd i:nth-child(3) { animation-delay: -.55s !important; } .snd i:nth-child(4) { animation-delay: -.15s !important; }
@keyframes eq { 0%, 100% { height: 3px; } 50% { height: 12px; } }

/* ---------------- narration strip ---------------- */
#strip { grid-column: 1 / 3; grid-row: 3; border-top: 1px solid var(--line); background: var(--bg1); display: grid; grid-template-columns: minmax(0,1fr) var(--listW); grid-template-rows: 34px auto; min-height: 0; }
#stripHead { grid-column: 1 / -1; display: flex; align-items: center; gap: 5px; padding: 0 8px; border-bottom: 1px solid var(--line); min-width: 0; white-space: nowrap; }
#stripHead .ttlh { margin-right: 4px; }
.sndI { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; width: 18px; }
.sndI i { width: 3px; border-radius: 1px; background: var(--dim); height: 3px; }
.playing .sndI i { background: var(--accent); animation: eq .8s ease-in-out infinite; }
.sndI i:nth-child(2) { animation-delay: -.3s !important; } .sndI i:nth-child(3) { animation-delay: -.55s !important; } .sndI i:nth-child(4) { animation-delay: -.15s !important; }
.sndT { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.playing .sndT { color: var(--accentText); }
@media (max-width: 1380px) { #strip:not(.playing) .sndT { display: none; } }
@media (max-width: 1150px) { #stripHead > .ttlh, .sndT { display: none; } #prevCol .colhead { gap: 7px; padding: 0 6px 0 10px; } }
.tbtn.play { background: var(--accent); color: #1c1c1c; border-color: var(--accent); font-weight: 600; }
.tbtn.play:hover:not(:disabled) { background: #f0b257; }
.tbtn.play svg { fill: currentColor; stroke: none; }
.ttime { font: 11px var(--mono); color: var(--text); min-width: 90px; }
.sstat { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sstat.ok { background: var(--okBg); color: #a9d8a3; } .sstat.amber { background: var(--accentBg); color: var(--accentText); } .sstat.rose { background: var(--roseBg); color: #f0a5a7; } .sstat.none { background: var(--bg3); color: var(--muted); }
#tlArea { display: flex; flex-direction: column; min-width: 0; padding: 6px 8px 5px; gap: 4px; }
#ov { display: block; width: 100%; height: 22px; cursor: pointer; touch-action: none; }
#tl { display: block; width: 100%; height: var(--tlH); cursor: pointer; touch-action: none; border-radius: 4px; }
#selLine { height: 24px; display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 11.5px; color: var(--muted); }
#selLine .q { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--serif); font-size: 12.5px; color: #d6d2c8; }
#selLine .lbl { font: 10.5px var(--mono); color: var(--dim); white-space: nowrap; }
.pillS { font-size: 10.5px; padding: 0 7px; border-radius: 8px; line-height: 17px; white-space: nowrap; }
.pillS.ok { background: var(--okBg); color: #a9d8a3; } .pillS.amber { background: var(--accentBg); color: var(--accentText); } .pillS.rose { background: var(--roseBg); color: #f0a5a7; } .pillS.grey { background: var(--bg3); color: var(--muted); }
#nlist { border-left: 1px solid var(--line); overflow: auto; min-height: 0; max-height: calc(var(--tlH) + 76px); padding: 6px 8px 8px; scrollbar-width: thin; scrollbar-color: var(--bg4) transparent; }
#strip.folded #tlArea, #strip.folded #nlist { display: none; }
.hcard { border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; border: 1px solid var(--line2); background: var(--bg2); font-size: 11.5px; line-height: 1.45; color: var(--muted); }
.hcard b.t { display: block; font-size: 12.5px; color: #eef0f3; margin-bottom: 2px; }
.hcard.ok { border-color: var(--okLine); background: rgba(134,196,127,.07); }
.hcard.amber { border-color: var(--accentLine); background: rgba(233,162,59,.08); }
.hcard.rose { border-color: var(--roseLine); background: rgba(229,127,130,.07); }
.hcard ul { margin: 4px 0 0; padding-left: 16px; }
.nent { border-radius: 6px; padding: 6px 9px 7px; margin-bottom: 5px; border: 1px solid var(--line2); border-left: 3px solid var(--rose); background: var(--bg2); font-size: 11.5px; line-height: 1.4; }
.nent.amber { border-left-color: var(--accent); } .nent.grey { border-left-color: #6a6f78; } .nent.ok { border-left-color: var(--ok); }
.nent.act { box-shadow: 0 0 0 1px var(--focus); }
.nent .nt { display: flex; gap: 6px; align-items: baseline; border: 0; background: transparent; padding: 0; width: 100%; text-align: left; cursor: pointer; color: #e7e9ee; font-weight: 600; }
.nent .nt small { margin-left: auto; font: 10px var(--mono); color: var(--dim); font-weight: 400; white-space: nowrap; }
.nent .q { margin-top: 3px; font: 12.5px/1.45 var(--serif); color: #d8d3c8; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.nent .q del { color: #e9a3a5; text-decoration-color: rgba(229,127,130,.8); }
.nent .q ins { color: #ffd391; text-decoration: none; background: rgba(233,162,59,.14); border-radius: 2px; }
.nent .nx { margin-top: 3px; color: var(--muted); }
.nent .btnrow { margin-top: 5px; gap: 4px; }
.settled { margin-top: 6px; }
.settled summary { cursor: pointer; color: var(--muted); font-size: 11px; padding: 3px 0; }
.settled .nent { opacity: .75; }
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; grid-column: 1 / -1; }
.slot { border: 1.5px dashed var(--line2); border-radius: 8px; padding: 10px 12px; color: var(--muted); font-size: 11.5px; line-height: 1.45; display: flex; gap: 10px; align-items: flex-start; }
.slot b { display: block; color: #eef0f3; font-size: 12.5px; margin-bottom: 2px; }
.slot svg { width: 22px; height: 22px; flex: none; color: var(--accentText); stroke-width: 1.4; }
.slotNote { grid-column: 1 / -1; color: var(--dim); font-size: 11px; padding: 0 2px; }

/* status bar and debug strip */
#sb { display: flex; align-items: center; background: var(--bg1); border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); min-width: 0; }
#sb > div { padding: 0 10px; border-right: 1px solid var(--line); height: 100%; display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
#sb b { color: var(--text); font-weight: 500; }
#sb .grow { flex: 1; min-width: 0; text-overflow: ellipsis; display: block; line-height: 23px; }
#dbg { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding: 3px 6px; background: #1a1220; border-top: 2px dashed #d63fd6; font: 11px var(--mono); color: #e0b6e0; }
#dbg .lab { color: #d63fd6; font-weight: 700; margin-right: 4px; }
#dbg button { height: 22px; padding: 0 8px; border: 1px solid #6c3a6c; border-radius: 3px; background: #2a1830; color: #f3d6f3; cursor: pointer; font: 11px var(--sans); }
#dbg button:hover { background: #3c2246; }
#dbg .sz { margin-left: auto; color: #a07ca0; }
#toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); padding: 7px 14px; border-radius: 5px; background: rgba(240,241,243,.97); color: #18191c; font-size: 12px; font-weight: 500; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 60; max-width: min(640px, calc(100% - 32px)); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
#toast.show { opacity: 1; }
.pop { position: absolute; z-index: 40; background: rgba(31,32,35,.99); border: 1px solid var(--line2); border-radius: 7px; box-shadow: 0 10px 28px rgba(0,0,0,.45); padding: 10px 12px; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.pop h5 { margin: 0 0 6px; font-size: 12.5px; color: #eef0f3; }
.pop code { font: 11px var(--mono); color: #e7c58e; }
.pop ul { margin: 0; padding-left: 16px; }
.pop .assets { display: flex; gap: 8px; }
.pop .asset { width: 120px; border: 1px solid var(--line2); border-radius: 6px; background: var(--bg2); padding: 0; cursor: pointer; text-align: left; overflow: hidden; color: var(--text); }
.pop .asset:hover { border-color: var(--accent); }
.pop .asset .pic { height: 64px; }
.pop .asset span { display: block; padding: 4px 6px; font-size: 11px; }
</style>
</head>
<body>
<header id="tb">
  <div class="brand"><svg class="i" viewBox="0 0 16 16" style="color:var(--accent)"><path d="M8 1.8l5.5 3v6.4L8 14.2 2.5 11.2V4.8z"/><path d="M2.5 4.8L8 7.8l5.5-3M8 7.8v6.4"/></svg><b>Tour Editor</b><span class="doc">Old Town Walk</span></div>
  <div class="grp"><button class="tbtn" disabled title="Undo (this prototype: Ctrl+Z inside the text)"><i data-icon="undo"></i><span>Undo</span></button><button class="tbtn" disabled><i data-icon="redo"></i><span>Redo</span></button></div>
  <div class="spacer"></div>
  <div class="grp" id="tbMap"><button class="tbtn" disabled><i data-icon="frame"></i><span>Frame</span><kbd>F</kbd></button><button class="tbtn" disabled><i data-icon="top"></i><span>Top view</span><kbd>T</kbd></button></div>
</header>

<div id="app">
  <aside id="rail" aria-label="Stations and blocks"></aside>
  <main id="work">
    <section id="map" aria-label="3D view">
      <svg id="scene" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
      <div id="tags"></div>
      <div id="mapCtl" aria-hidden="true"><div class="pill"><span><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 3 15 12H9z" fill="#e5483f"/><path d="M12 21 9 12h6z" fill="#9aa0a6"/></svg></span></div><div class="pill"><span><svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span><svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></span></div></div>
      <div id="mapNote">3D view: a static picture in this prototype</div>
      <aside id="insp" aria-label="Inspector"></aside>
    </section>

    <section id="desk" hidden aria-label="Writing desk">
      <div id="deskHead">
        <button class="tbtn" id="bDone" title="Back to the 3D view (the text is kept as it is)"><i data-icon="back"></i><span>3D view</span></button>
        <div class="crumb"><span id="crumbSt"></span><span>/</span><input class="ttlin" id="dTitle" aria-label="Title of the text" spellcheck="false"></div>
        <div class="fmt" role="toolbar" aria-label="Formatting">
          <button class="fbtn" data-f="h" title="Heading: turns the line into a heading; press again for a smaller one">H</button>
          <button class="fbtn" data-f="b" title="Bold (Ctrl+B)"><b>B</b></button>
          <button class="fbtn" data-f="i" title="Italic (Ctrl+I)"><em>I</em></button>
          <button class="fbtn" data-f="ul" title="List (Tab inside a list makes a list inside the list)"><i data-icon="ul"></i></button>
          <button class="fbtn" data-f="ol" title="Numbered list"><i data-icon="ol"></i></button>
          <button class="fbtn" data-f="link" title="Link (Ctrl+K)"><i data-icon="link"></i></button>
          <button class="fbtn" data-f="pic" title="Picture from the tour's files"><i data-icon="photo"></i></button>
          <button class="fbtn" data-f="help" title="What becomes formatting" aria-haspopup="dialog"><i data-icon="help"></i></button>
        </div>
        <div class="spacer"></div>
        <span class="saved" id="saved">Kept in this page</span>
      </div>
      <div id="deskBody">
        <div id="srcCol">
          <div class="colhead"><span class="ttlh">Your text</span><span class="stat" id="srcStat"></span></div>
          <div id="srcWrap">
            <div id="gutter" aria-hidden="false"><div id="gutIn"></div></div>
            <div id="back" aria-hidden="true"></div>
            <textarea id="src" spellcheck="true" aria-label="The text, written in simple formatting marks" placeholder="Start writing. The buttons above add headings, bold, lists and pictures."></textarea>
          </div>
        </div>
        <div id="marginCol" aria-label="Shown as typed">
          <div class="colhead"><span class="ttlh">Shown as typed</span><span class="cnt" id="mCnt">0</span><span class="spacer"></span><button class="navb" id="mPrev" title="Previous" aria-label="Previous line shown as typed"><i data-icon="up"></i></button><button class="navb" id="mNext" title="Next" aria-label="Next line shown as typed"><i data-icon="down"></i></button></div>
          <div id="mlist"></div>
        </div>
        <div id="prevCol" aria-label="Phone preview">
          <div class="colhead"><span class="ttlh">Visitors see it as</span><span class="spacer"></span><label class="chk" title="The phone scrolls along with your text, and your text with the phone"><input type="checkbox" id="cStep" checked> In step</label><label class="chk" title="Outline what is shown as typed, and mark where you are writing"><input type="checkbox" id="cMarks" checked> My marks</label></div>
          <div id="prevTop"><div class="vcards row" id="vcDesk" role="radiogroup" aria-label="How visitors see this text"></div></div>
          <div id="phoneArea"><div id="phone"><div id="phScr"></div></div></div>
          <div id="prevFoot"><div id="vnote" class="vnote" hidden></div><div class="vexp" id="vexp"></div></div>
        </div>
      </div>
      <div id="strip">
        <div id="stripHead"></div>
        <div id="tlArea"><canvas id="ov" aria-label="The whole narration: click to jump"></canvas><canvas id="tl" tabindex="0" aria-label="Narration timeline: the voice above, your sentences below. Left and right arrows move between sentences, space plays or pauses."></canvas><div id="selLine"></div></div>
        <div id="nlist" aria-label="Where the voice and the text disagree"></div>
      </div>
    </section>
  </main>
</div>

<footer id="sb"><div id="sbMode"></div><div class="grow" id="sbHint"></div><div id="sbWords"></div></footer>
<div id="dbg" aria-label="Prototype debug controls (not part of the design)">
  <span class="lab">PROTOTYPE DEBUG</span>
  <button data-dbg="desk" title="Open or close the writing desk">Desk</button>
  <button data-dbg="vtt" title="Import a WebVTT with 2 mismatches">WebVTT, 2 mismatches</button>
  <button data-dbg="words" title="Import a word list that fits">Word list that fits</button>
  <button data-dbg="stale" title="Edit a word (and reword one sentence) so the timing goes stale">Edit a word: goes stale</button>
  <button data-dbg="reline" title="Re-anchor: line the voice up again; 1 sentence cannot be matched">Re-line (1 unmatched)</button>
  <button data-dbg="table" title="Paste a table">Paste table</button>
  <button data-dbg="html" title="Paste HTML">Paste HTML</button>
  <button data-dbg="nonarr" title="Remove the narration">No narration</button>
  <button data-dbg="reset">Reset</button>
  <span class="sz" id="dbgSz"></span>

## The keep

Long before there was a market, there was a rise in the ground and a tower on top of it. The keep was built of rough field stone, bedded in lime mortar that the builders burned in a kiln down by the river. Nobody wrote down the year it was begun. The first record that mentions it is a dispute about firewood, which tells us that by then somebody lived in the tower through the winter and expected the farms around it to keep him warm. The walls were nearly three metres thick at the base. The only door was on the first floor, reached by a wooden stair that could be pulled up or burned in an emergency. From the top a guard could see the ford across the river and the road coming down from the hills, which is exactly what the tower was for.

A tower that watches a road soon attracts people who want to use the road. Carters stopped below the keep because it was safe there. Smiths and saddlers followed the carters, and bakers followed everyone. By the time the town received the right to hold a market, the open ground at the foot of the tower had already been trampled flat by generations of traders who had not waited for permission. The charter gave them three things:

- Two market days, **Wednesday** and **Saturday**.
- A fair at the end of the harvest.
- The duty to keep the ground free of:
  - dung,
  - carts,
  - and quarrels.

The last of these duties was the hardest to fulfil, and the town records are full of fines for all three.

The keep lost its purpose slowly and then all at once. Once the town had its own walls and gates, a single tower in one corner of the market was more of a nuisance than a defence. In a hard winter the council allowed citizens to take stone from the upper storeys, and in the years that followed nobody quite remembered to stop them. Much of that stone is still in the town. It sits in cellar walls, in garden steps and in the foundations of the guild house in front of you. What remained of the keep was cut down to the height of a man's waist, and a cart road was broken through the middle of it. That is the gap you can see in the wall today. Carts loaded with turnips rolled for two hundred years through the place where the lords of the tower once kept their stores.

The guild house (<i>Gildehaus</i> in the oldest records) was a joint venture, which in this town meant it took eleven years of argument and four of building. The bakers, the butchers, the weavers and the smiths each wanted the hall for themselves, and each refused to pay for a hall they would have to share. What finally brought them together was not friendship but the town scales. Every sack of grain, every bale of wool and every barrel of salt sold in the square had to be weighed, and the weighing had always been done under an awning that leaked. The guilds agreed to build one solid house with a dry ground floor for the scales and an upper hall for their meetings, and to split the cost by the weight of goods each trade brought to market. The weavers, who sold light cloth, paid the least, and the smiths never forgave them.

## The market hall

![The market hall, drawn a few years before the fire](asset:hall-1880)

Those who remembered the hall described it above all by its smell. Under the roof the air was thick with flour dust, with tar from the ropes, with wet wool and with the cheese that the farmers' wives brought in from the villages on Saturdays. Children played between the posts and were chased out again. Dogs slept in the shade. A bell hung under the eaves at the south end, and it was rung at the start and close of each market. Nobody was allowed to sell before the first bell, and anybody still selling after the last one paid a fine to the wardens. On the posts the wardens nailed up the prices of bread and beer, and the posts were so full of old nail holes that a carpenter who repaired one of them claimed it was held together mainly by iron.

## The night of the fire

The fire began in the upper floor on a dry night in October 1890, a few hours after the autumn fair had closed. The most likely cause was a lamp left burning in one of the cloth stores, although at the inquiry each of the merchants was able to prove that it had not been his. A wind was blowing from the east. Within a quarter of an hour the roof was alight from end to end, and burning cloth was carried over the square like enormous moths. The town's fire engine was pulled out of the guild house, where it had been stored for decades, and it was found that the leather hose had dried and cracked. So the townspeople did what their grandparents would have done. They formed a line from the well behind the guild house and passed buckets from hand to hand.

The town never rebuilt the market hall. The council argued about it for six years, as it had once argued about the guild house, and by the end of the argument the traders had grown used to the open sky. Stalls with canvas roofs replaced the posts, and in the new century they were joined by the first carts selling things nobody in the old hall had heard of. The burnt posts were pulled out of the ground in the winter after the fire. Their sockets were filled with stone, and when the square was paved again, the masons laid the stones over them without marking where they had been. Old people in the town could still point to them a generation later. Today nobody can, which is one reason this walk exists.
