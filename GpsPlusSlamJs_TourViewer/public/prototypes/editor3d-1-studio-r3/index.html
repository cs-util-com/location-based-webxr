<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tour Editor Studio 3</title>
<!--
  Throwaway prototype, round 3: desktop 3D tour editor, "Studio 3". It opens in
  the tilted bird's-eye 3D view. Built on the round-2 Studio page, with the
  parts the owner picked from the other round-2 pages ported in: the map
  controls (compass that turns north up, +/- zoom) of "Map that tilts", the
  move arrow in the middle of a selection and the large station billboards of
  "Storyboard", and the layer toggle buttons of "Walk it".
  Original code. Inspired by the docked layouts of game-engine and DCC editors
  (hierarchy left, inspector right, F to frame, drag-on-label value scrubbing),
  by the selection rings of web map editors (a ring with round grips, a turn
  knob on a stalk, drag the middle to move along the ground), by storyboard
  cards (a picture with the name over it), by the two-finger tilt, pinch and
  twist gestures and the declutter of labels in web map apps, and by
  pop-up books (flat map symbols stand up as the camera tilts). The ground
  texture imitates the general look of a standard street-map style, drawn
  procedurally. Camera: three.js OrbitControls (one finger, mouse and wheel;
  the two-finger gestures are handled on this page); code labels: three.js
  CSS2DRenderer. Rendering: three.js r185 (MIT licence), including
  OrbitControls, CSS2DRenderer and BufferGeometryUtils. All icons are simple
  original SVG paths drawn for this gallery. Nothing is saved; all data is
  hard-coded sample data. The station picture, the description, the tour
  details and the model scale are faked here; they are not part of any file
  format yet.
  Hidden URL flags: #morph=8-42 (a smooth band in degrees of tilt, any A-B),
  #morph=snap5 (flat below 5 degrees, upright again above 8), #stations=1000
  (generated stations for a performance check); combine with &.
-->
<style>
:root {
  --bg0: #18191c; --bg1: #1f2023; --bg2: #26282c; --bg3: #2f3136; --bg4: #383a40;
  --line: #313338; --line2: #3c3f46;
  --text: #d9dbe0; --muted: #8a8f99; --dim: #646973;
  --accent: #e9a23b; --accentBg: rgba(233,162,59,.14); --accentLine: rgba(233,162,59,.55);
  --focus: #5b9cf0;
  --ax-e: #e0575b; --ax-n: #4f8fe8; --ax-u: #67bb57;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg0); color: var(--text);
  font: 12px/1.4 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
body { display: grid; grid-template-rows: 40px minmax(0,1fr) 24px; grid-template-columns: minmax(0,1fr); }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
button { font: inherit; color: inherit; }
kbd { font: 10px var(--mono); color: var(--dim); }

/* toolbar */
#tb { display: flex; align-items: center; gap: 6px; padding: 0 8px; background: var(--bg1); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; padding-right: 10px; margin-right: 2px; border-right: 1px solid var(--line); height: 24px; white-space: nowrap; }
.brand b { font-weight: 600; letter-spacing: .01em; }
.brand .doc { color: var(--muted); border: 1px solid transparent; background: transparent; border-radius: 4px; padding: 2px 5px; margin-left: -3px; cursor: pointer;
  max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: inherit; }
.brand .doc:hover { color: var(--text); border-color: var(--line2); background: var(--bg2); }
.grp { display: flex; align-items: center; gap: 2px; padding: 0 6px; border-right: 1px solid var(--line); height: 26px; }
.grp:last-child { border-right: 0; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border: 1px solid transparent; border-radius: 4px; background: transparent; cursor: pointer; white-space: nowrap; color: var(--text); }
.tbtn:hover:not(:disabled) { background: var(--bg3); }
.tbtn:disabled { color: var(--dim); cursor: default; }
.tbtn.on { background: var(--accentBg); border-color: var(--accentLine); color: #f3c47e; }
.spacer { flex: 1; }

/* viewport */
#vp { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #232427; }
#vp canvas { display: block; width: 100%; height: 100%; outline: none; }
#labels { position: absolute; inset: 0; pointer-events: none; }
.tag { pointer-events: auto; display: flex; align-items: center; gap: 5px; padding: 2px 7px 2px 3px; border-radius: 3px; background: rgba(28,29,32,.86);
  border: 1px solid rgba(255,255,255,.08); color: #e6e8ec; font-size: 11px; white-space: nowrap; cursor: pointer; transform: translateY(-50%); }
.tag .n { font: 10px var(--mono); background: #3d5a78; color: #e6f0fa; border-radius: 2px; padding: 0 4px; }
.tag.sel { border-color: var(--accent); }
.tag.sel .n { background: var(--accent); color: #1c1c1c; }
.tag.code .n { background: #4a4f58; }
.ov { position: absolute; pointer-events: none; font-size: 11px; color: #b9bdc5; }
#protoTag { right: 8px; bottom: 8px; font-size: 10px; color: rgba(220,222,226,.7); letter-spacing: .03em; padding: 1px 6px; border-radius: 3px; background: rgba(24,25,28,.6); }
#toast { left: 50%; bottom: 18px; transform: translateX(-50%); padding: 5px 12px; border-radius: 4px; background: rgba(30,31,34,.94); border: 1px solid var(--line2);
  color: var(--text); opacity: 0; transition: opacity .25s; z-index: 9; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
#toast.show { opacity: 1; }
#readout { display: none; padding: 3px 7px; border-radius: 3px; background: rgba(24,25,28,.9); border: 1px solid var(--line2); font: 10.5px var(--mono); color: var(--text); white-space: nowrap; z-index: 8; }
#help kbd { font: 10px var(--mono); padding: 0 4px; border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 3px; background: var(--bg2); color: var(--text); }

/* map controls, docked at the left (ported from "Map that tilts": white pills, 38 px buttons) */
#mapCtl { position: absolute; left: 12px; bottom: 14px; z-index: 4; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.pill { background: #fff; border-radius: 8px; box-shadow: 0 1px 2px rgba(60,64,67,.25), 0 2px 8px rgba(60,64,67,.15); display: flex; flex-direction: column; overflow: hidden; }
.pill button { width: 38px; height: 38px; border: none; background: #fff; cursor: pointer; display: grid; place-items: center; color: #5f6670; padding: 0; }
.pill button:hover { background: #f1f3f4; color: #1f2328; }
.pill button + button { border-top: 1px solid #e4e7eb; }

/* docked panels: flush with the screen edge, only as tall as their content */
.dock { position: absolute; top: 0; z-index: 5; display: flex; flex-direction: column; max-height: calc(100% - 10px);
  background: rgba(31,32,35,.97); border: 1px solid var(--line); border-top: 0; box-shadow: 0 8px 22px rgba(0,0,0,.35); }
#tree { left: 0; width: 272px; border-left: 0; border-radius: 0 0 8px 0; max-height: calc(100% - 150px); }
#insp { right: 0; width: 290px; border-right: 0; border-radius: 0 0 0 8px; max-height: calc(100% - 96px); }
#insp[hidden] { display: none; }
.dhead { flex: none; height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 5px 0 12px; }
.dock:not(.collapsed) .dhead { border-bottom: 1px solid var(--line); }
.dhead .ttlh { font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.dhead .count { font: 10px var(--mono); color: var(--dim); }
.dhead .sp { flex: 1; }
.ib { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border: 0; background: transparent; border-radius: 4px; color: var(--muted); cursor: pointer; flex: none; }
.ib:hover { background: var(--bg3); color: var(--text); }
.ib.add { color: #f3c47e; }
.dbody { overflow: auto; min-height: 0; }
.dock.collapsed .dbody { display: none; }
.dbody::-webkit-scrollbar { width: 10px; } .dbody::-webkit-scrollbar-thumb { background: var(--bg4); border: 3px solid var(--bg1); border-radius: 6px; }

/* tree: station story cards */
.cards { padding: 8px 8px 4px; display: flex; flex-direction: column; gap: 6px; }
.card { border-radius: 6px; overflow: hidden; background: var(--bg2); border: 1px solid var(--line2); }
.card:hover { border-color: #4a4e56; }
.card.ctx { border-color: var(--accentLine); }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.hero { position: relative; height: 62px; background: #33363c center / cover no-repeat; cursor: pointer; user-select: none; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,11,13,.08) 0%, rgba(10,11,13,.3) 42%, rgba(10,11,13,.86) 100%); }
.hero > * { position: absolute; z-index: 1; }
.hero .n { left: 7px; top: 6px; font: 600 10px var(--mono); background: rgba(20,21,24,.78); color: #e6f0fa; border-radius: 3px; padding: 1px 5px; }
.card.sel .hero .n { background: var(--accent); color: #1c1c1c; }
.hero .tw { right: 5px; top: 4px; width: 22px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 4px; color: #e8eaee; background: rgba(20,21,24,.6); border: 0; cursor: pointer; padding: 0; }
.hero .tw:hover { background: rgba(60,63,70,.9); }
.hero .nm { left: 9px; right: 9px; bottom: 19px; font-weight: 600; font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
.hero .ds { left: 9px; right: 9px; bottom: 5px; font-size: 11px; color: rgba(230,232,236,.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero.nodesc .nm { bottom: 7px; }
.kids { padding: 3px 0 4px; }
.kid { position: relative; display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px 0 12px; cursor: default; user-select: none; white-space: nowrap; }
.kid:hover { background: var(--bg3); }
.kid.sel { background: var(--accentBg); }
.kid.sel::before, .row.sel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.kid .nm, .row .nm { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.kid.sel .nm, .row.sel .nm { color: #fff; }
.kid .meta, .row .meta { font: 10.5px var(--mono); color: var(--dim); }
.kid .meta .off { color: var(--accent); font-weight: 400; }
.kid.empty { color: var(--dim); white-space: normal; height: auto; padding: 4px 10px 4px 12px; line-height: 1.35; }
.ic { display: inline-flex; color: var(--muted); }
.ic.pin { color: #e07a6e; } .ic.photo { color: #c9a66b; } .ic.model { color: #a3b1c2; } .ic.code { color: #b9c2cf; } .ic.station { color: #8db8e3; }
/* section headers fold their section (the whole header is the button) */
.sech { display: flex; align-items: center; gap: 5px; border: 0; background: transparent; cursor: pointer; padding: 0; color: var(--muted); user-select: none;
  font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; height: 26px; }
.sech:hover { color: var(--text); }
.sech svg { width: 13px; height: 13px; color: var(--dim); }
.sech .count { font: 10px var(--mono); color: var(--dim); letter-spacing: 0; }
.dhead .sech { font-size: 10.5px; letter-spacing: .09em; }
.sec { display: flex; align-items: center; height: 26px; padding: 0 10px 0 9px; margin-top: 4px; }
.row { position: relative; display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px 0 14px; cursor: default; user-select: none; white-space: nowrap; }
.row:hover { background: var(--bg2); }
.row.sel { background: var(--accentBg); }
/* visible layers: pill toggle buttons with a dot (the look of "Walk it", in this page's dark palette) */
.layers { display: flex; gap: 6px; flex-wrap: wrap; padding: 2px 10px 10px 12px; }
.chip { border: 1px solid var(--line2); background: rgba(255,255,255,.03); border-radius: 999px; padding: 3px 10px 3px 8px; height: 24px;
  cursor: pointer; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: #5a5e66; display: inline-block; }
.chip.on { color: var(--text); border-color: var(--accentLine); background: var(--accentBg); }
.chip.on i { background: var(--accent); }
.chip:hover { border-color: #5a5e66; }

/* inspector: light, actions first, pose tucked away */
#insp .dhead { padding-left: 8px; }
.hic { display: inline-flex; width: 22px; justify-content: center; }
.ttlin { flex: 1; min-width: 0; height: 26px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: #f0f1f3; font: 600 13.5px "Segoe UI", system-ui, sans-serif; padding: 0 5px; outline: none; text-overflow: ellipsis; }
.ttlin:hover { border-color: var(--line2); }
.ttlin:focus { border-color: var(--focus); background: var(--bg2); }
.sub { display: flex; align-items: center; gap: 4px; padding: 6px 12px 2px; color: var(--dim); font-size: 11px; }
.sub .sp { flex: 1; }
.sub .ib { width: 22px; height: 20px; }
.acts { padding: 4px 6px 6px; }
.act { display: flex; align-items: center; gap: 9px; width: 100%; height: 28px; padding: 0 8px; border: 0; border-radius: 4px; background: transparent; cursor: pointer; text-align: left; color: var(--text); }
.act:hover:not(:disabled) { background: var(--bg3); }
.act svg { color: #f3c47e; }
.act .note { color: var(--dim); font-size: 11px; }
.act kbd { margin-left: auto; }
.act:disabled { color: var(--dim); cursor: default; }
.act:disabled svg { color: var(--dim); }
.act.danger svg { color: #d97d79; }
.act.danger:hover { color: #f0a8a5; }
.isec { padding: 6px 12px 8px; border-top: 1px solid var(--line); }
.f { display: grid; grid-template-columns: 74px minmax(0,1fr); align-items: center; gap: 6px; min-height: 26px; margin: 3px 0; }
.f > label { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.f > label.scrub, .ax.scrub { cursor: ew-resize; }
.f > label.scrub:hover { color: var(--text); }
.f.top { align-items: start; } .f.top > label { padding-top: 5px; }
.num { display: flex; align-items: center; height: 24px; background: var(--bg2); border: 1px solid var(--line2); border-radius: 3px; min-width: 0; }
.num:focus-within { border-color: var(--focus); }
.num input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; color: var(--text); padding: 0 4px; font: 11px var(--mono); outline: none; }
.num .unit { color: var(--dim); font: 10.5px var(--mono); padding-right: 6px; }
.num.ro { background: transparent; border-color: var(--line); }
.num.ro input { color: var(--muted); }
.vec { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 4px; }
.vec.two { grid-template-columns: repeat(2, minmax(0,1fr)); }
.ax { font: 600 10px var(--mono); padding: 0 5px; align-self: stretch; display: flex; align-items: center; border-right: 1px solid var(--line2); border-radius: 2px 0 0 2px; }
.ax.e { color: var(--ax-e); } .ax.n { color: var(--ax-n); } .ax.u { color: var(--ax-u); }
.ax.scrub:hover { background: var(--bg3); }
.tfield { height: 24px; background: var(--bg2); border: 1px solid var(--line2); border-radius: 3px; font: 12px "Segoe UI", system-ui, sans-serif; color: var(--text); padding: 0 7px; width: 100%; outline: none; }
.tfield:focus { border-color: var(--focus); }
textarea.tfield { height: 52px; padding: 4px 7px; resize: vertical; line-height: 1.4; }
.note { color: var(--dim); font-size: 11px; line-height: 1.45; margin: 3px 0 2px; }
.warn { color: #e9b86b; font-size: 11px; line-height: 1.45; margin: 4px 0 2px; }
.thumbs { display: flex; gap: 5px; flex-wrap: wrap; }
.thumb { width: 54px; height: 32px; border-radius: 4px; border: 1px solid var(--line2); background: #33363c center / cover no-repeat; cursor: pointer; padding: 0; position: relative; }
.thumb:hover { border-color: #6a6f78; }
.thumb.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.thumb span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 9px; color: #eee; background: rgba(0,0,0,.55); line-height: 12px; text-align: center; }
.disc { display: flex; align-items: center; gap: 6px; width: 100%; height: 30px; padding: 0 10px; border: 0; border-top: 1px solid var(--line); background: transparent; cursor: pointer; color: var(--muted); text-align: left; }
.disc:hover { color: var(--text); background: var(--bg2); }
.disc .lab { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.disc .sum { margin-left: auto; font: 10.5px var(--mono); color: var(--dim); }
.disc svg { transition: transform .15s; }
.disc.open svg { transform: rotate(90deg); }
.pos { padding: 2px 12px 10px; }
.inline { display: flex; gap: 4px; align-items: center; }

/* help popover */
#help { position: absolute; top: 46px; right: 8px; z-index: 30; width: 300px; padding: 10px 12px; background: rgba(31,32,35,.98); border: 1px solid var(--line2); border-radius: 6px; box-shadow: 0 8px 22px rgba(0,0,0,.4); display: none;
  grid-template-columns: auto 1fr; gap: 5px 10px; align-items: center; color: var(--muted); font-size: 11.5px; }
#help.show { display: grid; }
#help span:nth-child(2n+1) { white-space: nowrap; }

/* bottom bar: the selection's power actions; the debug readout behind a toggle */
#sb { display: flex; align-items: center; background: var(--bg1); border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); min-width: 0; }
#sb > div { padding: 0 10px; border-right: 1px solid var(--line); height: 100%; display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
#sb .mono { font: 10.5px var(--mono); }
#sb .grow { flex: 1; min-width: 0; }
#sb b { color: var(--text); font-weight: 500; }
#sbActs { gap: 2px; padding: 0 4px !important; }
#sbActs:empty { display: none !important; }
.sact { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border: 1px solid transparent; border-radius: 3px; background: transparent; color: var(--text); cursor: pointer; font-size: 11px; white-space: nowrap; }
.sact svg { width: 14px; height: 14px; color: #f3c47e; }
.sact:hover { background: var(--bg3); border-color: var(--line2); }
#sbHint { overflow: hidden; text-overflow: ellipsis; display: block !important; line-height: 23px; }
#sb .dbg { display: none !important; }
#sb.debug .dbg { display: flex !important; }
#bDebug { height: 100%; border: 0; border-left: 1px solid var(--line); background: transparent; color: var(--dim); cursor: pointer; padding: 0 9px; font: 10px var(--mono); flex: none; }
#bDebug:hover { color: var(--text); background: var(--bg2); }
#sb.debug #bDebug { color: #f3c47e; }

/* tour details modal */
#modalBack { position: fixed; inset: 0; z-index: 50; background: rgba(8,9,11,.55); display: none; align-items: center; justify-content: center; padding: 16px; }
#modalBack.show { display: flex; }
#modal { width: min(440px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--bg1); border: 1px solid var(--line2); border-radius: 8px; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
#modal h2 { margin: 0; font-size: 13.5px; font-weight: 600; color: #f0f1f3; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
#modal h2 .sp { flex: 1; }
#modal .mb { padding: 10px 14px 4px; }
#modal .f { grid-template-columns: 92px minmax(0,1fr); }
#modal textarea.tfield { height: 72px; }
#modal .thumbs .thumb { width: 64px; height: 40px; }
#modal .mf { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px 12px; border-top: 1px solid var(--line); margin-top: 6px; }
.btn { height: 28px; padding: 0 14px; border-radius: 4px; border: 1px solid var(--line2); background: var(--bg2); color: var(--text); cursor: pointer; }
.btn:hover { background: var(--bg3); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #1c1c1c; font-weight: 600; }
.btn.pri:hover { background: #f0b257; }

@media (max-width: 820px) {
  .tbtn .lbl, .tbtn kbd { display: none; }
  .brand { padding-right: 6px; } .brand b { display: none; }
  .brand { min-width: 0; flex: 0 1 auto; } .brand .doc { max-width: 34vw; min-width: 0; }
  #tb { gap: 2px; padding: 0 4px; } .grp { padding: 0 3px; } .tbtn { padding: 0 6px; }
  #tree { width: min(272px, 56vw); } #insp { width: min(290px, 60vw); }
  .sact .lbl { display: none; }
  #sbHint { display: none !important; }
  #sb .dbg.wide { display: none !important; }
}

<header id="tb">

  <div class="grp">
    <button class="tbtn" id="bDetails" title="Tour details: name, cover image, description"><i data-icon="pencil"></i></button>
    <button class="tbtn" id="bUndo" title="Undo (Ctrl+Z)"><i data-icon="undo"></i><span class="lbl">Undo</span></button>
    <button class="tbtn" id="bRedo" title="Redo (Ctrl+Shift+Z)"><i data-icon="redo"></i><span class="lbl">Redo</span></button>

  '<span>Select</span><span>click or tap first, then drag the middle arrow; a drag on anything else moves the camera</span>' +
  '<span>Handles</span><span>the middle arrow moves, a white dot for the radius (stations) or the size (3D models), the round arrow turns; Shift snaps</span>' +
  '<span><kbd>Arrows</kbd></span><span>nudge 0.1 m east / north, <kbd>Shift</kbd> 1 m</span>' +
  '<span><kbd>Q</kbd> <kbd>E</kbd></span><span>turn 5 deg (Shift 15); also <kbd>Alt</kbd>+<kbd>Left/Right</kbd></span>' +
  '<span><kbd>PgUp</kbd> <kbd>PgDn</kbd></span><span>height up / down</span>' +
  '<span><kbd>T</kbd></span><span>top view on / off</span>' +
  '<span><kbd>F</kbd> / double</span><span>frame the selection (double click or double tap), <kbd>Home</kbd> the tour</span>' +
  '<span><kbd>Ctrl</kbd>+<kbd>D</kbd></span><span>duplicate the selection</span>' +
  '<span><kbd>Del</kbd></span><span>delete the selection</span>' +
  '<span><kbd>Ctrl</kbd>+<kbd>Z</kbd></span><span>undo, add <kbd>Shift</kbd> to redo</span>';
$('#bHelp').addEventListener('click', (e) => { e.stopPropagation(); $('#help').classList.toggle('show'); $('#bHelp').classList.toggle('on', $('#help').classList.contains('show')); });
document.addEventListener('pointerdown', (e) => { if (!e.target.closest('#help') && !e.target.closest('#bHelp')) { $('#help').classList.remove('show'); $('#bHelp').classList.remove('on'); } });
$('#bTop').addEventListener('click', () => setTop(!top.active));
$('#bFrame').addEventListener('click', () => frameSelection(!S.sel));
$('#bUndo').addEventListener('click', undo);
$('#bRedo').addEventListener('click', redo);
$('#bDebug').addEventListener('click', () => { const on = $('#sb').classList.toggle('debug'); $('#bDebug').setAttribute('aria-pressed', String(on)); });

window.addEventListener('keydown', (e) => {
  if ($('#modalBack').classList.contains('show')) return;
  const a = document.activeElement; const typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && !a.readOnly;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.code === 'KeyZ') { if (typing) return; e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.code === 'KeyY') { if (typing) return; e.preventDefault(); redo(); return; }
  if (mod && e.code === 'KeyD') { if (typing) return; e.preventDefault(); duplicateSel(); return; }
  if (typing || mod || drag) return;
  const turn = (d) => { e.preventDefault(); nudge(0, 0, 0, d * (e.shiftKey ? 15 : 5), 'Turn ' + selNoun(getSel())); };
  if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return turn(e.key === 'ArrowRight' ? 1 : -1);
  if (e.key.startsWith('Arrow')) {
    e.preventDefault(); if (!S.sel) return; const st = e.shiftKey ? 1 : 0.1;
    const dE = e.key === 'ArrowRight' ? st : e.key === 'ArrowLeft' ? -st : 0, dN = e.key === 'ArrowUp' ? st : e.key === 'ArrowDown' ? -st : 0;
    nudge(dE, dN, 0, 0, 'Nudge ' + selNoun(getSel())); return;
  }
  if (e.key === 'PageUp' || e.key === 'PageDown') { e.preventDefault(); const g = getSel(); if (g && g.kind !== 'station') nudge(0, 0, (e.key === 'PageUp' ? 1 : -1) * (e.shiftKey ? 1 : 0.1), 0, 'Change height'); return; }
  if (e.code === 'KeyT') return setTop(!top.active);
  if (e.code === 'KeyF') return frameSelection(!S.sel);
  if (e.code === 'Home') return frameSelection(true);
  if (e.code === 'Escape') { if ($('#help').classList.contains('show')) { $('#help').classList.remove('show'); $('#bHelp').classList.remove('on'); return; } return select(null); }
  if ((e.code === 'KeyQ' || e.code === 'KeyE') && S.sel) return turn(e.code === 'KeyE' ? 1 : -1);
  if (e.code === 'Delete' || e.code === 'Backspace') { e.preventDefault(); deleteSel(); }
});

// ---------------------------------------------------------------- loop
function resize() { vpW = vp.clientWidth; vpH = Math.max(1, vp.clientHeight); renderer.setSize(vpW, vpH, false); labelRenderer.setSize(vpW, vpH); camera.aspect = vpW / vpH; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(vp); resize();
let lastT = performance.now(), statT = 0, ready = false, flatWas = -1;
const needle = $('#needle'); const cursorEl = $('#sbCursor'), callsEl = $('#sbCalls'), frameEl = $('#sbFrame');
const frameMs = []; let perfRec = null;   // recent frame times; perfRec collects every frame while a measurement runs
function frame(now) {
  const dtMs = now - lastT; const dt = Math.min(0.05, dtMs / 1000); lastT = now;
  frameMs.push(dtMs); if (frameMs.length > 60) frameMs.shift();
  if (perfRec) { perfRec.ms.push(dtMs); if (perfRec.spin) placeCam(orbit.target, camState().dist, camState().polar, camState().azim + perfRec.spin * dt); }
  if (tween) stepTween(now);
  else if (!two) orbit.update();
  const tilt = updateMorph(dt);
  // the stations whose items show follow the orbit target
  if (!drag) { const ids = computeShown(); const k = keyOf(ids); if (k !== shownKey) sync(); }
  if (flatK > 0 || flatWas !== flatK) { placeItems(); flatWas = flatK; }   // flat symbols follow the zoom
  const g = getSel(); if (g && g.kind === 'station') { const v = views.get(g.s.id); if (v) updateStationRings(v, g.s, true); }
  updateHandles(); updateBillboards(); updateLabelLOD();
  if (hoverDirty) doHover();
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
  if (perfRec) perfRec.calls.push(renderer.info.render.calls);
  if (now - statT > 200) {
    statT = now; const head = -camState().azim / DEG;
    needle.setAttribute('transform', `rotate(${-head} 12 12)`);
    updateViewLabel(tilt);
    cursorEl.textContent = cursorGround ? `E ${fmtNum(cursorGround.x, 2)}  N ${fmtNum(-cursorGround.z, 2)}  alt ${fmtNum(cursorGround.y, 2)} m` : 'E -  N -  alt -';
    callsEl.textContent = `${renderer.info.render.calls} draw calls`;
    const mean = frameMs.reduce((a, b) => a + b, 0) / Math.max(1, frameMs.length); frameEl.textContent = `${fmtNum(mean, 1)} ms / frame`;
  }
  if (!ready) { ready = true; window.__proto.ready = true; }
  requestAnimationFrame(frame);
}
// test hook (used by throwaway headless checks; not part of any suite): read the state, the camera
// and the morph, project handle and world positions to page pixels, set the camera angle directly
// (as a drag would), and record frame times for the performance check
const toPage = (v3) => { const p = v3.clone().project(camera); const r = canvas.getBoundingClientRect(); return { x: r.left + (p.x + 1) / 2 * r.width, y: r.top + (1 - p.y) / 2 * r.height }; };
window.__proto = {
  ready: false,
  select: (kind, id) => select(kind, id),
  frame: () => frameSelection(),
  busy: () => !!tween || (MORPH.snap && flatK % 1 !== 0),
  pose: (id) => { const r = findItem(id); if (r) { const w = itemWorld(r.s, r.it); return { E: w.E, N: w.N, y: w.y, heading: w.heading, scale: r.it.scale || 1, size: r.it.type === 'model' ? modelSize(r.it) : null }; } const s = findStation(id); if (s) return { E: s.E, N: s.N, y: s.alt, heading: s.heading, radius: s.radius }; const c = findCode(id); return c ? { E: c.E, N: c.N, y: c.U, heading: c.heading } : null; },
  handle: (name) => { updateHandles(); const o = { middle: hDisc, knob: hKnob, dot: hDots[0] }[name]; if (!o || !o.visible) return null; return toPage(o.position); },
  // the screen point of an item's visible body (its pivot, lifted to the middle of what is drawn)
  itemPoint: (id) => { const v = views.get(id); if (!v) return null; const b = new THREE.Box3().setFromObject(v.root); return toPage(b.getCenter(new THREE.Vector3())); },
  billboardPoint: (id) => { const b = bb.get(id); if (!b || !b.sprite.visible) return null; const p = toPage(b.sprite.position); const hpx = b.sprite.scale.y / pxScale(); return { x: p.x, y: p.y - (0.5 - b.sprite.center.y) * hpx }; },
  // the screen boxes the declutter reserved for billboards this frame (viewport pixels), and which code tags are on
  billboardRects: () => bbRects.map((r) => ({ ...r })),
  codeTags: () => [...views].filter(([, v]) => v.kind === 'code').map(([id, v]) => ({ id, on: v.label.visible })),
  project: (E, y, N) => toPage(new THREE.Vector3(E, y, -N)),
  ground: (E, N) => surfaceY(E, N),
  selected: () => S.sel,
  camera: () => camera.position.toArray(),
  cam: () => { const c = camState(); return { target: orbit.target.toArray(), dist: c.dist, tiltDeg: c.polar / DEG, headingDeg: norm360(-c.azim / DEG) }; },
  setTilt: (deg) => { tween = null; killInertia(); const c = camState(); placeCam(orbit.target, c.dist, deg * DEG, c.azim); },
  setView: ({ E, N, dist, tilt, heading }) => { tween = null; killInertia(); const c = camState(); const t = E != null ? new THREE.Vector3(E, surfaceY(E, N), -N) : orbit.target.clone(); placeCam(t, dist ?? c.dist, tilt != null ? tilt * DEG : c.polar, heading != null ? -heading * DEG : c.azim); },
  setHeading: (deg) => { tween = null; killInertia(); const c = camState(); placeCam(orbit.target, c.dist, c.polar, -deg * DEG); },
  flat: () => flatK,
  morph: () => ({ ...MORPH }),
  topActive: () => top.active,
  // pins and photos: the pivot's lie-down angle in degrees (0 standing, 90 flat)
  itemFold: (id) => { const v = views.get(id); return v && v.pivot ? v.pivot.rotation.x / DEG : null; },
  shown: () => [...shownIds],
  views: () => views.size,
  billboards: () => bbPlaced.map((s) => s.userData.pick.id),
  expanded: () => [...expanded],
  sections: () => ({ ...secOpen }),
  gestures: () => [...gestureLog],
  touchBlocked: () => touchBlocked,
  tour: () => ({ ...S.tour }),
  lastCopied: () => lastCopied,
  history: () => hist.past.length,
  calls: () => renderer.info.render.calls,
  layers: () => ({ ...layers }),
  setLayer: (k, on) => { layers[k] = !!on; applyLayers(); renderTree(); },
  // record frame times and draw calls for ms milliseconds (spin: radians per second of turn)
  perf: (ms, spin = 0) => new Promise((res) => { perfRec = { ms: [], calls: [], spin }; setTimeout(() => { const r = perfRec; perfRec = null; const f = r.ms.slice(1); const mean = f.reduce((a, b) => a + b, 0) / Math.max(1, f.length); res({ frames: f.length, meanMs: mean, maxMs: Math.max(...f), meanCalls: r.calls.reduce((a, b) => a + b, 0) / Math.max(1, r.calls.length), maxCalls: Math.max(...r.calls), billboards: bbPlaced.length, views: views.size }); }, ms); }),
};
sync(); renderTree(); renderInspector(); updateViewUI(); updateHistoryUI();
requestAnimationFrame(frame);
