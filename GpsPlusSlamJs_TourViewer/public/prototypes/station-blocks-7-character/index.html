<style>

  --red: #c4483a;
  --ok: #8fc49a;
  --warn: #f0b35a;
  --sky: #e4e9ee;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: ui-serif, Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 var(--sans); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

/* ---------- prototype chrome (not part of the app) ---------- */

.spacer { flex: 1; }

#readout { position: fixed; left: 6px; bottom: 4px; z-index: 50; font: 10px/1.2 ui-monospace, "Cascadia Mono", Consolas, monospace; color: rgba(244,239,230,0.75); background: rgba(10,12,16,0.6); padding: 2px 6px; border-radius: 6px; pointer-events: none; }

/* ---------- visitor HUD (the app) ---------- */
#picker { top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; max-width: calc(100% - 20px); overflow-x: auto; scrollbar-width: none; background: var(--glass); border-radius: 999px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

#vBottom { left: 0; right: 0; bottom: 22px; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
#hint { font-size: 12px; color: rgba(244,239,230,0.9); background: rgba(14,16,21,0.62); padding: 4px 10px; border-radius: 999px; transition: opacity 0.8s; text-align: center; max-width: 92%; }

#portrait .ring { position: relative; flex: none; width: 76px; height: 76px; border-radius: 50%; background: #1b1f27; box-shadow: 0 0 0 3px var(--gold), 0 8px 24px rgba(0,0,0,0.35); pointer-events: auto; cursor: pointer; }
#portrait .ring canvas { width: 76px; height: 76px; border-radius: 50%; display: block; }
#portrait .tick { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transition: opacity 0.3s; }

textarea, input[type="text"], input[type="number"], select { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.14); border-radius: 10px; padding: 8px 10px; color: var(--ink); }
textarea { resize: vertical; min-height: 64px; line-height: 1.4; }
.val { font-variant-numeric: tabular-nums; min-width: 56px; text-align: right; }
.status { font-size: 12px; color: var(--muted); margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- editor (desktop) ---------- */
body[data-mode="editor"] #stage { background: #20242b; }
body[data-mode="editor"] #canvasWrap { left: 232px; right: 312px; }
#eList { left: 0; top: 0; bottom: 0; width: 232px; background: #15181e; border-right: 1px solid var(--faint); padding: 14px 10px; overflow: auto; }

.eh { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 14px 4px 6px; font-weight: 600; }

.eitem { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: 8px; color: var(--ink); font-size: 13px; }

.sec { border-top: 1px solid var(--faint); padding-top: 12px; margin-top: 12px; }

.sec h4 small { color: var(--muted); font-weight: 400; font-size: 11px; }
.f { margin-top: 9px; }
.f > label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; letter-spacing: 0.02em; }
.f .code { font: 11px/1.3 ui-monospace, Consolas, monospace; color: #c9c3b6; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.grid3 input { padding: 6px 8px; }
.segsmall { display: inline-flex; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.14); border-radius: 10px; padding: 2px; }
.segsmall button { border: 0; background: transparent; padding: 5px 12px; border-radius: 8px; color: var(--muted); font-size: 12px; }
.segsmall button[aria-pressed="true"] { background: rgba(242,184,75,0.16); color: var(--gold); font-weight: 600; }
.thumbs { display: flex; gap: 6px; }
.thumbs figure { margin: 0; text-align: center; font-size: 10px; color: var(--muted); }
.thumbs canvas { width: 44px; height: 88px; border-radius: 6px; background: repeating-conic-gradient(#2a2e36 0% 25%, #22262d 0% 50%) 50% / 12px 12px; display: block; }
#eTools { top: 10px; left: calc(232px + 10px); right: calc(312px + 10px); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
#eTools > * { pointer-events: auto; }
#eTools .tip { font-size: 12px; color: var(--muted); background: rgba(14,16,21,0.75); padding: 5px 10px; border-radius: 999px; }
pre.json { font: 11px/1.35 ui-monospace, Consolas, monospace; background: rgba(0,0,0,0.35); border-radius: 10px; padding: 10px; max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word; color: #d9d3c6; }
#eStations { display: none; }
@media (max-width: 699px) {
  body[data-mode="editor"] #canvasWrap { left: 0; right: 0; bottom: 54%; }
  #eList { display: none !important; }
  #eInsp { top: 46%; left: 0; width: auto; border-left: 0; border-top: 1px solid var(--faint); border-radius: 18px 18px 0 0; }
  #eTools { left: 10px; right: 10px; }
  #eStations { display: inline-flex; margin-bottom: 10px; }
  #eTools .tip { display: none; }
}

/* ---------- fields panel + notes ---------- */
#fields { top: 52px; right: 10px; width: min(330px, calc(100% - 20px)); background: var(--glass-2); border-radius: 16px; padding: 12px 14px; font-size: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); max-height: calc(100% - 140px); overflow: auto; z-index: 20; }
#fields h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }

body[data-mode="editor"] #fields { right: 322px; }
@media (max-width: 699px) { body[data-mode="editor"] #fields { right: 10px; } }

#notes { position: fixed; inset: 44px 0 0 0; z-index: 60; background: rgba(8,9,12,0.94); overflow: auto; padding: 24px 16px 60px; }
#notes .inner { max-width: 760px; margin: 0 auto; }

#notes summary { cursor: pointer; font-weight: 600; font-size: 15px; }

#notes ul { padding-left: 20px; }
#notes b { color: var(--ink); }
#notes .close { position: sticky; top: 0; float: right; }
</style>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   Small helpers
   ============================================================ */
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const DEG = Math.PI / 180;
const SANS = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
const SERIF = 'ui-serif, Georgia, "Times New Roman", serif';
const wrapAngle = (a) => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fnv1a(str) {
  let h = 0x811c9dc5;
  for (const ch of str) { h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
  return 'fnv1a:' + h.toString(16).padStart(8, '0');
}
function tokenize(text) {
  const out = []; const re = /\S+/g; let m;
  while ((m = re.exec(text))) out.push({ text: m[0], from: m.index, to: m.index + m[0].length });
  return out;
}
/** Fake word timing for the generated tone narration (no speech). */
function makeTiming(text) {
  const segs = []; let t = 260;
  for (const w of tokenize(text)) {
    const letters = w.text.replace(/[^\p{L}\p{N}]/gu, '').length || 1;
    const dur = clamp(110 + 52 * letters, 170, 640);
    segs.push({ startMs: Math.round(t), endMs: Math.round(t + dur), from: w.from, to: w.to });
    t += dur + 70;
    if (/[.!?]$/.test(w.text)) t += 430; else if (/[,;:]$/.test(w.text)) t += 210;
  }
  return { granularity: 'word', segments: segs, textHash: fnv1a(text) };
}
const timingEnd = (tm) => (tm && tm.segments.length ? tm.segments[tm.segments.length - 1].endMs : 0);
const isStale = (ap) => !ap.timing || ap.timing.textHash !== fnv1a(ap.line);

/* ============================================================
   The example record (the same data in every view)
   ============================================================ */
const LINE1 = 'Good day, traveller! My keep stood behind that broken wall. Come, the market road runs east.';
const LINE2 = 'Here the carts left for the fields. At dusk the guild bell called them home.';
const LINE_MAX = 120;
const model = {
  character: {
    id: 'wendel',
    name: 'Wendel the Warden',
    image: 'media/wendel.png',
    frames: { image: 'media/wendel-frames.png', frameW: 512, frameH: 1024, names: ['idle', 'talk-a', 'talk-b', 'beckon'] },
    voiceCredit: 'Tone pattern stand-in, no speech',
  },
  stations: [
    { id: 's1', title: 'Market square', anchor: { x: 0, z: 0 }, radiusM: 25, view: 'bubble',

/* ============================================================

<template id="notesTpl">
<details open><summary>1. The model as built, and what I would change</summary><p>As built (exactly the assignment's fields; <code>exportModel()</code> returns this):</p><ul><li>tour level <code>character</code>: <code>id</code>, <code>name</code>, <code>image</code> (one alpha cut-out), <code>frames</code> (optional sprite sheet; I gave it the shape <code>{ image, frameW, frameH, names: ["idle", "talk-a", "talk-b", "beckon"] }</code>), <code>voiceCredit</code>.</li><li>per station <code>appearance</code>: <code>characterId</code>, <code>pose</code> (<code>position</code> in metres from the station anchor, <code>yawDeg</code>, 0 = facing south), <code>heightM</code>, <code>line</code>, <code>narration</code> (asset ref), <code>timing</code> (as family 1: <code>granularity</code>, <code>segments [{ startMs, endMs, from, to }]</code>, <code>textHash</code>), <code>bubbleSide</code> (<code>left</code>, <code>right</code>, or <code>auto</code>).</li><li><code>view</code> sits on the block wrapper, not in the model: it is the creator's choice of drawing, not data about the character.</li></ul><p>Changes I would make:</p><ul><li><b>Add <code>character.heightM</code></b> (his natural height), making <code>appearance.heightM</code> an optional override. Nine stations out of ten use the same height, and a creator in a hurry should not retype it; a height that drifts between stations reads as a different character.</li><li><b>Give <code>frames</code> named roles</b>, not just names: <code>roles: { idle: 0, talk: [1, 2], point: 3 }</code>. A view is code written once; it needs to know which frame is "talking" and which is "pointing" for ANY character, and free-text names do not guarantee that.</li><li><b>Add <code>appearance.lang</code></b> (or <code>character.lang</code>): line breaking, quotes and a future voice depend on it; it costs one field.</li><li><b>Make <code>bubbleSide</code> a preference with <code>auto</code> as the default.</b> The page flips it when the bubble would leave the screen and slides it back on screen as a last resort; a fixed side is wrong half the time once the visitor walks around him.</li><li><b>Cap <code>line</code> at about 120 characters</b> (two short sentences). Anything longer is family 1's narrated text, opened from the bubble.</li><li>Keep <code>characterId</code> even with one character: a second character (a market woman, a child) is the obvious next request.</li><li>I would NOT add a back image: the back of the cut-out is generated from the alpha at load (white edge, grey board).</li></ul></details>
<details><summary>2. Per view: what it is, fields, why a visitor likes it, where it is weakest</summary><p><b>bubble</b> (required). The cut-out stands on the square with a die-cut white edge and a soft contact shadow. He turns up to 60 degrees from his rest facing toward the visitor and breathes very slightly. Farther than 9 m he shows only a small name tag with three dots; within 9 m the bubble opens (dark backplate, light text, his name in gold). The bubble has a reading floor: it is never smaller on screen than body text read at 2.4 m, so at 9 m it is a 3.7 m object in the world but the same size on screen. Tap opens or closes it.</p><ul><li>Fields: <code>name</code>, <code>image</code> (first frame), <code>characterId</code>, <code>pose</code>, <code>heightM</code>, <code>line</code>, <code>bubbleSide</code>.</li><li>Why: the character is in the place, not in a panel; it reads instantly.</li><li>Weakest: 1 m of height or placement error shows as floating or sunken feet (the shadow hides some, not all). Side-on beyond 60 degrees the cut-out goes thin; from behind he is grey board. In a crowded square the bubble covers other people. Sunlight: the dark plate holds up.</li></ul><p><b>speak</b> (required). The bubble view plus tap to speak: the tone pattern plays, the spoken word turns gold and underlined, words already said stay white, words to come are dimmed, and the mouth alternates between two frames while a word sounds. A quiet line under the text credits the voice. With sound off the read-along is identical, silent, and says "Sound off: reading along". If the line was edited after the timing was made (hash differs), tapping plays nothing and the bubble says, quietly in amber, that the narration is out of date.</p><ul><li>Fields: all of bubble plus <code>frames</code>, <code>narration</code>, <code>timing</code>, <code>voiceCredit</code>.</li><li>Why: the character "talks"; read-along makes it work in a loud square or with sound banned.</li><li>Weakest: the tap target is small beyond 5 m (the bubble is also a tap target, which helps). The bubble texture is re-uploaded on every word change (about 16 uploads per line).</li></ul><p><b>two-stations</b> (required). The same character, one image asset, at both stations with a different line. At station 1, once he has said his line (or after 6 s of the bubble being open) he switches to the beckon frame, mirrored so the open hand points toward the next station on screen, and slow gold chevrons on the ground lead out of the circle toward it. "Walk on" walks the visitor east; between the circles nothing of him is shown, only the app's own chip (station, direction, distance). At station 2 he greets again with the second line.</p><ul><li>Fields: every field; both appearances share <code>characterId</code> and therefore the image, frames, name and credit.</li><li>Why: a familiar face that hands you on is the cheapest way to make a tour feel like one walk.</li><li>Weakest: "next station" comes from the tour's station order, not from a field. Mirroring the beckon frame moves the shield to the other arm (visible if you watch for it). The chevrons are only 5 m long, so a few degrees of heading error matters little.</li></ul><p><b>portrait</b> (the suggested idea). He stands in the world without a bubble (a name tag only, and a gold ring pulses at his feet while he talks). A round portrait (the head cropped from the same frames, so its mouth moves) and a caption card with the read-along sit in a bottom corner; <code>bubbleSide</code> picks the corner. When he is off screen a gold tick on the ring points toward him. In landscape the card moves to the top.</p><ul><li>Fields: <code>name</code>, <code>image</code>, <code>frames</code>, <code>voiceCredit</code>, <code>characterId</code>, <code>pose</code>, <code>heightM</code>, <code>line</code>, <code>narration</code>, <code>timing</code>, <code>bubbleSide</code> (reused as the corner).</li><li>Why: the most robust view: screen text is unaffected by sunlight angle, distance or 1 m of error, and the tick finds him.</li><li>Weakest: it loses the magic of him speaking in the place; the card covers the lower third of the screen; in AR it needs the DOM overlay feature (or a screen-space quad).</li></ul><p><b>popup</b> (my own idea, nobody listed it). A paper-theatre stage lies flat on the ground; when the visitor comes within 12 m it unfolds like a pop-up book: first the arched backdrop (the old keep drawn in ink on cream paper), then the knight on his cardboard tab, then a scroll unrolls above with his line in ink. Tap the stage and the line reads along in red ink. His name is printed on the stage's front edge. The stage keeps its fixed facing (<code>pose.yawDeg</code>); it never turns.</p><ul><li>Fields: <code>name</code>, <code>image</code>, <code>frames</code>, <code>voiceCredit</code>, <code>characterId</code>, <code>pose</code> (with the fixed facing), <code>heightM</code> (scales the whole stage), <code>line</code>, <code>narration</code>, <code>timing</code>. Not <code>bubbleSide</code>.</li><li>Why: it is a storybook object, so it does not pretend to fit the real ruins; 1 m of error does not matter, and the unfolding is a calm, single reveal.</li><li>Weakest: no reading floor (scroll letters are 0.13 m, readable to about 5 m). From the side it is flat, from behind it is board. It is 2.5 m wide, too big for a museum unless <code>heightM</code> is cut. The backdrop drawing is view code: a creator who wants their own backdrop needs a new field.</li></ul></details>
<details><summary>3. Costs</summary><p>Frame time, measured with the readout, headless: page CPU work per frame is a mean of about 1 to 11 ms in every view and mode (the worst single frames, 50 to 420 ms, are the first-frame shader compiles and texture uploads just after a view switch, plus the bubble re-upload per word in speak at 1440 x 900). The frame interval itself read 33 to 3 000 ms because the machine was loaded by other browser runs; the full table is in the page's notes panel (measured headless with the readout, SwiftShader software rendering on a shared, loaded machine, so it says little about a phone). Work per frame is small in every view: two textured quads per appearance, a bubble quad, a few ground quads; the scene stand-ins dominate draw calls.</p><p><b>Measured headless</b> (SwiftShader software rendering, a machine shared with other browser runs; 2 s window, mean / max ms). The frame interval is set by the load and the screenshots, not by the page; the CPU column (update plus render submission) is the page's own work.</p><table style="border-collapse:collapse;font-size:12px"><tr><th align=left>viewport</th><th align=left>mode / view</th><th align=left>interval</th><th align=left>cpu</th></tr><tr><td>390x844</td><td>visitor bubble</td><td>2966.5 / 2966.5</td><td>6.1 / 6.1</td></tr><tr><td>390x844</td><td>visitor speak</td><td>53.9 / 450.0</td><td>1.2 / 8.0</td></tr><tr><td>390x844</td><td>visitor two-stations</td><td>33.1 / 249.9</td><td>5.8 / 52.0</td></tr><tr><td>390x844</td><td>visitor portrait</td><td>33.1 / 116.7</td><td>2.7 / 50.4</td></tr><tr><td>390x844</td><td>visitor popup</td><td>50.8 / 216.7</td><td>10.8 / 190.3</td></tr><tr><td>390x844</td><td>creator</td><td>42.9 / 250.0</td><td>6.8 / 76.9</td></tr><tr><td>390x844</td><td>editor</td><td>43.1 / 266.7</td><td>1.2 / 9.0</td></tr><tr><td>844x390</td><td>visitor bubble</td><td>54.5 / 383.4</td><td>5.0 / 110.1</td></tr><tr><td>844x390</td><td>visitor speak</td><td>123.5 / 483.3</td><td>3.4 / 20.4</td></tr><tr><td>844x390</td><td>visitor two-stations</td><td>54.3 / 400.0</td><td>5.5 / 57.8</td></tr><tr><td>844x390</td><td>visitor portrait</td><td>72.0 / 300.0</td><td>4.5 / 104.6</td></tr><tr><td>844x390</td><td>visitor popup</td><td>113.9 / 850.0</td><td>8.7 / 105.3</td></tr><tr><td>844x390</td><td>creator</td><td>84.0 / 466.6</td><td>0.4 / 0.5</td></tr><tr><td>844x390</td><td>editor</td><td>90.7 / 500.0</td><td>1.1 / 7.5</td></tr><tr><td>1440x900</td><td>visitor bubble</td><td>134.4 / 850.0</td><td>1.5 / 10.2</td></tr><tr><td>1440x900</td><td>visitor speak</td><td>183.3 / 833.3</td><td>39.1 / 418.1</td></tr><tr><td>1440x900</td><td>visitor two-stations</td><td>73.2 / 183.3</td><td>1.5 / 19.5</td></tr><tr><td>1440x900</td><td>visitor portrait</td><td>148.8 / 333.3</td><td>5.8 / 69.7</td></tr><tr><td>1440x900</td><td>visitor popup</td><td>203.3 / 350.0</td><td>1.3 / 2.4</td></tr><tr><td>1440x900</td><td>creator</td><td>138.9 / 350.0</td><td>1.7 / 19.0</td></tr><tr><td>1440x900</td><td>editor</td><td>257.4 / 983.4</td><td>1.0 / 1.9</td></tr></table><p>Media, measured from the generated canvases (<code>mediaSizes()</code>):</p><ul><li>one frame as the <code>image</code> asset: 512 x 1024, PNG 320 KB, WebP 51 KB.</li><li>the 4-frame sheet: 2048 x 1024, PNG 737 KB, WebP 173 KB. GPU: about 11 MB with mipmaps.</li><li>the back side: generated at load from the alpha, 0 bytes in the zip, but another 11 MB of GPU memory; a shader that tints the front's alpha would remove it.</li><li>narration: the tone stand-ins are 8.1 s and 6.5 s; as speech in Opus at 24 kbps that is about 25 KB and 20 KB per station. Timing JSON is under 1 KB.</li><li>pop-up backdrop 1024 x 1080: WebP 29 KB if shipped, about 4.4 MB on the GPU; in the page it is drawn by code.</li><li>So a station with this block costs about 200 KB the first time (the character), then about 25 KB per further station. That is the strongest argument for the tour-level character.</li></ul><p>Creator minutes:</p><ul><li>once per tour: the character (an illustration with alpha and three or four frames) is the real cost, hours, not minutes.</li><li>per station: a line (1 min), placing and turning (1 min), size if it differs (0 min with <code>character.heightM</code>).</li><li>narration: recording 2 min, timing by forced alignment or by hand 2 to 10 min; or none, and the views fall back to plain reading.</li></ul></details>
<details><summary>4. Creator controls per view</summary><p>On the phone (creator mode), five large buttons, the same for every view:</p><ul><li><b>View</b>: chips for the five views, and the bubble side (left, auto, right).</li><li><b>Line</b>: the text with a counter (120 max) and the timing status; editing the line marks the timing out of date, and "Re-time narration" rebuilds the stand-in timing.</li><li><b>Size</b>: a slider (0.5 to 3.2 m) with Child, Adult, Giant presets.</li><li><b>Turn</b>: a slider and "Face the phone"; the sheet says he turns up to 60 degrees toward a visitor (in the pop-up view the stage does not turn at all).</li><li><b>Move</b>: tap the ground where he should stand, or "Two steps in front of me"; he is kept inside the station circle.</li><li>A gold ring at his feet marks the block being edited.</li></ul><p>In the desktop editor:</p><ul><li>left: the tour's character (shared) and each station's blocks.</li><li>right: the appearance (view, line, height, bubble side, x, z, yaw, narration with timing status, Play, Re-time) and the shared character (name, the four frames, voice credit, id). Editing the name changes both stations at once, which is the point of the model. "Show tour JSON" shows the stored record live.</li><li>in the 3D view: a gold disc to drag him, a white ring with a gold knob to turn him (Shift snaps 15 degrees), and a faint gold circle at 9 m where his bubble opens. The bubble is shown at its real world size here (no reading floor), which is honest about how small it is without the floor.</li></ul></details>
<details><summary>5. Blunt self-check</summary><ul><li><b>Breaks or stretches the prompt:</b> the reading floor means the bubble is screen-sized text drawn in the world: it grows in the world with distance and is drawn over everything (no depth test). I think that is right for AR, but it is not "world-sized text". The portrait view is DOM, so in AR it depends on the DOM overlay feature. The beckon depends on the tour order, not a field. The pop-up backdrop is code, not creator data. I added page-only hook extras (<code>speak</code>, <code>setFramed</code>, <code>readout</code>, <code>mediaSizes</code>) for my own screenshots; the shared hook is complete without them.</li><li><b>Headless numbers:</b> frame times are software rendering on a loaded machine; they do not predict a phone.</li><li><b>Drop first:</b> <code>bubble</code> as a separate view. <code>speak</code> without narration IS the bubble view; one view that degrades is better than two to choose between.</li><li><b>Weakest required view:</b> <code>two-stations</code> is less a view than a property of the model (a shared character); its only drawing of its own is the beckon and the chevrons.</li><li><b>Proudest:</b> <code>speak</code>, because of the details that make it hold up outside: the reading floor, the side flip and slide-back that keep the bubble on screen, the read-along that is the same with sound off, and the honest stale state. The pop-up is the most charming, and the one I would show a creator first.</li></ul></details>
