<!doctype html>
<!-- Prototype: calm HUD round 2, direction 3 "The world shows it". Throwaway; not wired to the app. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>The World Shows It</title>
<style>
:root {
  --ink: #f3f5f7;
  --muted: #b3bcc6;
  --plate: rgb(10 13 18 / 78%);
  --line: rgb(255 255 255 / 16%);
  --beam: #fb923c;
  --tap: 48px;
  --font: corbel, "Noto Sans", system-ui, -apple-system, "Segoe UI", roboto, sans-serif;
}

* { box-sizing: border-box; }
.dev [hidden] { display: none; }

html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #101318;
  color: var(--ink);
  font: 15px/1.4 var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

button {

  font: inherit;

  color: inherit;

  cursor: pointer;

}
p { margin: 0; }

.dev {

  position: fixed;

  inset: 0;

  overflow: hidden;

  user-select: none;

}
#gl {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
  outline: 0;
}

#gl:active { cursor: grabbing; }

/* the fake camera feed: a lens vignette over the 3D square */
.feed {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 45%, transparent 60%, rgb(0 0 0 / 26%) 100%);
}

/* ================= the HUD: Exit; the radar (stations only, always); the transport while something
   plays; the story chip while a story runs. Nothing about items: the world shows those ================= */
.exit {
  position: absolute;
  z-index: 30;
  top: calc(14px + env(safe-area-inset-top));
  left: calc(14px + env(safe-area-inset-left));
  width: 44px;
  height: 44px;
  padding: 0;
  border-radius: 50%;
  border: 2px solid rgb(255 255 255 / 72%);
  background: rgb(10 13 18 / 70%);
  display: grid;
  place-items: center;
}

.exit svg {

  width: 20px;

  height: 20px;

}
.radar {
  position: absolute;
  z-index: 26;
  top: calc(64px + env(safe-area-inset-top));
  right: calc(14px + env(safe-area-inset-right));
  width: 124px;
  height: 124px;
  border-radius: 50%;
}

.transport {
  position: absolute;
  z-index: 27;
  left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom));
  width: 56px;
  height: 56px;
  margin-left: -28px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: conic-gradient(#fff calc(var(--p, 0) * 1turn), rgb(255 255 255 / 22%) 0);
  display: grid;
  place-items: center;
  box-shadow: 0 4px 14px rgb(0 0 0 / 30%);
  animation: fade-in 0.3s ease;
}

.transport::before {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  background: rgb(10 13 18 / 88%);
}

.transport svg {

  position: relative;

  width: 24px;

  height: 24px;

}
.chip {
  position: absolute;
  z-index: 27;
  left: calc(14px + env(safe-area-inset-left));
  bottom: calc(22px + env(safe-area-inset-bottom));
  max-width: calc(50% - 46px);
  min-height: var(--tap);
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 2px 5px 5px;
  border-radius: 24px;
  background: var(--plate);
  box-shadow: 0 4px 14px rgb(0 0 0 / 28%);
  animation: fade-in 0.4s ease;
}

.chip .face {
  flex: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid #fff;
}

.chip .title {
  flex: 1;
  min-width: 0;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.15;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.chip .leave {
  flex: none;
  width: 36px;
  height: 36px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: rgb(255 255 255 / 10%);
  font-size: 22px;
  line-height: 1;
}

@keyframes fade-in { from { opacity: 0; } }

/* the measuring hook: any two HUD boxes that overlap get a red outline (only while measuring) */
.measuring .ovl {
  outline: 3px solid #ff2d2d;
  outline-offset: 0;
}
/* ================= demo chrome: dashed, not part of the design, not measured ================= */
.chrome {
  position: absolute;
  z-index: 40;
  top: calc(12px + env(safe-area-inset-top));
  right: calc(10px + env(safe-area-inset-right));
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1.5px dashed rgb(255 255 255 / 55%);
  border-radius: 22px;
  background: rgb(0 0 0 / 50%);
}

.chrome button {
  height: 36px;
  min-width: 34px;
  padding: 0 7px;
  border: 0;
  border-radius: 18px;
  background: transparent;
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}

.chrome button:active,
.chrome button[aria-pressed="true"] { background: rgb(255 255 255 / 20%); }

.chrome .beat-name {
  min-width: 112px;
  max-width: 40vw;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 650;
}

.chrome .info-btn { font: italic 700 16px/1 Georgia, serif; }
.chrome svg {
  width: 18px;
  height: 18px;
  vertical-align: middle;
}
.readout {
  position: absolute;
  z-index: 40;
  left: 50%;
  bottom: calc(92px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  padding: 4px 9px;
  border: 1.5px dashed rgb(255 255 255 / 45%);
  border-radius: 10px;
  background: rgb(0 0 0 / 60%);
  font: 11px/1.35 ui-monospace, consolas, monospace;
  color: #fff;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
  white-space: pre;
}

.try {
  position: absolute;
  z-index: 40;
  left: 50%;
  top: 38%;
  transform: translateX(-50%);
  width: 320px;
  max-width: calc(100% - 48px);
  padding: 9px 13px;
  border: 1.5px dashed rgb(255 255 255 / 45%);
  border-radius: 14px;
  background: rgb(0 0 0 / 58%);
  font-size: 13.5px;
  line-height: 1.4;
  color: #fff;
  text-align: center;
  transition: opacity 0.8s;
  pointer-events: none;
}

.try.gone { opacity: 0; }

.rip {
  position: absolute;
  z-index: 45;
  width: 46px;
  height: 46px;
  margin: -23px 0 0 -23px;
  border-radius: 50%;
  border: 3px solid #fff;
  box-shadow: 0 0 0 2px rgb(0 0 0 / 35%);
  pointer-events: none;
  animation: rip 0.7s ease-out forwards;
}

@keyframes rip {
  from {
    transform: scale(0.5);
    opacity: 1;
  }
  to {
    transform: scale(1.5);
    opacity: 0;
  }
}

.info {
  position: absolute;
  z-index: 50;
  top: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  max-width: 430px;
  overflow: auto;
  padding: 14px 16px calc(20px + env(safe-area-inset-bottom));
  background: rgb(14 18 23 / 97%);
  border-left: 1px solid var(--line);
  font-size: 14px;
  line-height: 1.45;
  user-select: text;
}

.info h1 {

  margin: 0 0 4px;

  font-size: 19px;

}
.info h3 {
  margin: 14px 0 4px;
  font-size: 11.5px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--muted);
}

.info p,
.info li { color: #dfe4ea; }

.info ol,
.info ul {
  margin: 4px 0;
  padding-left: 20px;
}
.info .close {
  position: sticky;
  top: 0;
  float: right;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  background: rgb(255 255 255 / 10%);
  font-size: 22px;
}

.info .knob {

  display: flex;

  flex-wrap: wrap;

  align-items: center;

  gap: 5px;

  margin: 6px 0;

}
.info .knob span {
  min-width: 112px;
  font-weight: 600;
  color: #fff;
}
.info .knob button,
.info .beats button {
  min-height: 36px;
  padding: 4px 10px;
  border: 1px solid rgb(255 255 255 / 30%);
  border-radius: 10px;
  background: rgb(255 255 255 / 6%);
  font-size: 13px;
}

.info .knob button[aria-pressed="true"] {

  border-color: #fff;

  background: rgb(255 255 255 / 18%);

}
.info .beats {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.info table {
  width: 100%;
  border-collapse: collapse;
  font: 12px/1.4 ui-monospace, consolas, monospace;
  font-variant-numeric: tabular-nums;
}

.info td,
.info th {
  padding: 3px 4px;
  border-bottom: 1px solid var(--line);
  text-align: right;
}
.info td:first-child,
.info th:first-child { text-align: left; }

.exited {
  position: absolute;
  z-index: 60;
  inset: 0;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 14px;
  background: #0d1015;
  text-align: center;
  font-size: 16px;
}

.exited .back {
  min-height: 44px;
  padding: 8px 18px;
  border: 0;
  border-radius: 22px;
  background: #fff;
  color: #1d232b;
  font-weight: 700;
}

@media (orientation: landscape) and (height <= 520px) {
  .radar {
    top: calc(60px + env(safe-area-inset-top));
    width: 112px;
    height: 112px;
  }
  .transport { bottom: calc(10px + env(safe-area-inset-bottom)); }
  .chip {
    bottom: calc(14px + env(safe-area-inset-bottom));
    max-width: 300px;
  }
  .try { top: 30%; }
}

@media (prefers-reduced-motion: reduce) {
  .dev *,
  .dev *::before,
  .dev *::after {
    animation: none;
    transition: none;
  }
}

/* the gallery's verdict on this page: a calm note on top, hidden with its x */
.proto-note{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:1000;width:max-content;max-width:calc(100vw - 32px);display:flex;align-items:center;gap:6px;padding:4px 4px 4px 14px;border-radius:18px;background:rgba(10,14,19,.9);border:2px solid rgba(255,255,255,.25);color:#e6ebf0;font:500 13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.proto-note a{color:#9fd8ff}
.proto-note button{flex:none;appearance:none;border:0;background:transparent;color:inherit;font-size:18px;width:32px;height:32px;border-radius:50%;cursor:pointer}
</style>

<body>
<div class="proto-note" role="note"><span><b>Not chosen.</b> Everything glowing in the world was not liked.</span><button type="button" aria-label="Hide this note" onclick="this.parentElement.remove()">&times;</button></div>
<main class="dev" id="dev">
  <canvas id="gl" tabindex="0" aria-label="The square, standing in for the camera view"></canvas>
  <div class="feed" aria-hidden="true"></div>

  <!-- the HUD (everything with data-hud is measured) -->
  <button type="button" class="exit" id="exit" data-hud aria-label="Exit AR"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <canvas class="radar" id="radar" data-hud width="248" height="248" aria-label="Radar of the stations; tap to change its range"></canvas>
  <div class="chip" id="chip" data-hud hidden><span class="face"></span><span class="title"></span><button type="button" class="leave" aria-label="Leave this story">&times;</button></div>
  <button type="button" class="transport" id="transport" data-hud hidden aria-label="Pause"></button>

  <!-- demo chrome -->
  <div class="chrome" id="chrome">
    <button type="button" id="prev" aria-label="Previous beat">&#9664;</button>
    <button type="button" class="beat-name" id="beat-name" aria-label="Replay this beat">1/10 Outside</button>
    <button type="button" id="next" aria-label="Next beat">&#9654;</button>
    <button type="button" class="info-btn" id="info-btn" aria-label="About this page">i</button>
    <button type="button" id="measure-btn" aria-pressed="false" aria-label="Show the measuring numbers"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="2.5" y="8" width="19" height="8" rx="1.5"/><path d="M7 8v3M11 8v4M15 8v3M19 8v4"/></svg></button>
  </div>
  <div class="readout" id="readout" hidden></div>
  <p class="try" id="try">Drag sideways to look, up and down to walk (WASD on a keyboard). Things you have not seen shimmer softly; tap people and things. Or press &#9654; for the next beat.</p>
  <aside class="info" id="info" hidden></aside>
  <div class="exited" id="exited" hidden><p>You left AR.</p><button type="button" class="back" id="back-in">Back into AR</button></div>
</main>

<script type="module">
import * as THREE from "three";

/* ---------------- tune here ---------------- */
const EYE = 1.6;
const PITCH = -0.05;
const LOOK_GAIN = 0.0048; // radians per CSS pixel
const DRAG_WALK = 0.035; // metres per CSS pixel of vertical drag
const TAP_PX = 10, TAP_MS = 420;
const WORDS_PER_S = 2.7; // how fast a guide's words appear in the bubble
const HOLD_FAR_M = 14; // a guide stops mid-sentence once you are this far away...
const RESUME_M = 10; // ...and goes on once you are back this close
const SEEN_LOOK_S = 1.5; // a sign or a picture is seen after this long in view, near enough to read
// the shimmer: strength (how far towards warm gold) and period (one slow pass, then a rest), per preset
const GLINTS = { faint: { s: 0.3, p: 6 }, soft: { s: 0.5, p: 4.5 }, clear: { s: 0.68, p: 3.5 } };
const PASSES = 2; // passes of light per showing; then it rests until it may show again
// the creator's distance is "reach" (8, 12 or 18 m); each kind scales it by how far away it can be made out
const REACH_K = { character: 1.5, video: 1.2, long: 1, picture: 1, audio: 1, model: 0.9, short: 0.8 };
const NOTICE_S = 1.5; // held this long near the middle of the view, after one whole pass of light, a shimmering thing counts as noticed and settles
const NOTICE_NDC = 0.45; // "near the middle": within this share of the half-screen from the centre
const REARM_S = 20; // a settled but unseen thing may shimmer again after this long out of view...
const MAX_ASKS = 2; // ...but a thing shows its shimmer twice at most, so PASSES * MAX_ASKS passes ever
const HAND_S = 5; // a person points on for this long after an ending
const DRIFT_MAX_M = 9; // a sound's motes drift at most this far towards the next thing
const COL = { beam: "#fb923c", unseen: "#ffffff", seen: "#8b939c", ink: "#1d232b", paper: "#fffdf8", gold: "#ffc24a", play: "#7dd3fc" };
const KN = { glint: "soft", style: "sweep", reach: 12, beam: "round", drift: false, voice: true };
{ // the address may set the knobs: ?glint=faint|soft|clear&style=sweep|breathe&reach=8|12|18&beam=round|built&drift=on
  const q = new URLSearchParams(location.search);
  if (GLINTS[q.get("glint")]) { KN.glint = q.get("glint"); }
  if (["sweep", "breathe"].includes(q.get("style"))) { KN.style = q.get("style"); }
  if ([8, 12, 18].includes(+q.get("reach"))) { KN.reach = +q.get("reach"); }
  if (["round", "built"].includes(q.get("beam"))) { KN.beam = q.get("beam"); }
  KN.drift = q.get("drift") === "on";
  KN.voice = q.get("voice") !== "off";
}

const STATIONS = {
  A: { id: "A", name: "The Well", c: [0, -2], rIn: 18, rOut: 20 },
  B: { id: "B", name: "The Old Gate", c: [24, -80], rIn: 16, rOut: 18 },
};

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const damp = (dt, tau) => 1 - Math.exp(-dt / tau);
const angDiff = (a, b) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) { d -= Math.PI * 2; } if (d < -Math.PI) { d += Math.PI * 2; } return d; };
const faceTo = (p, q) => Math.atan2(q[0] - p[0], q[1] - p[1]); // yaw that turns local +Z towards q
const $ = (s) => document.querySelector(s);

/* ---------------- renderer, camera, the square ---------------- */
const canvas = $("#gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog("#dfe6ea", 80, 260);
const camera = new THREE.PerspectiveCamera(64, 1, 0.1, 600);
camera.rotation.order = "YXZ";

// a plain environment only: sky light, one sun, no shadows
scene.add(new THREE.HemisphereLight(0xffffff, 0xb9ae98, 1.8));
const sun = new THREE.DirectionalLight(0xfff2e0, 1.3); sun.position.set(30, 60, 20); scene.add(sun);

(function sky() {
  const g = new THREE.SphereGeometry(400, 24, 12);
  const c = new Float32Array(g.attributes.position.count * 3);
  const top = new THREE.Color("#86b6df"), mid = new THREE.Color("#dbe7ef"), low = new THREE.Color("#efe8da"), o = new THREE.Color();
  for (let i = 0; i < g.attributes.position.count; i++) {
    const h = g.attributes.position.getY(i) / 400;
    if (h >= 0) { o.lerpColors(mid, top, Math.min(1, h / 0.5)); } else { o.lerpColors(mid, low, Math.min(1, -h / 0.1)); }
    c.set([o.r, o.g, o.b], i * 3);
  }
  g.setAttribute("color", new THREE.BufferAttribute(c, 3));
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }));
  m.renderOrder = -10; scene.add(m);
})();

(function ground() {
  const S = 512, cv = document.createElement("canvas"); cv.width = cv.height = S;
  const g = cv.getContext("2d"); let s = 11;
  const rnd = () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296;
  g.fillStyle = "#b9b09e"; g.fillRect(0, 0, S, S);
  const n = 12, k = S / n;
  for (let x = 0; x < n; x++) {
    for (let z = 0; z < n; z++) { const v = 196 + rnd() * 22; g.fillStyle = `rgb(${v} ${v - 7} ${v - 20})`; g.fillRect(x * k + 1.5, z * k + 1.5, k - 3, k - 3); }
  }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(40, 40);
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  const m = new THREE.Mesh(new THREE.PlaneGeometry(340, 340).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ map: t }));
  m.position.z = -30; scene.add(m);
})();

const mats = new Map();
const mat = (c) => { if (!mats.has(c)) { mats.set(c, new THREE.MeshLambertMaterial({ color: c })); } return mats.get(c); };
const box = (w, h, d, c, x, y, z, ry = 0, parent = scene) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c)); m.position.set(x, y, z); m.rotation.y = ry; parent.add(m); return m; };
const cyl = (r0, r1, h, c, x, y, z, n = 16, parent = scene) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r0, r1, h, n), mat(c)); m.position.set(x, y, z); parent.add(m); return m; };

(function town() {
  const colors = ["#e7dcc8", "#d9e2e6", "#efd9c6", "#e6e2d2", "#dcc9b6", "#f0e8d8", "#e3d3c8", "#d6cbb8"];
  let i = 0;
  const house = (x, z, w, d, h, ry) => {
    const c = colors[i++ % colors.length];
    box(w, h, d, c, x, h / 2, z, ry);
    box(w + 0.4, 0.5, d + 0.4, "#8a6d5a", x, h + 0.25, z, ry);
    const fx = Math.sin(ry), fz = Math.cos(ry);
    for (let fl = 0; fl < Math.floor(h / 3.2); fl++) {
      for (let k = -1; k <= 1; k++) {
        const off = k * (w / 3.2), ox = Math.cos(ry) * off, oz = -Math.sin(ry) * off, door = fl === 0 && k === 0;
        box(1.0, 1.4, 0.1, door ? "#5a3d2c" : "#5d6d7e", x + ox + fx * (d / 2 + 0.03), door ? 1.2 : 2 + fl * 3.2, z + oz + fz * (d / 2 + 0.03), ry);
      }
    }
  };
  // the square of the well
  for (let x = -40; x <= 40; x += 13) { house(x, 48, 12, 8, 8 + ((x * 7) & 7), Math.PI); }
  for (const x of [-40, -27, -14]) { house(x, -50, 12, 8, 9 + ((x * 5) & 7), 0); }
  house(44, -50, 10, 8, 10, 0);
  for (let z = -38; z <= 40; z += 13) { house(-48, z, 12, 8, 8 + ((z * 3) & 7), Math.PI / 2); house(50, z, 12, 8, 9 + ((z * 11) & 5), -Math.PI / 2); }
  // the road to the gate and its houses
  for (const z of [-64, -77, -90]) { house(2, z, 11, 8, 8 + ((z * 3) & 5), Math.PI / 2); house(48, z, 11, 8, 9 + ((z * 7) & 5), -Math.PI / 2); }
  // trees
  for (const [x, z, s] of [[-22, -24, 1], [18, 22, 1.2], [-26, 24, 1.1], [34, -30, 1], [-34, -8, 0.9], [8, -60, 1], [40, -62, 1.1]]) {
    cyl(0.18 * s, 0.28 * s, 3 * s, "#7d6650", x, 1.5 * s, z, 8);
    const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(2.2 * s, 1), mat("#6f9e62")); crown.position.set(x, 4 * s, z); scene.add(crown);
  }
  // far skyline

  switch (n) {

    case 2: return [S.walk([[0.6, 7]], 1.3), S.face(0.2, -4.2, 1), S.wait(4), S.mark("greet"), S.until(pointing("greta")), S.mark("handoff"), S.wait(4)];
    case 3: return [S.until(midPass("lecternA"), 8), S.mark("lectern"), S.face(-11, -3, 1.5), S.until(midPass("videoA"), 8), S.mark("film"), S.until(() => byId.videoA.settled, 10), S.mark("settled"), S.wait(2)];
    case 4: return [S.wait(0.8), S.tapAt(at("videoA")), S.wait(3.2), S.mark("film"), S.turn(2.6, 2.2), S.wait(1.2), S.tapEl("#transport"), S.wait(1.4), S.mark("paused"), S.wait(2)];
    case 5: return [S.wait(4.5), S.mark("card"), S.wait(1.5), S.face(-10, 6.5, 1.5), S.until(midPass("audioA"), 8), S.mark("bench"), S.wait(3)];
    case 6: return [S.wait(1.5), S.mark("quiet"), S.face(-10, 6.5, 2.5), S.until(midPass("audioA"), 8), S.mark("song"), S.walk([[6, -2]], 1.6), S.face(11.5, -11, 1.5), S.until(midPass("modelA"), 8), S.mark("model"), S.wait(2)];
    case 7: return [S.walk([[8.6, -23.8]], 1.6), S.face(0, -2, 1.5), S.wait(1.5), S.mark("beam"), S.wait(3)];
    case 8: return [S.walk([[24, -71.5]], 1.4), S.face(24, -86, 1), S.until(midPass("watchman"), 8), S.mark("three"), S.face(17.5, -87, 2), S.until(midPass("mason"), 8), S.mark("mason"), S.walk([[21, -80.5]], 1.2), S.face(17.5, -87, 0.6), S.tapAt(at("mason")), S.wait(5), S.mark("entered"), S.until(pointing("mason")), S.mark("handoff"), S.wait(4)];
    case 9: return [S.wait(0.8), S.tapAt(at("modelB")), S.wait(2), S.mark("note"), S.face(17.5, -87, 1), S.until(() => !!byId.mason.line), S.wait(2), S.mark("outro"), S.until(pointing("mason")), S.mark("handoff"), S.wait(4)];
    case 10: return [S.wait(1), S.turn(Math.PI * 2, 10), S.mark("quiet"), S.face(0.2, -4.2, 0.6), S.tapAt(at("greta")), S.wait(10), S.mark("light"), S.walk([[6, -26]], 2.2), S.face(0, -2, 1.4), S.wait(1.5), S.mark("pale"), S.wait(2)];
  }
  return [];
}
function runScript(dt) {
  while (true) {
    if (!cur) { cur = script.shift(); if (!cur) { demo.running = false; return; } }
    if (cur.step(dt)) { cur = null; dt = 0; continue; }
    return;
  }
}
function jump(n, { run = true } = {}) {
  beat = clamp(n, 1, BEATS.length); rec[beat] = { hud: 0, el: 0, ov: 0 };
  preState(beat); script = run ? beatScript(beat) : []; cur = null; demo.running = run; demo.held = false;
  $("#beat-name").textContent = `${beat}/${BEATS.length} ${BEATS[beat - 1]}`;
  renderInfo();
}
function userTouched(moving) { if (moving && demo.running) { script = []; cur = null; demo.running = false; $("#beat-name").textContent = `${beat}/${BEATS.length} free walk`; } }
function ripple(x, y) { const d = document.createElement("div"); d.className = "rip"; d.style.left = x + "px"; d.style.top = y + "px"; $("#dev").append(d); setTimeout(() => d.remove(), 800); }

$("#prev").addEventListener("click", () => jump(beat - 1));
$("#next").addEventListener("click", () => jump(beat >= BEATS.length ? 1 : beat + 1));
$("#beat-name").addEventListener("click", () => jump(beat));
$("#exit").addEventListener("click", () => { hush(); $("#exited").hidden = false; });
$("#back-in").addEventListener("click", () => { $("#exited").hidden = true; });

/* ---------------- the measuring hook (behind the ruler toggle) ---------------- */
let measuring = false, hudNow = { hud: 0, el: 0, ov: 0 };
const rec = {};
function hudBoxes() {
  return [...document.querySelectorAll("[data-hud]")].filter((el) => {
    if (el.hidden) { return false; }
    const cs = getComputedStyle(el); if (cs.display === "none" || cs.visibility === "hidden" || +cs.opacity < 0.05) { return false; }
    const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0;
  }).map((el) => ({ el, r: el.getBoundingClientRect() }));
}
const glinting = () => ITEMS.filter((it) => it.gu.uGlint.value > 0.01 || it.env > 0.05).map((it) => it.id);
function measureHud() {
  const bx = hudBoxes(), W0 = innerWidth, H0 = innerHeight, St = 4; let cov = 0;
  for (let y = St / 2; y < H0; y += St) { for (let x = St / 2; x < W0; x += St) { for (const b of bx) { if (x >= b.r.left && x < b.r.right && y >= b.r.top && y < b.r.bottom) { cov++; break; } } } }
  const total = Math.ceil(W0 / St) * Math.ceil(H0 / St);
  document.querySelectorAll(".ovl").forEach((e) => e.classList.remove("ovl"));
  let ov = 0;
  for (let i = 0; i < bx.length; i++) {
    for (let j = i + 1; j < bx.length; j++) {
      const a = bx[i].r, b = bx[j].r, w = Math.min(a.right, b.right) - Math.max(a.left, b.left), h = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
      if (w > 2 && h > 2) { ov++; bx[i].el.classList.add("ovl"); bx[j].el.classList.add("ovl"); }
    }
  }
  hudNow = { hud: (cov / total) * 100, el: bx.length, ov };
  const R = rec[beat]; if (R) { R.hud = Math.max(R.hud, hudNow.hud); R.el = Math.max(R.el, hudNow.el); R.ov = Math.max(R.ov, ov); }
  const inf = renderer.info.render, gl = glinting();
  $("#readout").textContent = `HUD ${hudNow.hud.toFixed(1)}% · ${hudNow.el} el · ${ov} overlap\nglinting ${gl.length}: ${gl.join(" ") || "-"}\nslowest frame ${maxFrame.toFixed(0)} ms · ${inf.calls} draws\n${innerWidth}x${innerHeight} · ${KN.glint} ${KN.style} ${KN.reach} m`;
  if (!$("#info").hidden) { renderTable(); }
}
$("#measure-btn").addEventListener("click", () => {
  measuring = !measuring; $("#measure-btn").setAttribute("aria-pressed", String(measuring));
  $("#readout").hidden = !measuring; $("#dev").classList.toggle("measuring", measuring);
  if (measuring) { measureHud(); }
});

/* ---------------- the page's own notes and knobs ---------------- */
const KNOBS = [
  { key: "glint", label: "Shimmer", opts: [["faint", `faint (${GLINTS.faint.s}, every ${GLINTS.faint.p} s)`], ["soft", `soft (${GLINTS.soft.s}, every ${GLINTS.soft.p} s)`], ["clear", `clear (${GLINTS.clear.s}, every ${GLINTS.clear.p} s)`]] },
  { key: "style", label: "Its motion", opts: [["sweep", "a band of light passes up"], ["breathe", "the whole thing warms and cools"]] },
  { key: "reach", label: "Shows within", opts: [[8, "8 m"], [12, "12 m"], [18, "18 m"]] },
  { key: "beam", label: "Station pin", opts: [["round", "the beam with a gem"], ["built", "today's beacon"]] },
  { key: "drift", label: "Ending sound", opts: [[false, "off"], [true, "a soft drift"]] },
  { key: "voice", label: "Voice", opts: [[true, "on"], [false, "off"]] },
];
function syncUrl() {
  try { const q = new URLSearchParams(location.search); for (const k of ["glint", "style", "reach", "beam"]) { q.set(k, String(KN[k])); } q.set("drift", KN.drift ? "on" : "off"); history.replaceState(null, "", "?" + q.toString()); } catch { /* the address is a convenience */ }
}
function renderInfo() {
  const el = $("#info"); if (el.hidden) { return; }
  el.innerHTML = `<button type="button" class="close" aria-label="Close">&times;</button>
  <h1>The world shows it</h1>
  <p>Nothing on the screen tells you what is left. A thing you have not seen yet carries a faint, slow shimmer on itself, only while it is in view and near, and it settles once you have looked at it. Each thing's ending hands you on to the next: a person turns and points, a text's last line names it, a film's end card shows which way, a song's light drifts that way. The radar shows stations only.</p>
  <h3>Try the shimmer</h3>
  <p class="small">Start with soft, the default, outdoors. If you cannot make it out on the pale signs in sun, try clear; faint is for a dim place or a dark object.</p>
  ${KNOBS.slice(0, 3).map(knobRow).join("")}
  <p class="small">Also by address: <code>?glint=faint|soft|clear&amp;style=sweep|breathe&amp;reach=8|12|18</code></p>
  <h3>What "seen" means here</h3>
  <ul><li><b>A person</b>: their first words have played to the end.</li><li><b>A short text, a picture</b>: it has been in the middle of your view, near enough to read, for ${SEEN_LOOK_S} s.</li><li><b>A long text</b>: you turned to its last page.</li><li><b>A film, a sound</b>: it played to its end.</li><li><b>A model</b>: you tapped it and its note opened.</li></ul>
  <p>"Noticed" is not "seen": the shimmer settles after you have held a thing near the middle of your view for ${NOTICE_S} s and its light has passed over it once, or after you touched it. Either way it shows at most ${PASSES} passes, then rests. A thing settled but not seen may show its shimmer once more after ${REARM_S} s out of view, never a third time: ${PASSES * MAX_ASKS} passes at most, ever.</p>
  <h3>On the screen, and only then</h3>
  <ul><li>Exit, always.</li><li>The radar, stations only (orange while a station holds something unseen, grey once all of it is seen). A tap steps its range.</li><li>Play/pause, while something of this station plays, so you can stop it without looking at it.</li><li>The story you are in, with the face colour of the person you entered it through, and a leave button.</li></ul>
  <h3>Stories</h3>
  <p>At the well the one story begins with Greta; she greets you once when you walk in (the only thing that starts by arriving). At the gate three people stand where their stories begin; talking to one of them enters that story. This replaces today's picker of story titles.</p>
  <h3>Leaving</h3>
  <p>Nothing is said. The station's light comes back behind you, still orange while anything there is unseen; once all of it is seen it turns pale.</p>
  <h3>The strongest case against it</h3>
  <ul><li>A shimmer reacts to where you look, which is close to the rejected "HUD that follows the gaze", even though it lives on the object.</li><li>In bright sun on a real camera image, a warm sheen may be too faint on pale stone and too loud on dark wood; only a phone outdoors can tell.</li><li>The chain is creator work: an item without a good ending, or one met out of order, hands on to nothing better than the nearest unseen thing.</li><li>A visitor who never turns round never sees the shimmer behind them; the light outside the station is the only reminder.</li></ul>
  <h3>Other knobs</h3>
  ${KNOBS.slice(3).map(knobRow).join("")}
  <h3>Beats</h3>
  <div class="beats">${BEATS.map((b, i) => `<button type="button" data-beat="${i + 1}">${i + 1} ${b}</button>`).join("")}</div>
  <h3>Numbers per beat (the most seen during the beat; switch the ruler on to record)</h3>
  <div id="tbl"></div>`;
  el.querySelector(".close").addEventListener("click", () => { el.hidden = true; });
  el.querySelectorAll("[data-k]").forEach((b) => b.addEventListener("click", () => { const k = KNOBS.find((x) => x.key === b.dataset.k); KN[k.key] = k.opts[+b.dataset.i][0]; if (!KN.voice) { hush(); } syncUrl(); renderInfo(); }));
  el.querySelectorAll("[data-beat]").forEach((b) => b.addEventListener("click", () => { el.hidden = true; jump(+b.dataset.beat); }));
  renderTable();
}
function knobRow(k) { return `<div class="knob"><span>${k.label}</span>${k.opts.map(([v, l], i) => `<button type="button" data-k="${k.key}" data-i="${i}" aria-pressed="${KN[k.key] === v}">${l}</button>`).join("")}</div>`; }
function renderTable() {
  const t = $("#tbl"); if (!t) { return; }
  t.innerHTML = `<table><tr><th>beat</th><th>HUD %</th><th>el</th><th>overlap</th></tr>${BEATS.map((b, i) => { const r = rec[i + 1]; return `<tr><td>${i + 1} ${b}</td><td>${r ? r.hud.toFixed(1) : "-"}</td><td>${r ? r.el : "-"}</td><td>${r ? r.ov : "-"}</td></tr>`; }).join("")}</table>`;
}
$("#info-btn").addEventListener("click", () => { const el = $("#info"); el.hidden = !el.hidden; renderInfo(); });
setTimeout(() => $("#try").classList.add("gone"), 9000);

/* ---------------- size ---------------- */
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // a phone camera's long side sees about 64 degrees, whichever way the phone is held
  camera.fov = w < h ? 64 : THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(32)) * h / w));
  camera.updateProjectionMatrix(); viewH.value = h * renderer.getPixelRatio();
  for (const it of ITEMS) { if (it.bubble) { it.bubble.key = ""; } }
}
addEventListener("resize", resize); resize();

/* ---------------- build, and the automation hook (screenshots, numbers) ---------------- */
for (const it of ITEMS) { buildItem(it); }
Object.assign(demo, {
  jump(n, { stopAt = null, speed = 1 } = {}) { this.stopAt = stopAt; demoMult = speed; jump(n); },
  release() { this.held = false; this.stopAt = null; },
  idle() { return !this.running || this.held; },
  measure(on = true) { if (on !== measuring) { $("#measure-btn").click(); } },
  numbers() { return { beat, rec: JSON.parse(JSON.stringify(rec)), now: hudNow, maxFrame, station: W.station, seen: ITEMS.filter((it) => it.seen).map((it) => it.id), glinting: glinting(), settled: ITEMS.filter((it) => it.settled).map((it) => it.id) }; },
});
window.demo = demo;
const qBeat = +new URLSearchParams(location.search).get("beat");
jump(qBeat >= 1 && qBeat <= BEATS.length ? qBeat : 1);
requestAnimationFrame((t) => { last = t; frame(t); });
</script>
