<html lang="en">

<style>
:root {
  --page: #0e0f12;
  --hud: rgba(15, 17, 21, 0.82);
  --hud-solid: #15171c;
  --fg: #f4f1ea;
  --dim: rgba(244, 241, 234, 0.64);
  --faint: rgba(244, 241, 234, 0.14);
  --brass: #e3b26a;
  --brass-deep: #b8853f;
  --ok: #9ed8b8;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--page); color: var(--fg); font: 14px/1.4 var(--font); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

#chrome {
  position: fixed; inset: 0 0 auto 0; height: 44px; display: flex; align-items: center; gap: 6px;
  padding: 0 8px; background: var(--page); border-bottom: 1px solid #1d2026; z-index: 30;
}
.seg { display: inline-flex; background: #1a1d23; border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 999px; font-size: 12.5px; color: var(--dim); }
.seg button.on { background: var(--fg); color: #111; font-weight: 600; }
.chip { border: 1px solid #2a2e36; background: #16191e; padding: 5px 10px; border-radius: 999px; font-size: 12.5px; color: var(--dim); }
.chip.on { border-color: var(--brass); color: var(--brass); }
.chip:disabled { opacity: .35; cursor: default; }
#chrome .spacer { flex: 1; }
@media (max-width: 480px) { #chrome { gap: 4px; padding: 0 5px; } .seg button { padding: 5px 8px; } .chip { padding: 5px 8px; } }

#main { position: fixed; inset: 44px 0 0 0; display: grid; grid-template-columns: 1fr; }
#stageWrap { position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; overflow: hidden; background: #0b0c0f; }
#stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: #dfe5e8; container-type: size; }
#stageWrap.phone #stage { width: auto; height: calc(100% - 28px); aspect-ratio: 9 / 19.5; max-width: calc(100% - 28px); border-radius: 34px;
  box-shadow: 0 0 0 9px #1c1e23, 0 0 0 10px #353841, 0 26px 70px rgba(0,0,0,.55); }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#markers { position: absolute; inset: 0; pointer-events: none; }
.hud { position: absolute; z-index: 5; }
.plate { background: var(--hud); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.07); }

/* view picker */
#picker { top: 10px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; border-radius: 999px; padding: 3px; gap: 2px; font-size: 13px; }
#picker button { border: 0; background: transparent; padding: 5px 9px; border-radius: 999px; color: var(--fg); }
#picker .name { min-width: 92px; font-weight: 600; letter-spacing: .01em; }
#picker .name small { color: var(--dim); font-weight: 400; margin-left: 4px; }
#pickerList { top: 46px; left: 50%; transform: translateX(-50%); border-radius: 14px; padding: 6px; min-width: 220px; display: none; }
#pickerList.open { display: block; }
#pickerList button { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 12px; border: 0; background: transparent; padding: 8px 10px; border-radius: 9px; text-align: left; }
#pickerList button.on { background: rgba(227,178,106,.16); color: var(--brass); }
#pickerList .tag { font-size: 11px; color: var(--dim); }

#stationChip { top: 52px; left: 50%; transform: translateX(-50%); border-radius: 999px; padding: 6px 13px 6px 9px; display: none; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
#stationChip .arrow { width: 18px; height: 18px; display: inline-block; transition: transform .2s; }
#stationChip b { font-weight: 600; }

#walkBar { left: 12px; bottom: 12px; display: flex; gap: 8px; align-items: center; }
#walkBar button { border-radius: 999px; padding: 9px 15px; border: 0; font-weight: 600; font-size: 13.5px; }
@container (max-width: 600px) { #walkBar .hint { display: none; } }
#walkBar .hint { font-size: 11.5px; color: rgba(20,22,26,.62); text-shadow: 0 1px 0 rgba(255,255,255,.4); }
#frameStat { right: 8px; top: 10px; border-radius: 8px; padding: 4px 7px; font: 10.5px/1.3 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--dim); pointer-events: none; white-space: pre; text-align: right; }

/* hotspot markers */
.hs { position: absolute; left: 0; top: 0; pointer-events: auto; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 7px; will-change: transform, opacity; border: 0; background: none; padding: 0; }
.hs .disc { width: 28px; height: 28px; border-radius: 50%; background: rgba(15,17,21,.86); color: #fff; display: grid; place-items: center; font: 600 13px/1 var(--font);
  box-shadow: 0 0 0 1.5px var(--brass), 0 3px 10px rgba(0,0,0,.35); transition: background .2s, color .2s, transform .2s; }
.hs.sel .disc { background: var(--brass); color: #16120b; transform: scale(1.12); }
.hs .lab { position: absolute; left: 34px; top: 50%; transform: translateY(-50%); white-space: nowrap; background: rgba(15,17,21,.86); color: var(--fg);
  padding: 4px 9px; border-radius: 7px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; }
.hs.showlab .lab { opacity: 1; }
.hs.small .disc { width: 20px; height: 20px; font-size: 11px; }

#card { left: 50%; bottom: 12px; transform: translate(-50%, 16px); width: min(420px, calc(100% - 24px)); border-radius: 18px; padding: 15px 16px 13px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
#card.open { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#card .num { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--brass); }
#card h3 { margin: 3px 0 7px; font: 600 19px/1.25 var(--serif); }

#card .row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
#card .row button { border: 1px solid rgba(255,255,255,.14); background: transparent; border-radius: 999px; padding: 6px 13px; font-size: 13px; }
#card .x { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(255,255,255,.08); }
#edgeHint { width: 34px; height: 34px; border-radius: 50%; display: none; place-items: center; transform: translate(-50%,-50%); background: var(--brass); color: #16120b; font-weight: 700; }

/* creator */
#cTop { top: 10px; left: 10px; border-radius: 999px; padding: 6px 14px; font-size: 12.5px; white-space: nowrap; }
#cTop b { color: var(--brass); font-weight: 600; }
#cBar { left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 8px; width: min(560px, calc(100% - 20px)); }
#cBar button { flex: 1; border: 0; border-radius: 18px; padding: 10px 2px 8px; background: var(--hud); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; min-height: 64px; }
#cBar button svg { width: 24px; height: 24px; }
#cBar button.on { background: var(--brass); color: #16120b; }
#cSheet { left: 50%; bottom: 88px; transform: translateX(-50%); width: min(560px, calc(100% - 20px)); border-radius: 18px; padding: 14px 15px; display: none; max-height: 52%; overflow: auto; }
#cSheet.open { display: block; }
#cSheet h4 { margin: 0 0 8px; font-size: 14px; }
#cSheet .muted, .muted { color: var(--dim); font-size: 12.5px; }
.rowf { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
.big { border: 0; border-radius: 12px; padding: 9px 13px; background: rgba(255,255,255,.1); font-weight: 600; }
.big.on { background: var(--brass); color: #16120b; }
input[type=range] { width: 100%; accent-color: var(--brass); }
.vchips { display: flex; flex-wrap: wrap; gap: 6px; }
.vchips button { border: 1px solid rgba(255,255,255,.16); background: transparent; border-radius: 999px; padding: 7px 12px; font-size: 13px; }
.vchips button.on { background: var(--fg); color: #111; border-color: var(--fg); font-weight: 600; }
.field { display: block; margin: 8px 0; }
.field span { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-bottom: 3px; }
.field input, .field textarea, .field select { width: 100%; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.13); border-radius: 9px; padding: 7px 9px; }
.field textarea { min-height: 76px; resize: vertical; line-height: 1.45; }
.notelist { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }

.notelist button.on { background: rgba(227,178,106,.18); }
.badge { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11.5px; font-weight: 700; background: var(--brass); color: #16120b; flex: none; }

#main.editor { grid-template-columns: 236px minmax(0,1fr) 352px; }

.anno { border: 1px solid #262a31; border-radius: 12px; padding: 9px 10px; margin: 8px 0; }

.anno .top { display: flex; align-items: center; gap: 8px; }
.anno .top input { flex: 1; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.13); border-radius: 9px; padding: 6px 9px; font-weight: 600; }
.anno .tools { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
.anno .tools button { border: 1px solid #2c3038; background: transparent; border-radius: 8px; padding: 4px 9px; font-size: 12px; }

.mini { border: 1px solid #2c3038; background: #181b20; border-radius: 8px; padding: 5px 10px; font-size: 12.5px; }
.mini.on { border-color: var(--brass); color: var(--brass); }
#main.editor #frameStat { top: auto; bottom: 10px; }
#eTools { top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; border-radius: 12px; padding: 5px; }
#eTools button { border: 0; background: transparent; border-radius: 8px; padding: 6px 10px; font-size: 12.5px; color: var(--fg); }

#eTools label { display: flex; align-items: center; gap: 5px; padding: 0 8px; font-size: 12.5px; }
#ePick { top: 58px; left: 50%; transform: translateX(-50%); border-radius: 999px; padding: 7px 14px; font-size: 13px; display: none; background: var(--brass); color: #16120b; font-weight: 600; }
@media (max-width: 900px) {
  #main.editor { grid-template-columns: minmax(0,1fr) 300px; }

}

  #main.editor { grid-template-columns: 1fr; grid-template-rows: 46% 54%; }

/* panels */
.panel { position: fixed; z-index: 40; background: var(--hud-solid); border: 1px solid #2a2e36; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.5); display: none; }

#loading { position: absolute; inset: 0; display: grid; place-items: center; color: #444; font-size: 13px; z-index: 3; }
</style>

<body>
<div id="chrome">
  <div class="seg" id="modeSeg">
    <button data-mode="visitor">Visitor</button>
    <button data-mode="creator">Creator</button>
    <button data-mode="editor">Editor</button>
  </div>
  <div class="spacer"></div>
  <button class="chip" id="phoneBtn" title="Render into a 9:19.5 phone viewport">Phone</button>
  <button class="chip" id="fieldsBtn" title="Which fields this view uses">Fields</button>
  <button class="chip" id="notesBtn" title="Design notes">Notes</button>
</div>

<div id="main">
  <aside id="left"></aside>
  <div id="stageWrap">
    <div id="stage">
      <div id="loading">Preparing the model...</div>
      <svg id="leaders"></svg>
      <div id="markers"></div>
      <!-- visitor -->
      <div class="hud plate" id="picker">
        <button id="pPrev" aria-label="Previous view">&#8249;</button>
        <button class="name" id="pName">Full scale</button>
        <button id="pNext" aria-label="Next view">&#8250;</button>
      </div>
      <div class="hud plate" id="pickerList"></div>
      <div class="hud plate" id="stationChip"><svg class="arrow" viewBox="0 0 20 20"><path d="M10 2 L16 15 L10 12 L4 15 Z" fill="#e3b26a"/></svg><span id="stationText"></span></div>
      <div class="hud" id="walkBar"><button id="walkBtn" class="plate">Walk in</button><span class="hint" id="walkHint">drag to look - WASD to walk</span></div>
      <div class="hud plate" id="card" role="dialog" aria-live="polite">
        <button class="x" id="cardX" aria-label="Close">&#215;</button>
        <div class="num" id="cardNum"></div>
        <h3 id="cardTitle"></h3>
        <p id="cardText"></p>
        <div class="row"><button id="cardPrev">&#8249; Previous</button><button id="cardNext">Next &#8250;</button></div>
      </div>
      <div class="hud" id="edgeHint">&#8250;</div>
      <!-- creator -->
      <div class="hud plate" id="cTop"></div>
      <div class="hud plate" id="cSheet"></div>
      <div class="hud" id="cBar"></div>
      <!-- editor -->
      <div class="hud plate" id="eTools"></div>
      <div class="hud" id="ePick">Click the model to place the note</div>
      <div class="hud plate" id="frameStat">-</div>
    </div>
  </div>
  <aside id="insp"></aside>
</div>

<div class="panel" id="fieldsPanel"><button class="close" data-close="fieldsPanel">&#215;</button><div id="fieldsBody"></div></div>
<div class="panel" id="notesPanel"><button class="close" data-close="notesPanel">&#215;</button><div class="in" id="notesBody"></div></div>

<template id="notesTpl">
  <h2>Design notes - 3D models presented</h2>
  <p class="muted">Family station-blocks-5-models. One record (the guild's market bell in its oak frame), five views. Frame times are from this machine; see point 3.</p>
  <details open><summary>1. The model as built, and field changes</summary>
    <ul>
      <li><b>model</b> - a glb asset. The page builds the bell with three.js geometry, exports it with GLTFExporter to a real binary glb (<span data-k="glbKB"></span> KB with its three generated textures), loads that glb back with GLTFLoader, and every view draws the loaded copy. So the size, the node names and the animation are what a creator's file would really contain.</li>
      <li><b>sizeM</b> - largest side of the drawn model, 0.05 to 500 m. The glb's own largest side is <span data-k="nativeM"></span> m; the view scales by sizeM / native.</li>
      <li><b>pose</b> - position relative to the station anchor plus yaw. Stored as { position: [x, y, z], yawDeg }.</li>
      <li><b>animation</b> - { name, autoplay }: a clip name from the glb, or null.</li>
      <li><b>annotations</b> - [{ position, normal, title, text }] in the glb's own coordinates (they scale with sizeM). Title is clamped to 64 and text to 1024 characters on load.</li>
    </ul>
    <p><b>Add <code>title</code> and <code>credit</code></b> to the block. Every view wanted a name (the pedestal's plate, the list in the editor, the station chip) and the model has none; and a downloaded glb almost always comes with a licence that requires attribution, which today has nowhere to go.</p>
    <p><b>Add an optional <code>node</code> to each annotation</b> (the glb node it is pinned to). Annotations are in model space, so the moment the bell swings they float off the bronze. The page works around it honestly: any view that shows notes holds the animation at its rest pose. With <code>node</code>, notes could ride on the moving part.</p>
    <p><b>Replace yaw by a full quaternion later</b>, for models leaning on a wall or lying on their side. Yaw alone was enough for everything on this square.</p>
    <p><b>Do not add</b> a material override, a colour or a sound field: a sound belongs to an audio block, and a colour override is what the ghost and cutaway views already decide in code.</p>
  </details>
  <details><summary>2. Per view - what, which fields, why, weakest where</summary>
    <ul>
      <li><b>Pedestal (turntable)</b> - a dark stone pedestal with a brass ring; the model turns once in 36 s, shown at 0.3 to 0.85 m and never wider than the 0.41 m turntable radius, with a scale plate (1 : n) from sizeM; tap the model to stop the turn. Uses model, sizeM, pose, animation. A visitor likes it because it reads like a museum object they can walk round, and it never pretends to fit the real scene, so 1 m of error is harmless. Weakest: the scale plate is small text (read within 2 m); a crowd standing round it hides it; the miniature undersells a large thing.</li>
      <li><b>Full scale (in place)</b> - the bell in its frame at 1 : 1 where it stood, swinging slowly, with a soft contact shadow. Uses model, sizeM, pose, animation. The strongest "it was here" moment. Weakest: placement error shows at the feet (a 1 m slide on a paved square is visible), and a big opaque object can stand in a visitor's path or inside a real bench.</li>
      <li><b>Ghost</b> - the same shape as dark glass with a bright edge, a slow light sweep, and feet that fade out over the lowest 0.7 m so the ground contact never has to be exact. Uses model (shape only), sizeM, pose, animation. Forgiving of error and of a crowd (people show through it). Weakest: in bright sun a translucent object loses contrast on a pale background; detail like the inscription is lost.</li>
      <li><b>Hotspots (suggested idea)</b> - numbered discs on short leader lines at each annotation; a disc fades when its surface faces away and dims when the model hides it (a ray test); the title shows beside the disc nearest the screen centre; tapping opens a card with the text and previous/next. Uses every field. Weakest: needs the animation held still (see point 1), and five discs in a crowded view are busy.</li>
      <li><b>Cutaway (my own idea)</b> - the model cut by a vertical plane that always turns to face the visitor, so the near half is gone and the inside is visible: the clapper swinging in the bell, the wall thickness of the bronze, the heart of the oak. Section faces are drawn flat and warm (back faces with a plain colour), and four brass corner marks frame the cut. Uses model, sizeM, pose, animation. Generic for any closed glb. Weakest: models with open or single-sided meshes show nonsense sections; it is a technical look, not a romantic one.</li>
    </ul>
  </details>
  <details><summary>3. Per view - cost</summary>
    <div data-k="costs"></div>
    <p>Media: the glb is <span data-k="glbKB"></span> KB for <span data-k="tris"></span> triangles including three generated textures (patina 512 x 256, its metal/roughness map, the inscription band 2048 x 128, oak 256 x 512). The views add no media: every view is code over the same file. Creator minutes: choosing a view is seconds; placing and sizing about a minute on the phone; each annotation is a tap on the model plus typing, two to five minutes each with real text.</p>
  </details>
  <details><summary>4. The creator's controls per view</summary>
    <ul>
      <li><b>Phone (creator mode)</b>: five large buttons - Place (tap the ground), Size (log slider 0.05 to 500 m, a Real size button), Turn (slider, 15 degree steps, Face me), View (the five views plus the animation switch), Notes (tap the model to drop a note at the hit point and its surface normal, then type a title and text). The same five buttons serve every view; only Notes matters for Hotspots.</li>
      <li><b>Desktop editor</b>: move and turn handles on the block, numeric pose, the size with its scale factor, the clip list from the glb with autoplay, and the annotation list (title and text with live character counts, Pick on model, Delete, Add). "Notes in 3D" draws the markers in every view and holds the animation while on.</li>
    </ul>
  </details>
  <details><summary>5. Blunt self-check</summary>
    <ul>

  }

}

}
window.addEventListener('hashchange', readHash);

// ---------------------------------------------------------------- resize
function resize() {
  const w = Math.max(1, stage.clientWidth), h = Math.max(1, stage.clientHeight);
  renderer.setSize(w, h, false);
  visitorCam.aspect = w / h;
  // the short side of the screen spans about 45 degrees, like a phone camera
  visitorCam.fov = w < h ? 2 * Math.atan(Math.tan(22.5 * DEG) * h / w) / DEG : 45;
  visitorCam.updateProjectionMatrix();
  editorCam.aspect = w / h; editorCam.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

// ---------------------------------------------------------------- frame loop
const frames = [];
let last = performance.now(), statT = 0;
const clock = { t: 0 };
const _tmp = new THREE.Vector3();
function nearestStation(x, z) { let best = null; for (const s of STATIONS) { const d = Math.hypot(s.x - x, s.z - z); if (!best || d < best.d) best = { s, d }; } return best; }

function loop(now) {
  const dtMs = now - last; last = now;
  const dt = Math.min(0.1, dtMs / 1000); clock.t += dt;
  frames.push([now, dtMs]); while (frames.length && now - frames[0][0] > 2000) frames.shift();
  if (now - statT > 250 && frames.length > 2) {
    statT = now; let s = 0, mx = 0; for (const [, d] of frames) { s += d; if (d > mx) mx = d; }
    const mean = s / frames.length;
    $('#frameStat').textContent = `${mean.toFixed(1)} ms mean\n${mx.toFixed(1)} ms max`;
    if (view && mode === 'visitor') measured[view.name] = { mean, max: mx };
  }
  if (!view) { renderer.render(scene, activeCam()); return; }

  // visitor movement
  if (mode === 'visitor') {
    const sp = keys.has('shift') ? 3.2 : 1.4;
    let fx = 0, fz = 0;
    if (keys.has('w') || keys.has('arrowup')) fz -= 1; if (keys.has('s') || keys.has('arrowdown')) fz += 1;
    if (keys.has('a') || keys.has('arrowleft')) fx -= 1; if (keys.has('d') || keys.has('arrowright')) fx += 1;
    if (fx || fz) {
      visitor.walking = null; const c = Math.cos(visitor.yaw), s = Math.sin(visitor.yaw);
      visitor.x += (fx * c + fz * s) * sp * dt; visitor.z += (-fx * s + fz * c) * sp * dt;
    }
    if (visitor.walking) {
      const w = visitor.walking; const dx = w.tx - visitor.x, dz = w.tz - visitor.z; const d = Math.hypot(dx, dz);
      if (d < 0.05) { visitor.walking = null; syncWalkBtn(); }
      else { const st = Math.min(d, 2.4 * dt); visitor.x += dx / d * st; visitor.z += dz / d * st; }
      const [bx, , bz] = record.pose.position; const want = Math.atan2(-(bx - visitor.x), -(bz - visitor.z));
      let dy = want - visitor.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); visitor.yaw += dy * Math.min(1, dt * 2.5);
      visitor.pitch += (-0.06 - visitor.pitch) * Math.min(1, dt * 2);
    }
    visitorCam.position.set(visitor.x, EYE, visitor.z); visitorCam.rotation.set(visitor.pitch, visitor.yaw, 0);
    const inA = Math.hypot(visitor.x - STATIONS[0].x, visitor.z - STATIONS[0].z) < STATIONS[0].r;
    appear = clamp(appear + (inA ? dt : -dt) / 0.9, 0, 1);
    const nb = nearestStation(visitor.x, visitor.z);
    const chip = $('#stationChip');
    if (nb.d > nb.s.r) {
      chip.style.display = 'flex';
      const bearing = Math.atan2(nb.s.x - visitor.x, -(nb.s.z - visitor.z)); // 0 = north, clockwise
      const rel = bearing + visitor.yaw; // yaw is counter-clockwise
      chip.querySelector('.arrow').style.transform = `rotate(${rel}rad)`;
      $('#stationText').innerHTML = `<b>${esc(nb.s.name)}</b> - ${Math.round(nb.d)} m`;
    } else chip.style.display = 'none';
    stationB.visible = Math.hypot(visitor.x - 60, visitor.z) < RADIUS;
  } else if (mode === 'creator') {
    appear = 1; stationB.visible = true;
    visitorCam.position.set(0, EYE, 0); visitorCam.rotation.set(creatorCam.pitch, creatorCam.yaw, 0);
  } else {
    appear = 1; stationB.visible = true; orbit.update();
  }

  // block pose from the record (except while a handle is dragged)
  if (!tc.dragging) {
    blockRoot.position.fromArray(record.pose.position);
    blockRoot.rotation.set(0, record.pose.yawDeg * DEG, 0);
  }
  view.modelRoot.scale.setScalar(view.scaleFn());
  if (view.shadow) { const s = modelScale(); view.shadow.scale.set(3.3 * s, 2.5 * s, 1); }

  // animation
  const clip = record.animation ? clipByName(record.animation.name) : null;
  const wantPlay = !!(clip && record.animation.autoplay && !holdAtRest() && view.mixer);
  if (wantPlay && (!view.playing || view.action.getClip() !== clip)) { if (view.action) view.action.stop(); view.action = view.mixer.clipAction(clip); view.action.reset().play(); view.playing = true; }
  if (!wantPlay && view.playing) { view.action.stop(); view.playing = false; view.mixer.update(0); }
  if (view.playing) view.mixer.update(dt);
  if (view.update) view.update(dt, clock.t);

  // appear fade (content shows only inside the station circle)
  view.group.visible = appear > 0.001;
  for (const m of view.mats) { m.opacity = m.userData.baseOpacity * appear; m.transparent = m.userData.baseTransparent || appear < 0.999; }
  if (view.ghost) { view.ghost.uniforms.uTime.value = clock.t; view.ghost.uniforms.uAppear.value = appear; view.ghost.uniforms.uGround.value = blockRoot.position.y; }
  blockRoot.updateMatrixWorld(true);

  // cutaway plane turns to face the camera (smoothed)
  if (view.frame) {
    const cam = activeCam(); const s = modelScale();
    const center = blockRoot.localToWorld(_tmp.set(0, glb.native * 0.45 * s, 0)).clone();
    const dir = new THREE.Vector3(center.x - cam.position.x, 0, center.z - cam.position.z);
    if (dir.lengthSq() < 1e-6) dir.set(0, 0, -1); dir.normalize();
    if (!view.cutDir) view.cutDir = dir.clone(); else view.cutDir.lerp(dir, Math.min(1, dt * 3)).normalize();
    clipPlane.setFromNormalAndCoplanarPoint(view.cutDir, center.clone().addScaledVector(view.cutDir, -0.02 * s));
    view.frame.position.copy(center); view.frame.lookAt(center.clone().add(view.cutDir));
    view.frame.scale.set(glb.native * 0.62 * s, glb.native * 0.5 * s, 1);
    view.frame.visible = appear > 0.001;
  }

  const cam = activeCam();
  renderer.render(scene, cam);
  updateMarkers(cam, stage.clientWidth, stage.clientHeight);
  $('#ePick').style.display = mode === 'editor' && pickMode ? 'block' : 'none';
}

// ---------------------------------------------------------------- hook
const nextFrames = (n = 3) => new Promise((res) => { let k = 0; const f = () => { if (++k >= n) res(); else requestAnimationFrame(f); }; requestAnimationFrame(f); });
let readyResolve; const ready = new Promise((r) => { readyResolve = r; });
window.__stationBlock = {
  family: FAMILY,
  views: VIEW_NAMES.slice(),
  modes: ['visitor', 'creator', 'editor'],
  async setMode(name) { await ready; setModeInternal(name); writeHash(); await nextFrames(); },
  async setView(name) { await ready; setViewInternal(name); writeHash(); await nextFrames(); },
  async walkTo(x, z) {
    await ready; if (!Number.isFinite(x) || !Number.isFinite(z)) throw new Error('walkTo needs two finite numbers');
    if (mode !== 'visitor') setModeInternal('visitor');
    visitor.walking = null; visitor.x = x; visitor.z = z; syncWalkBtn(); await nextFrames();
  },
  async lookAt(x, y, z) {
    await ready; if (![x, y, z].every(Number.isFinite)) throw new Error('lookAt needs three finite numbers');
    const st = mode === 'creator' ? creatorCam : visitor; const px = mode === 'creator' ? 0 : visitor.x, pz = mode === 'creator' ? 0 : visitor.z;
    const dx = x - px, dz = z - pz, dy = y - EYE;
    st.yaw = Math.atan2(-dx, -dz); st.pitch = Math.atan2(dy, Math.hypot(dx, dz)); visitor.walking = null; await nextFrames();
  },
  async describe() {
    await ready;
    return { family: FAMILY, fields: FIELDS.slice(), views: VIEW_DEFS.map((v) => ({ name: v.name, required: v.required, usesFields: FIELDS.filter((f) => v.uses[f]) })) };
  },
  async exportModel() { await ready; return JSON.parse(JSON.stringify(record)); },
  // test-only extras (not part of the shared hook contract)
  async _frameStat() { return $('#frameStat').textContent; },
  async _openNote(i) { await ready; openCard(i); await nextFrames(); },
  async _setPhoneFrame(on) { await ready; phoneFrame = !!on; syncUI(); await nextFrames(); resize(); await nextFrames(); },
  async _panel(name) { await ready; if (name === 'notes') fillNotes(); for (const id of ['fieldsPanel', 'notesPanel']) $('#' + id).classList.toggle('open', id === name + 'Panel'); await nextFrames(); },
};

// ---------------------------------------------------------------- start
renderer.setAnimationLoop(loop);
resize();
prepareGlb().then(() => {
  $('#loading').remove();
  const p = new URLSearchParams(location.hash.slice(1));
  setViewInternal(viewDef(p.get('view')) ? p.get('view') : record.view);
  setModeInternal(['visitor', 'creator', 'editor'].includes(p.get('mode')) ? p.get('mode') : 'visitor');
  visitor.yaw = 0; writeHash();
  readyResolve();
}).catch((e) => { $('#loading').textContent = 'The model could not be prepared.'; console.error(e); });
</script>
</body>
</html>
