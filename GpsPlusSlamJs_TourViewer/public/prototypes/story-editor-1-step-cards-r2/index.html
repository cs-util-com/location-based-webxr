<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Story Editor - Step Cards, round 2</title>
<meta name="description" content="Throwaway prototype, round 2 of the step cards: cards open in place on a desktop, a tap drills into one step on a phone, Back goes one level up, and the story follows the format where blocks live inside their story.">
<!--
  Throwaway prototype: round 2 of "story-editor-1-step-cards", the chosen
  story editor. Not wired into the app; everything is in memory, nothing is
  saved, no libraries.

  What changed against round 1:
  - DESKTOP: a card opens in place, and several may be open at once, so steps
    can be compared and text copied from one to another ("Open all").
  - PHONE (narrow, or short in landscape): a tap on a card DRILLS IN - the
    list is replaced by that step alone. Back goes ONE LEVEL UP to the
    structural parent (step, story, station, tour), and the Android system
    Back does the same. The crumb at the top is clickable on every level.
    Coming back to the list restores its scroll position.
  - THE STORY SHAPE of the tour file's version 5: a station holds one ordered
    list of children, each a free item or a story; a story holds its own
    blocks, choices and quizzes. A block lives in exactly one place, so the
    old "blocks" list and "Also delete the block?" are gone.
    - A quiz has no jump: after its answer the story goes on at the next step.
    - A choice's answer goes on at the next step, jumps to any step of the
      story (ahead OR back), or ends the story.
    - A jump back is allowed, shown as "goes back to step N". The only loop
      warning is for a loop that no answer can leave.
    - Delete is a plain delete with Undo.
  - Kept: the "Story valid" check, the jump chips and margin lines, the
    visitor preview, drag to reorder.
  Block fields (name, text, view, file) are simplified for the prototype.
  Hand-check hash: #station=st2&story=tale&step=c3&open=c2,c5&preview=0&level=tour
-->
<style>
:root {
  --bg0: #18191c; --bg1: #1f2023; --bg2: #26282c; --bg3: #2f3136; --bg4: #383a40;
  --line: #313338; --line2: #3c3f46;
  --text: #d9dbe0; --muted: #8f949e; --dim: #6b707a;
  --accent: #e9a23b; --accentBg: rgba(233,162,59,.14); --accentLine: rgba(233,162,59,.55); --accentInk: #f3c47e;
  --focus: #5b9cf0;
  --ok: #6cc08a; --okBg: rgba(108,192,138,.13);
  --bad: #e5736d; --badBg: rgba(229,115,109,.13);
  --l0: #5b9cf0; --l1: #c58af0; --l2: #4fc2a6; --l3: #e9a23b;
  --gutter: 34px;
  --mono: "Cascadia Mono", Consolas, "SF Mono", ui-monospace, Menlo, monospace;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --hud: rgba(30,35,50,.9); --hudInk: #fff; --hudAccent: #f2971f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg0); color: var(--text); font: 12.5px/1.4 var(--sans); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
body { display: grid; grid-template-rows: 40px minmax(0,1fr) 24px; grid-template-columns: minmax(0,1fr); }

/* ---------- top bar ---------- */
#tb { display: flex; align-items: center; gap: 6px; padding: 0 8px; background: var(--bg1); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; padding-right: 10px; border-right: 1px solid var(--line); height: 24px; white-space: nowrap; }
.brand b { font-weight: 600; }
.spacer { flex: 1; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid transparent; border-radius: 4px; background: transparent; white-space: nowrap; color: var(--text); }
.tbtn:hover:not(:disabled) { background: var(--bg3); }
.tbtn:disabled { color: var(--dim); cursor: default; }
.tbtn.pri { background: var(--accent); color: #1c1c1c; font-weight: 600; }
.tbtn.pri:hover { background: #f0b257; }
.tbtn .ulbl { max-width: 220px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.phoneOnly { display: none !important; }
#landActs { display: none; gap: 4px; }
.vpill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid transparent; background: var(--okBg); color: var(--ok); font-weight: 600; white-space: nowrap; flex: none; }
.vpill.bad { background: var(--badBg); color: var(--bad); border-color: rgba(229,115,109,.4); }
.vpill.sm { height: 20px; padding: 0 7px; font-size: 11px; gap: 4px; }
.vpill.sm svg { width: 12px; height: 12px; }

/* the crumb: every part but the last is a button */
.crumbs { display: flex; align-items: center; gap: 1px; min-width: 0; overflow: hidden; }
.cb { flex: 0 1 auto; min-width: 0; border: 0; background: transparent; color: var(--muted); padding: 3px 6px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
.cb:hover:not([aria-current]) { background: var(--bg3); color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
.cb[aria-current] { color: var(--text); font-weight: 600; cursor: default; }
.csep { flex: none; color: var(--dim); }
#crumbRow { display: none; }

/* ---------- desktop stage ---------- */
#vp { position: relative; overflow: hidden; background: #232427; min-height: 0; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; }
.dock { position: absolute; top: 0; z-index: 5; display: flex; flex-direction: column; background: rgba(31,32,35,.97); border: 1px solid var(--line); border-top: 0; box-shadow: 0 8px 22px rgba(0,0,0,.35); }
#tree { left: 0; width: 262px; border-left: 0; border-radius: 0 0 8px 0; max-height: calc(100% - 40px); }
#panel { right: 0; width: 500px; bottom: 0; border-right: 0; border-bottom: 0; border-radius: 0; }
.dhead { flex: none; min-height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--line); }
.ttlh { font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.count { font: 10.5px var(--mono); color: var(--dim); }
.dbody { overflow: auto; min-height: 0; padding-bottom: 6px; }
.protoTag { position: absolute; left: 276px; bottom: 8px; font-size: 10px; color: rgba(220,222,226,.65); letter-spacing: .03em; padding: 1px 6px; border-radius: 3px; background: rgba(24,25,28,.6); }

/* tree */
.st { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; color: var(--muted); width: 100%; border: 0; background: transparent; text-align: left; }
.st:hover { background: var(--bg3); color: var(--text); }
.st .n { font: 600 10px var(--mono); background: #3d5a78; color: #e6f0fa; border-radius: 3px; padding: 1px 5px; }
.st.cur { color: var(--text); background: var(--bg2); }
.st.cur .n { background: var(--accent); color: #1c1c1c; }
.st.sel { box-shadow: inset 2px 0 0 var(--accent); }
.st .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { padding: 0 0 8px; background: var(--bg2); border-bottom: 1px solid var(--line); }
.tsec { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px 0 22px; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.trow { position: relative; display: flex; align-items: center; gap: 7px; min-height: 28px; padding: 2px 8px 2px 22px; width: 100%; border: 0; background: transparent; text-align: left; color: var(--text); }
.trow:hover { background: var(--bg3); }
.trow.sel { background: var(--accentBg); }
.trow.sel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.trow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .meta { font: 10.5px var(--mono); color: var(--dim); white-space: nowrap; }
.trow .meta.free { color: var(--l2); }
.trow .meta.bad { color: var(--bad); }
.mthumb { width: 22px; height: 22px; border-radius: 4px; overflow: hidden; flex: none; }
.mthumb svg { display: block; width: 100%; height: 100%; }

/* ---------- panel ---------- */
#panel .dhead { padding: 6px 10px 6px 8px; }
.ptitle { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.ptitle b { font-size: 14px; color: #f0f1f3; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.upbtn { flex: none; width: 30px; height: 30px; border-radius: 5px; border: 1px solid var(--line2); background: transparent; color: var(--muted); display: grid; place-items: center; padding: 0; }
.upbtn:hover { color: var(--text); background: var(--bg3); }
.scroll { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }
.scroll::-webkit-scrollbar, .dbody::-webkit-scrollbar { width: 10px; } .scroll::-webkit-scrollbar-thumb, .dbody::-webkit-scrollbar-thumb { background: var(--bg4); border: 3px solid var(--bg1); border-radius: 6px; }
#list { position: relative; padding: 10px 12px 14px var(--gutter); }
#links { position: absolute; left: 0; top: 0; width: 100%; pointer-events: none; overflow: visible; }
.intro { color: var(--muted); font-size: 11.5px; margin: 0 0 8px; line-height: 1.45; }
.pfoot { flex: none; display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); }
.pfoot:empty { display: none; }
.fld.titlefld { margin: 0 0 12px; }

/* rows: the tour's stations, a station's children */
.rows { padding: 10px 12px 16px; }
.row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; margin: 0 0 8px; border-radius: 8px; background: var(--bg2); border: 1px solid var(--line2); color: var(--text); text-align: left; }
.row:hover { border-color: #4a4e56; }
.row.flash { animation: flash 1.1s ease-out; }
.row .thumb { width: 48px; height: 48px; }
.row .bi { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .bi b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.row .bi span { font-size: 11.5px; color: var(--muted); }
.row .bi span.free { color: var(--l2); }
.row .nbadge { flex: none; width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; font: 600 12px var(--mono); background: #3d5a78; color: #e6f0fa; }
.row .chevR { flex: none; color: var(--dim); }
.secrow { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 6px; }

/* card */
.card { position: relative; background: var(--bg2); border: 1px solid var(--line2); border-radius: 8px; margin: 0 0 8px; transition: border-color .12s, box-shadow .12s; }
.card:hover { border-color: #4a4e56; }
.card.open { border-color: #5a5e66; background: #2a2c31; }
.card.bad { border-color: rgba(229,115,109,.6); }
.card.playing { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accentLine); }
.card.dragging { z-index: 20; box-shadow: 0 14px 30px rgba(0,0,0,.55); border-color: var(--accent); }
.card.flash { animation: flash 1.1s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: 0 0 0 0 transparent; } }
.chead { display: flex; align-items: flex-start; gap: 9px; padding: 8px 8px 8px 4px; cursor: pointer; user-select: none; border-radius: 8px; }
.grip { flex: none; width: 22px; height: 40px; margin-top: 4px; border: 0; border-radius: 4px; background: transparent; color: var(--dim); display: grid; place-items: center; cursor: grab; touch-action: none; padding: 0; }
.grip:hover { color: var(--text); background: var(--bg3); }
.num { flex: none; width: 22px; height: 22px; margin-top: 2px; border-radius: 50%; background: #3a3d44; color: #eef0f3; font: 600 11px var(--mono); display: grid; place-items: center; }
.card.playing .num { background: var(--accent); color: #1c1c1c; }
.thumb { flex: none; width: 58px; height: 58px; border-radius: 6px; overflow: hidden; background: #111; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.thumb svg { display: block; width: 100%; height: 100%; }
.sum { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.l1 { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.kindtag { flex: none; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kindtag.choice { color: var(--l1); } .kindtag.quiz { color: var(--l2); }
.ttl { font-weight: 600; font-size: 13px; color: #f0f1f3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.l2 { color: #b9bdc5; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.38; }
.l2.empty { color: var(--bad); font-style: italic; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 1px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--line2); color: var(--muted); font-size: 11px; white-space: nowrap; }
.chip svg { width: 12px; height: 12px; }
.chip.adv { color: #c9ccd3; }
.chev { flex: none; margin-top: 4px; color: var(--dim); transition: transform .15s; }
.card.open .chev { transform: rotate(180deg); }
.answers { list-style: none; margin: -2px 8px 8px calc(4px + 22px + 9px + 22px + 9px); padding: 0; display: flex; flex-direction: column; gap: 4px; }
.ans { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 3px 4px 3px 9px; border-radius: 6px; background: rgba(0,0,0,.18); border: 1px solid var(--line); }
.ans.after { background: transparent; border-style: dashed; }
.ans .albl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ans .albl.empty { color: var(--bad); font-style: italic; }
.ans .albl.quiet { color: var(--muted); }
.ans .mark { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--dim); display: grid; place-items: center; }
.ans .mark.right { background: var(--ok); border-color: var(--ok); color: #10301c; }
.jump { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; border: 1px solid currentColor; background: transparent; color: var(--text); }
button.jump:hover { background: rgba(255,255,255,.06); }
.jump.next { color: var(--muted); border-color: var(--line2); font-weight: 400; }
.jump.end { color: #d6d8dd; border-color: #6a6e77; }
.jump.back { border-style: dashed; }
.jump.missing { color: var(--bad); border-style: dashed; }
.jump svg { width: 12px; height: 12px; }
.issues { margin: 0 8px 8px 8px; display: flex; flex-direction: column; gap: 4px; }
.issue { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 7px; padding: 6px 8px; border-radius: 6px; background: var(--badBg); color: #f0b3ae; font-size: 12px; line-height: 1.4; }
.issue svg { margin-top: 1px; color: var(--bad); }
.issue > span { flex: 1 1 220px; min-width: 0; }
.issue .fix { margin-left: auto; flex: none; max-width: 100%; white-space: normal; text-align: left; }

/* edit body */
.body { padding: 4px 12px 12px; border-top: 1px solid var(--line); }
.fld { margin: 10px 0 0; }
.fld > label, .flabel { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
.tf { width: 100%; min-height: 30px; background: var(--bg1); border: 1px solid var(--line2); border-radius: 5px; color: var(--text); padding: 5px 8px; outline: none; }
.tf:focus { border-color: var(--focus); }
textarea.tf { resize: vertical; line-height: 1.45; min-height: 58px; }
select.tf { padding: 4px 6px; }
.row2 { display: flex; gap: 6px; align-items: center; }
.row2 > .tf { flex: 1; min-width: 0; }
.cnt { font: 10.5px var(--mono); color: var(--dim); text-align: right; margin-top: 2px; }
.note { color: var(--muted); font-size: 11.5px; line-height: 1.45; margin: 4px 0 0; }
.muted { color: var(--muted); font-size: 11.5px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.segb { min-height: 28px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line2); background: transparent; color: var(--muted); }
.segb:hover { color: var(--text); border-color: #5a5e66; }
.segb[aria-pressed="true"] { color: var(--accentInk); border-color: var(--accentLine); background: var(--accentBg); }
.segb .where { opacity: .7; font-size: 10.5px; margin-left: 4px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 30px; padding: 0 12px; border-radius: 5px; border: 1px solid var(--line2); background: var(--bg3); color: var(--text); white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--bg4); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { min-height: 26px; padding: 0 9px; font-size: 12px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #1c1c1c; font-weight: 600; }
.btn.pri:hover:not(:disabled) { background: #f0b257; }
.btn.danger { color: #f0a8a5; border-color: rgba(229,115,109,.45); background: rgba(229,115,109,.08); }
.btn.danger:hover:not(:disabled) { background: rgba(229,115,109,.18); }
.btn.ghost { background: transparent; }
.btn.wide { flex: 1; }
.optrow { display: flex; gap: 6px; align-items: center; margin: 0 0 6px; }
.optrow .tf { flex: 1 1 40%; min-width: 0; }
.optrow select.tf { flex: 1 1 45%; }
.optrow .rbtn { flex: none; width: 30px; height: 30px; border-radius: 5px; border: 1px solid var(--line2); background: transparent; color: var(--muted); display: grid; place-items: center; padding: 0; }
.optrow .rbtn:hover:not(:disabled) { color: var(--text); background: var(--bg3); }
.optrow .rbtn:disabled { opacity: .35; cursor: default; }
.optrow .radio { flex: none; width: 30px; height: 30px; display: grid; place-items: center; }
.optrow .radio input { width: 17px; height: 17px; accent-color: var(--ok); }
.optbox { padding: 6px; border: 1px solid var(--line); border-radius: 7px; background: rgba(0,0,0,.14); margin: 0 0 6px; }
.optbox .optrow { margin: 0; }
.optrow.lead { margin-top: 5px; }
.leads { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); padding: 0 2px 0 4px; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }
.acts .sp { flex: 1; }
.thenbox { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 7px 9px; border-radius: 6px; border: 1px dashed var(--line2); }

/* the phone's drilled-in step */
.detail .chead { cursor: default; padding-left: 8px; }
.detail:hover { border-color: #5a5e66; }
#detailWrap { padding: 10px 10px 16px; }

/* insert gap between cards (desktop) */
.gap { position: relative; height: 0; margin: -4px 0 4px; }
.gap button { position: absolute; left: 50%; top: -10px; transform: translateX(-50%); height: 20px; padding: 0 10px; border-radius: 999px; border: 1px dashed var(--line2); background: var(--bg1); color: var(--muted); font-size: 11px; opacity: 0; transition: opacity .12s; z-index: 3; display: inline-flex; align-items: center; gap: 4px; }
.gap:hover button, .gap button:focus-visible { opacity: 1; }
.gap button:hover { color: var(--accentInk); border-color: var(--accentLine); }
#dropLine { position: absolute; left: var(--gutter); right: 12px; height: 3px; border-radius: 2px; background: var(--accent); z-index: 25; pointer-events: none; }
#dropLine span { position: absolute; left: 0; top: -24px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; white-space: nowrap; background: var(--bad); color: #2a0e0c; }
#dropLine.warn { background: var(--bad); }
.addEnd { display: flex; width: 100%; justify-content: center; min-height: 38px; border: 1px dashed var(--line2); border-radius: 8px; background: transparent; color: var(--muted); align-items: center; gap: 6px; }
.addEnd:hover { color: var(--accentInk); border-color: var(--accentLine); }
.endmark { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 11px; margin: 2px 0 10px; }
.endmark::before, .endmark::after { content: ""; flex: 1; height: 1px; background: var(--line2); }

/* status bar */
#sb { display: flex; align-items: center; background: var(--bg1); border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); min-width: 0; }
#sb > div { padding: 0 10px; border-right: 1px solid var(--line); height: 100%; display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
#sb .grow { flex: 1; min-width: 0; }

/* ---------- modal ---------- */
#modalBack { position: fixed; inset: 0; z-index: 60; background: rgba(8,9,11,.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
#modal { width: min(500px, 100%); max-height: calc(100% - 32px); overflow: auto; background: var(--bg1); border: 1px solid var(--line2); border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
#modal h2 { margin: 0; font-size: 15px; font-weight: 600; color: #f0f1f3; padding: 14px 16px 10px; display: flex; align-items: center; gap: 8px; }
#modal h2 .sp { flex: 1; }
#modal .mb { padding: 0 16px 10px; }
#modal .mf { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; padding: 12px 16px 14px; }
.kindgrid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin: 0 0 12px; }
.bigopt { display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px; border-radius: 8px; border: 1px solid var(--line2); background: var(--bg2); color: var(--text); min-height: 44px; }
.bigopt:hover { border-color: var(--accentLine); background: #2c2e33; }
.bigopt .thumb { width: 48px; height: 48px; }
.bigopt b { font-size: 13px; }
.bigopt span { font-size: 11.5px; color: var(--muted); line-height: 1.4; }
.newgrid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; margin: 0 0 12px; }
.newk { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 7px 4px; border-radius: 8px; border: 1px dashed var(--line2); background: transparent; color: var(--muted); font-size: 11.5px; min-height: 44px; text-align: center; }
.newk:hover { color: var(--accentInk); border-color: var(--accentLine); }
.newk .thumb { width: 40px; height: 40px; }
.sechead { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 4px 0 6px; }
.ilist { display: flex; flex-direction: column; gap: 6px; }

/* toast */
#toast { position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%); z-index: 70; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 8px; background: #2d2f34; border: 1px solid var(--line2); box-shadow: 0 10px 28px rgba(0,0,0,.45); color: var(--text); width: max-content; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; }
#toast.show { opacity: 1; pointer-events: auto; }
#toast span { line-height: 1.4; }
#toast button { flex: none; }

/* ---------- preview ---------- */
#pv { position: fixed; z-index: 40; left: 262px; right: 500px; top: 40px; bottom: 24px; background: rgba(14,15,18,.78); display: flex; flex-direction: column; align-items: center; padding: 10px 14px 14px; gap: 10px; }
.pvbar { width: 100%; max-width: 520px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 8px; border-radius: 8px; background: var(--bg1); border: 1px solid var(--line2); }
.pvbar .where { flex: 1; min-width: 120px; overflow: hidden; }
.pvbar .where b { display: block; color: #f0f1f3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pvbar .where span { color: var(--muted); font-size: 11px; }
.trail { width: 100%; max-width: 520px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; color: var(--dim); font-size: 11px; min-height: 20px; }
.trail .t { font: 600 10.5px var(--mono); padding: 1px 6px; border-radius: 999px; background: var(--bg3); color: var(--text); }
.trail .t.cur { background: var(--accent); color: #1c1c1c; }
.phoneFrame { position: relative; flex: 1; min-height: 0; aspect-ratio: 9 / 18.5; max-width: 100%; border-radius: 30px; padding: 9px; background: #050608; box-shadow: 0 0 0 1px #2a2d33, 0 24px 60px rgba(0,0,0,.55); }
.scene { position: relative; width: 100%; height: 100%; border-radius: 22px; overflow: hidden; background: linear-gradient(#8fb6d6 0%, #c7dbe8 46%, #dfe8ea 58%); cursor: pointer; user-select: none; font-family: "Corbel", "Noto Sans", var(--sans); }
.scene .hills { position: absolute; left: -10%; right: -10%; bottom: 30%; height: 18%; background: radial-gradient(60% 100% at 30% 100%, #8ea377 0 60%, transparent 61%), radial-gradient(55% 90% at 78% 100%, #9bb084 0 60%, transparent 61%); }
.scene .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 32%; background: linear-gradient(#7f9566, #5f7449); }
.scene .path { position: absolute; left: 38%; bottom: 0; width: 30%; height: 32%; background: #b9a888; clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%); opacity: .8; }
.scene .millArt { position: absolute; left: 50%; bottom: 26%; width: 62%; transform: translateX(-46%); }
.wobj { position: absolute; transition: opacity .4s, transform .4s; }
.wobj.fresh { animation: pop .55s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.92); } to { opacity: 1; transform: none; } }
.w-wheel { left: 6%; bottom: 25%; width: 30%; }
.w-wheel svg { display: block; width: 100%; animation: spin 7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.w-stone { left: 62%; bottom: 4%; width: 20%; }
.w-stone svg { display: block; width: 100%; }
.w-framed { left: 5%; bottom: 7%; width: 40%; }
.frameArt { background: #5b3b22; padding: 6%; border-radius: 3px; box-shadow: 0 6px 14px rgba(0,0,0,.35); }
.frameArt svg { display: block; width: 100%; }
.legs { height: 14px; margin: 0 20%; border-left: 4px solid #4a2f1b; border-right: 4px solid #4a2f1b; }
.wtag { margin-top: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #fff; background: var(--hud); border-radius: 6px; padding: 3px 7px; text-align: center; }
.w-pin { left: 5%; bottom: 44%; max-width: 44%; }
.w-pin2 { right: 6%; bottom: 58%; max-width: 40%; }
.signArt { background: var(--hud); color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; box-shadow: 0 0 0 2px rgba(242,151,31,.85) inset; }
.signArt::after { content: ""; display: block; width: 2px; height: 26px; background: rgba(255,255,255,.75); margin: 6px auto -32px; }
.w-reading { left: 30%; bottom: 6%; width: 32%; }
.w-other { left: 34%; bottom: 10%; width: 30%; }
.w-figure { right: 3%; bottom: 3%; height: 46%; }
.w-figure svg { display: block; height: 100%; }
.ovl { position: absolute; inset: 0; pointer-events: none; }
.ovl > * { pointer-events: auto; }
.hudTop { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); padding: 4px 12px; border-radius: 999px; background: var(--hud); color: #fff; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.hint { position: absolute; left: 50%; transform: translateX(-50%); top: 38px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 999px; background: rgba(20,24,34,.72); color: #fff; font-size: 11.5px; white-space: nowrap; pointer-events: none; }
.hint .bar { width: 120px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.25); overflow: hidden; }
.hint .bar i { display: block; height: 100%; width: 0; background: var(--hudAccent); }
.bubble { position: absolute; right: 8%; bottom: 50%; width: 72%; padding: 10px 12px 12px; border-radius: 16px; background: #fff; color: #1b1d22; box-shadow: 0 8px 20px rgba(0,0,0,.25); font-size: 14px; line-height: 1.4; }
.bubble::after { content: ""; position: absolute; right: 18%; bottom: -12px; border: 7px solid transparent; border-top: 8px solid #fff; border-right: 9px solid #fff; }
.bubble .who { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #b26a12; margin-bottom: 3px; }
.bubble .w, .cap .w { opacity: .28; transition: opacity .15s; } .bubble .w.on, .cap .w.on { opacity: 1; }
.portrait { position: absolute; left: 10px; right: 10px; bottom: 12px; display: flex; align-items: flex-end; gap: 8px; }
.portrait .face { flex: none; width: 74px; height: 74px; border-radius: 50%; overflow: hidden; background: #e9dcc6; box-shadow: 0 0 0 3px var(--hudAccent); }
.portrait .face svg { width: 100%; height: 200%; display: block; }
.portrait .cap { flex: 1; padding: 8px 10px; border-radius: 12px; background: var(--hud); color: #fff; font-size: 13px; line-height: 1.4; }
.pcard { position: absolute; left: 10px; right: 10px; bottom: 12px; padding: 12px; border-radius: 14px; background: var(--hud); color: #fff; box-shadow: 0 10px 24px rgba(0,0,0,.35); }
.pcard h4 { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.pcard p { margin: 6px 0 0; font-size: 13.5px; line-height: 1.42; }
.pcard .art { border-radius: 8px; overflow: hidden; background: #000; }
.pcard .art svg { display: block; width: 100%; }
.vid { position: relative; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: repeating-linear-gradient(115deg, #2c2a26 0 14px, #34312b 14px 28px); animation: roll 1.2s linear infinite; }
@keyframes roll { to { background-position: 62px 0; } }
.vid .t { position: absolute; left: 10px; top: 8px; font-size: 11px; color: rgba(255,255,255,.8); }
.vid .ctrl { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: linear-gradient(transparent, rgba(0,0,0,.7)); font: 11px var(--mono); color: #fff; }
.vid .ctrl .track { flex: 1; height: 3px; background: rgba(255,255,255,.3); border-radius: 2px; overflow: hidden; }
.vid .ctrl .track i { display: block; height: 100%; width: 0; background: var(--hudAccent); }
.ask { position: absolute; left: 10px; right: 10px; bottom: 12px; padding: 14px 12px 12px; border-radius: 16px; background: var(--hud); color: #fff; box-shadow: 0 10px 24px rgba(0,0,0,.35); }
.ask .q { font-size: 15px; font-weight: 600; line-height: 1.35; margin: 0 0 10px; }
.ask .kicker { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--hudAccent); margin-bottom: 4px; }
.ask button.a { display: block; width: 100%; min-height: 44px; margin: 0 0 7px; padding: 8px 12px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,.35); background: rgba(255,255,255,.07); color: #fff; font-size: 14px; text-align: left; }
.ask button.a:hover { border-color: var(--hudAccent); }
.ask button.a.right { border-color: #6cc08a; background: rgba(108,192,138,.25); }
.ask button.a.wrong { border-color: #e5736d; background: rgba(229,115,109,.22); }
.ask button.a:disabled { cursor: default; }
.ask .fb { margin: 4px 0 10px; font-size: 13.5px; line-height: 1.4; }
.ask .pts { display: inline-block; margin-left: 6px; color: var(--hudAccent); font-weight: 700; }
.ask button.go, .endcard button.go { width: 100%; min-height: 44px; border: 0; border-radius: 12px; background: var(--hudAccent); color: #000; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; }
.endcard { position: absolute; left: 12px; right: 12px; top: 30%; padding: 18px 14px; border-radius: 16px; background: var(--hud); color: #fff; text-align: center; }
.endcard h4 { margin: 0 0 6px; font-size: 16px; }
.endcard p { margin: 0 0 12px; font-size: 13px; color: rgba(255,255,255,.8); }
.scene.wide .millArt { width: 25%; bottom: 26%; }
.scene.wide .w-wheel { width: 13%; left: 24%; }
.scene.wide .w-framed { width: 20%; left: 6%; }
.scene.wide .w-stone { width: 9%; left: 60%; }
.scene.wide .w-figure { height: 64%; right: 8%; }
.scene.wide .bubble { width: 44%; right: 18%; bottom: 46%; }
.scene.wide .pcard, .scene.wide .ask, .scene.wide .portrait { left: auto; right: 12px; width: 52%; }
.scene.wide .pcard .art { max-height: 120px; }
.scene.wide .pcard .art svg { max-height: 120px; width: auto; margin: 0 auto; }
.scene.wide .vid { max-height: 130px; margin: 0 auto; }
.scene.wide .endcard { left: 25%; right: 25%; top: 22%; }

/* ---------- phone ---------- */
body.phone { grid-template-rows: auto minmax(0,1fr) auto; font-size: 14.5px; }
body.phone .desk { display: none !important; }

body.phone .ptitlePh { display: flex !important; flex-direction: column; min-width: 0; flex: 1; line-height: 1.2; padding-left: 2px; }

body.phone #crumbRow::-webkit-scrollbar { display: none; }

body.phone { --gutter: 24px; }
body.phone #list { padding: 10px 10px 14px var(--gutter); }
body.phone .rows { padding: 10px; }
body.phone .row { min-height: 64px; }
body.phone .row .bi b { font-size: 15px; }
body.phone .chead { padding: 10px 8px 10px 2px; gap: 8px; }
body.phone .grip { width: 26px; height: 44px; }
body.phone .num { width: 24px; height: 24px; }
body.phone .thumb { width: 54px; height: 54px; }
body.phone .ttl { font-size: 15px; }
body.phone .chip { height: 24px; font-size: 12.5px; }
body.phone .answers { margin-left: 10px; margin-right: 10px; }

body.phone .segb, body.phone .btn { min-height: 42px; }
body.phone .btn.sm { min-height: 40px; }
body.phone .optrow .rbtn, body.phone .optrow .radio { width: 42px; height: 42px; }
body.phone .acts .btn { flex: 1 1 40%; }
body.phone .gap { display: none; }
body.phone .pfoot { display: none; }
body.phone .fld > label, body.phone .flabel { font-size: 11.5px; }
body.phone .detail .chead { padding: 10px; }
body.phone .detail .body { padding: 4px 10px 12px; }
body.phone #pbar { display: flex; gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--bg1); border-top: 1px solid var(--line); }
#pbar { display: none; }
body.phone #pbar:empty { display: none; }
#pbar .btn { min-height: 50px; font-size: 15px; font-weight: 600; flex: 1; min-width: 0; }
#pbar .btn span { overflow: hidden; text-overflow: ellipsis; }

@media (max-width: 1100px) { body:not(.phone) #panel { width: 430px; } body:not(.phone) #pv { right: 430px; } }
</style>
</head>
<body>
<header id="tb">
  <button class="tbtn phoneOnly" id="bBack" aria-label="Back" title="Back"><svg class="i" viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
  <div class="ptitlePh" style="display:none"><b id="phTitle"></b><span id="phSub"></span></div>
  <div class="brand desk"><svg class="i" viewBox="0 0 16 16" style="color:var(--accent)"><path d="M8 1.8l5.5 3v6.4L8 14.2 2.5 11.2V4.8z"/><path d="M2.5 4.8L8 7.8l5.5-3M8 7.8v6.4"/></svg><b>Tour Editor</b></div>
  <nav class="crumbs desk" id="crumbTop" aria-label="Where you are"></nav>
  <div class="spacer desk"></div>
  <button class="vpill" id="vpill" type="button"></button>
  <span id="landActs"></span>
  <button class="tbtn" id="bUndo" title="Undo the last edit (Ctrl+Z)"><svg class="i" viewBox="0 0 16 16"><path d="M5.5 3.5 2.5 6.5l3 3"/><path d="M2.5 6.5h7a4 4 0 0 1 0 8h-2"/></svg><span class="ulbl desk" id="undoLbl">Undo</span></button>
  <button class="tbtn pri desk" id="bPreview"><svg class="i" viewBox="0 0 16 16"><path d="M5 3.5v9l7-4.5z" fill="currentColor"/></svg>Preview</button>
</header>

<main id="vp">
  <svg id="map" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
  <aside class="dock" id="tree" aria-label="Tour">
    <div class="dhead"><span class="ttlh">Stations</span><span class="count" id="treeCount"></span></div>
    <div class="dbody" id="treeBody"></div>
  </aside>
  <aside class="dock" id="panel" aria-label="Story editor">
    <div class="dhead" id="phead"></div>
    <nav id="crumbRow" aria-label="Where you are"></nav>
    <div class="scroll" id="scroll"><div id="view"></div></div>
    <div class="pfoot" id="pfoot"></div>
  </aside>
  <div class="protoTag">Prototype: story editor, step cards, round 2</div>
</main>

<footer id="sb">
  <div>Draft kept on this device</div>
  <div class="grow" id="sbHint"></div>
  <div id="sbCount"></div>
</footer>
<div id="pbar"></div>

<div id="modalBack" hidden><div id="modal" role="dialog" aria-modal="true" aria-labelledby="mTtl"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></div>

<div id="pv" hidden>
  <div class="pvbar">
    <button class="btn sm ghost" id="pvClose" aria-label="Close the preview"><svg class="i" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></svg><span class="lbl">Close</span></button>
    <div class="where"><b id="pvWhere"></b><span id="pvWhat"></span></div>
    <button class="btn sm" id="pvBack" title="Back one step"><svg class="i" viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg><span class="lbl">Back</span></button>

  </div>
  <div class="trail" id="pvTrail"></div>
  <div class="phoneFrame"><div class="scene" id="scene"></div></div>
</div>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ------------------------------------------------------------------ icons
const IC = {
  grip: '<svg class="i" viewBox="0 0 16 16" style="stroke-width:2.2"><path d="M6 3.5h0M10 3.5h0M6 8h0M10 8h0M6 12.5h0M10 12.5h0"/></svg>',
  chev: '<svg class="i" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg>',

  left: '<svg class="i" viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg>',
  arrow: '<svg class="i" viewBox="0 0 16 16"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5"/></svg>',
  down: '<svg class="i" viewBox="0 0 16 16"><path d="M8 3v10M4.5 9.5 8 13l3.5-3.5"/></svg>',
  up: '<svg class="i" viewBox="0 0 16 16"><path d="M8 13V3M4.5 6.5 8 3l3.5 3.5"/></svg>',
  back: '<svg class="i" viewBox="0 0 16 16"><path d="M12.5 12V7.5a3 3 0 0 0-3-3H4"/><path d="M6.5 2 4 4.5 6.5 7"/></svg>',
  end: '<svg class="i" viewBox="0 0 16 16"><path d="M3 8h7"/><path d="M12.5 4v8"/></svg>',
  tap: '<svg class="i" viewBox="0 0 16 16"><path d="M6.5 9V3.5a1.2 1.2 0 0 1 2.4 0V8l3 .8a1.5 1.5 0 0 1 1.1 1.7L12.5 14H7l-2.6-3.2a1.1 1.1 0 0 1 1.7-1.4z"/></svg>',

function storyIssues(story) {
  const out = []; const ch = story.children;

  ch.forEach((s) => {
    if (s.kind === 'choice') {
      if (!s.prompt.trim()) out.push({ step: s.id, msg: 'The question is empty.' });
      const empty = s.options.filter((o) => !o.label.trim()).length;
      if (empty) out.push({ step: s.id, msg: empty === 1 ? 'One answer has no text.' : `${empty} answers have no text.` });
    } else if (s.kind === 'quiz') {
      if (!s.question.trim()) out.push({ step: s.id, msg: 'The question is empty.' });
      const empty = s.answer.options.filter((o) => !o.label.trim()).length;
      if (empty) out.push({ step: s.id, msg: empty === 1 ? 'One answer has no text.' : `${empty} answers have no text.` });
      if (!s.answer.options.some((o) => o.id === s.answer.correct)) out.push({ step: s.id, msg: 'No answer is marked as the right one.' });
    } else {
      const K = KINDS[s.kind];
      if (!s.text.trim() && REQUIRED_TEXT.includes(s.kind)) out.push({ step: s.id, msg: s.kind === 'character' ? `${s.name} has nothing to say yet: write the line.` : 'The text is empty.' });
      if (K.asset && !s.asset) out.push({ step: s.id, msg: `No ${K.asset} chosen yet.` });

  const trapped = trappedSteps(ch);
  const loop = loopSteps(ch, trapped);
  const trap = loop.length ? loop : trapped;
  if (trap.length) {
    const choices = trap.filter((i) => ch[i].kind === 'choice');
    const fixAt = choices.length ? ch[choices[choices.length - 1]] : null;
    const verb = trap.length === 1 ? 'leads only back to itself' : 'go round in a loop';
    out.push({ step: ch[trap[0]].id, steps: trap.map((i) => ch[i].id), trap: true, fixOn: fixAt ? fixAt.id : null,

  }

}

// ------------------------------------------------------------------ connector lines in the margin
const LANE_COLORS = ['var(--l0)', 'var(--l1)', 'var(--l2)', 'var(--l3)'];
function drawLinks() {
  const list = $('#list'); const svg = $('#links'); const c = ctx(); if (!list || !svg || !c) return;
  const ch = c.ch; const lr = list.getBoundingClientRect();
  svg.setAttribute('height', list.scrollHeight); svg.style.height = list.scrollHeight + 'px';
  const gx = parseFloat(getComputedStyle(list).paddingLeft);
  const links = [];
  ch.forEach((s, i) => {
    if (s.kind !== 'choice') return;
    s.options.forEach((o) => {
      const r = jumpOf(ch, i, o); if (!(r.type === 'jump' || r.type === 'back' || (r.type === 'next' && r.explicit))) return;
      const src = list.querySelector(`.ans[data-opt="${o.id}"]`); const dst = list.querySelector(`.card[data-id="${ch[r.j].id}"]`);
      if (!src || !dst) return;
      const a = src.getBoundingClientRect(); const d = dst.getBoundingClientRect();
      links.push({ ref: o.id, sy: a.top - lr.top + a.height / 2, ty: d.top - lr.top + 20, back: r.type === 'back' });
    });
  });
  links.sort((p, q) => Math.abs(p.ty - p.sy) - Math.abs(q.ty - q.sy));
  const lanes = [];
  links.forEach((l) => {
    const lo = Math.min(l.sy, l.ty), hi = Math.max(l.sy, l.ty);
    let k = 0; while (lanes[k] && lanes[k].some(([a, b]) => lo < b + 6 && hi > a - 6)) k++;
    (lanes[k] ||= []).push([lo, hi]); l.lane = k;
  });
  const step = Math.max(4, Math.min(7, (gx - 8) / Math.max(1, lanes.length)));
  let h = '<defs>' + LANE_COLORS.map((col, k) => `<marker id="ah${k}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="${col}"/></marker>`).join('') + '</defs>';
  links.forEach((l, idx) => {
    const x = gx - 8 - l.lane * step; const col = LANE_COLORS[idx % 4]; const r = 5;
    const dir = l.ty > l.sy ? 1 : -1; const right = gx + 6;
    const d = `M ${right} ${l.sy} H ${x + r} Q ${x} ${l.sy} ${x} ${l.sy + dir * r} V ${l.ty - dir * r} Q ${x} ${l.ty} ${x + r} ${l.ty} H ${gx - 1}`;
    h += `<path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" ${l.back ? 'stroke-dasharray="4 3"' : ''} marker-end="url(#ah${idx % 4})" opacity=".9"/>`;
    const chip = list.querySelector(`[data-jump="${l.ref}"]`); if (chip) chip.style.color = col;
  });
  svg.innerHTML = h;
}

    e.preventDefault(); const id = g.closest('.card').dataset.id; const i = idxIn(ctx().ch, id);
    moveStep(i, i + (e.key === 'ArrowUp' ? -1 : 1));
    requestAnimationFrame(() => { const ng = $(`.card[data-id="${id}"] [data-grip]`); if (ng) ng.focus(); });
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('chead') && e.target.dataset.act === 'toggle') { e.preventDefault(); toggleCard(e.target.closest('.card').dataset.id); }
});
view.addEventListener('input', (e) => {
  const f = e.target.dataset.f; const card = e.target.closest('.card'); if (!card) return;
  if (f === 'text') { const c = card.querySelector('[data-live="cnt"]'); if (c) c.textContent = `${e.target.value.length} / ${e.target.maxLength}`; const l = card.querySelector('[data-live="text"]'); if (l) { l.textContent = e.target.value.trim() ? `"${firstWords(e.target.value)}"` : 'No text yet'; l.classList.toggle('empty', !e.target.value.trim()); } }
  if (f === 'name' || f === 'prompt' || f === 'question') { const l = card.querySelector('[data-live="ttl"]'); if (l) l.textContent = e.target.value; }
});
view.addEventListener('change', (e) => {
  const f = e.target.dataset.f; if (!f) return;
  const c = ctx(); if (!c) return; const v = e.target.value;
  if (f === 'storyTitle') { commit('Rename the story', () => { c.story.title = v.trim(); }); return; }
  const card = e.target.closest('.card'); const id = card.dataset.id; const i = idxIn(c.ch, id); const s = c.ch[i];
  const oid = e.target.closest('[data-opt]')?.dataset.opt;
  const opts = s.kind === 'choice' ? s.options : s.kind === 'quiz' ? s.answer.options : [];
  const o = oid ? opts.find((x) => x.id === oid) : null;
  switch (f) {
    case 'name': commit(`Rename "${s.name}"`, () => { s.name = v.trim() || s.name; }); break;
    case 'text': commit(`Edit the ${KINDS[s.kind].textLabel.toLowerCase()} of "${s.name}"`, () => { s.text = v; }); break;
    case 'adv': commit(`Change how step ${i + 1} moves on`, () => { s.advance = v === 'auto' ? { mode: 'auto', afterS: 8 } : { mode: v }; }); break;
    case 'advS': commit(`Change the seconds of step ${i + 1}`, () => { s.advance = { mode: 'auto', afterS: clamp(Math.round(+v) || 1, 1, 600) }; }); break;
    case 'prompt': commit(`Edit the question of step ${i + 1}`, () => { s.prompt = v; }); break;
    case 'question': commit(`Edit the quiz question of step ${i + 1}`, () => { s.question = v; }); break;
    case 'optLabel': commit(`Edit an answer of step ${i + 1}`, () => { o.label = v; }); break;
    case 'optGoto': commit(`Change where "${o.label || 'an answer'}" leads`, () => { delete o.goto; delete o.end; if (v === '__end') o.end = true; else if (v) o.goto = v; }); break;
    case 'correct': commit(`Mark the right answer of step ${i + 1}`, () => { s.answer.correct = oid; }); break;
    case 'points': commit(`Change the points of step ${i + 1}`, () => { s.points = clamp(Math.round(+v) || 0, 0, 1000); }); break;
  }
});

// drag to reorder (mouse, pen and touch), by the grip only
let drag = null;
view.addEventListener('pointerdown', (e) => {
  const g = e.target.closest('[data-grip]'); if (!g || e.button > 0) return;
  e.preventDefault();
  const card = g.closest('.card');
  drag = { id: card.dataset.id, from: idxIn(ctx().ch, card.dataset.id), y0: e.clientY, card, moved: false, to: null, pid: e.pointerId };
  g.setPointerCapture(e.pointerId);
});
view.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.pid) return;
  const list = $('#list'); const ch = ctx().ch;
  const dy = e.clientY - drag.y0;
  if (!drag.moved && Math.abs(dy) < 5) return;
  if (!drag.moved) { drag.moved = true; drag.card.classList.add('dragging'); }
  drag.card.style.transform = `translateY(${dy}px)`;
  const sc = $('#scroll'); const sr = sc.getBoundingClientRect();
  if (e.clientY < sr.top + 40) sc.scrollTop -= 10; else if (e.clientY > sr.bottom - 40) sc.scrollTop += 10;
  const others = [...list.querySelectorAll('.card')].filter((c) => c !== drag.card);
  if (!others.length) return;
  let to = others.length;
  for (let k = 0; k < others.length; k++) { const r = others[k].getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { to = k; break; } }
  drag.to = to;
  const lr = list.getBoundingClientRect();
  const y = to < others.length ? others[to].getBoundingClientRect().top - lr.top - 5 : others[others.length - 1].getBoundingClientRect().bottom - lr.top + 3;
  let dl = $('#dropLine'); if (!dl) { dl = document.createElement('div'); dl.id = 'dropLine'; list.appendChild(dl); }
  dl.style.top = y + 'px';
  // would this order trap the visitor in a loop? say so before the drop
  const order = ch.filter((s) => s.id !== drag.id); order.splice(to, 0, ch[drag.from]);
  const worse = trappedSteps(order).length > trappedSteps(ch).length;
  dl.className = worse ? 'warn' : '';
  dl.innerHTML = worse ? '<span>Dropping here makes a loop no answer can leave</span>' : '';
});
function endDrag(e) {
  if (!drag || (e && e.pointerId !== drag.pid)) return;
  const d = drag; drag = null;
  $('#dropLine')?.remove();
  d.card.style.transform = ''; d.card.classList.remove('dragging');
  if (d.moved && d.to !== null && d.to !== d.from) { moveStep(d.from, d.to); if (!isPhone) scrollToCard(d.id); }
}
view.addEventListener('pointerup', endDrag);
view.addEventListener('pointercancel', endDrag);

$('#bUndo').onclick = undo;
$('#vpill').onclick = openIssues;
$('#bPreview').onclick = () => pvOpen(0);
document.addEventListener('keydown', (e) => {
  const inField = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '');
  if (e.key === 'Escape') {
    if (!$('#modalBack').hidden) closeModal(); else if (PV.on) pvClose(); else if (isPhone && !inField && NAV.level !== 'tour') goUp();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !inField && $('#modalBack').hidden) { e.preventDefault(); undo(); }
});

// ------------------------------------------------------------------ preview: the visitor's view
const PV = { on: false, path: [], ended: false, quiz: null, raf: 0, t0: 0, dur: 0, read: 0, from: 0, points: 0, fresh: false };
const pvCh = () => ctx()?.ch || [];
function pvOpen(from) {
  if (!pvCh().length) { toast('Add a step first: there is no story to play.'); return; }
  PV.on = true; $('#pv').hidden = false; pvStart(from);
}
function pvClose() { PV.on = false; pvStop(); $('#pv').hidden = true; document.querySelectorAll('.card.playing').forEach((c) => c.classList.remove('playing')); }
function pvStop() { cancelAnimationFrame(PV.raf); }
function pvStart(from) { PV.from = from; PV.path = []; PV.ended = false; PV.points = 0; pvEnter(from); }
function pvEnter(i) {
  pvStop(); PV.quiz = null; PV.fresh = true;
  const n = pvCh().length;
  if (i >= n || i < 0 || PV.path.length > 300) { PV.ended = true; pvRender(); return; }
  PV.ended = false; PV.path.push(i);
  pvRender(); pvTimers();
}
const pvCur = () => PV.path[PV.path.length - 1];
function pvChoose(o) { const ch = pvCh(); const r = jumpOf(ch, pvCur(), o); pvEnter(r.type === 'end' || r.type === 'missing' ? ch.length : r.j); }
function pvNext() { if (PV.ended) return; const ch = pvCh(); const s = ch[pvCur()]; if (s.kind === 'quiz' ? PV.quiz : s.kind !== 'choice') pvEnter(pvCur() + 1); }
function pvTimers() {
  const ch = pvCh(); const i = pvCur(); const s = ch[i]; if (s.kind === 'choice' || s.kind === 'quiz') return;
  const read = Math.max(2, words(s.text) * 0.32);
  const media = s.kind === 'video' || s.kind === 'audio' ? s.durS || 20 : read;
  const auto = s.advance.mode === 'auto' ? s.advance.afterS : s.advance.mode === 'lineEnd' ? media + 0.6 : 0;
  PV.t0 = performance.now(); PV.dur = auto; PV.read = media;
  const tick = () => {
    const t = (performance.now() - PV.t0) / 1000;
    document.querySelectorAll('#scene .bubble .w, #scene .cap .w').forEach((w, k, all) => w.classList.toggle('on', k < Math.ceil((t / PV.read) * all.length)));
    const bar = $('#scene .hint .bar i'); if (bar && PV.dur) bar.style.width = clamp((t / PV.dur) * 100, 0, 100) + '%';
    const vb = $('#scene .vid .track i'); if (vb) vb.style.width = clamp((t / media) * 100, 0, 100) + '%';
    const vt = $('#scene .vid .tm'); if (vt) vt.textContent = `0:${String(Math.min(Math.floor(t), media)).padStart(2, '0')} / 0:${String(media).padStart(2, '0')}`;
    if (auto && t >= auto) { pvEnter(i + 1); return; }
    PV.raf = requestAnimationFrame(tick);
  };
  PV.raf = requestAnimationFrame(tick);
}
const wordSpans = (t) => t.trim().split(/\s+/).map((w) => `<span class="w">${esc(w)}</span>`).join(' ');
function worldObj(b, fresh, slot) {
  const f = fresh ? ' fresh' : '';
  if (b.kind === 'model') return b.art === 'stone' ? `<div class="wobj w-stone${f}">${STONE_SVG}</div>` : b.art === 'cat' ? `<div class="wobj w-stone${f}"><svg viewBox="0 0 64 44" aria-hidden="true">${CAT}</svg></div>` : `<div class="wobj w-wheel${f}">${WHEEL_SVG}</div>`;
  if (b.kind === 'picture') return `<div class="wobj w-framed${f}"><div class="frameArt" ${b.view === 'plane' ? 'style="background:none;box-shadow:none;padding:0"' : ''}>${PIC_SVG}</div>${b.view === 'framed' ? '<div class="legs"></div>' : ''}<div class="wtag">${esc(b.name)}</div></div>`;
  if (b.kind === 'shortText') return `<div class="wobj ${slot ? 'w-pin2' : 'w-pin'}${f}"><div class="signArt" title="${esc(b.text)}">${esc(b.name)}</div></div>`;
  if (b.kind === 'longText') return `<div class="wobj w-reading${f}"><div class="signArt" style="text-transform:none;font-weight:400">${esc(b.name)}</div></div>`;
  if (b.kind === 'video') return `<div class="wobj w-other${f}"><div class="vid" style="border:4px solid #222"><span class="t">${esc(b.name)}</span></div></div>`;
  return `<div class="wobj w-other${f}"><div class="signArt">${esc(b.name)}</div></div>`;
}
function cardContent(b) {
  if (b.kind === 'picture') return `<div class="art">${PIC_SVG}</div><p>${esc(b.text)}</p>`;
  if (b.kind === 'video') return `<div class="vid"><span class="t">${esc(b.name)}</span><div class="ctrl"><span>${IC.play}</span><span class="track"><i></i></span><span class="tm">0:00</span></div></div><p style="font-size:12px;opacity:.8">Captions: ${esc(firstWords(b.text, 10))}</p>`;
  if (b.kind === 'model') return `<div class="art" style="background:#2a3040;padding:10px"><div style="width:44%;margin:0 auto">${b.art === 'cat' ? `<svg viewBox="0 0 64 44">${CAT}</svg>` : WHEEL_SVG}</div></div><p>${esc(b.text)}</p>`;
  if (b.kind === 'audio') return `<div class="art" style="background:#2a3040;padding:10px">${glyph('audio', 0, 0, 48, 30).replace('<svg', '<svg width="100%" height="60"')}</div><p>${esc(b.text)}</p>`;
  if (b.kind === 'character') return `<p class="cap" style="font-size:14px">${wordSpans(b.text)}</p>`;
  return `<p>${esc(b.text)}</p>`;
}
function pvRender() {
  const c = ctx(); if (!c) { pvClose(); return; }
  const ch = c.ch; const n = ch.length;
  if (!PV.ended && (!PV.path.length || pvCur() >= n)) PV.ended = true;
  const sc = $('#scene'); const r = sc.getBoundingClientRect(); sc.classList.toggle('wide', r.width > r.height);
  const cur = PV.ended ? -1 : pvCur();
  const s = cur >= 0 ? ch[cur] : null;
  const isBlock = (x) => x && x.kind !== 'choice' && x.kind !== 'quiz';
  // what stands in the world: the station's free items, plus every world block of the story reached so far
  const reached = new Set(PV.path.map((k) => ch[k]).filter(isBlock).map((x) => x.id));
  for (let k = 0; k < PV.from; k++) if (isBlock(ch[k])) reached.add(ch[k].id);
  let world = ''; let pins = 0;
  c.station.children.forEach((b) => { if (!isStory(b) && VIEWS[b.view].world) world += worldObj(b, false, b.kind === 'shortText' ? pins++ : 0); });
  ch.forEach((b) => { if (isBlock(b) && b.kind !== 'character' && VIEWS[b.view].world && reached.has(b.id)) world += worldObj(b, s && s.id === b.id && PV.fresh, b.kind === 'shortText' ? pins++ : 0); });
  const figure = PV.ended ? null : [...PV.path].reverse().map((k) => ch[k]).find((x) => x.kind === 'character');
  if (figure) world += `<div class="wobj w-figure${s && s.id === figure.id && PV.fresh ? ' fresh' : ''}">${ADA_SVG()}</div>`;
  let ov = `<div class="hudTop">${esc(c.station.name)}</div>`; let hint = '';
  if (PV.ended) {
    const others = c.station.children.filter((x) => isStory(x) && x.id !== c.story.id && x.children.length).length;
    ov += `<div class="endcard"><h4>End of the story</h4><p>${others ? `The visitor goes back to this station's stories: ${others} more to choose from.` : 'The visitor walks on to the next station.'}${PV.points ? ` Points: ${PV.points}.` : ''}</p><button class="go" data-pv="restart">PLAY AGAIN</button></div>`;
  } else if (s.kind === 'choice') {
    ov += `<div class="ask"><div class="q">${esc(s.prompt || '(no question yet)')}</div>${s.options.map((o) => `<button class="a" data-pv="choose" data-o="${o.id}">${esc(o.label || '(empty answer)')}</button>`).join('')}</div>`;
  } else if (s.kind === 'quiz') {
    const q = PV.quiz; const a = s.answer; const right = a.options.find((o) => o.id === a.correct);
    ov += `<div class="ask"><div class="kicker">Quiz, ${s.points} points</div><div class="q">${esc(s.question || '(no question yet)')}</div>${a.options.map((o) => { const cls = q ? (o.id === a.correct ? 'right' : o.id === q ? 'wrong' : '') : ''; return `<button class="a ${cls}" data-pv="answer" data-o="${o.id}" ${q ? 'disabled' : ''}>${esc(o.label || '(empty answer)')}</button>`; }).join('')}${q ? `<div class="fb">${q === a.correct ? `Right!<span class="pts">+${s.points}</span>` : `Not quite.${right ? ` The right answer: ${esc(right.label)}.` : ''}`}</div><button class="go" data-pv="next">Continue</button>` : ''}</div>`;
  } else {
    if (s.kind === 'character' && s.view === 'bubble') ov += `<div class="bubble"><span class="who">${esc(s.name)}</span>${wordSpans(s.text || '...')}</div>`;
    else if (s.kind === 'character' && s.view === 'portrait') ov += `<div class="portrait"><div class="face">${ADA_SVG()}</div><div class="cap"><b style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--hudAccent)">${esc(s.name)}</b><br>${wordSpans(s.text || '...')}</div></div>`;
    else if (s.view === 'card' || s.view === 'portrait') ov += `<div class="pcard"><h4>${esc(s.name)}</h4>${cardContent(s)}</div>`;
    const a = s.advance;
    if (a.mode === 'tap') hint = '<div class="hint">Tap to continue</div>';
    else if (a.mode === 'auto') hint = `<div class="hint">Moves on in ${a.afterS} s<span class="bar"><i></i></span></div>`;
    else hint = `<div class="hint">${esc((KINDS[s.kind].lineEnd || 'Moves on by itself').replace('When', 'Moves on when'))}<span class="bar"><i></i></span></div>`;
  }
  sc.innerHTML = `<div class="hills"></div><div class="ground"></div><div class="path"></div><svg class="millArt" viewBox="0 0 220 170" aria-hidden="true">${MILL}</svg>${world}<div class="ovl">${ov}</div>${hint}`;
  PV.fresh = false;
  $('#pvWhere').textContent = PV.ended ? 'The story has ended' : `Step ${cur + 1} of ${n}: ${stepTitle(s)}`;
  $('#pvWhat').textContent = PV.ended ? 'Play again, or go back one step.' : s.kind === 'choice' || s.kind === 'quiz' ? 'Pick an answer as the visitor would.' : 'Exactly what the visitor sees. Tap the view to move on.';
  $('#pvTrail').innerHTML = '<span>Path taken:</span>' + PV.path.map((k, x) => `<span class="t ${x === PV.path.length - 1 && !PV.ended ? 'cur' : ''}">${k + 1}</span>`).join('<span>&rsaquo;</span>') + (PV.ended ? '<span>&rsaquo;</span><span class="t">end</span>' : '');
  $('#pvSkip').disabled = PV.ended || (s && s.kind === 'choice') || (s && s.kind === 'quiz' && !PV.quiz);
  $('#pvBack').disabled = PV.path.length < (PV.ended ? 1 : 2);
  document.querySelectorAll('.card').forEach((el) => el.classList.toggle('playing', !!s && el.dataset.id === s.id));
  if (s && !isPhone) { const el = $(`.card[data-id="${s.id}"]`); if (el) { const scr = $('#scroll'); const cr = el.getBoundingClientRect(); const sr = scr.getBoundingClientRect(); if (cr.top < sr.top || cr.bottom > sr.bottom) scr.scrollTop += cr.top - sr.top - 60; } }
}
$('#scene').addEventListener('click', (e) => {
  const b = e.target.closest('[data-pv]'); const ch = pvCh(); const s = ch[pvCur()];
  if (b) {
    const k = b.dataset.pv;
    if (k === 'restart') { pvStart(0); return; }
    if (k === 'choose') { pvChoose(s.options.find((o) => o.id === b.dataset.o)); return; }
    if (k === 'answer') { PV.quiz = b.dataset.o; if (PV.quiz === s.answer.correct) PV.points += s.points; pvRender(); return; }
    if (k === 'next') { pvEnter(pvCur() + 1); return; }
  }
  if (!PV.ended && s && s.kind !== 'choice' && s.kind !== 'quiz') pvNext();
});
$('#pvClose').onclick = pvClose;
$('#pvRestart').onclick = () => pvStart(0);
$('#pvSkip').onclick = () => { const s = pvCh()[pvCur()]; if (s && s.kind === 'quiz') pvEnter(pvCur() + 1); else pvNext(); };
$('#pvBack').onclick = () => { if (!PV.ended) PV.path.pop(); const p = PV.path.pop(); pvEnter(p === undefined ? 0 : p); };

// ------------------------------------------------------------------ layout
function layout() {
  const w = innerWidth, h = innerHeight;
  const phone = w <= 760 || h <= 500;
  const changed = phone !== isPhone || document.body.classList.contains('land') !== (phone && w > h);
  isPhone = phone;
  document.body.classList.toggle('phone', phone);
  document.body.classList.toggle('land', phone && w > h);
  if (changed) render(); else requestAnimationFrame(drawLinks);
  if (PV.on) pvRender();
}
addEventListener('resize', layout);
new ResizeObserver(() => requestAnimationFrame(drawLinks)).observe($('#view'));
// for screenshots and hand checks: #station=st2&story=tale&step=c3&open=c2,c5&preview=0&level=tour
(() => {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('station')) { NAV.station = p.get('station'); NAV.level = 'station'; }
  if (p.get('story')) { NAV.story = p.get('story'); NAV.level = 'story'; }
  if (p.get('level')) NAV.level = p.get('level');
  if (p.get('open')) p.get('open').split(',').forEach((id) => openSet.add(id));
  if (p.get('step')) { NAV.step = p.get('step'); NAV.level = 'step'; }
})();
isPhone = innerWidth <= 760 || innerHeight <= 500;
layout();
render();
if (new URLSearchParams(location.hash.slice(1)).has('preview')) pvOpen(+new URLSearchParams(location.hash.slice(1)).get('preview') || 0);
</script>
</body>
