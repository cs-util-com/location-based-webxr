<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Audio blocks - station block prototype</title>
<script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
  } }
</script>
<style>
:root{
  --plate:rgba(15,17,23,.86); --plate2:rgba(20,22,29,.94); --ink:#f4f0e8; --muted:#aea89b; --faint:#77726a;
  --amber:#f3b35a; --teal:#5ccfbe; --line:rgba(255,255,255,.10); --hot:#f4f0e8;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Noto Serif",serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#191b20;color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
#app{position:fixed;inset:0;display:grid;grid-template-columns:0 minmax(0,1fr) 0;grid-template-rows:minmax(0,1fr)}
#app.editor{grid-template-columns:232px minmax(0,1fr) 336px}
#left,#right{display:none;background:#14161b;overflow:auto;min-height:0}
#app.editor #left,#app.editor #right{display:block}
#left{grid-column:1;border-right:1px solid var(--line)}
#right{grid-column:3;border-left:1px solid var(--line)}
#mid{grid-column:2;position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
#stage{position:relative;overflow:hidden;width:100%;height:100%;background:#dfe5ea;touch-action:none}
#app.phone #stage{width:auto;height:calc(100% - 28px);aspect-ratio:9/19.5;border-radius:34px;box-shadow:0 0 0 9px #0b0c0f,0 0 0 10px #2b2e35,0 30px 60px rgba(0,0,0,.5)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;z-index:4}
/* top bar */
#top{left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 10px 0;display:flex;gap:6px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
.seg{display:flex;background:var(--plate);border-radius:999px;padding:3px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.seg button{all:unset;cursor:pointer;font:600 12px/1 var(--sans);padding:7px 10px;border-radius:999px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--hot);color:#14161b}
.sp{flex:1}
.ib{all:unset;cursor:pointer;width:32px;height:32px;border-radius:50%;background:var(--plate);display:grid;place-items:center;color:var(--ink);flex:none;backdrop-filter:blur(8px)}
.ib.on{background:var(--hot);color:#14161b}
.ib svg{width:17px;height:17px}
#views{left:0;right:0;top:calc(env(safe-area-inset-top) + 50px);display:flex;justify-content:center;gap:6px;padding:0 10px;pointer-events:none}
#views>*{pointer-events:auto}
#views .seg button{padding:6px 10px;font-size:11.5px}
#views .seg button i{font-style:normal;color:var(--amber);margin-left:3px;font-size:10px}
#views .seg button.on i{color:#9a6a1c}
#ft{right:8px;bottom:calc(env(safe-area-inset-bottom) + 5px);font:500 9.5px/1.2 var(--mono);color:#e9e6df;background:rgba(15,17,23,.6);padding:3px 7px;border-radius:6px;pointer-events:none;white-space:nowrap}
/* nearest station */
#nearest{left:50%;top:calc(env(safe-area-inset-top) + 92px);transform:translateX(-50%);background:var(--plate);border-radius:999px;padding:7px 14px 7px 8px;display:none;align-items:center;gap:9px;font:500 13px/1.2 var(--sans);white-space:nowrap}
#nearest .arr{width:26px;height:26px;border-radius:50%;background:#2a2d35;display:grid;place-items:center}
#nearest b{font-weight:650}
#nearest small{display:block;color:var(--muted);font-size:11px}
/* card + strip */
.panel{background:var(--plate);border-radius:20px;box-shadow:0 12px 34px rgba(0,0,0,.28);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#card{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 28px);max-width:460px;margin:0 auto;padding:14px 16px 12px;display:none}
.krow{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.n{background:var(--amber);box-shadow:0 0 0 3px rgba(243,179,90,.18)}
.dot.s{background:var(--teal);box-shadow:0 0 0 3px rgba(92,207,190,.18)}
.kicker{font:700 10.5px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--amber)}
.state{margin-left:auto;font:500 11.5px/1 var(--sans);color:var(--muted);white-space:nowrap}
.state.live{color:var(--ink)}
.ctitle{font:600 21px/1.2 var(--serif);margin:7px 0 10px;letter-spacing:.005em}
.scrub{display:flex;align-items:center;gap:10px}
.round{all:unset;cursor:pointer;width:42px;height:42px;border-radius:50%;background:var(--hot);color:#14161b;display:grid;place-items:center;flex:none}
.round svg{width:18px;height:18px}
.scrub canvas{flex:1;height:30px;min-width:0}
.time{font:500 11.5px/1 var(--mono);color:var(--muted);white-space:nowrap}
.read{font:400 17px/1.45 var(--serif);margin:11px 0 2px;min-height:2.9em}
.read .cur{color:var(--ink)}
.read .nx{color:var(--faint)}
.amb{display:flex;align-items:center;gap:8px;font:500 12.5px/1.2 var(--sans);color:var(--ink);padding-top:10px;margin-top:10px;border-top:1px solid var(--line)}
.amb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amb .k{color:var(--teal);font:700 9.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.meter{width:54px;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;flex:none;margin-left:auto}
.meter i{display:block;height:100%;background:var(--teal);border-radius:3px;width:0}
.tag{font:600 10.5px/1 var(--sans);color:#1b1d22;background:var(--amber);border-radius:999px;padding:4px 7px;white-space:nowrap;display:none;align-items:center;gap:3px}
.tag.show{display:inline-flex}
#strip{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 28px);max-width:520px;margin:0 auto;padding:12px 16px;display:none}
#strip .cap{font:400 18px/1.42 var(--serif);text-align:center;color:var(--ink)}
#strip .cap .who{display:block;font:700 9.5px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
#strip .amb:first-child{border-top:0;margin-top:0;padding-top:0}
#strip .cap:empty{display:none}
#strip .cap:empty + .amb{border-top:0;margin-top:0;padding-top:0}
/* edge pointers */
.edge{position:absolute;z-index:3;transform:translate(-50%,-50%);display:none;align-items:center;gap:7px;background:var(--plate);border-radius:999px;padding:5px 11px 5px 5px;font:600 12px/1.15 var(--sans);white-space:nowrap;pointer-events:none}
.edge .ar{width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.edge small{display:block;font-weight:500;color:var(--muted);font-size:10.5px}
#hz{left:10px;right:10px;top:calc(env(safe-area-inset-top) + 88px);height:84px;display:none;pointer-events:none}
#hz canvas{width:100%;height:100%;display:block}
/* creator */
#reticle{left:50%;top:40%;width:44px;height:44px;margin:-22px 0 0 -22px;display:none;pointer-events:none}
#creator{left:0;right:0;bottom:0;max-width:580px;margin:0 auto;display:none;flex-direction:column;gap:8px;padding:0 10px calc(env(safe-area-inset-bottom) + 26px)}
.sheet{background:var(--plate2);border-radius:22px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;box-shadow:0 12px 34px rgba(0,0,0,.3)}
.sheet .row{display:flex;align-items:center;gap:10px;font:500 12.5px/1.2 var(--sans)}
.sheet .row>label{color:var(--muted);width:88px;flex:none;font-size:11.5px}
.sheet input[type=range]{flex:1;accent-color:var(--amber);min-width:0}
.sheet .val{font:500 11.5px var(--mono);color:var(--ink);width:44px;text-align:right}
.sheet .seg{background:rgba(255,255,255,.07);overflow-x:auto;scrollbar-width:none;min-width:0;flex:0 1 auto}
.sheet .seg button{font-size:11.5px;padding:6px 9px}
.txt{all:unset;flex:1;min-width:0;background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px;font:500 13px var(--sans);color:var(--ink)}
.ok{color:var(--teal);font-size:12px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big{all:unset;cursor:pointer;height:60px;border-radius:18px;background:var(--plate);display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 12.5px var(--sans);gap:5px;color:var(--ink);backdrop-filter:blur(8px)}
.big svg{width:20px;height:20px}
.big.primary{background:var(--hot);color:#121318}
.blocks{display:flex;gap:6px;min-width:0}
.sheet>*{min-width:0}
.bchip{all:unset;cursor:pointer;flex:1;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.06);font:600 12.5px/1.15 var(--sans);min-width:0}
.bchip small{display:block;font-weight:500;color:var(--muted);font-size:10.5px}
.bchip.on{background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.bchip span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* editor */
.ph{padding:14px 14px 8px;font:700 10.5px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.item{display:flex;gap:10px;align-items:center;padding:9px 14px;cursor:pointer;font:500 13px/1.25 var(--sans);border-left:3px solid transparent}
.item small{display:block;color:var(--muted);font-size:11px}
.item.on{background:rgba(255,255,255,.06);border-left-color:var(--hot)}
.item.off{opacity:.45;cursor:default}
.ins{padding:4px 14px 20px;display:grid;gap:12px}
.f{display:grid;gap:5px}
.f>label{font:600 10.5px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.f>label em{font-style:normal;letter-spacing:0;text-transform:none;font-weight:500;color:var(--faint)}
.f input[type=text],.f input[type=number],.f select,.f textarea{all:unset;box-sizing:border-box;width:100%;background:#1f2229;border:1px solid #2c3039;border-radius:8px;padding:7px 9px;font:500 12.5px/1.35 var(--sans);color:var(--ink)}
.f textarea{min-height:110px;white-space:pre-wrap;font-family:var(--serif);font-size:13px}
.f select{background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.f input[type=range]{width:100%;accent-color:var(--amber)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f .seg{background:#1f2229;border-radius:9px}
.f .seg button{border-radius:7px;flex:1;text-align:center}
.asset{display:grid;gap:6px;background:#1f2229;border:1px solid #2c3039;border-radius:10px;padding:8px}
.asset .meta{display:flex;justify-content:space-between;font:500 11px var(--mono);color:var(--muted)}
.asset canvas,.curve{width:100%;height:44px;display:block}
.curve{height:78px;background:#1f2229;border:1px solid #2c3039;border-radius:10px}
.warn{font:500 11.5px var(--sans);color:var(--amber)}
.chk{display:flex;gap:8px;align-items:center;font:500 12.5px var(--sans)}
.chk input{accent-color:var(--teal);width:16px;height:16px;flex:none}
.f>label.chk{text-transform:none;letter-spacing:0;font:500 12.5px/1.35 var(--sans);color:var(--ink);justify-content:flex-start}
#edHint{left:12px;bottom:12px;background:var(--plate);border-radius:12px;padding:8px 11px;font:500 11.5px/1.35 var(--sans);color:var(--muted);display:none;max-width:320px}
#edHint b{color:var(--ink)}
/* overlays */
.over{position:absolute;inset:0;z-index:20;display:none;background:rgba(10,11,14,.55);backdrop-filter:blur(3px);padding:calc(env(safe-area-inset-top) + 54px) 12px 12px}
.over.show{display:block}
.over .box{background:#15171c;border:1px solid var(--line);border-radius:18px;max-width:640px;margin:0 auto;max-height:100%;overflow:auto;padding:16px 18px}
.over h2{font:650 15px/1.2 var(--sans);margin:0 0 4px}
.over p.sub{margin:0 0 12px;color:var(--muted);font:500 12px/1.4 var(--sans)}
.fl{display:grid;grid-template-columns:132px 1fr;gap:6px 12px;font:500 12.5px/1.4 var(--sans)}
.fl code{font:500 11.5px/1.4 var(--mono);color:var(--amber)}
.fl span{color:#d9d4ca}
.md{font:400 13.5px/1.55 var(--sans);color:#ddd8ce}
.md h1{font:650 18px/1.25 var(--sans);margin:4px 0 10px;color:var(--ink)}
.md h2{font:650 15px/1.3 var(--sans);margin:18px 0 6px;color:var(--ink)}
.md h3{font:650 13.5px/1.3 var(--sans);margin:14px 0 4px;color:var(--amber)}
.md ul{margin:4px 0 8px;padding-left:18px}
.md li{margin:2px 0}
.md code{font:500 12px var(--mono);color:var(--amber)}
.md p{margin:6px 0}
.xb{all:unset;cursor:pointer;float:right;font:600 12px var(--sans);color:var(--muted);padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.06)}
@media (max-height:520px){
  #views{top:10px;left:auto;right:150px;justify-content:flex-end}
  #nearest,#hz{top:52px}
  #card,#strip{left:12px;right:auto;width:340px;margin:0;bottom:12px}
  .read .nx{display:none}
  .sheet .row>label{width:74px}
  #card{padding:10px 14px 9px}
  .ctitle{font-size:18px;margin:5px 0 7px}
  .read{font-size:15.5px;margin-top:7px;min-height:0}
  #strip .cap{font-size:16px}
  #creator{left:auto;right:0;top:0;width:360px;padding:52px 10px 10px;justify-content:flex-end}
  .sheet{gap:7px;padding:10px 12px}
  .big{height:48px}
}
@media (max-width:860px){
  #app.editor{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,44vh) minmax(0,1fr)}
  #app.editor #left{grid-column:1;grid-row:1;border:0;border-bottom:1px solid var(--line)}
  #app.editor #mid{grid-column:1;grid-row:2}
  #app.editor #right{grid-column:1;grid-row:3;border:0}
  #app.editor #left .ph{display:none}
  #app.editor #left .list{display:flex;overflow-x:auto}
  #app.editor #left .item{border-left:0;border-bottom:3px solid transparent;flex:none;padding:8px 12px}
  #app.editor #left .item.on{border-bottom-color:var(--hot)}
  #app.editor #edHint{display:none!important}
}
@media (max-width:860px) and (max-height:520px){
  #app.editor{grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr)}
  #app.editor #left{grid-column:1/3;grid-row:1}
  #app.editor #mid{grid-column:1;grid-row:2}
  #app.editor #right{grid-column:2;grid-row:2;border-left:1px solid var(--line)}
}
</style>

<script type="text/markdown" id="notesMd">
# Audio alone - designer notes

Family `station-blocks-8-audio`. One model, five views: three required (Spot, Zone, Beacon) and two of my own (Drift, Horizon). Every view draws the same data: the station's two audio blocks, both records of the one audio model.

## 1. The model as built

- The example is a PAIR of records, because the assignment needs one of each `mode` and ducking needs both at once: "The fire of 1890" (narration, 36 s tone pattern, play `resume`, source in front of the guild house door, full volume within 4 m, heard to 16 m, linear rolloff) and "Market day, 1880s" (soundscape, 16 s seamless loop, play `loop`, source over the west half where the market hall stood, 5 m / 15 m, inverse rolloff, `duck` true, volume 0.7). Every view draws both; the view picker switches both at once (the exported file stores `view` per block).
- Fields exactly as given: `audio`, `mode`, `play`, `fadeInMs`, `fadeOutMs`, `volume`, `source` (`position`, `minM`, `maxM`, `rolloff`), `duck`, `transcript`, `caption`.
- Semantics I had to decide, because the field names do not say them:
  - A block starts when the visitor is inside the station circle AND inside `maxM` (or anywhere in the circle without a `source`). Tapping play on the card starts it from anywhere in the circle at full level.
  - `play`: `once` plays to the end once, and leaving midway restarts it next time; `resume` continues where the visitor left; `loop` repeats while audible.
  - Loudness is 1 inside `minM`, 0 at `maxM`, and between them follows `rolloff` ("linear", "inverse", "exponential"), normalised so it reaches exactly 0 at `maxM`. The Web Audio panner is used for direction only (rolloff factor 0); the gain is computed once in the page and drives both the sound and every visual, so what a muted visitor sees is what a hearing one hears.

## 2. Per view

### Spot (required) - a listening post and a player card
- What: a slim post with a speaker badge and a label (caption, state, time) over a bright circle on the ground where the sound is at full volume, a dashed earshot ring at `maxM`, and a player card on the screen: caption, play/pause, a waveform scrub bar, the current sentence in ink and the next in grey, and a one-line ambience row with its level and a "lowered" tag while ducked.
- Fields: all of them; `source.rolloff` is heard, not drawn.
- Why a visitor likes it: it is the familiar audio-guide stop. It says where to stand, and the card works fully with sound off (it reads along).
- Weakest: the card takes a third of a portrait screen; in a crowded square a post on a spot people stand on is crowded too. 1 m of error is harmless: the circle is 8 m wide.

### Zone (required) - a soundscape you walk into
- What: the ground glows where the sound is heard, and the gradient IS the loudness curve (computed from `minM`, `maxM`, `rolloff` in the shader), with slow ripples driven by the sound's envelope and a floating caption on a stem over the centre. It dims while ducked and says so.
- Why: it makes an invisible thing visible without a single control; the visitor sees where the market was loudest.
- Weakest: at eye height a ground gradient is seen at a grazing angle and is faint; against a real camera image (cobbles, shadows) it will be fainter still. In sunlight only the rings and the label survive. Fine with 1 m of error.

### Beacon (required) - a directional source to walk toward
- What: a lit point 2.6 m above the source on a thin beam, sending out wavefronts (rate from the envelope, reach from `maxM`), a base ring at `minM`, a label with distance; off screen, a pointer at the screen edge with caption and "9 m, louder this way" or "heard in 4 m".
- Why: it answers "where is that sound coming from?" with sound off, and the edge pointer gets the visitor to turn.
- Weakest: the lit point is small at 15 m on a bright sky; an exact-looking point placed 1 m wrong in front of a doorway looks wrong, so it floats above head height on purpose.

### Drift (my own) - the words rise from the spot
- What: as the narration plays, its words are set into a line in the air above the post, a new line lifting the older ones, which fade; the soundscape breathes out slow teal motes over the market area. The caption strip at the bottom still carries the whole sentence.
- Inspired by: subtitles and "words in the air" title sequences; nothing specific.
- Why: it is the most "the place is talking" of the five, and it gives a muted visitor the text where the sound comes from.
- Weakest: it is only as good as the timing, and without a `timing` field it is estimated; long words at 15 m are small; a crowd walking through the words breaks the effect. Sunlight: pills are dark, so it holds up.

### Horizon (my own) - a hearing compass
- What: a compass bar across the top of the screen, cardinal letters and ticks, with every sound as a soft glow at its bearing, wide when near (the angular size of `minM`), bright when loud, an outline with "heard in N m" when out of earshot, and a "lowered" tag while ducked. Nothing in the world has to line up; the ground shows only faint earshot rings.
- Inspired by: compass bars in games.
- Why: it is immune to placement error and works in any light, and it shows several sounds at once.
- Weakest: it is the least magical; it is a HUD, not AR. It needs the phone's heading to be right.

## 3. Cost per view

Frame times are from the page's own readout, headless Chromium with SOFTWARE rendering (SwiftShader) on a desktop CPU, at 390 x 844; "frame" is the rAF interval, which in software rendering is dominated by the rasteriser, so read the "work" column (the page's own JavaScript per frame, render call included) as the comparable number.

- Readout per view, visitor mode, as "frame mean / max ms; work mean / max ms" at 390x844, 844x390 and 1440x900 (final run; the machine was also running other work, so the maxima are load noise, not the page):
  - visitor-spot: 177/2183; 1.0/3 | 147/283; 1.2/6 | 178/400; 0.8/1
  - visitor-zone: 79/417; 14.3/414 | 77/400; 12.6/154 | 169/367; 0.6/1
  - visitor-beacon: 70/433; 0.6/1 | 128/417; 16.7/273 | 141/250; 2.2/14
  - visitor-drift: 61/217; 4.9/128 | 68/483; 0.9/2 | 158/400; 8.6/99
  - visitor-horizon: 78/417; 28.6/349 | 48/250; 14.7/210 | 183/350; 0.8/1
  - creator-spot: 149/567; 2.9/34 | 131/317; 0.7/1 | 525/667; 115.7/461
  - editor-spot: 80/250; 0.9/1 | 35/550; 8.9/242 | 156/283; 0.8/1
- Reading them: the frame interval (35 to 525 ms) is SwiftShader rasterising on the CPU and says nothing about a phone. The work column (the page's own code per frame, including the render call) is under about 1-3 ms in most runs for every view; the spikes into hundreds of ms coincide with page load, texture uploads (Drift creates one per new word) and the competing load, and appear in different views on different runs. No view is measurably heavier than another in this setup. On a phone the GPU cost is a handful of transparent quads and one ground shader per block: Zone's full-screen-ish ground disc is the largest fill-rate cost, Drift the largest number of draw calls (up to 34 word sprites).

- Media per station: narration 36 s mono, about 140 KB as Opus at 32 kbps; soundscape 16 s loop, about 94 KB at 48 kbps. Nothing else: every view draws from the data. Raw PCM in the page is 1.7 MB and 0.75 MB.
- Creator's minutes: Spot and Horizon about 2 (place, set "heard within"); Zone about 3 (the size matters more); Beacon about 2; Drift about 5 if a `timing` file exists, otherwise the same as Spot but the creator must accept estimated timing.
- Code: each view is a few hundred lines once in the app. Zone uses one small ground shader shared with Spot and the editor; nothing is per block.

## 4. The creator's controls

- Phone (creator mode): pick the block, pick the view, "Heard within" (`maxM`), volume, "When I return" (once / resume / loop), and for a soundscape "Lower while a narration plays" (`duck`); the transcript shows only as a check mark (it is typed on the desktop). Three large buttons: Place here (moves the source to the reticle), Preview (plays it from the start at full level), Done.
- Desktop editor: the station's blocks on the left; the inspector has every field: caption, view, the audio asset with waveform, duration and size, mode, play, volume, fade in and out, source on or off, x and z, `minM`, `maxM`, rolloff with a live loudness curve, duck, transcript (warned when a narration lacks it). In the 3D view: a white disc to drag the source, a small knob for "full volume" and a large knob for "heard to", with their values floating above them. Same controls for every view; no view adds a field.

## 5. Blunt self-check

- Rule bent: "one example record". The family needs two records (a narration and a soundscape) to show ducking; both are drawn in every view, the same in each.
- Rule bent: the visitor's read-along is estimated from text length because the fixed model has no timing field; I say so in the fields panel and propose the field above.
- Context: Drift spawns a canvas texture per new word (cached by word); on a phone that is a small upload per word, fine, but it is the one view whose cost grows with text.
- The editor's "turn" handle is missing by design (the model has no orientation).
- Headless sound is never heard in the checks; sound is generated and routed, but only tested by hand in a real browser (press the speaker button).
- Drop first: Zone as a separate view. It is beautiful from above and faint from eye height, and Spot already draws the full-volume circle; Zone is worth keeping only as the default for soundscapes, which is what it is for.
- Proudest of: Horizon, because it is the honest answer to the brief's own warnings: it needs no exact fit, survives sunlight and sound-off, shows ducking and distance for every sound at once, and costs nothing per block. Drift is the one that would make people smile.

}
function placeCamera(dt) {

    const E = S.E; camera.position.set(E.tx + E.dist * Math.sin(E.az) * Math.cos(E.el), E.dist * Math.sin(E.el), E.tz + E.dist * Math.cos(E.az) * Math.cos(E.el));

    let f = 0, s = 0; const k = S.keys;
    if (k.has('w') || k.has('arrowup')) f += 1; if (k.has('s') || k.has('arrowdown')) f -= 1; if (k.has('a')) s -= 1; if (k.has('d')) s += 1;

/* ---------------------------------------------------------------- loop */
const FT = []; let last = performance.now(), ftNext = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); const interval = now - last; last = now; const w0 = performance.now();
  S.t += dt;
  placeCamera(dt);
  const lp = S.mode === 'visitor' ? S.V : S.mode === 'creator' ? S.C : S.V;
  const inside = S.mode === 'creator' || Math.hypot(lp.x, lp.z) <= STATION.radiusM;
  const nl = narrationLevel(null);
  for (const rt of RT) stepRuntime(rt, dt, lp, inside, rt.rec.mode === 'narration' ? narrationLevel(rt) : nl);
  updateListener();
  const visTarget = S.mode === 'visitor' ? (inside ? 1 : 0) : 1;
  S.vis += (visTarget - S.vis) * (1 - Math.exp(-dt / 0.35)); if (Math.abs(visTarget - S.vis) < 0.004 || S.mode !== 'visitor') S.vis = visTarget;
  const camDist = (p) => Math.hypot(camera.position.x - p[0], camera.position.y - (p[1] || 1.6), camera.position.z - p[2]);
  for (const v of VIEWS) {
    const on = v.name === S.view; v.group.visible = on && S.vis > 0.005; if (!v.group.visible) continue;
    v.parts.forEach((P, i) => { const sel = S.mode === 'visitor' || S.mode === 'editor' || i === S.sel; v.update({ dt, t: S.t, cam: camera, vis: S.vis * (sel ? 1 : 0.35), camDist, group: v.group }, RT[i], P); });
  }
  // editing overlays
  editG.visible = S.mode !== 'visitor';
  EDIT.forEach((d, i) => { const show = S.mode === 'editor' || i === S.sel; d.visible = show && editG.visible; if (d.visible) syncDisc(d, RT[i], { t: S.t }, 1, i === S.sel ? 1 : 0.45); d.material.uniforms.uColor.value.set(i === S.sel ? '#ffffff' : '#30343b'); if (S.mode === 'creator') d.material.uniforms.uColor.value.copy(GROUND_COL[RT[i].rec.mode]); });
  const showH = S.mode === 'editor' && RT[S.sel].rec.source; hG.visible = !!showH;
  if (showH) { const s = RT[S.sel].rec.source, p = s.position; handles.move.position.set(p[0], 0.07, p[2]); handles.move.scale.setScalar(clamp(S.E.dist / 45, 0.6, 2));
    handles.min.position.set(p[0] + KNOB_DIR.x * s.minM, 0.36, p[2] + KNOB_DIR.y * s.minM); handles.max.position.set(p[0] + KNOB_DIR.x * s.maxM, 0.55, p[2] + KNOB_DIR.y * s.maxM);
    handles.min.material.color.copy(COL[RT[S.sel].rec.mode]);
    minLbl.set('', 'full ' + s.minM + ' m', ''); maxLbl.set('', 'heard ' + s.maxM + ' m', '');
    minLbl.mesh.position.copy(handles.min.position).add(_v.set(0, 1.0, 0)); maxLbl.mesh.position.copy(handles.max.position).add(_v.set(0, 1.2, 0));

    S.ft = { mean: s / n, max: m, workMean: ws / n, workMax: wm }; $('ft').textContent = `frame ${S.ft.mean.toFixed(1)} · max ${S.ft.max.toFixed(1)} ms · work ${S.ft.workMean.toFixed(1)}/${S.ft.workMax.toFixed(1)}`; }

new ResizeObserver(() => { renderer.setSize(stage.clientWidth, stage.clientHeight, false); applyFov(); drawEdWave(); drawCurve(); }).observe(stage);

/* ---------------------------------------------------------------- modes */
function applyMode() {
  appEl.classList.toggle('editor', S.mode === 'editor');
  for (const b of $('modes').children) b.classList.toggle('on', b.dataset.mode === S.mode);
  for (const b of $('viewSeg').children) b.classList.toggle('on', b.dataset.view === S.view);
  $('views').style.display = S.mode === 'visitor' ? 'flex' : 'none';
  $('creator').style.display = S.mode === 'creator' ? 'flex' : 'none';
  $('reticle').style.display = S.mode === 'creator' ? 'block' : 'none';
  $('edHint').style.display = S.mode === 'editor' ? 'block' : 'none';
  if (S.mode === 'creator') renderCreator(); if (S.mode === 'editor') renderEditor();
  for (const rt of RT) if (rt.forced && S.mode !== 'creator') rt.forced = false;
  if (S.mode !== 'visitor') S.walking = false; $('bWalk').classList.toggle('on', S.walking);

  history.replaceState(null, '', `#mode=${S.mode}&view=${S.view}`);

}
function parseHash() { const h = new URLSearchParams(location.hash.slice(1)); const m = h.get('mode'), v = h.get('view'); if (['visitor', 'creator', 'editor'].includes(m)) S.mode = m; if (VIEWS.some((x) => x.name === v)) S.view = v; }
addEventListener('hashchange', () => { parseHash(); applyMode(); });
const nextDraw = (n = 2) => new Promise((res) => { const target = S.drawn + n; const tick = () => (S.drawn >= target ? res() : requestAnimationFrame(tick)); requestAnimationFrame(tick); });

/* ----------------------------------------------------------------- hook */
const api = {
  family: 'station-blocks-8-audio',
  views: VIEWS.map((v) => v.name),
  modes: ['visitor', 'creator', 'editor'],
  async setMode(name) { if (!this.modes.includes(name)) throw new Error('unknown mode ' + name); S.mode = name; applyMode(); await nextDraw(); },
  async setView(name) { if (!this.views.includes(name)) throw new Error('unknown view ' + name); S.view = name; applyMode(); await nextDraw(); },
  async walkTo(x, z) { if (!Number.isFinite(x) || !Number.isFinite(z)) throw new Error('walkTo needs numbers'); S.V.x = x; S.V.z = z; await nextDraw(); },
  async lookAt(x, y, z) {

  async describe() { return { family: this.family, fields: FIELDS.slice(), views: VIEWS.map((v) => ({ name: v.name, required: v.required, usesFields: FIELDS.filter((k) => v.uses[k]) })) }; },
  async exportModel() {
    return JSON.parse(JSON.stringify({ station: STATION.id, blocks: RECORDS.map((r) => ({ id: r.id, model: 'audio', view: r.view, audio: r.audio, mode: r.mode, play: r.play, fadeInMs: r.fadeInMs, fadeOutMs: r.fadeOutMs, volume: r.volume, source: r.source, duck: r.duck, transcript: r.transcript, caption: r.caption })) }));

};
window.__stationBlock = api;
parseHash(); applyMode();
