<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ground chevron ribbon</title>
<style>
  :root {
    --chrome: rgba(16, 19, 25, 0.86);
    --chrome-2: rgba(30, 35, 44, 0.92);
    --line: rgba(255, 255, 255, 0.12);
    --ink: #f4f1ea;
    --ink-2: #b9bdc6;
    --ink-3: #8a909b;
    --mint: #5fe3c9;
    --parch: #f1d79c;
    --amber: #ffb02e;
    --bg: #15181e;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.35 var(--font); }
  body { overflow: hidden; }
  button { font: inherit; color: inherit; }
  #app { display: flex; flex-direction: column; height: 100%; }

  /* ---------- top bar (demo chrome) ---------- */
  #topbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 7px 10px;
    background: #0d1014; border-bottom: 1px solid var(--line); z-index: 20; }
  .seg { display: inline-flex; background: #1b2028; border-radius: 9px; padding: 2px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 7px; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #111; font-weight: 600; }
  .seg button:hover:not([aria-pressed="true"]) { color: var(--ink); }
  #viewpicker { overflow-x: auto; max-width: 100%; scrollbar-width: none; }
  #viewpicker::-webkit-scrollbar { display: none; }
  #viewpicker .vlabel { color: var(--ink-3); padding: 5px 4px 5px 8px; white-space: nowrap; }
  .tools { margin-left: auto; display: inline-flex; gap: 4px; }
  .tools button { border: 1px solid var(--line); background: transparent; padding: 4px 9px; border-radius: 8px; cursor: pointer; color: var(--ink-2); }
  .tools button[aria-pressed="true"] { color: #111; background: var(--ink); border-color: var(--ink); }
  @media (max-width: 720px) {
    #topbar { padding: 6px 8px; }
    #viewpicker { order: 3; width: 100%; }
    .seg button { padding: 5px 8px; }
  }

  /* ---------- layout ---------- */
  #layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr; }
  #stage-wrap { position: relative; min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; background: #1b1f25; overflow: hidden; }
  #stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: #dfe6ec; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #app.phone:not([data-mode="editor"]) #stage { border-radius: 30px; box-shadow: 0 0 0 9px #07080a, 0 0 0 10px #2c3139, 0 18px 50px rgba(0,0,0,.5); }
  #overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .mode-ui { display: none; }
  #app[data-mode="visitor"] .ui-visitor, #app[data-mode="creator"] .ui-creator, #app[data-mode="editor"] .ui-editor { display: revert; }
  #app[data-mode="visitor"] .ui-visitor.flex, #app[data-mode="creator"] .ui-creator.flex, #app[data-mode="editor"] .ui-editor.flex { display: flex; }
  #ed-list, #ed-inspector { display: none; }

  /* editor layout */
  #app[data-mode="editor"] #layout { grid-template-columns: 230px 1fr 330px; }
  #app[data-mode="editor"] #ed-list, #app[data-mode="editor"] #ed-inspector { display: block; }
  @media (max-width: 1100px) {
    #app[data-mode="editor"] #layout { grid-template-columns: 1fr 310px; }
    #app[data-mode="editor"] #ed-list { display: none; }
  }
  @media (max-width: 720px) {
    #app[data-mode="editor"] #layout { grid-template-columns: 1fr; grid-template-rows: 42% 58%; }
    #app[data-mode="editor"] #ed-inspector { border-left: 0; border-top: 1px solid var(--line); }
  }

  /* ---------- in-app overlays (visitor) ---------- */
  .glass { background: var(--chrome); color: var(--ink); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #station-hint { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); padding: 8px 14px 8px 10px; border-radius: 999px; align-items: center; gap: 10px; font-size: 14px; white-space: nowrap; transition: opacity .5s; }
  #station-hint .arr { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; }
  #station-hint .arr svg { transition: transform .2s; }
  #station-hint b { font-weight: 650; }
  #station-hint .d { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  #walk-ui { position: absolute; right: 12px; bottom: 14px; gap: 8px; align-items: center; }
  #app.phone #walk-ui .hint { display: none; }
  #walk-ui button { white-space: nowrap; pointer-events: auto; border: 1px solid var(--line); background: var(--chrome); color: var(--ink); padding: 9px 14px; border-radius: 12px; cursor: pointer; font-weight: 600; backdrop-filter: blur(10px); }
  #walk-ui .hint { color: rgba(20,24,30,.75); font-size: 11.5px; max-width: 170px; text-align: right; }
  @media (max-width: 500px) { #walk-ui .hint { display: none; } }

  /* ---------- edge hints (a view, screen space) ---------- */
  .eh { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 8px; border-radius: 12px;
    background: rgba(15,18,24,.9); color: var(--ink); font-size: 15px; font-weight: 600; white-space: nowrap; will-change: transform; border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 4px 16px rgba(0,0,0,.28); transition: opacity .25s; }
  .eh .bar { width: 4px; align-self: stretch; border-radius: 2px; }
  .eh .ar { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .eh .body { display: flex; flex-direction: column; min-width: 0; }
  .eh .tx { max-width: 230px; overflow: hidden; text-overflow: ellipsis; }
  .eh .desc { display: none; max-width: 230px; white-space: normal; font-weight: 450; font-size: 12.5px; line-height: 1.3; color: var(--ink-2); margin-top: 2px; }
  .eh .dist { display: none; color: var(--ink-2); font-weight: 500; font-size: 12.5px; font-variant-numeric: tabular-nums; align-self: flex-start; padding-top: 1px; }
  /* off screen: arrow + caption only; on screen: the tag over its spot; fully in view: description and distance too */
  .eh.full .desc, .eh.full .dist { display: block; }
  .eh.inview .ar { display: none; }
  .eh.inview::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: rgba(15,18,24,.9); }
  .eh.edge .tx { max-width: 150px; }

  /* ---------- creator (phone in AR) ---------- */
  #app[data-mode="creator"] #ftime { bottom: auto; top: 8px; }
  #cr-top { position: absolute; top: 30px; left: 12px; right: 12px; justify-content: center; }
  #cr-top .chip { pointer-events: auto; display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 14px; max-width: 100%; }
  #cr-top .chip button { border: 0; background: transparent; width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 18px; color: var(--ink-2); }
  #cr-top .chip .mid { padding: 0 6px; min-width: 0; text-align: center; }
  #cr-top .chip .t { font-weight: 650; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  #cr-top .chip .s { color: var(--ink-2); font-size: 11.5px; }
  #cr-reticle { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; border: 2px solid rgba(255,255,255,.95); box-shadow: 0 0 0 1px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.35); }
  #cr-reticle::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: #fff; }
  #cr-bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 10px 16px; gap: 8px; justify-content: center;
    background: linear-gradient(to top, rgba(10,12,16,.55), rgba(10,12,16,0)); }
  #cr-bar button { pointer-events: auto; flex: 1; max-width: 86px; min-height: 64px; border-radius: 16px; border: 1px solid var(--line); background: var(--chrome); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; font-size: 12px; font-weight: 600; backdrop-filter: blur(10px); }
  #cr-bar button.primary { background: var(--ink); color: #111; }
  #cr-bar svg { width: 24px; height: 24px; }
  .sheet { position: absolute; left: 8px; right: 8px; bottom: 98px; border-radius: 18px; padding: 14px; pointer-events: auto; max-width: 520px; margin: 0 auto;
    transform: translateY(20px); opacity: 0; transition: transform .22s, opacity .22s; visibility: hidden; max-height: calc(100% - 180px); overflow: auto; }
  .sheet.open { transform: none; opacity: 1; visibility: visible; }
  .sheet h3 { margin: 0 0 10px; font-size: 13px; color: var(--ink-2); font-weight: 600; letter-spacing: .02em; }
  .sheet .row { margin: 10px 0; }
  .sheet textarea, #ed-inspector textarea { width: 100%; resize: none; border-radius: 10px; border: 1px solid var(--line); background: #0c0f13; color: var(--ink); font: 600 16px/1.3 var(--font); padding: 9px 10px; }
  .count { color: var(--ink-3); font-size: 11.5px; text-align: right; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .count.over { color: var(--amber); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { border: 1px solid var(--line); background: #1b2028; color: var(--ink-2); border-radius: 10px; padding: 7px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .chips button[aria-pressed="true"] { background: var(--ink); color: #111; border-color: var(--ink); font-weight: 600; }
  .chips .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .sheet .done { margin-top: 6px; width: 100%; border: 0; background: var(--ink); color: #111; border-radius: 12px; padding: 11px; font-weight: 650; cursor: pointer; }
  .viewgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .viewgrid button { border: 1px solid var(--line); background: #1b2028; color: var(--ink); border-radius: 12px; padding: 10px 6px; cursor: pointer; text-align: center; font-weight: 600; }
  .viewgrid button small { display: block; color: var(--ink-3); font-weight: 400; font-size: 11px; margin-top: 2px; }
  .viewgrid button[aria-pressed="true"] { background: var(--ink); color: #111; }
  .viewgrid button[aria-pressed="true"] small { color: #444; }
  #toast { position: absolute; left: 50%; bottom: 104px; transform: translate(-50%, 8px); padding: 9px 14px; border-radius: 12px; font-size: 13.5px; opacity: 0; transition: opacity .2s, transform .2s; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #app[data-mode="visitor"] #toast { bottom: 70px; }
  #app[data-mode="editor"] #toast { bottom: 16px; }

  /* ---------- editor ---------- */
  #ed-list { background: #101318; border-right: 1px solid var(--line); overflow: auto; padding: 12px 10px; }
  #ed-list h4, #ed-inspector h4 { margin: 4px 4px 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  .blk { display: flex; gap: 9px; align-items: flex-start; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; padding: 8px; border-radius: 10px; cursor: pointer; color: var(--ink-2); }
  .blk:hover { background: #171b21; }
  .blk[aria-selected="true"] { background: #1e242d; border-color: var(--line); color: var(--ink); }
  .blk .ic { width: 22px; height: 22px; flex: none; margin-top: 1px; }
  .blk .t { font-weight: 600; color: var(--ink); }
  .blk .s { font-size: 11.5px; color: var(--ink-3); }
  .blk.other { opacity: .55; cursor: default; }
  #ed-inspector { background: #101318; border-left: 1px solid var(--line); overflow: auto; padding: 12px 14px 30px; }
  .insp-sec { border-top: 1px solid var(--line); padding: 12px 2px; }
  .insp-sec:first-of-type { border-top: 0; }
  .insp-sec label.l { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; font-weight: 600; }
  .insp-sec label.l span { color: var(--ink-3); font-weight: 400; }
  .insp-sec .help { color: var(--ink-3); font-size: 11.5px; margin-top: 6px; }
  input[type=range] { width: 100%; accent-color: var(--ink); }
  .xyz { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .xyz label { display: flex; align-items: center; gap: 4px; background: #0c0f13; border: 1px solid var(--line); border-radius: 8px; padding: 0 6px; color: var(--ink-3); font-size: 11px; }
  .xyz input { width: 100%; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 12.5px var(--mono); padding: 6px 0; }
  .btnrow { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .btnrow button { border: 1px solid var(--line); background: #1b2028; color: var(--ink); border-radius: 9px; padding: 6px 10px; cursor: pointer; }
  .btnrow button[aria-pressed="true"] { background: var(--ink); color: #111; }
  .blocksel { width: 100%; border-radius: 9px; border: 1px solid var(--line); background: #0c0f13; color: var(--ink); padding: 7px; font: inherit; }
  #ed-tools { position: absolute; left: 12px; top: 12px; gap: 6px; }
  #ed-tools .seg { pointer-events: auto; background: rgba(16,19,25,.85); }
  #ed-tools .seg button { color: var(--ink-2); }
  #ed-tools .seg button[aria-pressed="true"] { color: #111; }
  #ed-tools .seg button[aria-pressed="true"] .key { color: #555; }
  #ed-tools .key { color: var(--ink-3); font-size: 10.5px; margin-left: 4px; }
  #ed-hint { position: absolute; left: 12px; bottom: 34px; color: rgba(20,24,30,.78); font-size: 11.5px; }

  /* ---------- panels ---------- */
  #ftime { position: absolute; left: 8px; bottom: 8px; z-index: 30; font: 10.5px/1.2 var(--mono); color: #e9edf2; background: rgba(0,0,0,.55); padding: 3px 6px; border-radius: 6px; pointer-events: none; font-variant-numeric: tabular-nums; }
  .panel { position: fixed; z-index: 40; background: #0d1015; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  #fields-panel { right: 10px; top: 54px; width: min(380px, calc(100% - 20px)); padding: 14px 16px; max-height: calc(100% - 70px); overflow: auto; }
  #fields-panel h3 { margin: 0 0 2px; font-size: 15px; }
  #fields-panel .sub { color: var(--ink-3); margin-bottom: 10px; }
  #fields-panel dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; }
  #fields-panel dt { font: 12px var(--mono); color: var(--ink); padding-top: 1px; }
  #fields-panel dd { margin: 0; color: var(--ink-2); }
  #fields-panel dt.off { color: var(--ink-3); text-decoration: line-through; }
  #fields-panel dd.off { color: var(--ink-3); }
  #notes-panel { inset: 50px 10px 10px; max-width: 860px; margin: 0 auto; padding: 0; display: flex; flex-direction: column; }
  #notes-panel header { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  #notes-panel header button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  #notes-body { overflow: auto; padding: 6px 22px 30px; font-size: 14px; line-height: 1.5; color: #dfe2e7; }
  #notes-body h1 { font-size: 20px; } #notes-body h2 { font-size: 16.5px; margin-top: 26px; } #notes-body h3 { font-size: 14.5px; margin-top: 18px; }
  #notes-body code { font: 12.5px var(--mono); background: #1d222a; padding: 1px 4px; border-radius: 4px; }
  #notes-body li { margin: 3px 0; }
  [hidden] { display: none !important; }
</style>
<script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
  } }
</script>
</head>
<body>
<div id="app" data-mode="visitor">
  <header id="topbar">
    <div class="seg" id="modepicker" aria-label="Mode">
      <button data-mode="visitor">Visitor</button><button data-mode="creator">Creator</button><button data-mode="editor">Editor</button>
    </div>
    <div class="seg" id="viewpicker" aria-label="View"></div>
    <div class="tools">
      <button id="btn-fields" aria-pressed="false" title="Which fields this view uses">Fields</button>
      <button id="btn-phone" aria-pressed="false" title="Render into a 9:19.5 portrait phone viewport">Phone</button>
      <button id="btn-err" aria-pressed="false" title="Draw all content 1 m off, as a 1 m placement error would">1 m error</button>
      <button id="btn-notes" aria-pressed="false">Notes</button>
    </div>
  </header>
  <div id="layout">
    <aside id="ed-list" aria-label="Station blocks"></aside>
    <main id="stage-wrap">
      <div id="stage">
        <canvas id="c"></canvas>
        <div id="overlay"></div>
        <!-- visitor -->
        <div id="station-hint" class="glass mode-ui ui-visitor flex" style="pointer-events:none">
          <span class="arr"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1 L12 11 L7 8.6 L2 11 Z" fill="#111"/></svg></span>
          <span><b>Market square</b> <span class="d">0 m</span></span>
        </div>
        <div id="walk-ui" class="mode-ui ui-visitor flex">
          <span class="hint">Drag to look. W A S D or arrows to walk.</span>
          <button id="btn-hold" title="Hold to walk forward">Hold to walk</button>
          <button id="btn-walkin">Walk in</button>
        </div>
        <!-- creator -->
        <div id="cr-top" class="mode-ui ui-creator flex">
          <div class="chip glass">
            <button id="cr-prev" aria-label="Previous block">&#8249;</button>
            <div class="mid"><div class="t" id="cr-title"></div><div class="s" id="cr-sub"></div></div>
            <button id="cr-next" aria-label="Next block">&#8250;</button>
          </div>
        </div>
        <div id="cr-reticle" class="mode-ui ui-creator"></div>
        <div id="cr-sheet-view" class="sheet glass"><h3>View for this block</h3><div class="viewgrid" id="cr-viewgrid"></div><button class="done" data-close>Done</button></div>
        <div id="cr-sheet-edit" class="sheet glass">
          <h3>Caption</h3>
          <textarea id="cr-text" rows="1" maxlength="40" aria-label="Caption"></textarea>
          <div class="count" id="cr-count"></div>
          <div class="row"><h3>Description <span style="font-weight:400;color:var(--ink-3)">(optional)</span></h3>
          <textarea id="cr-desc" rows="3" maxlength="160" aria-label="Description" style="font-weight:450;font-size:15px"></textarea>
          <div class="count" id="cr-dcount"></div></div>
          <div class="row"><h3>Role</h3><div class="chips" id="cr-roles"></div></div>
          <div class="row"><h3>Orientation</h3><div class="chips" id="cr-orients"></div></div>
          <div class="row"><h3>Points to</h3><div class="chips"><button id="cr-aim">Aim with the ring</button><button id="cr-clear">None</button></div><div class="count" id="cr-pt" style="text-align:left"></div></div>
          <button class="done" data-close>Done</button>
        </div>
        <div id="cr-bar" class="mode-ui ui-creator flex">
          <button id="cr-b-view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="8" height="7" rx="1.5"/><rect x="13" y="4" width="8" height="7" rx="1.5"/><rect x="3" y="13" width="8" height="7" rx="1.5"/><rect x="13" y="13" width="8" height="7" rx="1.5"/></svg>View</button>
          <button id="cr-b-edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>Text</button>
          <button id="cr-b-size"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 18 L8.5 6 L13 18 M5.7 14h5.6"/><path d="M15 18l3-7 3 7M15.9 16h4.2"/></svg><span id="cr-size-l">Size</span></button>
          <button id="cr-b-turn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12a7 7 0 1 1-2.05-4.95"/><path d="M19 4v4h-4"/></svg>Turn</button>
          <button id="cr-b-place" class="primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg>Place</button>
        </div>
        <!-- editor -->
        <div id="ed-tools" class="mode-ui ui-editor flex">
          <div class="seg" id="ed-tc"><button data-tc="move">Move<span class="key">W</span></button><button data-tc="turn">Turn<span class="key">E</span></button><button data-tc="target">Points to<span class="key">T</span></button></div>
        </div>
        <div id="ed-hint" class="mode-ui ui-editor">Click a block to select it. Drag empty space to orbit, wheel to zoom.</div>
        <div id="toast" class="glass"></div>
        <div id="ftime" title="frame interval, mean / max over the last 2 s">frame -</div>
      </div>
    </main>
    <aside id="ed-inspector" aria-label="Inspector"></aside>
  </div>
</div>
<div id="fields-panel" class="panel" hidden></div>
<div id="notes-panel" class="panel" hidden>
  <header><b>Notes - short text, ground view as a floating chevron ribbon</b><button id="notes-close">Close</button></header>
  <div id="notes-body"></div>
</div>
<script type="text/markdown" id="notes-md">
<!--NOTES-START-->
# Short text blocks - notes

Family `station-blocks-2-short-text`. One model, six views (four required, two of my own), three example records drawn by every view at once: "This way to the guild house" (instruction, upright, reads at 6 m, points to the guild house door), "Market hall, 1890" (label, face, reads at 12 m, points to nothing) and "Mind the step" (warning, world, reads at 3 m, points to the step in the gap of the ruined keep wall).

## 0. This page: the ground view as a floating chevron ribbon

This page is a copy of the short-text page (second round, with caption and description) with only the ground view replaced; the other five views, the three records, `pointsTo`, the walk-in, the modes and the hook are unchanged. It opens in the new ground view ("Knee ribbon" in the view bar). One button is new: **1 m error** draws every block and every `pointsTo` 1 m off (as a 1 m anchor error would; the place stays put; visitor mode only; also `&err=1` in the URL hash). Sections 0a-5 below are the original page's notes; where they mention the ground rug or its chevrons, read this section instead.

### What it is

- A thin dark ribbon floating at knee height (0.4 m), slightly see-through, with rounded edges piped in the role colour. It leaves the block's spot, bends toward `pointsTo` and ends in a role-coloured arrow head 1.5-3 m short of the target.
- On top of it one to four raised, bevelled chevrons in the role colour, about one per 2.4 ribbon widths. Nothing animates.
- It is lit like the place (smooth normals across the rounded section, bevelled chevrons catching the sun) and throws a soft shadow straight down onto the ground. The shadow is what makes it float rather than lie on the paving.
- The caption stands on a small plate at the ribbon's start that leans back 28 degrees like a lectern, at knee to hip height. The plate stands beside the ribbon, on the side away from the target as the visitor sees it (with 0.3 m of hysteresis), so it never hides the ribbon behind it.
- Width from `readAtM`: 0.24 m at 3 m, 0.36 m at 6 m, 0.6 m at 12 m. Length at most 2.5 m + 0.45 x `readAtM` (5.2 m for the guild house).
- Orientation: `world` keeps plate and ribbon fixed (the ribbon leaves along the block's turn). `upright` turns the plate toward the visitor and lets the ribbon leave its start from the visitor's side, so it reads as "from where you stand, then this way" (at most 70 degrees off the straight line, damped, re-swept when the start moves 2 degrees). `face` does the same and also tilts the plate to look at the eye.
- Without `pointsTo` (the "Market hall" label) there is no arrow and no chevrons: a short straight rail under the plate, like a plinth. An arrow that points nowhere would be a lie.

### Why it should read better than the old ground arrow

- It is an object, not a decal. The old rug and its flat chevrons were stickers on the paving: in sun a dark rug was a hole in the ground and the flat chevrons flickered. Here the shading across the rounded ribbon, the bevels of the chevrons and the shadow under it all say "a thing floating in the air", which is what AR content is anyway.
- It escapes the ground's foreshortening. At 0.4 m it is seen less obliquely than paint on the ground; and the caption is on an upright, slightly tilted plate, not stretched across the paving, so it reads like the sign's letters at `readAtM`.
- One visual language: dark body, role-coloured edges, chevrons and head, the same dark plate as the other views. The old view mixed a rug, stretched letters and pulsing runway lights.
- Arrow and words agree: the caption is at the start of the ribbon it belongs to, beside it, never rotating against it.
- Dark on bright paving in sun is the strongest contrast available; the role colour sits on the dark ribbon, not on the stone.
- Small obstacles do not break it: at 0.4 m it floats over kerbs, steps and low edges that a ground decal would run into (the step in the wall gap is 0.18 m).

### What it costs to build for real

- Rendering: per block one swept mesh (about 2 000-3 000 vertices for a 5 m ribbon: 20 points around the section every 4 cm), up to four small extruded chevrons (shared geometry), two shadow strips, one plate texture (the sign's plate code). Standard lit materials, one transparent ribbon with depth writes.
- CPU: building all three blocks took 3.6 ms (median of 20 runs; 2.9-13.5 ms) on this machine (headless Chromium, the page's `rebuildMs()` hook). Across 25 earlier runs at three viewports 20 were 2.7-11 ms and five read 21-257 ms; the machine was heavily loaded by other work throughout (frames of 100-3 000 ms in the readout), so the outliers are load, not the page. The ribbon of an `upright` or `face` block is re-swept while the visitor walks around it (at most once per 2 degrees of change); one sweep is a fraction of the 3.6 ms above (which also draws the three plate textures), so I expect that to be fine on a phone; it was not measured on one.
- Frame time: the readout in headless software rendering read about 30-90 ms mean at 390x844 and 844x390 in the screenshots, on a loaded machine; that is a CPU rasteriser, not a phone, and says nothing absolute.
- For real: the sweep and the chevrons are a few hundred lines; a real build wants a shadow that matches the AR light estimate (or none and an ambient contact shadow, as here), and an occlusion story for people walking through the ribbon.
- Editor and creator: nothing new, the same fields; the ribbon's bend needs no control.

### Known weaknesses (seen in the screenshots)

- Seen from straight behind, at 6 m or more, the ribbon is foreshortened to a short ladder of chevrons with the head at its far end; the direction "away from you" reads, but it is a small mark. From the side it reads very well (the walk-in end is its best view: it passes beside you and points on).
- The guild caption from 12 m is too small to read, as the model intends (`readAtM` 6); the "Market hall, 1890" plate reads at 12 m at every viewport.
- In portrait at 3 m the plate (1.6 m wide for the guild house) and the ribbon beside it do not both fit across the 42-degree view; you turn your head between them.
- With 1 m of error: at the door 30 m away it does not show. At the step 3.4 m away the ribbon now points at the wall beside the gap when the error is sideways, and toward the wall its head reaches the wall's face line; it floats over the 0.18 m step, but in AR nothing hides it, so it would be drawn over the wall. With the 1.5 m stop nothing runs under the step itself.
- A `world` plate seen from the side is edge-on (the step's warning from the east), as a fixed sign is.
- The `upright` ribbon's bend follows the visitor slowly; someone watching for it sees the ribbon re-shape as they walk, which is unlike any real object.
- People walk through it: at knee height it is exactly where legs are, and without occlusion it is drawn over them.
- The plate's soft shadow and the ribbon's shadow fall straight down; under a low real sun they would disagree with real shadows.

### Parameters it rests on

- Height 0.4 m, swept 0.2 / 0.4 / 0.7 m (`setParam('height', x)`). Legibility does not change across the range at 3-12 m; what changes is the 3D read: at 0.2 m the ribbon reads more like a ground mark (shadow nearly under it), at 0.7 m it floats clearly but from 6 m behind it is seen more edge-on, so the chevrons crowd. The value that would reverse the verdict is about eye height minus 0.5 m (above about 1.1 m): from 6-12 m the ribbon would be seen nearly edge-on and the direction would no longer read from behind.
- Width 0.12 + 0.04 x `readAtM` (0.22-0.6 m), thickness 11 % of the width (at least 2.8 cm), head 2.1 widths wide and 1.6 widths + 0.1 m long, chevrons 0.62 widths across, one per 2.4 widths (at least 0.8 m), at most four.
- Stop before the target: 20 % of the distance, between 1.5 and 3 m. Below 1.5 m the step's ribbon would, with 1 m of error toward it, end over the step and against the wall behind it.
- Plate tilt 28 degrees, plate beside the ribbon with a 0.3 m hysteresis; bend at most 70 degrees; ribbon opacity 0.88.

## 0a. Second round (2026-10-25) - what changed and why

The first look's verdicts, and what this round did about each. Sections 1-5 below are the first round's notes, kept as written; where they disagree with this section, this section holds, and where they mention the ground view, section 0 holds.

- **Pin: its arrow pointed the wrong way (a bug).** The pin's instruction icon was a fixed right-pointing arrow baked into the plate, and the pin ignored `pointsTo`; from where the walk-in stops it pointed straight away from the guild house.
  - Now the pin carries the sign's turning arrow whenever `pointsTo` is set: it points toward the target as seen from where you stand (up = past the pin, left and right = turn, down = behind you).
  - Without `pointsTo` an instruction shows a plain, non-directional marker (a ring and a dot). The same marker replaces the fixed arrow on the sign and in the editor's list, so no icon claims a direction it does not know.
- **Speech bubble: the tail looked buggy when strongly bent.** The old tail was a separate mesh whose outline was a scaled copy, not a stroke: the outline thinned as the tail bent, the two shoulders sat asymmetrically, the tip vertex was doubled and the fill cut a notch into the rim where it joined.
  - Bubble and tail are now one shape in one canvas, outlined once with a constant stroke (stroked at twice the rim width, then filled over the inner half, so the join carries no line). The edges are symmetric curves and the tip is rounded.
  - The tail's base slides along the bubble's bottom edge toward the target, so the clamp widened from 54 to 72 degrees. Beyond 72 degrees the tail still stops at 72.
  - Cost: the bubble's canvas is redrawn and re-uploaded when the tail's angle moves by more than 0.6 degrees, which happens only while the visitor moves.
- **Caption plus description, in the model.** `text` (80 characters) became `caption` (at most 40) plus an optional `description` (at most 160).
  - Every view shows the caption. Pin, sign, bubble and callout show the description in smaller letters under it (0.62 of the caption's letter height, so it reads from about 60 % of `readAtM`). The ground arrow paints only the caption: 160 characters do not read on the paving.
  - "Mind the step" has no description, to show the optional case.
  - The export is now `version: 2` with `caption` and `description`; an old record's `text` is read as its caption (cut to 40 characters).
- **Edge hint: quieter off screen.** Off screen the chip shows only its arrow and the caption, no distance.
  - On screen the tag stands over its spot with the caption. The description and the distance appear once the block is fully in view: its projected bounds (a 0.9 m footprint from the ground up to the tag's height of 1.9 m) inside the screen, not only its anchor point.
  - Hysteresis: they appear once every corner of the bounds is 24 px inside the usable screen, and go only when a corner is more than 8 px outside it, so they do not flicker at the edge.
  - Whether the tag fits over its spot at all is decided from its compact size (caption only), measured once per screen size. Deciding from its live size let the larger full tag push itself to the edge, where it shrank and came back, every frame on a 390 px phone.
- **Callout:** left as it was (the first look found it "a bit odd" without naming what); it only gained the description under its tag. Say what looks odd and it changes next round.
- **Ground arrow:** replaced on this page by the floating chevron ribbon at knee height; see section 0.

## 1. The model

As built, exactly the fixed fields:

- `text` - string, at most 80 characters (counted as code points; whitespace collapsed; empty becomes "..." rather than an invisible block).
- `role` - "instruction", "label" or "warning"; unknown values fall back to "label".
- `orientation` - "world", "upright" or "face"; unknown falls back to "upright".
- `readAtM` - the intended reading distance, clamped to 1-40 m. It sets the letter height at 2.64 cm per metre (0.066 m reads at 2.5 m), and in the floating views also the height above the ground (1.7 m plus 10 cm per metre: 2.0 m at 3 m, 2.3 m at 6 m, 2.9 m at 12 m), so text meant to be read from far away floats above a crowd.
- `pointsTo` - optional `{ x, y, z }` in station-local metres, or null.

The block envelope around it (not part of the model): `id`, `view`, `pose { x, y, z, yawDeg }`. `exportModel()` returns `{ family, model: "short-text", version, station, blocks: [{ id, model, view, pose, data: { text, role, orientation, readAtM, pointsTo } }] }`.

What I would change:

- **Add `lang`** (an optional BCP-47 tag). Creators write in any language. Line breaking, right-to-left layout (the sign's icon side, the order of the ground lines) and the font fallback all depend on it, and guessing it from the text is unreliable for 80 characters.
- **Keep `readAtM`.** It is the best field in the model: a creator understands "who reads this from where", never "font size 0.16". It also gives every view one honest rule for size and height.
- **`orientation` is really a view parameter, not a model field.** Of six views only three use all three values. The sign treats "face" as "upright" (a sign on posts must not tilt), the ground arrow has only "fixed" or "turns toward you", and the edge hint ignores it. I would keep it in the model (the creator thinks of it as part of the text) but document per view what each value does, as the Fields panel does.
- **Do not add a font size, a colour or a style field.** The role carries the colour and the icon; letting creators pick colours is how outdoor text becomes unreadable.
- `pointsTo.y` matters for the callout and the bubble (a door, a window) but the ground arrow ignores it. That is fine; say so in the editor.

## 2. Per view

- **Pin** - a dark head with the role icon on a thin stem, a ring on the ground that pulses slowly.
  - Fields: text, role, orientation, readAtM. Not pointsTo (a pin marks its own spot).
  - Why a visitor likes it: it says "here" without covering anything; the stem ties the text to a spot on the ground, so you know what it belongs to.
  - Weakest: 1 m of placement error moves the "here" by 1 m, and the ring advertises the exact spot. In a crowded square the stem foot is hidden, but the head floats above heads (that is what the readAtM height rule is for).
- **Sign** - a board on one or two posts with a role-coloured top band. When `pointsTo` is set, the icon slot holds a round arrow that turns toward the target as seen from where the visitor stands: up means "go past the sign", left and right mean turn, down means "behind you".
  - Fields: all five.
  - Why: it is the most familiar object here; nobody needs to learn it. The turning arrow is honest wayfinding from any side.
  - Weakest: it is the biggest and most solid thing in the view, so a placement error (posts standing in a flower bed, or half inside a real bench) shows most. "face" cannot mean anything for a sign on posts.
- **Ground arrow** - replaced on this page by the floating chevron ribbon at knee height; see section 0. The original page keeps the rug and chevrons.
- **Speech bubble** - a rounded bubble with a role-coloured rim, floating and bobbing gently, its tail pointing at `pointsTo` (or at its own foot).
  - Fields: all five.
  - Why: it feels like the place is talking; good for labels on things ("Market hall, 1890") and for short friendly instructions.
  - Weakest: the tail suggests a speaker; with nothing at the end of the tail it can read as a bug. A warning in a bubble feels wrong ("Mind the step" said by whom?). The tail is a dynamic mesh, rebuilt every frame (cheap, 7 vertices).
- **Callout** (my own) - a compact tag with an accent underline, a leader line in world units to `pointsTo`, ending in a soft 0.6 m halo instead of a precise dot. It quiets itself to a faint tag when it is more than about 16-34 degrees from the centre of the view.
  - Fields: all five.
  - Why: it connects text to a real feature (the door, the step) and the halo is deliberately larger than the placement error, so a 1 m offset still looks intended. The fading means only the thing you look at is loud.
  - Weakest: a long leader (30 m to the door) crosses the whole square; with three callouts the lines start to cross. The fade depends on the centre of the view, which a visitor might not expect (a tag dims while you read it at the edge).
- **Edge hint** (my own) - screen-space, not world: a tag stuck above the block's spot when it is on screen, and a chip at the screen edge with an arrow and the distance when it is off screen or behind you. Tags that overlap step aside, nearest first.
  - Fields: text and role only. Not orientation, readAtM or pointsTo (screen space, always the same size, leads to the block itself).
  - Why: it never fails to be readable (system text, constant size), and it answers "where was that warning?" when you have turned away.
  - Weakest: it is not in the world, so it does not feel like the place. It needs the DOM overlay of WebXR (or a screen-space quad layer) and it collides with the app's own "nearest station" display at the screen edges. Long text is cut at the edge.

## 3. Costs

Frame time is the readout's mean / max frame interval over 2 s. Headless Chromium here uses software rendering (SwiftShader), so these numbers are a CPU rasteriser's and say almost nothing about a phone GPU; they are listed to compare the views with each other only.

- Measured on this machine, headless Chromium, SwiftShader, 390x844, all three blocks in the view, read 2 s after each switch (so the window still holds the switch and a screenshot capture; the numbers are noisy):
  - pin: 93.5 mean / 883 max ms
  - sign: 89.6 / 750
  - ground arrow (the old rug and chevrons, measured on the original page; this page's numbers are in section 0): 132.3 / 650
  - speech bubble: 72.0 / 667
  - callout: 45.2 / 183
  - edge hint: 55.0 / 350
  - the whole page at rest after 2.3 s: 26.6 / 183 (390x844), 39.5 / 333 (844x390), 52.6 / 233 (1440x900).
- Read them as "nothing here is expensive": every view is a handful of transparent quads and one texture per block. The ground arrow is the slowest in software only because its rug and chevrons cover the most pixels with blending; on a phone GPU I would expect all six well inside 16 ms, but that is an expectation, not a measurement.

- Media size: zero. No view stores media; every texture is drawn at run time from `text` and `role` with the system font. A block in the tour file is about 200 bytes of JSON.
- GPU memory at run time: one canvas texture per block, 112 px per em; "This way to the guild house" is about 1 100 x 380 px for the sign (about 1.7 MB with mipmaps), the ground rug about 900 x 1 000 px (3.6 MB). Three blocks stay under 10 MB. Rebuilt only when the text, role or readAtM changes.
- Per frame: billboard turns (a few quaternions), one leader line per callout, the bubble tail (7 vertices), five chevrons; the edge hint does two DOM writes per block per frame.
- The creator's minutes: about one minute per block on the phone (place, type, pick the role, done); the defaults (upright, reads at 6 m, sign view) are right for most instructions. Setting `pointsTo` adds half a minute (aim the ring at the door and press "Aim with the ring").

## 4. The creator's controls

On the phone (creator mode), five large buttons along the bottom, the same for every view:

- **View** - a grid of the six views with a one-line description.
- **Text** - a sheet with the text (with a live counter to 80), the role chips (with their colour), the orientation chips and "Points to": "Aim with the ring" sets it to the point under the centre ring (ground, wall or door), "None" clears it.
- **Size** - steps `readAtM` through 2, 3, 4, 6, 8, 12, 16, 20 m and says the letter height ("Reads at 6 m - letters 16 cm").
- **Turn** - adds 15 degrees to the block's turn, and says so honestly when the orientation makes the turn invisible.
- **Place** - moves the block onto the ring on the ground.
- A chip at the top switches between the station's blocks.

In the desktop editor:

- A tilted bird's-eye view with handles: **Move** (W, on the ground plane only), **Turn** (E, about the vertical only) and **Points to** (T, a white diamond handle with a dashed line from the block, free in x, y, z). Click a block to select it.
- The inspector: block picker, text with counter, role, orientation (with a one-line explanation, and the note that upright and face turn toward the editor camera here), "Reads at" as a logarithmic slider from 1 to 40 m with the resulting letter height and float height, "Points to" as numbers plus "Pick in 3D", "Drag handle" and "Clear", the view grid (required / extra), and the pose as numbers.
- Per view nothing changes in the controls: every view reads the same five fields. That is the point of one model.

## 5. Blunt self-check

- **Rules the page bends:**
  - The family asks for several records, rule 1 asks for one record in every view. I drew the same three records in every view at once (the station's three blocks), never a different example per view.
  - The edge hint draws text in the DOM, not in WebGL. In WebXR that needs the DOM overlay feature (Chrome on Android has it) or a screen-space layer; it is the one view that is not "three.js only".
  - Creator mode stands 1.6 m from the anchor rather than exactly on it, facing the selected block.
  - The frame-time readout measures the frame interval; on this machine headless it is software rendering, not a phone.
- **What I would drop first:** the speech bubble. It is pretty, but it says "someone is talking", and in this model nobody is. Labels read better as pins or callouts, instructions as signs or ground arrows, warnings as signs. If a recurring character speaks, that is family 7's model, not this one.
- **What I am proudest of:** the sign's turning arrow. It makes `pointsTo` honest from every side: the same block tells a visitor coming from the south "straight on" and one coming from the east "to your right", without a second sign and without the creator thinking about it. Second, the callout's halo: it turns the placement error into part of the design instead of hiding from it.
- **Context points the views break:**
  - The ground arrow breaks "looks right with a visible offset" when the ground under it is not flat (a kerb, steps); the app has a ground plane per station, not a ground mesh.
  - The callout's leader line to a far target (30 m) shows the heading error most: a 3 degree heading error is 1.6 m at the door.
  - Nothing here uses sound, so "sound off" costs nothing.
- **Things I did not do:** no right-to-left or vertical scripts, no hyphenation (long words break by character), no occlusion by real people (the camera image is the background; a ground arrow under a person's feet is drawn over them).

document.getElementById('btn-err').addEventListener('click', () => {
  setPlaceErr(!PLACE_ERR.on); updateHash();
  toast(PLACE_ERR.on ? (state.mode === 'visitor' ? 'All content drawn 1 m off (the place stays put)' : 'The 1 m error shows in visitor mode') : 'No placement error');
});

/* tiny markdown renderer for the notes (headings, nested lists, paragraphs, bold, code) */
function renderNotes() {
  const src = document.getElementById('notes-md').textContent.replace(/<!--NOTES-(START|END)-->/g, '').trim();
  const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  let html = '', stack = [], para = [];
  const flushPara = () => { if (para.length) { html += `<p>${inline(para.join(' '))}</p>`; para = []; } };
  const closeTo = depth => { while (stack.length > depth) { html += '</li></ul>'; stack.pop(); } };
  for (const raw of src.split('\n')) {
    const line = raw.replace(/\s+$/, '');
    const li = line.match(/^(\s*)- (.*)$/);
    const h = line.match(/^(#{1,3}) (.*)$/);
    if (li) {
      flushPara(); const depth = Math.floor(li[1].length / 2) + 1;
      if (depth > stack.length) { while (stack.length < depth) { html += '<ul><li>'; stack.push(1); } }
      else { closeTo(depth); html += '</li><li>'; }
      html += inline(li[2]);
    } else if (h) { flushPara(); closeTo(0); html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; }
    else if (!line.trim()) { flushPara(); closeTo(0); }
    else if (stack.length && /^\s+/.test(raw)) { html += ' ' + inline(line.trim()); }
    else { closeTo(0); para.push(line.trim()); }
  }
  flushPara(); closeTo(0);
  document.getElementById('notes-body').innerHTML = html;
}
renderNotes();

/* URL hash: #mode=visitor&view=<name> */
function updateHash() {
  const v = currentViewName();
  const h = `#mode=${state.mode}${v ? `&view=${v}` : ''}${PLACE_ERR.on ? '&err=1' : ''}`;
  if (location.hash !== h) history.replaceState(null, '', h);
}
function readHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  const v = q.get('view'); if (v && VIEW_NAMES.includes(v)) setAllViews(v);
  setPlaceErr(q.get('err') === '1');
  const m = q.get('mode'); setMode(['visitor', 'creator', 'editor'].includes(m) ? m : 'visitor');
}
window.addEventListener('hashchange', readHash);

/* =====================================================================
   Frame loop and frame-time readout
   ===================================================================== */
const ftEl = document.getElementById('ftime');
const samples = []; let last = performance.now(), frameNo = 0, lastFt = 0;
const waiters = [];
function frame(now) {
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); const interval = now - last; last = now;
  const t0 = performance.now();
  updateVisitor(dt);
  if (state.mode !== 'editor') applyCamera();
  updateCreator(); updateEditor();
  const camera = activeCam(); camera.updateMatrixWorld(true);
  for (const b of blocks) { b.appearTarget = state.mode === 'visitor' ? (visitor.inside ? 1 : 0) : 1; b.update(dt, camera, now / 1000); }
  layoutEdgeHints(dt);
  renderer.render(scene, camera);
  const work = performance.now() - t0;
  samples.push({ t: now, work, interval });
  while (samples.length && now - samples[0].t > 2000) samples.shift();
  if (now - lastFt > 250 && samples.length) {
    lastFt = now; const n = samples.length;
    const mw = samples.reduce((s, x) => s + x.work, 0) / n, xw = Math.max(...samples.map(x => x.work));
    const mi = samples.reduce((s, x) => s + x.interval, 0) / n, xi = Math.max(...samples.map(x => x.interval));
    ftEl.textContent = `frame ${mi.toFixed(1)} mean / ${xi.toFixed(1)} max ms`; ftEl.dataset.work = `${mw.toFixed(1)} / ${xw.toFixed(1)}`;
  }
  if (snapFrames > 0) snapFrames--;
  frameNo++;
  for (let i = waiters.length - 1; i >= 0; i--) if (frameNo >= waiters[i].at) { waiters[i].res(); waiters.splice(i, 1); }
  requestAnimationFrame(frame);
}
const drawn = (n = 3) => new Promise(res => waiters.push({ at: frameNo + n, res }));

/* =====================================================================
   Script hook
   ===================================================================== */
function exportRecord(r) {
  return { id: r.id, model: 'short-text', view: r.view, pose: { ...r.pose }, data: { ...sanitizeModel(r.model) } };
}
window.__stationBlock = {
  family: FAMILY,
  views: [...VIEW_NAMES],
  modes: ['visitor', 'creator', 'editor'],
  async setMode(name) { setMode(String(name)); snapFrames = 4; await drawn(4); },
  async setView(name) { setAllViews(String(name)); refreshAll(); updateHash(); snapFrames = 4; await drawn(4); },
  async walkTo(x, z) {
    if (![x, z].every(Number.isFinite)) throw new Error('walkTo needs finite x and z');
    visitor.x = x; visitor.z = z; visitor.auto = null; snapFrames = 4; await drawn(4);
  },
  async lookAt(x, y, z) {
    if (![x, y, z].every(Number.isFinite)) throw new Error('lookAt needs finite x, y and z');
    const s = state.mode === 'creator' ? creator : visitor;
    const dx = x - s.x, dy = y - EYE, dz = z - s.z;
    s.yaw = Math.atan2(-dx, -dz); s.pitch = Math.atan2(dy, Math.hypot(dx, dz)); visitor.auto = null; snapFrames = 4; await drawn(4);
  },
  async rebuildMs() { const t0 = performance.now(); for (const bl of blocks) bl.rebuild(); const ms = performance.now() - t0; snapFrames = 4; await drawn(4); return ms; },
  async params() { return { ...RIB }; },
  async setParam(name, value) {
    const x = Number(value);
    if (typeof RIB[name] !== 'number' || !Number.isFinite(x)) throw new Error('unknown or non-numeric ground parameter ' + name);
    RIB[name] = x; for (const bl of blocks) if (bl.rec.view === 'ground-arrow') bl.rebuild(); snapFrames = 4; await drawn(4);
  },
  async resetParams() { Object.assign(RIB, GROUND_DEFAULTS); for (const bl of blocks) if (bl.rec.view === 'ground-arrow') bl.rebuild(); snapFrames = 4; await drawn(4); },
  async setError(on, bearingDeg = 53) { setPlaceErr(on, bearingDeg); updateHash(); snapFrames = 4; await drawn(4); },
  async describe() {
    return { family: FAMILY, fields: FIELDS.map(f => ({ ...f })), views: VIEWS.map(v => ({ name: v.name, required: v.required, usesFields: Object.keys(v.uses) })) };
  },
  async exportModel() {
    return { family: FAMILY, model: 'short-text', version: 2, station: { name: STATION.name, radiusM: STATION.r }, blocks: records.map(exportRecord) };
  },
  /* Round-2 probes for the checks: the bubble tail's drawn angle (degrees) and the edge-hint states per block. */
  async probe() {
    return blocks.map(b => ({ id: b.rec.id, view: b.rec.view, tailDeg: b.view.tailAngle ? +(b.view.tailAngle() * 180 / Math.PI).toFixed(1) : null,
      edge: b.view.isEdgeHint ? (b.view.edge ? 'edge' : b.view.full ? 'full' : 'inview') : null }));
  },
};

readHash();
layout();
requestAnimationFrame(t => { last = t; frame(t); });
</script>
</body>
