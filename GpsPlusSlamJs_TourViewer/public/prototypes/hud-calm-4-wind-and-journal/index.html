<!doctype html>
<!-- Prototype: calm HUD round 2, direction 4 "Call the wind, keep a journal". Throwaway; not wired to the app. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>Wind and Journal</title>
    <style>
      :root {
        --ink: #f3f5f7;
        --muted: #b3bcc6;
        --plate: rgb(10 13 18 / 78%);
        --line: rgb(255 255 255 / 16%);
        --beam: #fb923c;
        --paper: #f7f1e3;
        --paper-ink: #2a241c;
        --paper-muted: #6b5f4e;
        --tap: 48px;
        --font:
          corbel, "Noto Sans", system-ui, -apple-system, "Segoe UI", roboto,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101318;
        color: var(--ink);
        font: 15px/1.4 var(--font);
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }

      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }

      p {
        margin: 0;
      }

      .dev {
        position: fixed;
        inset: 0;
        overflow: hidden;
        user-select: none;
      }

      #gl {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
        outline: 0;
      }

      #gl:active {
        cursor: grabbing;
      }

      /* the fake camera feed: a lens vignette over the 3D square */
      .feed {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 50% 45%,
          transparent 60%,
          rgb(0 0 0 / 26%) 100%
        );
      }

      /* ================= the HUD: Exit and the journal at the top left; the radar (stations only) at the
   top right; the story chip, the transport and the wind in one row at the bottom ================= */
      .exit,
      .journal-btn {
        position: absolute;
        z-index: 30;
        top: calc(14px + env(safe-area-inset-top));
        width: 44px;
        height: 44px;
        padding: 0;
        border-radius: 50%;
        display: grid;
        place-items: center;
      }

      .exit {
        left: calc(14px + env(safe-area-inset-left));
        border: 2px solid rgb(255 255 255 / 72%);
        background: rgb(10 13 18 / 70%);
      }

      .exit svg {
        width: 20px;
        height: 20px;
      }

      .journal-btn {
        left: calc(66px + env(safe-area-inset-left));
        border: 0;
        background: var(--plate);
        box-shadow: 0 4px 14px rgb(0 0 0 / 28%);
        animation: fade-in 0.4s ease;
      }

      .journal-btn svg {
        width: 24px;
        height: 24px;
      }

      /* once, when a station's page is written on leaving it: a single small lift, never a badge */
      .journal-btn.wrote {
        animation: wrote 1s ease;
      }

      @keyframes wrote {
        0%,
        100% {
          transform: none;
          background: var(--plate);
        }
        35% {
          transform: translateY(-4px) scale(1.12);
          background: rgb(247 241 227 / 92%);
          color: #1d232b;
        }
      }

      .radar {
        position: absolute;
        z-index: 26;
        top: calc(64px + env(safe-area-inset-top));
        right: calc(14px + env(safe-area-inset-right));
        width: 112px;
        height: 112px;
        border-radius: 50%;
        pointer-events: none;
      }

      .wind {
        position: absolute;
        z-index: 27;
        right: calc(16px + env(safe-area-inset-right));
        bottom: calc(22px + env(safe-area-inset-bottom));
        width: var(--tap);
        height: var(--tap);
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: var(--plate);
        box-shadow: 0 4px 14px rgb(0 0 0 / 28%);
        display: grid;
        place-items: center;
        animation: fade-in 0.4s ease;
      }

      .wind svg {
        width: 30px;
        height: 30px;
      }

      .wind[aria-pressed="true"] {
        background: rgb(255 246 220 / 94%);
        color: #6b4511;
      }

      .transport {
        position: absolute;
        z-index: 27;
        left: 50%;
        bottom: calc(18px + env(safe-area-inset-bottom));
        width: 56px;
        height: 56px;
        margin-left: -28px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: conic-gradient(
          #fff calc(var(--p, 0) * 1turn),
          rgb(255 255 255 / 22%) 0
        );
        display: grid;
        place-items: center;
        box-shadow: 0 4px 14px rgb(0 0 0 / 30%);
        animation: fade-in 0.3s ease;
      }

      .transport::before {
        content: "";
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        background: rgb(10 13 18 / 88%);
      }

      .transport svg {
        position: relative;
        width: 24px;
        height: 24px;
      }

      .chip {
        position: absolute;
        z-index: 27;
        left: calc(14px + env(safe-area-inset-left));
        bottom: calc(22px + env(safe-area-inset-bottom));
        max-width: calc(50% - 46px);
        min-height: var(--tap);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 4px 5px 6px;
        border-radius: 24px;
        background: var(--plate);
        box-shadow: 0 4px 14px rgb(0 0 0 / 28%);
        animation: fade-in 0.4s ease;
      }

      .chip .face {
        flex: none;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid #fff;
      }

      .chip .title {
        flex: 1;
        min-width: 0;
        font-size: 13.5px;
        font-weight: 700;
        line-height: 1.2;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .chip .leave {
        flex: none;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgb(255 255 255 / 10%);
        font-size: 22px;
        line-height: 1;
      }

      .journal-open [data-hud] {
        visibility: hidden;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
        }
      }

      /* ================= the journal: an off-AR page over the paused view ================= */
      .paused {
        position: absolute;
        z-index: 48;
        inset: 0;
        background: rgb(14 16 20 / 82%);
        display: grid;
        place-items: center;
        animation: fade-in 0.25s ease;
      }

      .journal {
        position: relative;
        width: calc(100% - 24px);
        max-width: 560px;
        max-height: calc(
          100% - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom)
        );
        display: flex;
        flex-direction: column;
        border-radius: 18px;
        background: var(--paper);
        color: var(--paper-ink);
        box-shadow: 0 18px 50px rgb(0 0 0 / 45%);
        overflow: hidden;
        user-select: text;
      }

      .journal header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 10px 4px 18px;
      }

      .journal header h2 {
        flex: 1;
        margin: 0;
        font:
          700 21px/1.2 Georgia,
          serif;
      }

      .journal .pause-note {
        font-size: 12.5px;
        color: var(--paper-muted);
      }

      .journal .jclose {
        flex: none;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgb(42 36 28 / 8%);
        font-size: 24px;
        line-height: 1;
        color: var(--paper-ink);
      }

      .jtabs {
        display: flex;
        gap: 6px;
        padding: 6px 16px 8px;
        overflow-x: auto;
      }

      .jtabs button {
        min-height: 40px;
        padding: 6px 14px;
        border: 2px solid rgb(42 36 28 / 22%);
        border-radius: 20px;
        background: transparent;
        color: var(--paper-ink);
        font-weight: 700;
        white-space: nowrap;
      }

      .jtabs button[aria-selected="true"] {
        border-color: var(--paper-ink);
        background: var(--paper-ink);
        color: var(--paper);
      }

      .jtabs .star {
        margin-left: 6px;
        color: #d8681c;
      }

      .jtabs button[aria-selected="true"] .star {
        color: #ffb37a;
      }

      .jpage {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 4px 18px 10px;
      }

      .jpage h3 {
        margin: 4px 0 0;
        font:
          700 19px/1.25 Georgia,
          serif;
      }

      .jpage .when {
        font-size: 13px;
        color: var(--paper-muted);
      }

      .more,
      .all-seen {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 12px 0 4px;
        padding: 10px 12px;
        border-radius: 12px;
        font-weight: 700;
      }

      .more {
        background: rgb(216 104 28 / 12%);
        color: #8a3d0c;
      }

      .mstar {
        font-size: 30px;
        line-height: 1;
        color: #d8681c;
      }

      .all-seen {
        background: rgb(42 36 28 / 6%);
        color: var(--paper-muted);
      }

      .all-seen svg {
        flex: none;
        width: 26px;
        height: 26px;
      }

      .more small,
      .all-seen small {
        display: block;
        font-weight: 500;
        font-size: 13px;
        color: var(--paper-muted);
      }

      .jpage h4 {
        margin: 14px 0 6px;
        font-size: 11.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--paper-muted);
      }

      .jlist {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 8px;
      }

      .jlist li {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .jlist .thumb {
        flex: none;
        width: 46px;
        height: 46px;
        border-radius: 10px;
        display: grid;
        place-items: center;
      }

      .thumb svg {
        width: 30px;
        height: 30px;
      }

      .jlist .face {
        flex: none;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 3px solid var(--paper);
        box-shadow: 0 0 0 2px rgb(42 36 28 / 25%);
      }

      .jlist b {
        display: block;
        font-size: 15px;
        line-height: 1.25;
      }

      .jlist span {
        display: block;
        font-size: 13px;
        line-height: 1.3;
        color: var(--paper-muted);
      }

      .jempty {
        margin: 8px 0;
        color: var(--paper-muted);
      }

      .jback {
        margin: 4px 16px calc(14px + env(safe-area-inset-bottom));
        min-height: 48px;
        border: 0;
        border-radius: 24px;
        background: var(--paper-ink);
        color: var(--paper);
        font-weight: 700;
      }

      /* the measuring hook: any two HUD boxes that overlap get a red outline (only while measuring) */
      .measuring .ovl {
        outline: 3px solid #ff2d2d;
        outline-offset: 0;
      }

      /* ================= demo chrome: dashed, not part of the design, not measured ================= */
      .chrome {
        position: absolute;
        z-index: 40;
        top: calc(12px + env(safe-area-inset-top));
        right: calc(10px + env(safe-area-inset-right));
        max-width: calc(
          100% - 132px - env(safe-area-inset-left) - env(safe-area-inset-right)
        );
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 3px;
        border: 1.5px dashed rgb(255 255 255 / 55%);
        border-radius: 22px;
        background: rgb(0 0 0 / 50%);
      }

      .chrome button {
        height: 36px;
        min-width: 34px;
        padding: 0 7px;
        border: 0;
        border-radius: 18px;
        background: transparent;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }

      .chrome button:active,
      .chrome button[aria-pressed="true"] {
        background: rgb(255 255 255 / 20%);
      }

      .chrome .beat-name {
        min-width: 0;
        flex: 0 1 auto;
        max-width: 34vw;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 650;
      }

      .chrome .info-btn {
        font:
          italic 700 16px/1 Georgia,
          serif;
      }

      .chrome svg {
        width: 18px;
        height: 18px;
        vertical-align: middle;
      }

      .readout {
        position: absolute;
        z-index: 40;
        left: 50%;
        bottom: calc(92px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        padding: 4px 9px;
        border: 1.5px dashed rgb(255 255 255 / 45%);
        border-radius: 10px;
        background: rgb(0 0 0 / 60%);
        font:
          11px/1.35 ui-monospace,
          consolas,
          monospace;
        color: #fff;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        white-space: pre;
      }

      .try {
        position: absolute;
        z-index: 40;
        left: 50%;
        top: 38%;
        transform: translateX(-50%);
        width: 320px;
        max-width: calc(100% - 48px);
        padding: 9px 13px;
        border: 1.5px dashed rgb(255 255 255 / 45%);
        border-radius: 14px;
        background: rgb(0 0 0 / 58%);
        font-size: 13.5px;
        line-height: 1.4;
        color: #fff;
        text-align: center;
        transition: opacity 0.8s;
        pointer-events: none;
      }

      .try.gone {
        opacity: 0;
      }

      .rip {
        position: absolute;
        z-index: 49;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border-radius: 50%;
        border: 3px solid #fff;
        box-shadow: 0 0 0 2px rgb(0 0 0 / 35%);
        pointer-events: none;
        animation: rip 0.7s ease-out forwards;
      }

      @keyframes rip {
        from {
          transform: scale(0.5);
          opacity: 1;
        }
        to {
          transform: scale(1.5);
          opacity: 0;
        }
      }

      .info {
        position: absolute;
        z-index: 50;
        top: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        max-width: 430px;
        overflow: auto;
        padding: 14px 16px calc(20px + env(safe-area-inset-bottom));
        background: rgb(14 18 23 / 97%);
        border-left: 1px solid var(--line);
        font-size: 14px;
        line-height: 1.45;
        user-select: text;
      }

      .info h1 {
        margin: 0 0 4px;
        font-size: 19px;
      }

      .info h3 {
        margin: 14px 0 4px;
        font-size: 11.5px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .info p,
      .info li {
        color: #dfe4ea;
      }

      .info ol,
      .info ul {
        margin: 4px 0;
        padding-left: 20px;
      }

      .info .close {
        position: sticky;
        top: 0;
        float: right;
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 50%;
        background: rgb(255 255 255 / 10%);
        font-size: 22px;
      }

      .info .knob {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 5px;
        margin: 6px 0;
      }

      .info .knob span {
        min-width: 112px;
        font-weight: 600;
        color: #fff;
      }

      .info .knob button,
      .info .beats button {
        min-height: 36px;
        padding: 4px 10px;
        border: 1px solid rgb(255 255 255 / 30%);
        border-radius: 10px;
        background: rgb(255 255 255 / 6%);
        font-size: 13px;
      }

      .info .knob button[aria-pressed="true"] {
        border-color: #fff;
        background: rgb(255 255 255 / 18%);
      }

      .info .beats {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .info table {
        width: 100%;
        border-collapse: collapse;
        font:
          12px/1.4 ui-monospace,
          consolas,
          monospace;
        font-variant-numeric: tabular-nums;
      }

      .info td,
      .info th {
        padding: 3px 4px;
        border-bottom: 1px solid var(--line);
        text-align: right;
      }

      .info td:first-child,
      .info th:first-child {
        text-align: left;
      }

      .exited {
        position: absolute;
        z-index: 60;
        inset: 0;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 14px;
        background: #0d1015;
        text-align: center;
        font-size: 16px;
      }

      .exited .back {
        min-height: 44px;
        padding: 8px 18px;
        border: 0;
        border-radius: 22px;
        background: #fff;
        color: #1d232b;
        font-weight: 700;
      }

      @media (orientation: landscape) and (height <= 520px) {
        .radar {
          top: calc(60px + env(safe-area-inset-top));
          width: 100px;
          height: 100px;
        }
        .wind {
          bottom: calc(14px + env(safe-area-inset-bottom));
        }
        .transport {
          bottom: calc(10px + env(safe-area-inset-bottom));
        }
        .chip {
          bottom: calc(14px + env(safe-area-inset-bottom));
          max-width: 300px;
        }
        .try {
          top: 30%;
        }
        .journal {
          max-width: 640px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.185.1/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main class="dev" id="dev">
      <canvas
        id="gl"
        tabindex="0"
        aria-label="The square, standing in for the camera view"
      ></canvas>
      <div class="feed" aria-hidden="true"></div>

      <!-- the HUD (everything with data-hud is measured) -->
      <button
        type="button"
        class="exit"
        id="exit"
        data-hud
        aria-label="Exit AR"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="#fff"
          stroke-width="3"
          stroke-linecap="round"
        >
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
      <button
        type="button"
        class="journal-btn"
        id="journal-btn"
        data-hud
        hidden
        aria-label="Open the journal"
      >
        <svg viewBox="0 0 24 24">
          <path
            d="M4 4.5A1.5 1.5 0 0 1 5.5 3H11a1 1 0 0 1 1 1v16.5c-1-.9-2.3-1.3-3.6-1.3H5.5A1.5 1.5 0 0 1 4 17.7z"
            fill="currentColor"
          />
          <path
            d="M20 4.5A1.5 1.5 0 0 0 18.5 3H13a1 1 0 0 0-1 1v16.5c1-.9 2.3-1.3 3.6-1.3h2.9a1.5 1.5 0 0 0 1.5-1.5z"
            fill="currentColor"
            opacity=".62"
          />
        </svg>
      </button>
      <canvas
        class="radar"
        id="radar"
        data-hud
        width="224"
        height="224"
      ></canvas>
      <div class="chip" id="chip" data-hud hidden>
        <span class="face"></span><span class="title"></span
        ><button type="button" class="leave" aria-label="Leave this story">
          &times;
        </button>
      </div>
      <button
        type="button"
        class="transport"
        id="transport"
        data-hud
        hidden
        aria-label="Pause"
      ></button>
      <button
        type="button"
        class="wind"
        id="wind"
        data-hud
        hidden
        aria-pressed="false"
        aria-label="Call the wind towards something you have not seen yet"
      >
        <svg
          viewBox="0 0 32 32"
          fill="none"
          stroke="currentColor"
          stroke-width="2.8"
          stroke-linecap="round"
        >
          <path d="M4 12h14.5a3.5 3.5 0 1 0-3.5-3.5" />
          <path d="M4 18h19a3.5 3.5 0 1 1-3.5 3.5" />
          <path d="M4 24h8" />
        </svg>
      </button>

      <!-- demo chrome -->
      <div class="chrome" id="chrome">
        <button type="button" id="prev" aria-label="Previous beat">
          &#9664;
        </button>
        <button
          type="button"
          class="beat-name"
          id="beat-name"
          aria-label="Replay this beat"
        >
          1/10 Outside
        </button>
        <button type="button" id="next" aria-label="Next beat">&#9654;</button>
        <button
          type="button"
          class="info-btn"
          id="info-btn"
          aria-label="About this page and its settings"
        >
          i
        </button>
        <button
          type="button"
          id="measure-btn"
          aria-pressed="false"
          aria-label="Show the measuring numbers"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fff"
            stroke-width="2.4"
            stroke-linecap="round"
          >
            <rect x="2.5" y="8" width="19" height="8" rx="1.5" />
            <path d="M7 8v3M11 8v4M15 8v3M19 8v4" />
          </svg>
        </button>
      </div>
      <div class="readout" id="readout" hidden></div>
      <p class="try" id="try">
        Drag sideways to look, up and down to walk (WASD on a keyboard). Tap
        people and things. Inside a station, the wind button shows the way to
        something you have not seen. Or press &#9654; for the next beat.
      </p>

      <!-- the journal, over the paused view -->
      <div class="paused" id="paused" hidden>
        <section
          class="journal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="jtitle"
        >
          <header>
            <h2 id="jtitle">Journal</h2>
            <span class="pause-note">The view is paused</span
            ><button
              type="button"
              class="jclose"
              id="jclose"
              aria-label="Close the journal"
            >
              &times;
            </button>
          </header>
          <nav
            class="jtabs"
            id="jtabs"
            role="tablist"
            aria-label="Stations"
          ></nav>
          <div class="jpage" id="jpage" role="tabpanel"></div>
          <button type="button" class="jback" id="jback">

      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

      /* ---------------- renderer, camera, the square ---------------- */

      (function sky() {
        const g = new THREE.SphereGeometry(400, 24, 12);
        const c = new Float32Array(g.attributes.position.count * 3);
        const top = new THREE.Color("#86b6df"),
          mid = new THREE.Color("#dbe7ef"),
          low = new THREE.Color("#efe8da"),
          o = new THREE.Color();
        for (let i = 0; i < g.attributes.position.count; i++) {
          const h = g.attributes.position.getY(i) / 400;
          if (h >= 0) {
            o.lerpColors(mid, top, Math.min(1, h / 0.5));
          } else {
            o.lerpColors(mid, low, Math.min(1, -h / 0.1));
          }
          c.set([o.r, o.g, o.b], i * 3);
        }
        g.setAttribute("color", new THREE.BufferAttribute(c, 3));
        const m = new THREE.Mesh(
          g,
          new THREE.MeshBasicMaterial({
            vertexColors: true,

            fog: false,

      (function ground() {
        const S = 512,

        cv.width = cv.height = S;
        const g = cv.getContext("2d");
        let s = 11;
        const r = () =>
          (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296;
        g.fillStyle = "#b9b09e";
        g.fillRect(0, 0, S, S);
        const n = 12,
          k = S / n;
        for (let x = 0; x < n; x++) {
          for (let z = 0; z < n; z++) {
            const v = 196 + r() * 22;
            g.fillStyle = `rgb(${v} ${v - 7} ${v - 20})`;
            g.fillRect(x * k + 1.5, z * k + 1.5, k - 3, k - 3);
          }
        }
        const t = new THREE.CanvasTexture(cv);
        t.colorSpace = THREE.SRGBColorSpace;
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(40, 40);
        t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
        const m = new THREE.Mesh(
          new THREE.PlaneGeometry(340, 340).rotateX(-Math.PI / 2),

        m.position.z = -30;
        scene.add(m);

      const mats = new Map();
      const mat = (c) => {
        if (!mats.has(c)) {
          mats.set(c, new THREE.MeshLambertMaterial({ color: c }));
        }
        return mats.get(c);
      };
      const box = (w, h, d, c, x, y, z, ry = 0, parent = scene) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c));
        m.position.set(x, y, z);
        m.rotation.y = ry;
        parent.add(m);
        return m;
      };
      const cyl = (r0, r1, h, c, x, y, z, n = 16, parent = scene) => {

      (function town() {

      /* ---------------- words in the world: Canvas 2D textures ---------------- */
      function canvasTex(cw, ch) {
        const cv = document.createElement("canvas");
        cv.width = cw;
        cv.height = ch;
        const t = new THREE.CanvasTexture(cv);
        t.colorSpace = THREE.SRGBColorSpace;
        t.anisotropy = 4;
        return { cv, g: cv.getContext("2d"), t };
      }
      function wrap(g, text, maxW) {
        const lines = [];
        let cur = "";
        for (const w of text.split(/\s+/).filter(Boolean)) {
          const t = cur ? cur + " " + w : w;
          if (cur && g.measureText(t).width > maxW) {
            lines.push(cur);
            cur = w;
          } else {
            cur = t;
          }
        }
        if (cur) {
          lines.push(cur);
        }
        return lines;
      }
      function roundRect(g, x, y, w, h, r) {
        g.beginPath();
        g.roundRect(x, y, w, h, r);
      }
      /** a paper plate with a title and a body, drawn once */
      function paperPlate(
        wM,
        hM,
        title,
        body,
        { cw = 512, size = 34, bg = "#f4ecd8" } = {},
      ) {
        const ch = Math.round((cw * hM) / wM),
          T = canvasTex(cw, ch),
          g = T.g,
          pad = cw * 0.06;
        g.fillStyle = bg;
        g.fillRect(0, 0, cw, ch);
        g.strokeStyle = "#6b5a44";
        g.lineWidth = cw * 0.02;
        g.strokeRect(
          g.lineWidth / 2,
          g.lineWidth / 2,
          cw - g.lineWidth,
          ch - g.lineWidth,
        );
        g.fillStyle = "#2a241c";
        g.font = `700 ${size * 1.12}px Georgia, serif`;
        g.textBaseline = "top";
        let y = pad;
        if (title) {
          g.fillText(title, pad, y);
          y += size * 1.55;
        }
        g.font = `${size}px Georgia, serif`;
        for (const l of wrap(g, body, cw - pad * 2)) {
          g.fillText(l, pad, y);
          y += size * 1.28;
        }
        T.t.needsUpdate = true;
        return new THREE.Mesh(
          new THREE.PlaneGeometry(wM, hM),
          new THREE.MeshBasicMaterial({ map: T.t, toneMapped: false }),
        );
      }

        ring.position.y = 0.04;
        g.add(gem, col, built, ring);
        for (const m of [gem, col, built, ring]) {

        beams[st.id] = { g, gem, col, built, ring, a: 1 };

      /* ---------------- people ---------------- */
      function makeFigure({

        box(0.035, 0.05, 0.06, skin, 0, -0.005, 0.13, 0, head); // nose: shows where the face looks
        box(0.03, 0.03, 0.02, "#22262b", 0.048, 0.035, 0.118, 0, head);
        box(0.03, 0.03, 0.02, "#22262b", -0.048, 0.035, 0.118, 0, head);
        if (hat === "cap" || hat === "dress") {
          const c = new THREE.Mesh(

              0.14,
              16,
              8,
              0,
              Math.PI * 2,

          head.add(c);

        if (hat === "helmet") {
          const c = new THREE.Mesh(
            new THREE.ConeGeometry(0.17, 0.2, 14),

          c.position.y = 0.13;
          head.add(c);

        if (hat === "scarf") {

            mat(hatColor),
          );
          c.rotation.x = Math.PI / 2;
          c.position.y = -0.13;
          head.add(c);
        }
        const armL = pivot(0.27, 1.5, 0, root),
          armR = pivot(-0.27, 1.5, 0, root);
        box(0.09, 0.6, 0.09, coat, 0, -0.3, 0, 0, armL);
        box(0.09, 0.6, 0.09, coat, 0, -0.3, 0, 0, armR);
        box(0.08, 0.08, 0.08, skin, 0, -0.62, 0, 0, armL);
        box(0.08, 0.08, 0.08, skin, 0, -0.62, 0, 0, armR);
        return { root, head, armL, armR, legL, legR };
      }

      const SPARK_V = `attribute vec4 aSeed;uniform float uT,uViewH,uStrength,uHeight,uRadius,uSwirl,uSize;varying float vA;
void main(){float life=fract(aSeed.x+uT*(0.45+0.4*aSeed.y)/uHeight);float ang=aSeed.z*6.2832+uT*uSwirl*(0.4+aSeed.w);
float r=uRadius*(0.25+0.75*aSeed.w)*(1.0-0.5*life);vec3 p=vec3(cos(ang)*r,0.3+life*uHeight,sin(ang)*r);
vec4 mv=modelViewMatrix*vec4(p,1.0);gl_Position=projectionMatrix*mv;
gl_PointSize=clamp(uSize*uViewH*0.5*projectionMatrix[1][1]/max(0.1,-mv.z),2.0,7.0);

      const SPARK_F = `uniform vec3 uColor;varying float vA;void main(){float d=length(gl_PointCoord-0.5);float a=smoothstep(0.5,0.12,d)*vA;if(a<0.01)discard;
gl_FragColor=vec4(mix(uColor,vec3(1.0),smoothstep(0.22,0.0,d)*0.5),a);
#include <colorspace_fragment>
}`;
      const viewH = { value: 800 };
      function sparks(n, h, r) {
        const g = new THREE.BufferGeometry();
        g.setAttribute(
          "position",
          new THREE.BufferAttribute(new Float32Array(n * 3), 3),
        );
        const sd = new Float32Array(n * 4);
        for (let i = 0; i < n * 4; i++) {
          sd[i] = Math.random();
        }
        g.setAttribute("aSeed", new THREE.BufferAttribute(sd, 4));
        const m = new THREE.ShaderMaterial({
          uniforms: {
            uT: { value: Math.random() * 10 },
            uViewH: viewH,
            uStrength: { value: 0.6 },
            uHeight: { value: h },
            uRadius: { value: r },
            uSwirl: { value: 0.6 },
            uSize: { value: 0.05 },
            uColor: { value: new THREE.Color(COL.gold) },
          },
          vertexShader: SPARK_V,
          fragmentShader: SPARK_F,
          transparent: true,
          depthWrite: false,
        });
        const p = new THREE.Points(g, m);
        p.frustumCulled = false;
        p.raycast = () => undefined;
        return p;

      /* ---------------- speech bubbles: a person's words, in 3D, over the person ---------------- */
      const BUB_W = 640,
        BUB_H = 380;
      function makeBubble() {
        const T = canvasTex(BUB_W, BUB_H);
        const mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(1, BUB_H / BUB_W),
          new THREE.MeshBasicMaterial({
            map: T.t,
            transparent: true,
            depthWrite: false,
            depthTest: false,
            toneMapped: false,
            opacity: 0,
          }),
        );
        mesh.renderOrder = 20;
        mesh.visible = false;
        mesh.raycast = () => undefined;
        scene.add(mesh);
        return { T, mesh, a: 0, key: "" };
      }
      function drawBubble(it) {
        const b = it.bubble,
          L = it.line;
        if (!L) {
          return;
        }
        const text = L.held ? "…" : L.words.slice(0, L.shown).join(" ");
        const tag = L.held
          ? ""
          : W.t < L.resumedUntil
            ? " · as I was saying"
            : "";
        const key = text + "|" + tag;
        if (key === b.key) {
          return;
        }
        b.key = key;
        const g = b.T.g;
        g.clearRect(0, 0, BUB_W, BUB_H);
        g.font = "600 33px system-ui, sans-serif";
        const lines = wrap(g, text, BUB_W - 70).slice(-6);
        const lh = 41,
          top = 18,
          nameH = 40,
          bh = Math.max(lines.length, 1) * lh + nameH + 34,
          bw = L.held ? 170 : BUB_W - 16;
        const bx = (BUB_W - bw) / 2,
          by = BUB_H - 34 - bh;
        g.fillStyle = "rgb(0 0 0 / 22%)";
        roundRect(g, bx + 3, by + 6, bw, bh, 30);
        g.fill();
        g.fillStyle = COL.paper;
        roundRect(g, bx, by, bw, bh, 30);
        g.fill();
        g.beginPath();
        g.moveTo(BUB_W / 2 - 22, by + bh - 1);
        g.lineTo(BUB_W / 2, BUB_H - 4);
        g.lineTo(BUB_W / 2 + 22, by + bh - 1);
        g.closePath();
        g.fill();
        g.textBaseline = "top";
        if (L.held) {
          g.font = "800 44px system-ui, sans-serif";
          g.fillStyle = COL.ink;
          g.textAlign = "center";
          g.fillText("…", BUB_W / 2, by + 16);
          g.textAlign = "left";
        } else {
          g.fillStyle = it.coat;
          g.font = "800 27px system-ui, sans-serif";
          g.fillText((it.short ?? it.name) + tag, bx + 30, by + top);
          g.fillStyle = COL.ink;
          g.font = "600 33px system-ui, sans-serif";
          lines.forEach((l, i) =>
            g.fillText(l, bx + 30, by + top + nameH + i * lh),
          );
        }
        b.T.t.needsUpdate = true;
      }

        try {
          const u = new SpeechSynthesisUtterance(text);
          u.pitch = it.pitch ?? 1;
          u.rate = 1.0;
          u.lang = "en-GB";
          speechSynthesis.cancel();
          speechSynthesis.speak(u);
        } catch {
          /* the voice is a bonus */
        }
      }

      /* ---------------- lines: a person speaks, word by word ---------------- */
      function say(it, text, { onEnd } = {}) {
        it.line = {
          words: text.split(" "),
          shown: 1,
          acc: 1,
          held: false,
          doneAt: null,
          onEnd,
          resumedUntil: 0,
        };
        it.bubble.key = "";
        speak(it, text);
        drawBubble(it);
      }
      function updateLine(it, dt) {
        const L = it.line;
        if (!L) {
          return;
        }
        const d = dist(it);
        if (!L.held && L.doneAt == null && d > HOLD_FAR_M) {
          L.held = true;
          hush();
        } else if (L.held && d < RESUME_M) {
          L.held = false;
          L.resumedUntil = W.t + 2.2;
          speak(it, "As I was saying, " + L.words.slice(L.shown).join(" "));
        }
        if (!L.held) {
          L.acc += dt * WORDS_PER_S;
          L.shown = Math.min(L.words.length, Math.floor(L.acc));
          if (L.shown === L.words.length && L.doneAt == null) {
            L.doneAt = W.t;
          }
          if (
            L.doneAt != null &&
            W.t - L.doneAt > 2.4 + L.words.length * 0.07
          ) {
            it.line = null;
            L.onEnd?.();
            return;
          }
        }
        drawBubble(it);
      }

      /* ---------------- stories ---------------- */
      function enterStory(s) {
        if (W.story && W.story.s !== s) {
          const old = byId[W.story.s.steps[0]];
          old.line = null;
        }
        W.story = { s, step: 0, doneAt: null };
        s.entered = true;
        const ch = byId[s.steps[0]];
        say(ch, s.intro, {
          onEnd: () => {
            markSeen(ch);
            if (W.story?.s === s && W.story.step === 0) {
              W.story.step = 1;
            }
          },
        });
      }
      function leaveStory() {
        if (!W.story) {
          return;
        }
        const ch = byId[W.story.s.steps[0]];
        if (ch.line) {
          ch.line = null;
          hush();
        }
        W.story = null;
      }
      function updateStory() {
        const S = W.story;
        if (!S) {
          return;
        }
        if (S.doneAt == null && S.step >= 1 && byId[S.s.steps[S.step]].seen) {
          S.doneAt = W.t;
          S.s.done = true;
          const ch = byId[S.s.steps[0]];
          if (dist(ch) < 12 && !ch.line) {
            say(ch, S.s.outro);
          }
        }
        if (S.doneAt != null && W.t - S.doneAt > 3) {
          W.story = null;
        }
      }

      /* ---------------- playing things ---------------- */
      function play(it) {
        if (it.state === "done") {
          it.prog = 0;
        }
        it.state = "playing";
        W.hudPaused = W.hudPaused.filter((x) => x !== it);
      }
      function pause(it) {
        if (it.state === "playing") {
          it.state = "paused";
        }
      }
      function tapItem(it) {
        if (it.kind === "character") {
          const s = storyOf(it);
          if (s && !s.done && W.story?.s !== s) {
            enterStory(s);
            return;
          } // talking to a story's first person enters it
          if (!it.line) {
            say(it, it.again);
          }
          return;
        }
        if (it.kind === "video" || it.kind === "audio") {
          if (it.state === "playing") {
            pause(it);
          } else {
            play(it);
          }
          return;
        }
        if (it.kind === "long") {
          it.page = (it.page + 1) % it.pages.length;
          if (it.page === it.pages.length - 1) {
            markSeen(it);
          }
          drawLectern(it);
          return;
        }
        if (it.kind === "model") {
          it.noteOn = true;
          markSeen(it);
        }
      }
      function transportTap() {
        const now = playing().filter((it) => it.st === W.station);
        if (now.length) {
          for (const it of now) {
            pause(it);
          }
          W.hudPaused = now;
        } else {
          for (const it of W.hudPaused) {
            play(it);
          }
          W.hudPaused = [];
        }
      }

      /* ---------------- entering and leaving a station ---------------- */
      function enterStation(id) {
        W.station = id;
        W.visited[id] = true;
        W.lastStation = id;
        if (id === "A" && !W.greeted) {
          W.greeted = true;
          byId.greta.greetPending = true;
        } // the one deliberate start by arriving: once per visit, within earshot
      }
      function leaveStation(id) {
        W.station = null;
        for (const it of ITEMS) {
          if (it.st === id) {
            pause(it);
            it.line = null;
          }
        }
        hush();
        W.hudPaused = [];
        stopDrift();
        if (W.story?.s.st === id) {
          W.story = null;
        }
        // the journal page for this station is written now: one small lift of its button, whatever is left. Never a badge.
        const jb = $("#journal-btn");
        jb.classList.remove("wrote");
        void jb.offsetWidth;
        jb.classList.add("wrote");
      }

      /* ======================= the wind: a summoned drift toward the nearest unseen thing ======================= */
      // Where it goes: the active story's next step first (the story wins), else the nearest unseen item of this
      // station, else (everything here seen) the nearest other station that still has something unseen.
      function windTarget() {
        const S = W.story;
        if (S && S.step >= 1 && !byId[S.s.steps[S.step]].seen) {
          const it = byId[S.s.steps[S.step]];
          return { x: it.pos[0], z: it.pos[1], id: it.id, kind: "item" };
        }
        const left = unseenIn(W.station).sort((a, b) => dist(a) - dist(b));
        if (left.length) {
          return {
            x: left[0].pos[0],
            z: left[0].pos[1],
            id: left[0].id,
            kind: "item",
          };
        }
        const other = Object.values(STATIONS)
          .filter((st) => st.id !== W.station && unseenIn(st.id).length)
          .sort((a, b) => dist2(a.c[0], a.c[1]) - dist2(b.c[0], b.c[1]))[0];
        if (other) {
          return {
            x: other.c[0],
            z: other.c[1],
            id: other.id,
            kind: "station",
          };
        }
        return { x: me.x, z: me.z, id: null, kind: "none" };
      }

      const MOTE_V = `attribute float aA;attribute float aS;uniform float uViewH,uSize;varying float vA;
void main(){vec4 mv=modelViewMatrix*vec4(position,1.0);gl_Position=projectionMatrix*mv;
gl_PointSize=clamp(uSize*aS*uViewH*0.5*projectionMatrix[1][1]/max(0.1,-mv.z),3.0,34.0);vA=aA;}`;
      // a warm white core with a darker rim, so a mote still reads against bright paving in daylight
      const MOTE_F = `uniform vec3 uCore,uRim;varying float vA;void main(){float d=length(gl_PointCoord-0.5);
float a=smoothstep(0.5,0.18,d)*vA;if(a<0.01)discard;float k=smoothstep(0.36,0.08,d);
gl_FragColor=vec4(mix(uRim,uCore,k),a*mix(0.6,1.0,k));
#include <colorspace_fragment>
}`;
      const MAXN = 64;
      const DR = {
        active: false,
        t: 0,
        look: null,
        target: null,
        n: 0,
        p0: new Float32Array(MAXN * 3),
        p1: new Float32Array(MAXN * 3),
        p2: new Float32Array(MAXN * 3),
        birth: new Float32Array(MAXN),
        life: new Float32Array(MAXN),
        ph: new Float32Array(MAXN),
        spin: new Float32Array(MAXN * 3),
        count: 0,
      };
      const moteGeo = new THREE.BufferGeometry();
      const motePos = new Float32Array(MAXN * 3),
        moteA = new Float32Array(MAXN),
        moteS = new Float32Array(MAXN);
      moteGeo.setAttribute("position", new THREE.BufferAttribute(motePos, 3));
      moteGeo.setAttribute("aA", new THREE.BufferAttribute(moteA, 1));
      moteGeo.setAttribute("aS", new THREE.BufferAttribute(moteS, 1));
      const moteMat = new THREE.ShaderMaterial({
        uniforms: {
          uViewH: viewH,
          uSize: { value: 0.07 },
          uCore: { value: new THREE.Color("#fff4cf") },
          uRim: { value: new THREE.Color("#d08a2a") },
        },
        vertexShader: MOTE_V,
        fragmentShader: MOTE_F,
        transparent: true,
        depthWrite: false,
      });
      const motes = new THREE.Points(moteGeo, moteMat);
      motes.frustumCulled = false;
      motes.renderOrder = 15;
      motes.visible = false;
      motes.raycast = () => undefined;
      scene.add(motes);

      const leafShape = new THREE.Shape();
      leafShape.moveTo(0, -0.06);
      leafShape.quadraticCurveTo(0.042, -0.01, 0, 0.06);
      leafShape.quadraticCurveTo(-0.042, -0.01, 0, -0.06);
      const leaves = new THREE.InstancedMesh(
        new THREE.ShapeGeometry(leafShape, 4),
        new THREE.MeshBasicMaterial({
          side: THREE.DoubleSide,
          toneMapped: false,
        }),
        MAXN,
      );
      leaves.frustumCulled = false;
      leaves.renderOrder = 15;
      leaves.visible = false;
      leaves.raycast = () => undefined;
      scene.add(leaves);
      {
        const lc = ["#c9781f", "#b04a24", "#d1a131", "#8d7a2e", "#a6611c"].map(
          (c) => new THREE.Color(c),
        );
        for (let i = 0; i < MAXN; i++) {
          leaves.setColorAt(i, lc[i % lc.length]);
        }
      }
      const dummy = new THREE.Object3D();

      function summonWind() {
        if (DR.active || !W.station) {
          return;
        }
        const L = DRIFT_LOOKS[KN.drift],
          T = windTarget();
        DR.active = true;
        DR.t = 0;
        DR.look = L;
        DR.target = T;
        DR.n = L.n;
        const fx = -Math.sin(me.yaw),
          fz = -Math.cos(me.yaw),
          rx = Math.cos(me.yaw),
          rz = -Math.sin(me.yaw);
        let dx = T.x - me.x,
          dz = T.z - me.z;
        const dT = Math.hypot(dx, dz);
        if (T.kind === "none" || dT < 0.5) {
          dx = fx;
          dz = fz;
        } else {
          dx /= dT;
          dz /= dT;
        }
        // a far target gets a direction, never its spot: the drift ends at most `reach` metres out, and 1.2 m short of a near one
        const reach = T.kind === "none" ? 1.5 : clamp(dT - 1.2, 2.5, L.reach);
        const qx = me.x + dx * reach,
          qz = me.z + dz * reach,
          nx = -dz,
          nz = dx;
        const dot = fx * dx + fz * dz,
          side = Math.sign(rx * dx + rz * dz) || 1;
        for (let i = 0; i < L.n; i++) {
          const depth = L.depth[0] + rnd() * (L.depth[1] - L.depth[0]),
            lat = (rnd() * 2 - 1) * L.spread;
          const p0x = me.x + fx * depth + rx * lat,
            p0z = me.z + fz * depth + rz * lat,
            p0y = 0.2 + rnd() * 0.6;
          const end = (rnd() * 2 - 1) * (0.5 + 0.08 * reach);
          const p2x = qx + nx * end,
            p2z = qz + nz * end,
            p2y = 0.12 + rnd() * 0.35;
          // the bend: towards the target if it lies ahead or to the side; round the visitor's shoulder if it lies behind,
          // so the motes never fly at the camera
          let p1x, p1z;
          if (dot > -0.25) {
            const k = 0.5 * Math.hypot(p2x - p0x, p2z - p0z);
            p1x = p0x + (fx * 0.35 + dx * 0.65) * k;
            p1z = p0z + (fz * 0.35 + dz * 0.65) * k;
          } else {
            p1x =
              me.x + rx * side * (2.4 + rnd() * 0.8) + fx * (0.8 + rnd() * 0.6);
            p1z =
              me.z + rz * side * (2.4 + rnd() * 0.8) + fz * (0.8 + rnd() * 0.6);
          }
          const p1y = 0.45 + rnd() * 0.45;
          DR.p0.set([p0x, p0y, p0z], i * 3);
          DR.p1.set([p1x, p1y, p1z], i * 3);
          DR.p2.set([p2x, p2y, p2z], i * 3);
          const len =
            Math.hypot(p1x - p0x, p1z - p0z) + Math.hypot(p2x - p1x, p2z - p1z);
          const life = clamp(len / L.speed, 1.0, L.dur - 0.25);
          DR.life[i] = life;
          DR.birth[i] =
            rnd() *
            Math.max(0.05, L.dur - 0.25 - life) *
            (L === DRIFT_LOOKS.trail ? 1 : 0.85);
          DR.ph[i] = rnd() * 6.283;
          moteS[i] = 0.7 + rnd() * 0.6;
          DR.spin.set([2 + rnd() * 5, 1 + rnd() * 4, 3 + rnd() * 6], i * 3);
        }
        const pts = L !== DRIFT_LOOKS.leaves;
        motes.visible = pts;
        leaves.visible = !pts;
        if (pts) {
          moteMat.uniforms.uSize.value = L.size;
          moteMat.uniforms.uCore.value.set(L.core);
          moteMat.uniforms.uRim.value.set(L.rim);
          moteGeo.setDrawRange(0, L.n);
        } else {
          leaves.count = L.n;
        }
        DR.count++;
      }
      function stopDrift() {
        DR.active = false;
        motes.visible = false;
        leaves.visible = false;
      }
      function updateDrift(dt) {
        if (!DR.active) {
          return;
        }
        DR.t += dt;
        const L = DR.look,
          g = 1 - smooth(L.dur - 0.45, L.dur, DR.t);
        if (DR.t >= L.dur) {
          stopDrift();
          return;
        }
        const isLeaf = L === DRIFT_LOOKS.leaves;
        for (let i = 0; i < L.n; i++) {
          const age = DR.t - DR.birth[i],
            u0 = age / DR.life[i];
          let x = 0,
            y = -50,
            z = 0,
            a = 0;
          if (u0 > 0 && u0 < 1) {
            const u = u0 * u0 * (3 - 2 * u0), // slow start: the motes gather in view before they leave it
              v = 1 - u,
              i3 = i * 3;
            x = v * v * DR.p0[i3] + 2 * v * u * DR.p1[i3] + u * u * DR.p2[i3];
            y =
              v * v * DR.p0[i3 + 1] +
              2 * v * u * DR.p1[i3 + 1] +
              u * u * DR.p2[i3 + 1];
            z =
              v * v * DR.p0[i3 + 2] +
              2 * v * u * DR.p1[i3 + 2] +
              u * u * DR.p2[i3 + 2];
            // a little flutter, sideways and up, so it reads as air rather than a conveyor belt
            const w =
              Math.sin(DR.ph[i] + age * (isLeaf ? 3.2 : 5.5)) *
              (isLeaf ? 0.22 : 0.12);
            const tx = DR.p2[i3] - DR.p0[i3],
              tz = DR.p2[i3 + 2] - DR.p0[i3 + 2],
              tl = Math.hypot(tx, tz) || 1;
            x += (-tz / tl) * w;
            z += (tx / tl) * w;
            y += Math.sin(DR.ph[i] * 2 + age * 4) * 0.07;
            a = smooth(0, 0.22, age) * (1 - smooth(0.62, 1, u0)) * g;
          }
          if (isLeaf) {
            const i3 = i * 3;
            dummy.position.set(x, y, z);
            dummy.rotation.set(
              DR.ph[i] + age * DR.spin[i3],
              DR.ph[i] * 0.5 + age * DR.spin[i3 + 1],
              age * DR.spin[i3 + 2],
            );
            dummy.scale.setScalar(Math.max(0.0001, a) * 1.25);
            dummy.updateMatrix();
            leaves.setMatrixAt(i, dummy.matrix);
          } else {
            motePos[i * 3] = x;
            motePos[i * 3 + 1] = y;
            motePos[i * 3 + 2] = z;
            moteA[i] = a;
          }
        }
        if (isLeaf) {
          leaves.instanceMatrix.needsUpdate = true;
        } else {
          moteGeo.attributes.position.needsUpdate = true;
          moteGeo.attributes.aA.needsUpdate = true;
          moteGeo.attributes.aS.needsUpdate = true;
        }
      }

      /* ---------------- geometry helpers ---------------- */
      const v3 = new THREE.Vector3();
      function toScreen(x, y, z) {
        v3.set(x, y, z).applyMatrix4(camera.matrixWorldInverse);
        const front = v3.z < 0;
        v3.set(x, y, z).project(camera);
        return {
          x: (v3.x * 0.5 + 0.5) * innerWidth,
          y: (-v3.y * 0.5 + 0.5) * innerHeight,
          front,
          ndc: [v3.x, v3.y],
        };
      }
      function inView(x, y, z, k = 0.92) {
        const s = toScreen(x, y, z);
        return s.front && Math.abs(s.ndc[0]) < k && Math.abs(s.ndc[1]) < 0.95;
      }
      function anchorWorld(it) {
        const a = it.anchor ?? [0, it.anchorY ?? 1.2, 0];
        v3.set(a[0], a[1], a[2]).applyMatrix4(it.g.matrixWorld);
        return [v3.x, v3.y, v3.z];
      }
      function sizeToPx(mesh, wPx, d) {
        const s =
          (wPx * 2 * d * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) /
          innerHeight;
        mesh.scale.set(s, s, 1);
      }

      /* ---------------- the frame ---------------- */
      const keys = new Set();
      let last = performance.now(),
        maxFrame = 0,
        frameN = 0,
        radarDrawAt = 0;
      function frame(now) {
        const real = Math.min(0.1, (now - last) / 1000);
        last = now;
        maxFrame = Math.max(maxFrame * 0.995, real * 1000);
        frameN++;
        // the script runs on real time, so a beat can open and close the journal; the world stops while it is open
        runScript(real * demoMult);
        if (W.journal) {
          if (measuring && frameN % 8 === 0) {
            measureHud();
          }
          requestAnimationFrame(frame);
          return;
        }
        const dt = demo.held && demo.freeze ? 0 : real * demoMult; // a screenshot can hold the world still at a mark
        W.t += dt;
        if (keys.size) {
          if (keys.has("a") || keys.has("arrowleft")) {
            me.yaw += 1.3 * real;
          }
          if (keys.has("d") || keys.has("arrowright")) {
            me.yaw -= 1.3 * real;
          }
          const f =
            (keys.has("w") || keys.has("arrowup") ? 1 : 0) -
            (keys.has("s") || keys.has("arrowdown") ? 1 : 0);
          if (f) {
            step(f * 1.6 * real);
          }
        }

        // stations, with a margin so a jitter on the line does not flip it
        for (const st of Object.values(STATIONS)) {
          const d = dist2(st.c[0], st.c[1]);
          if (W.station !== st.id && d < st.rIn && !W.station) {
            enterStation(st.id);
          } else if (W.station === st.id && d > st.rOut) {
            leaveStation(st.id);
          }
        }

        camera.position.set(me.x, EYE, me.z);
        camera.rotation.set(PITCH, me.yaw, 0);
        camera.updateMatrixWorld();
        scene.updateMatrixWorld();

        for (const it of ITEMS) {
          updateItem(it, dt, real);
        }
        updateStory();
        updateDrift(dt);
        updateBeams(real);
        renderHud(now);
        renderer.render(scene, camera);
        if (measuring && frameN % 8 === 0) {
          measureHud();
        }
        requestAnimationFrame(frame);
      }
      function step(m) {
        me.x = clamp(me.x - Math.sin(me.yaw) * m, -42, 46);
        me.z = clamp(me.z - Math.cos(me.yaw) * m, -89, 44);
      }

      function updateItem(it, dt, real) {
        const here = W.station === it.st;
        if (it.kind === "short" || it.kind === "picture") {
          // seen: in the middle of the view, near enough to read, for a moment
          const a = anchorWorld(it);
          if (
            !it.seen &&
            here &&
            dist(it) < it.readM &&
            inView(a[0], a[1], a[2], 0.7)
          ) {
            it.lookT += dt;
            if (it.lookT > SEEN_LOOK_S) {
              markSeen(it);
            }
          }
        }
        if (it.kind === "video" || it.kind === "audio") {
          if (it.state === "playing") {
            it.prog += dt;
            if (it.prog >= it.dur) {
              it.prog = it.dur;
              it.state = "done";
              markSeen(it);
            }
          }
          if (it.kind === "video") {
            const key = it.state + Math.floor(it.prog * 8);
            if (key !== it.vKey) {
              it.vKey = key;
              drawVideo(it);
            }
          }
          if (it.kind === "audio") {
            const u = it.spark.material.uniforms,
              on = it.state === "playing";
            u.uT.value += real * (on ? 1.6 : 0.7);
            u.uSwirl.value = on ? 1.2 : 0.5;
            u.uStrength.value +=
              ((on ? 1 : it.seen ? 0.25 : 0.6) - u.uStrength.value) *
              damp(real, 0.4);
            u.uColor.value.lerp(
              on ? C_PLAY : it.seen ? C_SEEN : C_GOLD,
              damp(real, 0.4),
            );
          }
        }
        if (it.kind === "model") {
          const o = it.noteOn && dist(it) < 9 ? 1 : 0,
            m = it.notePlate.material;
          m.opacity += (o - m.opacity) * damp(real, 0.3);
          it.notePlate.visible = m.opacity > 0.01;
          if (dist(it) >= 9) {
            it.noteOn = false;
          }
          it.notePlate.quaternion
            .copy(camera.quaternion)
            .premultiply(it.g.quaternion.clone().invert());
        }
        if (it.kind === "character") {
          updateCharacter(it, dt, real);
        }
      }

      function updateCharacter(it, dt, real) {
        if (it.greetPending && dist(it) < 12) {
          it.greetPending = false;
          enterStory(STORIES[0]);
        }
        const F = it.fig,
          toMe = faceTo(it.pos, [me.x, me.z]);
        // a person turns to you while talking or when you come near; else keeps their post's way
        const want = it.line || dist(it) < 7 ? toMe : it.homeYaw;
        it.yaw += angDiff(it.yaw, want) * damp(real, 0.35);
        const headWant =
          clamp(angDiff(it.yaw, toMe), -1.2, 1.2) * (dist(it) < 16 ? 1 : 0);
        it.headYaw += (headWant - it.headYaw) * damp(real, 0.25);
        it.g.rotation.y = it.yaw;
        F.head.rotation.y = it.headYaw;
        const L = it.line,
          talking = L && !L.held && L.doneAt == null,
          tt = W.t;
        let rx = 0,
          rz = 0,
          lx = 0;

        F.armR.rotation.z += (rz - F.armR.rotation.z) * k;
        F.armL.rotation.x += (lx - F.armL.rotation.x) * k;

      // the radar: stations only, at their true bearings, heading-up, on a square-root scale
      function drawRadar() {
        const g = radarEl.getContext("2d"),
          S = radarEl.width,
          c = S / 2,
          R = c - 12;
        g.clearRect(0, 0, S, S);
        g.fillStyle = "rgb(10 13 18 / 70%)";
        g.beginPath();
        g.arc(c, c, c - 2, 0, 7);
        g.fill();
        g.strokeStyle = "rgb(255 255 255 / 55%)";
        g.lineWidth = 4;
        g.beginPath();
        g.arc(c, c, c - 4, 0, 7);
        g.stroke();
        const sy = Math.sin(me.yaw),
          cy = Math.cos(me.yaw);
        const scale = (d) =>
          R * Math.sqrt(Math.min(d, RADAR_RANGE_M) / RADAR_RANGE_M);
        for (const st of Object.values(STATIONS)) {
          const dx = st.c[0] - me.x,
            dz = st.c[1] - me.z,
            f = -dx * sy - dz * cy,
            r = dx * cy - dz * sy,
            d = Math.hypot(r, f);
          if (W.station === st.id) {
            g.strokeStyle = "rgb(251 146 60 / 85%)";
            g.lineWidth = 5;
            g.beginPath();
            g.arc(
              c + (r / Math.max(d, 1e-6)) * scale(d),
              c - (f / Math.max(d, 1e-6)) * scale(d),
              scale(st.rIn),
              0,
              7,
            );
            g.stroke();
            continue;
          }
          const k = scale(d) / Math.max(d, 1e-6),
            x = c + r * k,
            y = c - f * k;
          g.fillStyle = COL.beam;
          g.beginPath();
          g.arc(x, y, 10, 0, 7);
          g.fill();
          g.lineWidth = 3.5;
          g.strokeStyle = "rgb(10 13 18 / 90%)";
          g.stroke();

        g.fillStyle = "#fff";
        g.beginPath();
        g.moveTo(c, c - 14);
        g.lineTo(c + 10, c + 10);
        g.lineTo(c, c + 4);
        g.lineTo(c - 10, c + 10);
        g.closePath();
        g.fill();

              S.tapEl("#wind"),

              S.mark("drift"),
              S.wait(2.2),
              S.mark("after"),
              S.face(-11, -3, 1.4),
              S.wait(1.5),
            ];
          case 4:
            return [
              S.wait(0.8),
              S.tapAt(at("videoA")),
              S.wait(3.2),
              S.mark("film"),
              S.turn(2.6, 2.2),
              S.wait(1.2),
              S.tapEl("#transport"),
              S.wait(1.4),
              S.mark("paused"),
              S.wait(2),
            ];
          case 5:
            return [
              S.wait(1),
              S.tapEl("#wind"),
              S.wait(0.8),
              S.mark("drift"),
              S.wait(2.5),
            ];
          case 6:
            return [
              S.wait(1),
              S.tapEl("#journal-btn"),
              S.wait(0.8),
              S.mark("journal"),
              S.wait(4),
              S.tapEl("#jback"),
              S.wait(1),
            ];
          case 7:
            return [
              S.walk([[8.6, -23.8]], 1.6),
              S.wait(0.3),
              S.mark("left"),
              S.wait(1.5),
              S.walk([[16, -42]], 1.6),
              S.tapEl("#journal-btn"),
              S.wait(0.8),
              S.mark("journal"),
              S.wait(4),
              S.tapEl("#jback"),
            ];
          case 8:
            return [
              S.walk([[24, -59]], 1.4),
              S.face(24, -84, 1),
              S.wait(1.2),
              S.mark("three"),
              S.walk([[21, -80]], 1.2),
              S.face(17.5, -87, 0.6),
              S.tapAt(at("mason")),
              S.wait(6),
              S.mark("entered"),
              S.wait(8),
            ];
          case 9:
            return [
              S.wait(1),
              S.tapEl("#wind"),
              S.wait(0.8),
              S.mark("drift"),
              S.wait(2.5),
              S.face(20.4, -73.6, 1.4),
              S.wait(1),
            ];
          case 10:
            return [
              S.wait(1),
              S.tapEl("#wind"),
              S.wait(0.8),
              S.mark("drift"),
              S.wait(2.5),
              S.tapEl("#journal-btn"),
              S.wait(0.8),
              S.mark("journal"),
              S.wait(4),
              S.tapEl("#jback"),
            ];
        }
        return [];
      }
      function runScript(dt) {
        while (true) {
          if (!cur) {
            cur = script.shift();
            if (!cur) {
              demo.running = false;
              return;
            }
          }
          if (cur.step(dt)) {
            cur = null;
            dt = 0;
            continue;
          }
          return;
        }
      }
      function jump(n, { run = true } = {}) {
        beat = clamp(n, 1, BEATS.length);
        rec[beat] = { hud: 0, el: 0, ov: 0 };
        preState(beat);
        script = run ? beatScript(beat) : [];
        cur = null;
        demo.running = run;
        demo.held = false;
        $("#beat-name").textContent =
          `${beat}/${BEATS.length} ${BEATS[beat - 1]}`;
        renderInfo();
      }
      function userTouched(moving) {
        if (moving && demo.running) {
          script = [];
          cur = null;
          demo.running = false;
          $("#beat-name").textContent = `${beat}/${BEATS.length} free walk`;
        }
      }
      function ripple(x, y) {
        const d = document.createElement("div");
        d.className = "rip";
        d.style.left = x + "px";
        d.style.top = y + "px";
        $("#dev").append(d);
        setTimeout(() => d.remove(), 800);
      }

      $("#prev").addEventListener("click", () => jump(beat - 1));
      $("#next").addEventListener("click", () =>
        jump(beat >= BEATS.length ? 1 : beat + 1),
      );
      $("#beat-name").addEventListener("click", () => jump(beat));
      $("#exit").addEventListener("click", () => {
        hush();
        $("#exited").hidden = false;
      });
      $("#back-in").addEventListener("click", () => {
        $("#exited").hidden = true;
      });

      /* ---------------- the measuring hook (behind the ruler toggle) ---------------- */
      let measuring = false,
        hudNow = { hud: 0, el: 0, ov: 0 };
      const rec = {};
      function hudBoxes() {
        return [...document.querySelectorAll("[data-hud]")]
          .filter((el) => {
            if (el.hidden) {
              return false;
            }
            const cs = getComputedStyle(el);
            if (
              cs.display === "none" ||
              cs.visibility === "hidden" ||
              +cs.opacity < 0.05
            ) {
              return false;
            }
            const r = el.getBoundingClientRect();
            return r.width > 0 && r.height > 0;
          })
          .map((el) => ({ el, r: el.getBoundingClientRect() }));
      }
      function measureHud() {
        const bx = hudBoxes(),
          W0 = innerWidth,
          H0 = innerHeight,
          St = 4;
        let cov = 0;
        for (let y = St / 2; y < H0; y += St) {
          for (let x = St / 2; x < W0; x += St) {
            for (const b of bx) {
              if (
                x >= b.r.left &&
                x < b.r.right &&
                y >= b.r.top &&
                y < b.r.bottom
              ) {
                cov++;
                break;
              }
            }
          }
        }
        const total = Math.ceil(W0 / St) * Math.ceil(H0 / St);
        document
          .querySelectorAll(".ovl")
          .forEach((e) => e.classList.remove("ovl"));
        let ov = 0;
        for (let i = 0; i < bx.length; i++) {
          for (let j = i + 1; j < bx.length; j++) {
            const a = bx[i].r,
              b = bx[j].r,
              w = Math.min(a.right, b.right) - Math.max(a.left, b.left),
              h = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
            if (w > 2 && h > 2) {
              ov++;
              bx[i].el.classList.add("ovl");
              bx[j].el.classList.add("ovl");
            }
          }
        }
        hudNow = { hud: (cov / total) * 100, el: bx.length, ov };
        const R = rec[beat];
        if (R) {
          R.hud = Math.max(R.hud, hudNow.hud);
          R.el = Math.max(R.el, hudNow.el);
          R.ov = Math.max(R.ov, ov);
        }
        const inf = renderer.info.render,
          L = DRIFT_LOOKS[KN.drift];
        $("#readout").textContent =
          `HUD ${hudNow.hud.toFixed(1)}% · ${hudNow.el} el · ${ov} overlap${W.journal ? " · journal open" : ""}\nslowest frame ${maxFrame.toFixed(0)} ms · ${inf.calls} draws\ndrift ${KN.drift} ${L.dur} s · ${L.speed} m/s · ${L.n}${DR.active ? " (on)" : ""} · ${innerWidth}x${innerHeight}`;
        if (!$("#info").hidden) {
          renderTable();
        }
      }
      $("#measure-btn").addEventListener("click", () => {
        measuring = !measuring;
        $("#measure-btn").setAttribute("aria-pressed", String(measuring));
        $("#readout").hidden = !measuring;
        $("#dev").classList.toggle("measuring", measuring);
        if (measuring) {
          measureHud();
        }
      });

      /* ---------------- the page's own notes and settings ---------------- */
      const KNOBS = [
        {
          key: "drift",
          label: "The wind looks like",
          opts: Object.entries(DRIFT_LOOKS).map(([k, L]) => [
            k,
            `${L.label} (${L.dur} s)`,
          ]),
        },
        {
          key: "beam",
          label: "Station pin",
          opts: [
            ["round", "the beam with a gem"],
            ["built", "today's beacon"],
          ],
        },
        {
          key: "voice",
          label: "Voice",
          opts: [
            [true, "on"],
            [false, "off"],
          ],
        },
      ];
      function renderInfo() {
        const el = $("#info");
        if (el.hidden) {
          return;
        }
        el.innerHTML = `<button type="button" class="close" aria-label="Close">&times;</button>
  <h1>Call the wind, keep a journal</h1>
  <p>Nothing hints at what is left until you ask. Inside a station, the wind button at the bottom right sends one short drift along the ground toward the nearest thing you have not seen. It ends by itself and never comes again unless you ask. The journal at the top left keeps one page per station you visited: what you saw, and a mark while there is more here. It never counts and never names what you have not seen, and it opens over a paused view.</p>
  <h3>What "seen" means here</h3>
  <ul><li><b>A person</b>: their first words have played to the end.</li><li><b>A short text, a picture</b>: it has been in the middle of your view, near enough to read, for ${SEEN_LOOK_S} s.</li><li><b>A long text</b>: you turned to its last page.</li><li><b>A film, a sound</b>: it played to its end.</li><li><b>A model</b>: you tapped it and its note opened.</li></ul>
  <h3>Where the wind goes</h3>
  <ul><li>In a story: to the story's next thing.</li><li>Otherwise: to the nearest thing here you have not seen. It stops short of it, and at most ${DRIFT_LOOKS[KN.drift].reach} m out, so a far thing gets a direction, not its spot.</li><li>When you have seen everything here: toward the next station with something left.</li></ul>
  <h3>On the screen, and only then</h3>
  <ul><li>Exit, always.</li><li>The journal, once you have visited a station.</li><li>The radar, with stations only.</li><li>The wind, only inside a station.</li><li>Play/pause, while something of this station plays.</li><li>The story you are in, with the face colour of the person you entered it through, and a leave button.</li></ul>
  <h3>Stories</h3>
  <p>At the well the one story begins with Greta; she greets you once when you walk in, the only thing that starts by arriving. At the gate three people stand where their stories begin; talking to one enters that story. This replaces today's picker of story titles.</p>
  <h3>The strongest case against it</h3>
  <ul><li>A visitor who never calls the wind and never opens the journal can walk away with things unseen, and nothing says so.</li><li>The journal is a second place to look. A visitor who opens it often is studying a page, not the square.</li><li>A drift on a busy or very bright square is easy to miss. It cannot be made louder without becoming the cue that is always there.</li></ul>
  <h3>Settings (also <code>?drift=motes</code>, <code>leaves</code> or <code>trail</code>)</h3>
  ${KNOBS.map((k) => `<div class="knob"><span>${k.label}</span>${k.opts.map(([v, l], i) => `<button type="button" data-k="${k.key}" data-i="${i}" aria-pressed="${KN[k.key] === v}">${l}</button>`).join("")}</div>`).join("")}
  <h3>Beats</h3>
  <div class="beats">${BEATS.map((b, i) => `<button type="button" data-beat="${i + 1}">${i + 1} ${b}</button>`).join("")}</div>
  <h3>Numbers per beat (the most seen during the beat; switch the ruler on to record)</h3>
  <div id="tbl"></div>`;
        el.querySelector(".close").addEventListener("click", () => {
          el.hidden = true;
        });
        el.querySelectorAll("[data-k]").forEach((b) =>
          b.addEventListener("click", () => {
            const k = KNOBS.find((x) => x.key === b.dataset.k);
            KN[k.key] = k.opts[+b.dataset.i][0];
            if (!KN.voice) {
              hush();
            }
            if (k.key === "drift") {
              stopDrift();
            }
            renderInfo();
          }),
        );
        el.querySelectorAll("[data-beat]").forEach((b) =>
          b.addEventListener("click", () => {
            el.hidden = true;
            jump(+b.dataset.beat);
          }),
        );
        renderTable();
      }
      function renderTable() {
        const t = $("#tbl");
        if (!t) {
          return;
        }
        t.innerHTML = `<table><tr><th>beat</th><th>HUD %</th><th>el</th><th>overlap</th></tr>${BEATS.map(
          (b, i) => {
            const r = rec[i + 1];
            return `<tr><td>${i + 1} ${b}</td><td>${r ? r.hud.toFixed(1) : "-"}</td><td>${r ? r.el : "-"}</td><td>${r ? r.ov : "-"}</td></tr>`;
          },
        ).join("")}</table>`;
      }
      $("#info-btn").addEventListener("click", () => {
        const el = $("#info");
        el.hidden = !el.hidden;
        renderInfo();
      });
      setTimeout(() => $("#try").classList.add("gone"), 9000);

      /* ---------------- size ---------------- */
      function resize() {
        const w = innerWidth,
          h = innerHeight;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        // a phone camera's long side sees about 64 degrees, whichever way the phone is held
        camera.fov =
          w < h
            ? 64
            : THREE.MathUtils.radToDeg(
                2 * Math.atan((Math.tan(THREE.MathUtils.degToRad(32)) * h) / w),
              );
        camera.updateProjectionMatrix();
        viewH.value = h * renderer.getPixelRatio();
        for (const it of ITEMS) {
          if (it.bubble) {
            it.bubble.key = "";
          }
        }
        if (W.journal) {
          renderer.render(scene, camera);
        }
      }
      addEventListener("resize", resize);
      resize();

      /* ---------------- build, and the automation hook (screenshots, numbers) ---------------- */
      for (const it of ITEMS) {
        buildItem(it);
      }
      Object.assign(demo, {
        jump(n, { stopAt = null, speed = 1, freeze = false } = {}) {
          this.stopAt = stopAt;
          this.freeze = freeze;
          demoMult = speed;
          jump(n);
        },
        release() {
          this.held = false;
          this.stopAt = null;
        },
        idle() {
          return !this.running || this.held;
        },
        measure(on = true) {
          if (on !== measuring) {
            $("#measure-btn").click();
          }
        },
        setDrift(k) {
          if (DRIFT_LOOKS[k]) {
            KN.drift = k;
            stopDrift();
          }
        },
        numbers() {
          return {
            beat,
            rec: JSON.parse(JSON.stringify(rec)),
            now: hudNow,
            maxFrame,
            station: W.station,
            seen: [...W.seenLog],
            journal: W.journal,
            drift: {
              look: KN.drift,
              active: DR.active,
              count: DR.count,
              target: DR.target,
              t: +DR.t.toFixed(2),
              lit: [...moteA].filter((a) => a > 0.05).length,
              sample: [...motePos.slice(0, 3)].map((v) => +v.toFixed(2)),
            },
          };
        },
      });
      window.demo = demo;
      const qBeat = +qs.get("beat");
      jump(qBeat >= 1 && qBeat <= BEATS.length ? qBeat : 1);
      requestAnimationFrame((t) => {
        last = t;
        frame(t);
      });
    </script>
  </body>
