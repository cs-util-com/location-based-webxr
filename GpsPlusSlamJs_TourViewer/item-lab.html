<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Item lab</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/design.css" />
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #f3f5f7;
        color: #1c2329;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 1.25rem;
      }
      h2 {
        font-size: 1rem;
        margin-bottom: 8px;
      }
      #lab-error {
        color: #a12020;
      }
      .lab-sides {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-top: 12px;
      }

      @media (width <= 720px) {
        .lab-sides {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .lab-side {
        min-width: 0;
        padding: 12px;
        border-radius: 8px;
        background: #fff;
      }
      #lab-panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #lab-panel[hidden] {
        display: none;
      }
      #lab-image,
      #lab-station-image,
      #lab-video {
        max-width: 100%;
        max-height: 30vh;
        object-fit: contain;
      }
      #lab-image[hidden],
      #lab-station-image[hidden],
      #lab-video[hidden] {
        display: none;
      }
      #lab-text {
        white-space: pre-line;
      }
      #lab-choices,
      #lab-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      #lab-controls {
        margin-top: 12px;
      }
      #lab-world {
        height: 50vh;
        max-height: 420px;
      }
      #lab-world canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #lab-free-status,
      #lab-status,
      #lab-stage,
      .lab-note {
        font-size: 0.875rem;
        min-height: 1.25em;
      }
      .lab-note {
        margin-top: 8px;
        color: #51606b;
      }
      #lab-state {
        margin: 12px 0 0;
        overflow-x: auto;
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <h1>Item lab: <span id="lab-kind"></span></h1>
    <p id="lab-error" role="alert"></p>
    <div class="lab-sides">
      <section class="lab-side" aria-label="In a story">
        <h2>In a story</h2>
        <div id="lab-panel" hidden>
          <h3 id="lab-title"></h3>
          <p id="lab-description" hidden></p>
          <img id="lab-station-image" alt="" hidden />
          <p id="lab-speaker" hidden></p>
          <img id="lab-image" alt="" hidden />
          <video id="lab-video" controls playsinline hidden></video>
          <div id="lab-surface"></div>
          <p id="lab-text"></p>
          <p id="lab-status" aria-live="polite"></p>
          <div id="lab-choices"></div>
          <button id="lab-continue" class="btn" type="button" hidden>
            Continue
          </button>
          <button id="lab-play-next" class="btn" type="button" hidden></button>
        </div>
        <p id="lab-stage"></p>
        <p class="lab-note">
          The stage and the sound on this side are stand-ins: this line says
          what would stand and what would be heard.
        </p>
      </section>
      <section class="lab-side" aria-label="In a station">
        <h2>In a station</h2>
        <div id="lab-world"></div>
        <p id="lab-free-status" aria-live="polite"></p>
        <p class="lab-note">
          Tap the item. The sound is silent here. There is no sheet yet: a tap
          plays or stops its voice, or shuts its bubble.
        </p>
      </section>
    </div>
    <div id="lab-controls"></div>
    <pre id="lab-state"></pre>
    <script type="module">
      import { startItemLab } from "./src/checks/item-lab.ts";

      void startItemLab();
    </script>
  </body>
</html>
