<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KML Editor - demo</title>
  <style>
    html,
    body,
    #app {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: system-ui, sans-serif;
    }

    .kml-editor {
      display: grid;
      grid-template-columns: 19rem minmax(0, 1fr);
      height: 100%;
      background: #10131a;
      color: #e9edf5;
    }

    .kml-editor aside {
      padding: 1rem;
      overflow: auto;
      display: grid;
      align-content: start;
      gap: .65rem;
      border-right: 1px solid #31405a;
    }

    .kml-editor__viewport {
      min-width: 0;
      min-height: 0;
    }

    .kml-editor canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    input,
    textarea,
    button {
      font: inherit;
      padding: .45rem;
    }

    textarea {
      min-height: 5rem;
    }

    button {
      cursor: pointer;
    }

    ul {
      padding: 0;
      margin: 0;
      list-style: none;
      display: grid;
      gap: .25rem;
    }

    li button {
      width: 100%;
      text-align: left;
    }

    [role="alert"] {
      min-height: 2.5rem;
      color: #ffd08a;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script type="module">
    import { mountEditor } from '../../src/editor/index.ts';
    mountEditor(document.getElementById('app'));
  </script>
</body>

</html>
