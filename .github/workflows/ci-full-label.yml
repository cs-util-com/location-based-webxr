name: CI full set on label

# Adding the `full-ci` label to a pull request runs CI (ci.yml) with the full
# browser set: ci.yml reads the label from the pull request (E2E_TIER). It
# shares the pull request's concurrency group (set in ci.yml), so this run
# cancels the pull request's still-running tier run, whose checks the full set
# covers. This file declares no concurrency of its own: a caller sharing its
# callee's group would cancel itself. ci.yml itself listens to no label, so any other label
# starts no CI job: a skipped job would be a check named like the real one on
# the same commit, sitting over its earlier result. Its one skipped job here
# carries this workflow's own name. tests/repo-config/ci-jobs.test.js holds it.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  full:
    name: full-ci
    if: ${{ github.event.label.name == 'full-ci' }}
    uses: ./.github/workflows/ci.yml
