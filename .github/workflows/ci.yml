name: CI

# Two browser tiers (E2E_TIER, scripts/e2e/tier.mjs): a pull request runs the
# per-PR tier, the tests tagged `@pr` plus every test of a spec file it adds or
# changes, and so does a push to `main`. The full set runs when dispatched (by
# hand, or nightly on the newest rNNN branch by nightly-full.yml) and on a pull
# request that carries the `full-ci` label, which is how a branch gets its full
# run before a merge. Adding that label runs this workflow through
# ci-full-label.yml (`workflow_call`); this file listens to no label itself, so
# any other label starts no job here. tests/repo-config/ci-jobs.test.js holds
# the triggers and the tier choice.
#
# A branch without a pull request runs the same jobs by dispatch:
# `gh workflow run ci.yml --ref <branch> -f tier=pr [-f base=<commit or branch>]`
# selects what its pull request would, against the merge base with main unless
# `base` says otherwise, and tests the branch's head where a pull request tests
# the merge commit. `pnpm run ci:summary <branch>` prints the result in one line.
#
# A run on `main` records the timing tables and uploads them as artifacts;
# nothing in this workflow writes to the repository (scripts/test-timing/README.md).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
  workflow_dispatch:
    inputs:
      tier:
        description: "Browser tier: full (every test) or pr (the @pr tests)"
        type: choice
        options: [full, pr]
        default: full
      base:
        description: "Commit or branch the pr tier compares against (default: the merge base with main)"
        type: string
        default: ""

permissions:
  contents: read

# A newer push to a pull request's branch cancels its superseded run. Pushes to
# `main` are releases and every one of them runs to the end, so each gets a
# group of its own: GitHub keeps only one PENDING run per group, and with one
# group for `main` the middle of three quick merges would lose its run. The
# group starts with `github.workflow`, which in a called workflow is the
# CALLING workflow's name: the full-ci label's run (ci-full-label.yml) gets a
# group of its own and no longer cancels the pull request's run, which left a
# cancelled check on the pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deadcode:
    name: Dead code (knip)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          # Node 26 (harness-majors plan M0, owner decision 2026-09-07:
          # jsdom 30 needs >=24.15 or 26, and 26 is LTS from October 2026).
          # Since 2026-09-08 EVERY manifest here says engines >=26, the
          # published framework included: the consumer floor was split off
          # for a day and the split was reversed, because nothing ever ran
          # the framework at the lower floor and an unrun floor is an
          # untested promise. This pin is therefore load-bearing for
          # consumers too - moving it means moving the published floor
          # (asserted by published-engines-floor.test.ts in the private
          # repo's GpsPlusSlamJs_Investigation). Matches publish.yml/.nvmrc.
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Whole-workspace knip pass. Runs as its own job so dead-code
      # enforcement is independent of the test suite (no framework build, no
      # Playwright browsers) and a finding is attributed to this step rather
      # than masquerading as a Starter test failure. It is also the root
      # cascade's `check:deadcode` stage, which no job below repeats.
      - name: Check for dead code
        run: pnpm run check:deadcode

  # The root cascade (`pnpm test`) split into parallel jobs: one serial job
  # took 3.4-4.1 h, and a red stage hid every package after it. Each job runs the SAME package gates a
  # developer runs (the root's `test:<package>` scripts), so every stage,
  # command and budget is unchanged; only the order and the machine differ.
  # The Tour Viewer's gate runs without its browser stage, and its browser
  # specs run as six lanes of `GpsPlusSlamJs_TourViewer/playwright-tests/
  # e2e-plan.js` (`E2E_LANE`). `tests/repo-config/ci-jobs.test.js` holds this
  # matrix to the cascade: every root stage in exactly one job, every lane in
  # exactly one job, a time limit on each.
  test:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    env:
      E2E_LANE: ${{ matrix.lane }}
      # The full set on a dispatch (its input) and on a pull request labelled
      # full-ci; the per-PR tier otherwise, a push to main included.
      E2E_TIER: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || contains(github.event.pull_request.labels.*.name, 'full-ci') && 'full' || 'pr' }}
      # The base the tier compares against: it runs every spec file the branch
      # changed whole. A pull request's base or a dispatch's input; the fetch
      # step below resolves this to a commit, and fills it in for a dispatch
      # of the pr tier without an input. Empty on a push to main.
      E2E_TIER_BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
      GATE_SKIP_BROWSER_STAGES: ${{ matrix.skip_browser }}
      # Minutes one Playwright process may run; see the matrix.
      E2E_GLOBAL_TIMEOUT_MIN: ${{ matrix.e2e_limit }}
      # Only a run on main writes timing tables on the runner.
      TIMING_RECORD_ON_RUNNER: ${{ github.ref == 'refs/heads/main' && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # e2e_limit, in minutes per Playwright process, ends a hung browser run
        # as a red run that keeps its log and report: a job cancelled at its
        # timeout keeps neither. A hang that prints nothing meets the stage
        # watchdog first (20 min of silence), which interrupts Playwright so it
        # still writes its report (JSON in every package); this limit catches
        # the run that keeps printing. Each is about twice the slowest of 8 green full runs (Run
        # step, 2026-11-05): Tour page tests 25 of 13.2 min, Tour 3D 45 of 20.3,
        # OsmDemo 55 of 30.3 (1.8 times), the design system 25 of 12.8, which
        # also fits a test timing out on all 3 attempts (9 min). Each leaves 25
        # min of the job (30 on the Tour 3D lanes) for setup (20 of them the
        # browser install's limit), earlier stages and the upload. A worker that
        # stopped answering takes 5 more, Playwright's wait before it force-kills
        # one: the Tour 3D lanes have that room, OsmDemo and the Tour page lanes
        # only when setup took under about 17 min. A green process
        # coming near its limit reverses the value. A job of several packages
        # has its own sum in ci-jobs.test.js: one hang fits, two can outrun it.
        include:
          # About 7 min (CI runs of 2026-11-04).
          - job: libraries
            scripts: test:repo-config test:framework test:osm test:globe test:editor-kit test:site-worker
            timeout: 30
          # About 22 min: the design system (about 11.5 min, nearly all of
          # it e2e) and the apps (about 10.5 min) in one job, which keeps the
          # run at 11 jobs beside the Tour Viewer's two page-test lanes.
          - job: design-system-and-apps
            scripts: test:design-system test:recorder test:starter test:example test:qr-demo test:landing test:physics test:wayfinding
            browsers: true
            report: |
              GpsPlusSlamJs_*/test-results*
              GpsPlusSlamJs_DesignSystem/3d/test-results/
            e2e_limit: 25
            timeout: 75
          # About 33 min, the longest job until the Tour lanes are measured.
          - job: osm-demo
            scripts: test:osm-demo
            browsers: true
            report: GpsPlusSlamJs_OsmDemo/test-results/
            e2e_limit: 55
            timeout: 80
          # The Tour Viewer's builds, static checks and unit tests, about 5 min.
          - job: tour-static-unit
            scripts: test:tour
            skip_browser: "1"
            timeout: 30
          # The Tour Viewer's browser specs: the page tests in two lanes
          # (one worker each on CI; the whole set took about 28 min in one)
          # and four 3D lanes. The 2026-11-04 CI runs had lane 1 at about
          # 35 min (about 55 when its clouds spec is retried) and lanes 2-4
          # at about 26-32 min, before a second round of test cuts
          # shortened them; the lanes are balanced from a local full run since. The
          # 3D lanes keep a 75 min limit: 60 would cancel lane 1 on its first
          # clouds retry.
          - job: tour-dom-1
            dir: GpsPlusSlamJs_TourViewer
            scripts: test:e2e
            lane: dom-1
            browsers: true
            report: GpsPlusSlamJs_TourViewer/test-results/
            e2e_limit: 25
            timeout: 50
          - job: tour-dom-2
            dir: GpsPlusSlamJs_TourViewer
            scripts: test:e2e
            lane: dom-2
            browsers: true
            report: GpsPlusSlamJs_TourViewer/test-results/
            e2e_limit: 25
            timeout: 50
          - job: tour-webgl-1
            dir: GpsPlusSlamJs_TourViewer
            scripts: test:e2e
            lane: webgl-1
            browsers: true
            report: GpsPlusSlamJs_TourViewer/test-results/
            e2e_limit: 45
            timeout: 75
          - job: tour-webgl-2
            dir: GpsPlusSlamJs_TourViewer
            scripts: test:e2e
            lane: webgl-2
            browsers: true
            report: GpsPlusSlamJs_TourViewer/test-results/
            e2e_limit: 45
            timeout: 75
          - job: tour-webgl-3
            dir: GpsPlusSlamJs_TourViewer
            scripts: test:e2e
            lane: webgl-3
            browsers: true
            report: GpsPlusSlamJs_TourViewer/test-results/
            e2e_limit: 45
            timeout: 75
          - job: tour-webgl-4
            dir: GpsPlusSlamJs_TourViewer
            scripts: test:e2e
            lane: webgl-4
            browsers: true
            report: GpsPlusSlamJs_TourViewer/test-results/
            e2e_limit: 45
            timeout: 75
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          # Node 26 (harness-majors plan M0, owner decision 2026-09-07),
          # matching publish.yml, .nvmrc and the deadcode job above. Since
          # 2026-09-08 the framework's CONSUMER floor is this same number
          # (engines >=26.0.0, devEngines dropped), so unlike before, this
          # pin DOES say what consumers may run.
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        timeout-minutes: 15
        run: pnpm install --frozen-lockfile

      # The checkout holds one commit; the tier diffs against the base commit's
      # tree, so that one commit is fetched too. The API answers the merge base
      # because a shallow checkout cannot.
      - name: Fetch the tier's base
        if: ${{ env.E2E_TIER_BASE != '' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'pr') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$E2E_TIER_BASE"
          if [ -z "$base" ]; then
            base=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .merge_base_commit.sha)
          fi
          git fetch --no-tags --depth=1 origin "$base"
          echo "E2E_TIER_BASE=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"

      # Recorder + example resolve `gps-plus-slam-app-framework` via the
      # package's `exports` -> `./dist/...`, so the framework must be built
      # before its consumers run their tests.
      - name: Build AppFramework
        run: pnpm run build:framework

      # A step limit, because a job limit cancels the job with no log. Above
      # the first install's, because apt can fetch at 15 kB/s from a slow
      # mirror for over 15 min and still finish.
      - name: Install Playwright browsers
        if: ${{ matrix.browsers }}
        timeout-minutes: 20
        working-directory: GpsPlusSlamJs_RecorderApp
        run: pnpm exec playwright install --with-deps chromium

      # Every script runs even after a red one, so one job reports every
      # package it holds; the job fails if any of them failed.
      - name: Run ${{ matrix.scripts }}
        env:
          SCRIPTS: ${{ matrix.scripts }}
          SCRIPT_DIR: ${{ matrix.dir || '.' }}
        run: |
          rc=0
          for script in $SCRIPTS; do
            echo "::notice::running $script in $SCRIPT_DIR"
            pnpm --dir "$SCRIPT_DIR" run "$script" || rc=1
          done
          exit $rc

      - name: Upload Playwright report
        if: ${{ !cancelled() && matrix.report }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.job }}
          path: ${{ matrix.report }}
          retention-days: 14

      # `gh run download <run> --pattern 'test-timings-*'` fetches them. A
      # stage narrowed to the tier records nothing, so a job may have none.
      - name: Upload the timing tables
        if: ${{ !cancelled() && env.TIMING_RECORD_ON_RUNNER == '1' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-timings-${{ matrix.job }}
          path: |
            docs/test-timings.md
            GpsPlusSlamJs_*/docs/test-timings.md
          if-no-files-found: ignore
          retention-days: 90

  # One result for the whole run, with a stable name for a branch rule or a
  # reader: red unless every job concluded "success", so a cancelled,
  # timed-out or skipped job reads red too, not only a failed one.
  ci-result:
    name: CI result
    needs: [deadcode, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null
