name: CI

# Scratch probe, never merged: does a job that hits timeout-minutes leave
# cancelled() false, so that a result job with `if: !cancelled()` still runs?

on:
  workflow_dispatch:
    inputs:
      tier:
        type: string
        default: pr
      base:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: sleep 150

  ci-result:
    name: CI result
    needs: [slow]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null
