name: Deploy Sun AR to Pages

on:
  push:
    branches: [feature/sun-lighting]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build integrated Sun AR app
        run: >-
          pnpm --dir GpsPlusSlamJs_RealisticSunLightingDemo
          run build --base=/location-based-webxr/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: GpsPlusSlamJs_RealisticSunLightingDemo/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
